<!doctype html>

<title>方向 P4 · 悬浪（活体）</title>
<style>
  /* ═══ 概念 ═══（P4 会话 A：悬浪——见根目录 landingpage_swarm.md）
     主体不是几何巨构，而是一道悬停在半空、永远不会落下的巨浪：
     「正在发生的事」被暂停，而非「被摆放的物」。
     审美简报说世界「可能马上消失」——悬浪是这句话的形状：
     下一秒就要落下，却永远停在落下之前。
     局部规则（一条）：浪悬停不落——浪脚水面平静如镜，无飞沫无涟漪；
     水下的浪影更大、自体发暖光（梦里的浪更盛，规则继承自 J 的水下补齐）。
     材质：磨砂半透明受光壳（简报推荐组合「磨砂玻璃+半透明树脂」首次做主体级）。
     底盘继承 J✦（连续晕染水面 / 四时色板 / uDream / 滚动镜头 /
     字平面遮挡穿插 / 尺度锚点小碑 / 性能纪律），已验证资产不重写。 */

  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-600-normal.woff2') format('woff2');
  }

  :root {
    --ink: #37363a;
    --ink-soft: #655f66;
    --ink-faint: #6f696f;
    --mist-ink: #5d6d80;
    --font-display: 'Noto Serif SC Web', 'Noto Serif SC', 'Palatino Linotype', Georgia, 'Songti SC', SimSun, serif;
    --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); color: var(--ink); background: #e3dede; }

  .stage {
    position: fixed;
    inset: 0;
    overflow: clip;
    background: linear-gradient(to bottom, #f0ecea 0%, #e0dee0 30%, #c9ccd0 100%);
  }
  .scroll-length { height: 90vh; }
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .vignette {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(112, 84, 78, 0.14), rgba(112, 84, 78, 0) 22%),
      radial-gradient(125% 92% at 50% 42%, transparent 60%, rgba(84, 72, 80, 0.12) 100%);
  }

  .rise { opacity: 0; transform: translateY(10px); animation: rise-in 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .rise.d1 { animation-delay: 0.15s; }
  .rise.d2 { animation-delay: 0.45s; }
  .rise.d3 { animation-delay: 0.7s; }
  @keyframes rise-in { to { opacity: 1; transform: translateY(0); } }

  /* 宣言只有第一行留在 DOM（保证可读与无障碍），其余两行进入 3D 场景 */

  }
  .manifesto .l1 { display: block; font-size: clamp(1.35rem, 2.8vw, 2.6rem); font-weight: 500; letter-spacing: 0.04em; }

  .brand {
    position: absolute; top: 4.5vh; left: 4vw; z-index: 10;
    display: inline-flex; align-items: center; gap: 0.6rem;
    font-family: var(--font-display); font-weight: 500; font-size: 1.02rem;
    letter-spacing: 0.06em; color: var(--ink); text-decoration: none;
    text-shadow: 0 1px 18px rgba(246, 238, 224, 0.9);
  }
  .brand .ring { width: 11px; height: 11px; border: 1.5px solid var(--mist-ink); border-radius: 50%; opacity: 0.85; }

  .nav {

  .floating-ledger { position: absolute; left: 26vw; right: 16vw; bottom: 6vh; z-index: 10; }
  .floating-ledger h2 {
    margin: 0 0 1rem; font-weight: 500; font-size: 0.82rem;

    text-shadow: 0 1px 14px rgba(246, 238, 224, 0.9);
  }
  .slips { display: flex; gap: 1.2rem 1.8rem; align-items: flex-start; }
  .slip {
    position: relative; display: block; padding: 0.85rem 1rem 0.95rem;
    background: rgba(252, 250, 244, 0.9); border: 1px solid rgba(255, 255, 255, 0.62);
    box-shadow: 5px 4px 10px -6px rgba(84, 72, 80, 0.3);
    text-decoration: none; overflow: clip;
  }
  .slip::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
    background: linear-gradient(to bottom, transparent, rgba(200, 169, 154, 0.24));

  .slip:nth-child(2) { width: 15.5rem; transform: rotate(0.7deg) translateY(10px); }

  .slip .d { display: block; font-size: 0.72rem; letter-spacing: 0.12em; color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-bottom: 0.35rem; }
  .slip .t { display: block; font-family: var(--font-display); font-size: 0.98rem; color: var(--ink); line-height: 1.55; }
  .slip:hover .t { color: var(--mist-ink); }

  .stage.no3d canvas#gl { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; opacity: 1; transform: none; }
  }
  @media (max-width: 760px) {
    .side-note { display: none; }
    .nav { position: static; margin: 0.6rem 9vw 0; flex-direction: row; gap: 1.8rem; }
    .nav a { writing-mode: horizontal-tb; letter-spacing: 0.24em; font-size: 0.9rem; }
    .nav a::after { display: none; }
    .floating-ledger { position: static; margin: 2.8rem 9vw 8vh; }
    .slips { flex-direction: column; gap: 0.9rem; }
    .slip { width: 100%; transform: none; }
    .stage { position: relative; min-height: 100dvh; }
    .scroll-length { display: none; }
    .manifesto { position: relative; top: 0; left: 0; margin: 10vh 9vw 0; }
  }
</style>

<script src="vendor/three.min.js"></script>
<script>
/* ═══ 悬浪 ═══
   水 = 连续域水彩晕染（继承 J✦，构造上无马赛克）；
   主体 = 悬浪：程序曲面（浪头线悬空 + 坡身向后没水），
   磨砂半透明受光壳 + 水下更大自发光浪影（梦更盛）；
   宣言后两行 = 场景内字平面：竖排字下半泡进浪壳被浪皮稀释，
   远景横排挂在浪头之后被浪峰上弧咬住。 */
(function () {
  if (!window.THREE) return;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var seed = 42;
  function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  function range(a, b) { return a + rnd() * (b - a); }

  /* 浪形专用噪声：独立实现，不扰动色板随机序列 */
  function n1d(x) {
    var h = function (n) { var s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
    var i = Math.floor(x), f = x - i;
    f = f * f * (3 - 2 * f);
    return h(i) * (1 - f) + h(i + 1) * f;
  }
  function n2d(x, y) {
    var h = function (a, b) { var s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
    var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    return h(ix, iy) * (1 - ux) * (1 - uy) + h(ix + 1, iy) * ux * (1 - uy) +
           h(ix, iy + 1) * (1 - ux) * uy + h(ix + 1, iy + 1) * ux * uy;
  }

  var canvas = document.getElementById('gl');
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false }); }
  catch (e) { document.getElementById('stage').classList.add('no3d'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

  var scene = new THREE.Scene();
  /* ── 四时色板：暮玫瑰 → 冷晨 → 夜青 → （回）暮玫瑰（继承 J✦） ── */
  var PAL = [
    { /* 暮玫瑰 */
      wA: 0xf4e7e3, wB: 0xe8ccc8, wC: 0xcfa0a4, wD: 0x9e6e78,
      dA: 0xefeaef, dB: 0xdcd2de, dC: 0xb8a8c4, dD: 0x7e6e8c,
      fogW: 0xe9d8d6, fogD: 0xd8d4e0, hemiSky: 0xf5e8e6, hemiGnd: 0xb59aa0,
      hemiD: 0xe0d8e2, gndD: 0x9a8fa4, sun: 0xffdfd0, sunD: 0xd8cfe0,
      sunI: 0.5, fill: 0xe0dce8, shell: 0xded2d2, below: 0xd9a0a8, dream0: 0.25 },
    { /* 冷晨 */
      wA: 0xf1f4f2, wB: 0xdee6e5, wC: 0xb8ccd2, wD: 0x8aa5ad,
      dA: 0xedebef, dB: 0xdad6e0, dC: 0xbab3c8, dD: 0x858099,
      fogW: 0xdde4e2, fogD: 0xd8d5e0, hemiSky: 0xe8eef0, hemiGnd: 0x9fb0b5,
      hemiD: 0xe2e0ea, gndD: 0x8a95a8, sun: 0xdfe8ea, sunD: 0xc5cfdd,
      sunI: 0.5, fill: 0xe8e2ea, shell: 0xd8dee1, below: 0xd9b2a4, dream0: 0.32 },
    { /* 夜青 */
      wA: 0xdde3e3, wB: 0xc2cecf, wC: 0x98aeb4, wD: 0x64808a,
      dA: 0xd8dce4, dB: 0xc2c6d4, dC: 0x9aa2b8, dD: 0x5e6880,
      fogW: 0xc9d2d4, fogD: 0xc2c6d6, hemiSky: 0xd8e2e6, hemiGnd: 0x8a9aa4,
      hemiD: 0xd4d6e2, gndD: 0x76828e, sun: 0xcfdce2, sunD: 0xc0c8dc,
      sunI: 0.35, fill: 0xe2dce4, shell: 0xc4ced2, below: 0xe8c890, dream0: 0.45 }
  ];
  PAL.forEach(function (p) {
    ['wA','wB','wC','wD','dA','dB','dC','dD','fogW','fogD','hemiSky','hemiGnd','hemiD','gndD','sun','sunD','fill','shell','below']
      .forEach(function (k) { p[k] = new THREE.Color(p[k]); });
  });
  var _c1 = new THREE.Color(), _c2 = new THREE.Color();
  function palMix(key, a, b, f) { _c1.copy(a[key]); return _c1.lerp(b[key], f); }
  /* 相位 → (色板A, 色板B, 混合系数)。每段两端各留 15% 驻留，过渡占 70%。 */
  function phaseMix(p) {
    p = ((p % 1) + 1) % 1;
    var seg = Math.floor(p * 3), st = p * 3 - seg;
    var f = Math.min(1, Math.max(0, (st - 0.15) / 0.7));
    f = f * f * (3 - 2 * f);
    return { a: PAL[seg], b: PAL[(seg + 1) % 3], f: f };
  }
  var fogWake = new THREE.Color(), fogDream = new THREE.Color();
  scene.background = fogWake.clone();
  scene.fog = new THREE.Fog(fogWake.clone(), 16, 68);

  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 220);

  var hemi = new THREE.HemisphereLight(0xf6ead2, 0xb99f86, 0.95);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xffe3b8, 0.6);
  sun.position.set(-5, 8, 6);
  scene.add(sun);
  /* 冷色补光：从右后方给浪面第二个体面 */
  var fill = new THREE.DirectionalLight(0xd8e4ec, 0.28);
  fill.position.set(7, 5, -3);
  scene.add(fill);

  /* ── 共享表面纹理（灰泥噪点）：磨砂质感 ── */
  function makeSurfTex() {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var x = c.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, 128, 128);
    var im = x.getImageData(0, 0, 128, 128);
    for (var i = 0; i < im.data.length; i += 4) {
      var v = 234 + Math.floor(rnd() * 21);
      im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
    }
    x.putImageData(im, 0, 0);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(2, 2);
    return t;
  }
  var surfTex = makeSurfTex();
  /* 浪壳专属贴图：更高密度让磨砂颗粒在浪面上可辨 */
  var shellTex = surfTex.clone();
  shellTex.needsUpdate = true;
  shellTex.repeat.set(6, 3);

  /* ── 画笔水面（继承 J✦：域扭曲 fbm 纯连续色彩场） ── */
  var waterUniforms = {
    uTime: { value: 0 },
    uDream: { value: 0 },
    uFogColor: { value: fogWake.clone() },
    uFogNear: { value: 16.0 },
    uFogFar: { value: 68.0 },
    uWA: { value: new THREE.Color() }, uWB: { value: new THREE.Color() },
    uWC: { value: new THREE.Color() }, uWD: { value: new THREE.Color() },
    uDA: { value: new THREE.Color() }, uDB: { value: new THREE.Color() },
    uDC: { value: new THREE.Color() }, uDD: { value: new THREE.Color() }
  };
  var waterMat = new THREE.ShaderMaterial({
    transparent: true,
    uniforms: waterUniforms,
    vertexShader: [
      'uniform float uTime;',
      'varying vec3 vWorld;',
      'varying float vNdcY;',
      'void main() {',
      '  vec4 w = modelMatrix * vec4(position, 1.0);',
      '  w.y += 0.045 * sin(w.x * 0.55 + uTime * 0.7) + 0.03 * sin(w.z * 0.4 + uTime * 0.5 + w.x * 0.2);',
      '  vWorld = w.xyz;',
      '  vec4 pr = projectionMatrix * viewMatrix * w;',
      '  vNdcY = pr.y / pr.w;',
      '  gl_Position = pr;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform float uTime;',
      'uniform float uDream;',
      'uniform vec3 uFogColor;',
      'uniform float uFogNear;',
      'uniform float uFogFar;',
      'uniform vec3 uWA; uniform vec3 uWB; uniform vec3 uWC; uniform vec3 uWD;',
      'uniform vec3 uDA; uniform vec3 uDB; uniform vec3 uDC; uniform vec3 uDD;',
      'varying vec3 vWorld;',
      'varying float vNdcY;',
      'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
      'float noise(vec2 p) {',
      '  vec2 i = floor(p), f = fract(p);',
      '  float a = hash(i), b = hash(i + vec2(1.0, 0.0)), c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));',
      '  vec2 u = f * f * (3.0 - 2.0 * f);',
      '  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);',
      '}',
      'float fbm(vec2 p) {',
      '  float v = 0.0, a = 0.5;',
      '  for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }',
      '  return v;',
      '}',
      'vec3 grad(float t, vec3 A, vec3 B, vec3 C, vec3 D) {',
      '  vec3 c = mix(A, B, smoothstep(0.0, 0.36, t));',
      '  c = mix(c, C, smoothstep(0.36, 0.64, t));',
      '  c = mix(c, D, smoothstep(0.64, 1.0, t));',
      '  return c;',
      '}',
      'void main() {',
      '  vec2 p = vWorld.xz * 0.052;',
      '  vec2 w1 = vec2(fbm(p + vec2(0.0, 3.7)), fbm(p + vec2(5.2, 0.0)));',
      '  vec2 w2 = vec2(fbm(p * 1.9 + w1 * 1.4 + vec2(1.7, 9.2)),',
      '                 fbm(p * 1.9 + w1 * 1.4 + vec2(8.3, 2.8)));',
      '  float h = fbm(p * 2.3 + w2 * 1.1 + vec2(uTime * 0.010, -uTime * 0.007));',
      '  h = h * 0.74 + 0.26 * fbm(p * 0.42 + vec2(uTime * 0.004, 0.0));',
      '  float dist = length(vWorld - cameraPosition);',
      '  float fogF = smoothstep(uFogNear, uFogFar, dist);',
      '  vec3 col = grad(h,',
      '    mix(uWA, uDA, uDream), mix(uWB, uDB, uDream),',
      '    mix(uWC, uDC, uDream), mix(uWD, uDD, uDream));',
      '  float streak = fbm(vec2(vWorld.x * 0.33, vWorld.z * 1.35) + w1 * 0.8);',
      '  col *= 0.965 + 0.07 * streak;',
      '  float glint = smoothstep(0.92, 1.0, sin(vWorld.z * 1.7 + uTime * 0.35 + h * 6.0));',
      '  col += glint * 0.05;',
      '  col = mix(col, uFogColor, fogF);',
      '  float deep = smoothstep(0.25, -0.85, vNdcY);',
      '  col *= 1.0 - 0.06 * deep;',
      '  float alpha = clamp(mix(0.72, 0.95, fogF) + deep * 0.3, 0.0, 1.0);',
      '  gl_FragColor = vec4(col, alpha);',
      '}'
    ].join('\n')
  });
  var water = new THREE.Mesh(new THREE.PlaneGeometry(170, 170, 72, 72), waterMat);
  water.rotation.x = -Math.PI / 2;
  water.renderOrder = 5;
  scene.add(water);

  /* ── 主体：悬浪 ──
     曲面语法：j=0 是浪头线（悬空），d 增大沿背坡快速下落后缓落水；
     浪头高度沿 x 强起伏成峰谷（ridge 0.45~1.0），只有「峰」向前翻卷
     （curl 随峰强缩放，谷处退化为低坡）——剪影读作浪群而非幕布；
     两端 14% 内落地（side fade），浪是画面里的一个主体而非整个天。 */
  function makeWaveGeometry(len, height, slope, zHead, curl) {
    var nu = 120, nv = 44;
    var pos = [], idx = [], aux = [];
    for (var j = 0; j <= nv; j++) {
      var d = j / nv;                          /* 0=浪头线 1=远端贴水 */
      var front = Math.pow(d, 0.6);            /* 前缘陡：浪头附近快速下落 */
      var lip = Math.pow(1 - d, 2.4);          /* 浪头探出的檐带 */
      for (var i = 0; i <= nu; i++) {
        var u = i / nu;
        var x = (u - 0.5) * len;
        var s = Math.min(1, Math.min(u, 1 - u) / 0.14);
        var side = s * s * (3 - 2 * s);        /* 两端落地 */
        var ridge = 0.45 + 0.55 * (n1d(u * 5.2 + 7.3) * 0.85 + n1d(u * 11.3 + 2.2) * 0.15);
        var pk = Math.pow(Math.max(0, (ridge - 0.55) / 0.45), 1.3); /* 峰强 0..1：只有真峰卷 */
        var y = height * ridge * (1 - front) * side;
        y -= lip * pk * 0.85 * side;                             /* 峰顶檐口下勾：悬停的浪头姿态 */
        y *= 1 - lip * pk * 0.22 * n2d(u * 12.0, 3.7);           /* 檐缘参差：浪头似有撕裂处 */
        y += (n2d(u * 5.0, d * 3.0 + 2.1) - 0.5) * 0.5 * front;  /* 背坡碎波 */
        y += (n2d(u * 9.0 + 4.2, d * 7.0) - 0.5) * 0.16;         /* 浪头细起伏 */
        var z = -zHead + lip * curl * pk - front * slope;        /* 浪头在前，背坡向远处落水 */
        pos.push(x, y, z);
        aux.push(d, u);
      }
    }
    for (var j2 = 0; j2 < nv; j2++) {
      for (var i2 = 0; i2 < nu; i2++) {
        var a = j2 * (nu + 1) + i2, b = a + 1, c = a + nu + 1, e = c + 1;
        idx.push(a, c, b, b, c, e);
      }
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    g.userData.aux = aux;
    return g;
  }

  var waveGeo = makeWaveGeometry(17, 7.4, 13, 13, 3.0);
  var waveBase = waveGeo.attributes.position.array.slice();

  /* 悬停的颤动：各点相位不同的极缓呼吸（约 22s 一轮），浪永远停在落下之前 */
  function breathe(t) {
    var p = waveGeo.attributes.position.array;
    var a = waveGeo.userData.aux;
    for (var k = 0; k < p.length; k += 3) {
      var kk = (k / 3) * 2;
      var d = a[kk], u = a[kk + 1];
      p[k + 1] = waveBase[k + 1] + Math.sin(t * 0.28 + u * 5.3 + d * 3.1) * 0.07 * (0.35 + 0.65 * (1 - d));
    }
    waveGeo.attributes.position.needsUpdate = true;
    waveGeo.computeVertexNormals();
  }

  /* 浪壳：磨砂半透明受光（roughness 0.9 + 噪点贴图 + 暖芯微透）。
     renderOrder 4：字平面(3)之后、水面(5)之前——
     字先画被浪皮罩住（泡在浪里），水面后画罩住浪的浸水段。 */
  var waveShellMat = new THREE.MeshStandardMaterial({
    color: 0xded2d2, map: shellTex, roughness: 0.9, metalness: 0,
    transparent: true, opacity: 0.76, depthWrite: false,
    emissive: 0x74584a, emissiveIntensity: 0.12, side: THREE.DoubleSide
  });
  var waveGroup = new THREE.Group();
  waveGroup.position.set(1.5, 0, 0);
  waveGroup.rotation.y = -0.14; /* 轻透视：浪身向左后雾中延伸，防「幕布感」 */
  var waveShell = new THREE.Mesh(waveGeo, waveShellMat);
  waveShell.renderOrder = 4;
  waveGroup.add(waveShell);
  /* 浪芯：略缩的同几何自发光暖芯，被磨砂壳皮罩住——树脂里亮着微光 */
  var waveCoreMat = new THREE.MeshBasicMaterial({
    color: 0xe8b088, transparent: true, opacity: 0.5, depthWrite: false
  });
  var waveCore = new THREE.Mesh(waveGeo, waveCoreMat);
  waveCore.renderOrder = 3;
  waveCore.scale.set(0.965, 0.965, 0.965);
  waveGroup.add(waveCore);
  scene.add(waveGroup);

  /* 水下浪影：同几何共享（呼吸同步），更大、更深、自发光暖色——梦里的浪更盛。
     renderOrder 2 最先画，被水面罩得最狠 = 深梦朦胧。 */
  var waveBelowMat = new THREE.MeshBasicMaterial({
    color: 0xd9a0a8, transparent: true, opacity: 0.95, depthWrite: false
  });
  var waveBelow = new THREE.Mesh(waveGeo, waveBelowMat);
  waveBelow.renderOrder = 2;
  waveBelow.scale.set(1.3, 1.4, 1.3);
  waveBelow.position.set(5.5, -8.4, -1.5); /* 沉入水下：更大的浪只有峰顶贴着水面下发光 */
  scene.add(waveBelow);

  /* 浪脚尺度锚点：浅水里的小薄碑（继承 stele 语言，浪头前不远处） */
  var steleTones = [0xe4dedd, 0xd6d0d2, 0xc6c2c8, 0xb6b2ba];
  function steleMat(i) {
    return new THREE.MeshStandardMaterial({ color: steleTones[i % 4], map: surfTex, roughness: 0.92, metalness: 0 });
  }
  [[-4.8, -11.6, 0.22, 0.9], [-3.4, -11.2, 0.15, 0.6], [5.2, -10.9, 0.28, 1.2], [6.6, -10.3, 0.18, 0.75]]
  .forEach(function (s, i) {
    var stele = new THREE.Mesh(new THREE.BoxGeometry(s[2], s[3], s[2] * 0.6), steleMat(i));
    stele.position.set(s[0], s[3] / 2 + 0.05, s[1]);
    stele.rotation.y = rnd() * Math.PI;
    scene.add(stele);
  });

  /* ── 场景内字平面（穿插：字先画 → 被浪皮/水面罩住稀释） ── */
  function makeTextPlane(text, vertical, colorInk, worldW) {
    var cvs = document.createElement('canvas');
    var ctx = cvs.getContext('2d');
    var ratio = vertical ? [512, 2048] : [2048, 512];
    cvs.width = ratio[0]; cvs.height = ratio[1];
    var tex = new THREE.CanvasTexture(cvs);
    tex.anisotropy = 4;
    function draw() {
      var fontSize = vertical ? 168 : 148;
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      ctx.fillStyle = colorInk;
      ctx.font = '600 ' + fontSize + 'px "Noto Serif SC Web", "Songti SC", serif';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      if (vertical) {
        var x = cvs.width / 2;
        var step = fontSize * 1.12;
        var startY = cvs.height / 2 - (text.length - 1) * step / 2;
        for (var i = 0; i < text.length; i++) ctx.fillText(text[i], x, startY + i * step);
      } else {
        ctx.fillText(text, cvs.width / 2, cvs.height / 2);
      }
      tex.needsUpdate = true;
    }
    draw();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
    var mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
    var h = worldW * (ratio[1] / ratio[0]);
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(worldW, h), mat);
    mesh.renderOrder = 3;
    scene.add(mesh);
    return mesh;
  }
  /* 竖排：立在浪坡左侧，上半露出浪头线，下半泡进浪壳——字被浪喝掉一半 */
  var tp1 = makeTextPlane('它是人在即将醒来时', true, 'rgba(58,51,44,0.88)', 2.4);
  tp1.position.set(-6.0, 2.4, -14.6);
  tp1.rotation.y = 0.3;
  /* 远景横排：挂在浪头主峰之后，下缘被浪峰上弧咬住 */
  var tp2 = makeTextPlane('看见的最后一层世界', false, 'rgba(74,63,52,0.62)', 10.5);
  tp2.position.set(3.5, 8.4, -25);

  /* ── 镜头与醒/梦参数（继承 J✦） ── */
  var camPos = { x: 0, y: 1.35, z: 8.5 };
  var look = { x: 0, y: 0.35, z: -30 };
  var pointer = { x: 0, y: 0 };
  var scrollP = 0;

  function readScroll() {
    var max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    scrollP = Math.min(1, Math.max(0, window.scrollY / max || 0));
    camPos.z = 8.5 - 3.4 * scrollP;
    camPos.y = 1.35 + 1.6 * scrollP;
    look.y = 0.35 - 1.3 * scrollP;
  }

  var sunWake = new THREE.Color(), sunDream = new THREE.Color();
  var hemiWake = new THREE.Color(), hemiDream = new THREE.Color();
  var groundWake = new THREE.Color(), groundDream = new THREE.Color();
  /* 按相位应用整套色板（水面 8 色 / 雾对 / 光对 / 浪壳对 / 浪影），返回该相位 dream 基线 */
  function applySeason(p) {
    var m = phaseMix(p);
    waterUniforms.uWA.value.copy(palMix('wA', m.a, m.b, m.f));
    waterUniforms.uWB.value.copy(palMix('wB', m.a, m.b, m.f));
    waterUniforms.uWC.value.copy(palMix('wC', m.a, m.b, m.f));
    waterUniforms.uWD.value.copy(palMix('wD', m.a, m.b, m.f));
    waterUniforms.uDA.value.copy(palMix('dA', m.a, m.b, m.f));
    waterUniforms.uDB.value.copy(palMix('dB', m.a, m.b, m.f));
    waterUniforms.uDC.value.copy(palMix('dC', m.a, m.b, m.f));
    waterUniforms.uDD.value.copy(palMix('dD', m.a, m.b, m.f));
    fogWake.copy(palMix('fogW', m.a, m.b, m.f));
    fogDream.copy(palMix('fogD', m.a, m.b, m.f));
    sunWake.copy(palMix('sun', m.a, m.b, m.f));
    sunDream.copy(palMix('sunD', m.a, m.b, m.f));
    hemiWake.copy(palMix('hemiSky', m.a, m.b, m.f));
    hemiDream.copy(palMix('hemiD', m.a, m.b, m.f));
    groundWake.copy(palMix('hemiGnd', m.a, m.b, m.f));
    groundDream.copy(palMix('gndD', m.a, m.b, m.f));
    fill.color.copy(palMix('fill', m.a, m.b, m.f));
    sun.intensity = m.a.sunI + (m.b.sunI - m.a.sunI) * m.f;
    waveShellMat.color.copy(palMix('shell', m.a, m.b, m.f));
    waveBelowMat.color.copy(palMix('below', m.a, m.b, m.f));
    return m.a.dream0 + (m.b.dream0 - m.a.dream0) * m.f;
  }

  function renderOnce() {
    camera.position.set(camPos.x + pointer.x * 0.35, camPos.y + pointer.y * -0.12, camPos.z);
    camera.lookAt(look.x, look.y, look.z);
    waterUniforms.uFogColor.value.copy(scene.fog.color);
    renderer.render(scene, camera);
  }
  function onResize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderOnce();
  }

  var lastT = 0, running = false, rafId = null;
  function loop(now) {
    requestAnimationFrame(loop);
    if (now - lastT < 33) return;
    var t = now / 1000;
    lastT = now;

    /* 四时更迭（约 3.7 分钟一轮），滚动拨快换季 */
    var phase = 0.08 + t * 0.0045 + scrollP * 0.4;
    var dream0 = applySeason(phase);
    var dream = Math.max(0, Math.min(1, dream0 + 0.1 * Math.sin(t * 0.05) + 0.45 * scrollP));
    waterUniforms.uDream.value = dream;
    waterUniforms.uTime.value = t;
    scene.fog.color.copy(fogWake).lerp(fogDream, dream);
    scene.background.copy(scene.fog.color);
    sun.color.copy(sunWake).lerp(sunDream, dream);
    hemi.color.copy(hemiWake).lerp(hemiDream, dream);
    hemi.groundColor.copy(groundWake).lerp(groundDream, dream);

    /* 悬浪的颤动 + 浪影极缓浮沉（呼吸同步共享几何，浪影跟随） */
    breathe(t);
    waveBelow.position.y = -8.4 + Math.sin(t * 0.12) * 0.06;

    renderOnce();
  }
  function start() { if (running || reduceMotion) return; running = true; lastT = performance.now(); rafId = requestAnimationFrame(loop); }
  function stop() { running = false; if (rafId !== null) cancelAnimationFrame(rafId); rafId = null; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });

  if (!reduceMotion) {
    start();
    window.addEventListener('pointermove', function (e) {
      pointer.x = (e.clientX / window.innerWidth - 0.5) * 2;
      pointer.y = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });
  }
  window.addEventListener('scroll', function () { readScroll(); if (reduceMotion) renderOnce(); }, { passive: true });
  window.addEventListener('resize', onResize);

  applySeason(0.08);
  onResize();
  readScroll();
  renderOnce();
})();
</script>
</body>
</html>
