<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 B · 巨构尺度</title>
<style>
  :root {
    --paper: #f8f9f8;
    --ink: #232930;
    --ink-soft: #545f6a;
    --ink-faint: #6f7a85;
    --line: #dfe4e7;
    --mist: #a9bdc9;
    --mist-soft: #ccd8e0;
    --mist-ink: #4c6a80;
    --blush: #d8c4c9;
    --blush-soft: #e9dee1;
    --font-display: 'Palatino Linotype', 'Iowan Old Style', Palatino, Georgia,
      'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', SimSun, serif;
    --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB',
      'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    overflow: hidden;
  }

  .stage {
    position: relative;
    height: 100dvh;
    background:
      radial-gradient(52vw 40vh at 16% 88%, rgba(169, 189, 201, 0.14), transparent 70%),
      var(--paper);
  }

  /* ── 超大水晶剪影：巨构 ── */
  .mega {
    position: absolute;
    top: -12vh; right: -8vw;
    width: 62vw; height: 108vh;
    z-index: 1;
  }

  .mega svg { width: 100%; height: 100%; display: block; }

  /* ── 无限延伸的细线（导航依托其上） ── */
  .line {
    position: absolute;
    left: 0; right: 0;
    top: 74vh;
    height: 1px;
    background: linear-gradient(to right, var(--line) 0%, var(--ink-faint) 42%, rgba(109, 126, 138, 0.25) 100%);
    z-index: 2;
  }

  .nav {
    position: absolute;
    top: 74vh;
    transform: translateY(-50%);
    display: flex;
    gap: 4.5vw;
    left: 4vw;
    z-index: 6;
  }

  .nav a {
    position: relative;
    padding-top: 1.5rem;
    color: var(--ink-soft);
    text-decoration: none;
    letter-spacing: 0.14em;
    transition: color 0.18s ease;
  }

  /* 站点：线上的短刻度 */
  .nav a::before {
    content: '';
    position: absolute;
    top: -0.62rem;
    left: 50%;
    width: 1px;
    height: 0.9rem;
    background: var(--ink-faint);
  }

  .nav a:hover { color: var(--ink); }

  /* ── 小字宣言，落在巨物的负空间里 ── */
  .manifesto {
    position: absolute;
    left: 8vw; top: 30vh;
    max-width: 26em;
    margin: 0;
    z-index: 3;
  }

  .manifesto .main {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.35rem, 2.6vw, 2rem);
    line-height: 2.05;
    letter-spacing: 0.03em;
    margin: 0;
  }

  .manifesto .sub {
    margin: 1.6rem 0 0;
    font-size: 0.92rem;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
  }

  .brand {
    position: absolute;
    top: 4.5vh; left: 4vw;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-family: var(--font-display);
    color: var(--ink);
    text-decoration: none;
    z-index: 6;
  }

  .brand svg { width: 16px; height: 16px; color: var(--mist-ink); }

  /* 现实锚点：贴在巨构上的小照片 */
  .anchor {
    position: absolute;
    top: 18vh; right: 24vw;
    z-index: 4;
    transform: rotate(-2deg);
    padding: 6px;
    background: rgba(255, 255, 255, 0.75);
  }

  .anchor img {
    display: block;
    width: 10vw;
    min-width: 110px;
    max-width: 170px;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    filter: grayscale(0.85) contrast(0.88) opacity(0.85);
  }

  .anchor figcaption {
    font-size: 0.72rem;
    color: var(--ink-faint);
    padding-top: 6px;
    text-align: center;
    letter-spacing: 0.08em;
  }

  /* 小漂浮碎块（巨构的回声） */
  .echo {
    position: absolute;
    top: 60vh; left: 36vw;
    width: 5vw; height: 9vh;
    clip-path: polygon(28% 0%, 100% 26%, 74% 100%, 0% 70%);
    background: rgba(169, 189, 201, 0.22);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 2;
  }

  :focus-visible {
    outline: 2px solid var(--mist-ink);
    outline-offset: 3px;
  }

  @media (prefers-reduced-transparency: reduce) {
    .echo { background: rgba(169, 189, 201, 0.4); backdrop-filter: none; }
  }

  @media (max-width: 720px) {
    body { overflow: auto; }

    .stage { height: auto; min-height: 100dvh; padding: 16vh 8vw 20vh; }

    .mega { top: -6vh; right: -26vw; width: 92vw; height: 70vh; opacity: 0.8; }

    .mega-fall { display: none; }

    .manifesto { position: static; }
    .manifesto .main { font-size: clamp(1.3rem, 6.4vw, 1.8rem); }

    .anchor { top: 40vh; right: 6vw; }

    .echo { display: none; }

    .line { top: auto; bottom: 12vh; }

    .nav { top: auto; bottom: 12vh; transform: translateY(-50%); gap: 2rem; }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- 巨构：一块超大的水晶，切出画面边缘 -->
  <div class="mega" aria-hidden="true">
    <svg viewBox="0 0 100 160" preserveAspectRatio="xMidYMin slice">
      <defs>
        <linearGradient id="megagrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="rgba(204, 216, 224, 0.42)"/>
          <stop offset="0.55" stop-color="rgba(233, 222, 225, 0.30)"/>
          <stop offset="1" stop-color="rgba(169, 189, 201, 0.20)"/>
        </linearGradient>
      </defs>
      <path d="M34 0 L86 12 L104 52 L96 128 L58 160 L18 132 L6 70 Z"
            fill="url(#megagrad)"
            stroke="rgba(76,106,128,0.30)" stroke-width="0.4"/>
      <path d="M34 0 L52 74 L96 128 M86 12 L58 66 M18 132 L52 74 M6 70 L58 66 M58 66 L96 128 M52 74 L58 160"
            stroke="rgba(76,106,128,0.16)" stroke-width="0.3" fill="none"/>
      <!-- 错位晶面：一条不属于整体晶面规律的细线，制造"似乎有规则却无法理解"的异常 -->
      <path d="M12 96 L74 34"
            stroke="rgba(76,106,128,0.26)" stroke-width="0.3" stroke-dasharray="1.6 1.2" fill="none"/>
    </svg>
  </div>

  <a class="brand" href="/">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 1.6 19.9 8.7 16.9 22.2 7.3 22.4 4.1 9.5Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M12 1.6 9.4 22.3M12 1.6l4.9 20.6M4.1 9.5l15.8-.8" stroke="currentColor" stroke-width="0.55" stroke-opacity="0.5"/>
    </svg>
    <span>Traveritas</span>
  </a>

  <div class="echo" aria-hidden="true"></div>

  <div class="manifesto">
    <p class="main">这里不是梦，也不是现实。<br/>它是人在即将醒来时，<br/>看见的最后一层世界。</p>
    <p class="sub">世界应当始终保留一种感觉：它可能马上消失。</p>
  </div>

  <figure class="anchor">
    <img src="https://picsum.photos/seed/xingmeng-anchor/400/500" alt="贴在巨构上的一枚现实锚点" loading="lazy" />
    <figcaption>锚点</figcaption>
  </figure>

  <div class="line" aria-hidden="true"></div>

  <nav class="nav" aria-label="站内入口">
    <a href="/articles/">随笔</a>
    <a href="/projects/">项目</a>
    <a href="/about/">关于</a>
  </nav>

</div>
</body>
</html>
