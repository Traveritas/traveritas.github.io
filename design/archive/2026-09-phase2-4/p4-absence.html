<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 C · 天缺（活体）</title>
<style>
  /* ═══ 概念 ═══（Phase 4 · 会话 C · 主体是「巨大的没有」）
     天上裂开一处不规则的巨型空洞，露出洞后更暖更亮的「别处」；
     世界从自己的边缘持续剥落——纸屑、线缕、云絮——缓慢飘向缺口，穿过即溶解。
     缺从不扩大，也从不愈合：世界正在消失，只是永远消失不完。
     醒侧全场暖纸色；越往深处滚（入梦）全场转冷灰，
     洞里的暖是冷世界里唯一透过来的暖（规则继承 Jc 冷晨）。
     构图：本项目第一个天空主体——地面只是纸原，三座细碑是尺度锚点，
     两幅竖排字幡立在场中，剥落纸屑从幡前穿过（活物短暂遮字）。 */

  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-600-normal.woff2') format('woff2');
  }

  :root {
    --ink: #37363a;
    --ink-soft: #655f66;
    --ink-faint: #6f696f;
    --mist-ink: #5d6d80;
    --font-display: 'Noto Serif SC Web', 'Noto Serif SC', 'Palatino Linotype', Georgia, 'Songti SC', SimSun, serif;
    --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); color: var(--ink); background: #e6e1da; }

  .stage {
    position: fixed;
    inset: 0;
    overflow: clip;
    background: linear-gradient(to bottom, #eee4d6 0%, #e4ddd9 40%, #d4cfcf 100%);
  }
  .scroll-length { height: 260vh; }
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .vignette {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    /* 天有重量：顶部一层暖深渐变 + 四周暗角 */
    background:
      linear-gradient(to bottom, rgba(112, 84, 62, 0.14), transparent 22%),
      radial-gradient(125% 92% at 50% 44%, transparent 58%, rgba(88, 74, 70, 0.13) 100%);
  }

  .rise { opacity: 0; transform: translateY(10px); animation: rise-in 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .rise.d1 { animation-delay: 0.15s; }
  .rise.d2 { animation-delay: 0.45s; }
  .rise.d3 { animation-delay: 0.7s; }
  @keyframes rise-in { to { opacity: 1; transform: translateY(0); } }

  /* 宣言只有第一行留在 DOM（保证可读与无障碍），其余两行进入 3D 场景 */
  .manifesto {
    position: absolute;
    left: 8vw;
    top: 9vh;
    z-index: 10;
    margin: 0;
    font-family: var(--font-display);
    line-height: 1.6;
    color: var(--ink);
    text-shadow: 0 2px 26px rgba(248, 240, 228, 0.9), 0 0 8px rgba(248, 240, 228, 0.7);
  }
  .manifesto .l1 { display: block; font-size: clamp(1.35rem, 2.8vw, 2.6rem); font-weight: 500; letter-spacing: 0.045em; }

  .brand {
    position: absolute; top: 4.5vh; left: 4vw; z-index: 10;
    display: inline-flex; align-items: center; gap: 0.6rem;
    font-family: var(--font-display); font-weight: 500; font-size: 1.02rem;
    letter-spacing: 0.06em; color: var(--ink); text-decoration: none;
    text-shadow: 0 1px 18px rgba(248, 240, 228, 0.9);
  }
  .brand .ring { width: 11px; height: 11px; border: 1.5px solid var(--mist-ink); border-radius: 50%; opacity: 0.85; }

  .nav {
    position: absolute; right: 3.4vw; top: 24vh; z-index: 10;
    display: flex; flex-direction: column; gap: 2.3rem;
  }
  .nav a {
    position: relative; writing-mode: vertical-rl; letter-spacing: 0.5em;
    padding: 0.4rem 0.7rem; color: var(--ink-soft); text-decoration: none;
    font-size: 0.95rem; transition: color 0.18s ease;
    text-shadow: 0 1px 16px rgba(248, 240, 228, 0.9);
  }
  .nav a::after {
    content: ''; position: absolute; top: 46%; right: calc(100% + 0.35rem);
    width: 1.3rem; height: 1px; background: rgba(93, 109, 128, 0.45);
    transition: width 0.18s ease, background 0.18s ease;
  }
  .nav a:hover { color: var(--ink); }
  .nav a:hover::after { width: 2rem; background: var(--mist-ink); }

  .side-note {
    position: absolute; left: 3.2vw; top: 13vh; z-index: 10;
    writing-mode: vertical-rl; font-size: 0.8rem; letter-spacing: 0.52em;
    color: var(--ink-faint);
    text-shadow: 0 0 10px rgba(248, 240, 228, 0.95), 0 0 4px rgba(248, 240, 228, 0.9);
  }

  .floating-ledger { position: absolute; left: 26vw; right: 16vw; bottom: 6vh; z-index: 10; }
  .floating-ledger h2 {
    margin: 0 0 1rem; font-weight: 500; font-size: 0.82rem;
    letter-spacing: 0.3em; color: var(--ink-faint);
    text-shadow: 0 1px 14px rgba(248, 240, 228, 0.9);
  }
  .slips { display: flex; gap: 1.2rem 1.8rem; align-items: flex-start; }
  .slip {
    position: relative; display: block; padding: 0.85rem 1rem 0.95rem;
    background: rgba(252, 250, 244, 0.9); border: 1px solid rgba(255, 255, 255, 0.62);
    box-shadow: 5px 4px 10px -6px rgba(88, 74, 70, 0.3);
    text-decoration: none; overflow: clip;
  }
  .slip::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
    background: linear-gradient(to bottom, transparent, rgba(196, 164, 130, 0.22));
  }
  .slip:nth-child(1) { width: 13rem; transform: rotate(-1.2deg); }
  .slip:nth-child(2) { width: 15.5rem; transform: rotate(0.7deg) translateY(10px); }
  .slip:nth-child(3) { width: 12.5rem; transform: rotate(-0.5deg) translateY(3px); }
  .slip .d { display: block; font-size: 0.72rem; letter-spacing: 0.12em; color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-bottom: 0.35rem; }
  .slip .t { display: block; font-family: var(--font-display); font-size: 0.98rem; color: var(--ink); line-height: 1.55; }
  .slip:hover .t { color: var(--mist-ink); }

  .stage.no3d canvas#gl { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; opacity: 1; transform: none; }
  }
  @media (max-width: 760px) {
    .side-note { display: none; }
    .brand { position: static; margin: 1.1rem 9vw 0; }
    .nav { position: static; margin: 0.6rem 9vw 0; flex-direction: row; gap: 1.8rem; }
    .nav a { writing-mode: horizontal-tb; letter-spacing: 0.24em; font-size: 0.9rem; }
    .nav a::after { display: none; }
    .floating-ledger { position: static; margin: 2.8rem 9vw 8vh; }
    .slips { flex-direction: column; gap: 0.9rem; }
    .slip { width: 100%; transform: none; }
    .stage { position: relative; min-height: 100dvh; }
    .scroll-length { display: none; }
    .manifesto { position: relative; top: 0; left: 0; margin: 10vh 9vw 0; }
  }
</style>
</head>

<script src="vendor/three.min.js"></script>
<script>
/* ═══ 天缺 · THE ABSENCE ═══
   主体 = 天上的巨型空洞（fbm 溶解的不规则洞缘，洞内是暖白别处之光）；
   世界 = 纸原（连续域扭曲晕染，无水）+ 三座细碑（尺度锚点）；
   剥落 = 纸屑 InstancedMesh 单向飘向缺口，穿过即溶（缩小消隐后重生）；
   线缕与云絮 = 从地平线向上起 ,缓慢升入缺口方向；
   字幡 = 宣言后两行立在场中，剥落物从幡前穿过。
   uDream：醒暖 ↔ 梦冷，滚动加深；洞里的暖在冷侧保持唯一。 */
(function () {
  if (!window.THREE) return;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var seed = 20260919;
  function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  function range(a, b) { return a + rnd() * (b - a); }

  var canvas = document.getElementById('gl');
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false }); }
  catch (e) { document.getElementById('stage').classList.add('no3d'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

  var scene = new THREE.Scene();
  /* ── 醒/梦两极色板 ── */
  var WAKE = {
    fog: 0xeee3d0, skyTop: 0xd9bfa4,
    fA: 0xf2ead9, fB: 0xecdfc9, fC: 0xdfc9ac, fD: 0xc4a482,
    tearCore: 0xfff8e9, tearEdge: 0xeac793,
    ink: 0x57504a, paper: 0xead9c2,
    hemiSky: 0xf6ecd8, hemiGnd: 0xc0a88e,
    sun: 0xffe6bd, sunI: 0.55, fill: 0xe8e4ea,
    pool: 0xf3ddb0, thread: 0xb09a78
  };
  var DREAM = {
    fog: 0xe2e0ea, skyTop: 0xb9b6cc,
    fA: 0xeae9ee, fB: 0xdcdbe6, fC: 0xc2c1d4, fD: 0x9d9cb4,
    tearCore: 0xfaf0ee, tearEdge: 0xe2b8b8,
    ink: 0x4d4d60, paper: 0xe6e3f0,
    hemiSky: 0xe4e2ec, hemiGnd: 0x9795ac,
    sun: 0xe2d8ec, sunI: 0.38, fill: 0xd8dcea,
    pool: 0xe9cfc9, thread: 0x9690b2
  };
  [WAKE, DREAM].forEach(function (p) {
    for (var k in p) p[k] = (k === 'sunI') ? p[k] : new THREE.Color(p[k]);
  });
  var KEYS = ['fog','skyTop','fA','fB','fC','fD','tearCore','tearEdge','ink','paper','hemiSky','hemiGnd','sun','fill','pool','thread'];
  var _t = new THREE.Color();
  function palLerp(key, d, target) { target.copy(WAKE[key]).lerp(DREAM[key], d); }

  var fogWake = WAKE.fog.clone();
  scene.background = fogWake.clone();
  scene.fog = new THREE.Fog(fogWake.clone(), 14, 64);

  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 220);

  var hemi = new THREE.HemisphereLight(0xf6ecd8, 0xc0a88e, 0.95);
  scene.add(hemi);
  /* 主光从缺口方向来（右上远处偏上）：世界被那道暖光照着 */
  var sun = new THREE.DirectionalLight(0xffe6bd, 0.55);
  sun.position.set(4, 14, -18);
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0xe8e4ea, 0.25);
  fill.position.set(-7, 4, -2);
  scene.add(fill);

  /* ── 共享 fbm 噪声（与 P3 底盘同一套，连续域、无量化） ── */
  var NOISE_GLSL = [
    'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
    'float noise(vec2 p) {',
    '  vec2 i = floor(p), f = fract(p);',
    '  float a = hash(i), b = hash(i + vec2(1.0, 0.0)), c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));',
    '  vec2 u = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);',
    '}',
    'float fbm(vec2 p) {',
    '  float v = 0.0, a = 0.5;',
    '  for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }',
    '  return v;',
    '}'
  ].join('\n');

  /* ── 天幕：竖向渐变（上重下雾）+ 极缓噪声呼吸。缺口后面就是它 ── */
  var skyU = {
    uTime: { value: 0 },
    uTop: { value: new THREE.Color() },
    uBot: { value: new THREE.Color() }
  };
  var sky = new THREE.Mesh(
    new THREE.PlaneGeometry(260, 140),
    new THREE.ShaderMaterial({
      uniforms: skyU, depthWrite: false,
      vertexShader: [
        'varying vec2 vUv;',
        'void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }'
      ].join('\n'),
      fragmentShader: [
        'uniform float uTime;',
        'uniform vec3 uTop; uniform vec3 uBot;',
        'varying vec2 vUv;',
        NOISE_GLSL,
        'void main() {',
        '  vec3 col = mix(uBot, uTop, smoothstep(0.22, 0.96, vUv.y));',
        '  col *= 0.985 + 0.03 * fbm(vUv * vec2(6.0, 3.0) + vec2(uTime * 0.004, 0.0));',
        '  gl_FragColor = vec4(col, 1.0);',
        '}'
      ].join('\n')
    })
  );
  sky.position.set(0, 30, -58);
  sky.renderOrder = 0;
  scene.add(sky);

  /* ── 纸原：连续域扭曲晕染（P3 验证配方，去水光），洞下有暖晒斑 ── */
  var groundU = {
    uTime: { value: 0 },
    uFogColor: { value: new THREE.Color() },
    uFogNear: { value: 14.0 },
    uFogFar: { value: 64.0 },
    uWA: { value: new THREE.Color() }, uWB: { value: new THREE.Color() },
    uWC: { value: new THREE.Color() }, uWD: { value: new THREE.Color() },
    uPoolPos: { value: new THREE.Vector2(4.0, -33) },
    uPoolCol: { value: new THREE.Color() }
  };
  var groundMat = new THREE.ShaderMaterial({
    transparent: true,
    uniforms: groundU,
    vertexShader: [
      'varying vec3 vWorld;',
      'varying float vNdcY;',
      'void main() {',
      '  vec4 w = modelMatrix * vec4(position, 1.0);',
      '  vWorld = w.xyz;',
      '  vec4 pr = projectionMatrix * viewMatrix * w;',
      '  vNdcY = pr.y / pr.w;',
      '  gl_Position = pr;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform float uTime;',
      'uniform vec3 uFogColor;',
      'uniform float uFogNear;',
      'uniform float uFogFar;',
      'uniform vec3 uWA; uniform vec3 uWB; uniform vec3 uWC; uniform vec3 uWD;',
      'uniform vec2 uPoolPos;',
      'uniform vec3 uPoolCol;',
      'varying vec3 vWorld;',
      'varying float vNdcY;',
      NOISE_GLSL,
      'void main() {',
      '  vec2 p = vWorld.xz * 0.045;',
      '  vec2 w1 = vec2(fbm(p + vec2(0.0, 3.7)), fbm(p + vec2(5.2, 0.0)));',
      '  vec2 w2 = vec2(fbm(p * 1.9 + w1 * 1.4 + vec2(1.7, 9.2)),',
      '                 fbm(p * 1.9 + w1 * 1.4 + vec2(8.3, 2.8)));',
      '  float h = fbm(p * 2.3 + w2 * 1.1 + vec2(uTime * 0.008, -uTime * 0.005));',
      '  h = h * 0.74 + 0.26 * fbm(p * 0.42 + vec2(uTime * 0.003, 0.0));',
      '  float t = h;',
      '  vec3 col = mix(uWA, uWB, smoothstep(0.0, 0.36, t));',
      '  col = mix(col, uWC, smoothstep(0.36, 0.64, t));',
      '  col = mix(col, uWD, smoothstep(0.64, 1.0, t));',
      '  float streak = fbm(vec2(vWorld.x * 0.3, vWorld.z * 1.3) + w1 * 0.8);',
      '  col *= 0.965 + 0.06 * streak;',
      '  /* 洞的暖光落在纸原上的晒斑 */',
      '  float pd = length(vWorld.xz - uPoolPos);',
      '  col = mix(col, uPoolCol, exp(-pd * pd / 56.0) * 0.55);',
      '  float dist = length(vWorld - cameraPosition);',
      '  float fogF = smoothstep(uFogNear, uFogFar, dist);',
      '  col = mix(col, uFogColor, fogF);',
      '  float deep = smoothstep(0.25, -0.85, vNdcY);',
      '  col *= 1.0 - 0.05 * deep;',
      '  float alpha = clamp(mix(0.85, 0.96, fogF) + deep * 0.25, 0.0, 1.0);',
      '  gl_FragColor = vec4(col, alpha);',
      '}'
    ].join('\n')
  });
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(280, 280, 72, 72), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.renderOrder = 1;
  scene.add(ground);

  /* ── 主体：天缺——洞内是别处之光，洞缘 fbm 溶解，边缘呼吸但半径不变 ── */
  var TEAR_W = 17.0, TEAR_H = 11.5;
  var TEAR_C = new THREE.Vector3(4.2, 12.5, -40);
  var tearU = {
    uTime: { value: 0 },
    uDream: { value: 0.15 },
    uCore: { value: new THREE.Color() },
    uEdge: { value: new THREE.Color() },
    uFog: { value: new THREE.Color() }
  };
  var tear = new THREE.Mesh(
    new THREE.PlaneGeometry(TEAR_W, TEAR_H),
    new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: tearU,
      vertexShader: [
        'varying vec2 vUv;',
        'void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }'
      ].join('\n'),
      fragmentShader: [
        'uniform float uTime;',
        'uniform float uDream;',
        'uniform vec3 uCore; uniform vec3 uEdge; uniform vec3 uFog;',
        'varying vec2 vUv;',
        NOISE_GLSL,
        'void main() {',
        '  vec2 p = (vUv - 0.5) * vec2(' + (TEAR_W / TEAR_H).toFixed(3) + ', 1.0);',
        '  float d = length(p * vec2(0.97, 1.05));',
        '  float ang = atan(p.y, p.x);',
        '  float rim = 0.44',
        '    + 0.15 * fbm(vec2(ang * 1.15 + 3.1, uTime * 0.010))',
        '    + 0.07 * fbm(p * 2.2 + vec2(uTime * 0.006, -uTime * 0.004))',
        '    + 0.05 * sin(ang * 2.0 + 1.3 + uTime * 0.02);',
        '  rim = clamp(rim, 0.34, 0.55);',
        '  rim *= 1.0 + 0.012 * sin(uTime * 0.16);',
        '  /* 平面边界渐隐：halo 与 fray 不许被 plane 边缘切出直线 */',
        '  float eb = smoothstep(0.50, 0.42, abs(p.y)) * smoothstep(0.72, 0.60, abs(p.x));',
        '  float aIn = 1.0 - smoothstep(rim - 0.05, rim - 0.01, d);',
        '  float band = 1.0 - smoothstep(rim - 0.01, rim + 0.10, d);',
        '  float fray = clamp(band - aIn, 0.0, 1.0) * (0.4 + 0.3 * uDream) * eb;',
        '  /* 洞内：均匀的暖白别处之光（靠上略亮），近缘一圈可见的琥珀切口 */',
        '  vec3 col = uCore;',
        '  col *= 1.0 + 0.06 * (vUv.y - 0.5);',
        '  float vein = fbm(p * 4.5 + vec2(0.0, uTime * 0.01));',
        '  col *= 0.96 + 0.08 * vein;',
        '  float lip = smoothstep(rim - 0.18, rim - 0.04, d);',
        '  col = mix(col, uEdge, lip * 0.7);',
        '  col = mix(col, uFog, (1.0 - aIn) * smoothstep(rim + 0.04, rim - 0.01, d) * 0.3);',
        '  float halo = smoothstep(rim + 0.08, rim - 0.01, d) * (1.0 - aIn) * eb;',
        '  col += uCore * halo * 0.04;',
        '  float alpha = clamp(aIn + fray * 0.5 + halo * 0.05, 0.0, 1.0);',
        '  gl_FragColor = vec4(col, alpha);',
        '}'
      ].join('\n')
    })
  );
  tear.position.copy(TEAR_C);
  tear.rotation.z = 0.05;
  tear.renderOrder = 4;
  scene.add(tear);

  /* ── 剥落纸屑：世界边缘的单向旅程，穿过缺口即溶 ── */
  var FLAKES = 900;
  var flakeGeo = new THREE.PlaneGeometry(1, 1);
  var flakeMat = new THREE.MeshLambertMaterial({ color: 0x57504a, side: THREE.DoubleSide });
  var flakes = new THREE.InstancedMesh(flakeGeo, flakeMat, FLAKES);
  var fPos = new Float32Array(FLAKES * 3);
  var fVel = new Float32Array(FLAKES * 3);
  var fLife = new Float32Array(FLAKES);
  var fSize = new Float32Array(FLAKES);
  var fSpd = new Float32Array(FLAKES);
  var fPh = new Float32Array(FLAKES);
  var fKill = new Float32Array(FLAKES);
  var flakesRoot = new THREE.Group();
  flakesRoot.add(flakes);
  scene.add(flakesRoot);
  var _zero = new THREE.Color(1, 1, 1);
  for (var i = 0; i < FLAKES; i++) {
    var big = rnd() < 0.03;
    fSize[i] = big ? range(0.4, 0.6) : range(0.09, 0.3);
    fSpd[i] = range(0.3, 0.7);
    fPh[i] = rnd() * Math.PI * 2;
    /* 溶解壳：每粒有自己的歼灭半径，穿过即溶的位置分散成一层壳 */
    fKill[i] = range(0.85, 2.6);
    /* 纸色为主（tone>1 变浅），约两成墨色点缀 */
    var t3 = rnd();
    var tone = big ? range(1.5, 1.9) : (t3 < 0.5 ? range(1.3, 1.75) : (t3 < 0.82 ? range(0.85, 1.2) : range(0.5, 0.75)));
    flakes.setColorAt(i, _zero.clone().multiplyScalar(tone));
  }
  flakes.instanceColor.needsUpdate = true;

  /* 剥落流走廊：从地平线左侧（世界侧）向缺口汇聚，越近越收窄 */
  var FLOW_S = new THREE.Vector3(-15, 2.6, -24);
  var FLOW_D = new THREE.Vector3().subVectors(TEAR_C, FLOW_S).normalize();
  var _v = new THREE.Vector3(), _dir = new THREE.Vector3();
  function spawnFlake(i, initial) {
    var x, y, z;
    if (rnd() < 0.15) {
      /* 15% 大气散屑：随处漂浮，维持空气感 */
      x = range(-17, 17); y = range(0.6, 16); z = range(-36, -8);
    } else {
      var t = Math.pow(rnd(), 0.75);
      var spread = 4.5 + 9.0 * (1 - t);
      x = FLOW_S.x + (TEAR_C.x - FLOW_S.x) * t + (rnd() + rnd() - 1) * spread;
      y = FLOW_S.y + (TEAR_C.y - FLOW_S.y) * t + (rnd() + rnd() - 1) * spread * 0.7;
      z = FLOW_S.z + (TEAR_C.z - FLOW_S.z) * t + (rnd() - 0.5) * 6;
    }
    if (y < 0.6) y = 0.6 + rnd() * 1.2;
    if (y > 19) y = 19 - rnd() * 2;
    fPos[i * 3] = x;
    fPos[i * 3 + 1] = y;
    fPos[i * 3 + 2] = z;
    fVel[i * 3] = FLOW_D.x * fSpd[i] * 0.5 + range(-0.04, 0.04);
    fVel[i * 3 + 1] = FLOW_D.y * fSpd[i] * 0.5 + range(0.0, 0.06);
    fVel[i * 3 + 2] = FLOW_D.z * fSpd[i] * 0.5 + range(-0.04, 0.04);
    fLife[i] = initial ? rnd() * 20 : 0;
  }
  for (i = 0; i < FLAKES; i++) spawnFlake(i, true);

  var dummy = new THREE.Object3D();
  dummy.rotation.order = 'YXZ';
  function updateFlakes(dt, t) {
    for (var i = 0; i < FLAKES; i++) {
      var ix = i * 3;
      var px = fPos[ix], py = fPos[ix + 1], pz = fPos[ix + 2];
      _dir.set(TEAR_C.x - px, TEAR_C.y - py, TEAR_C.z - pz);
      var distC = _dir.length() || 1;
      _dir.divideScalar(distC);
      var sp = fSpd[i], ph = fPh[i];
      /* 目标速度 = 向缺口 + 微旋流 + 风；再向目标缓混合 */
      var tvx = _dir.x * sp + Math.sin(py * 0.5 + t * 0.24 + ph) * 0.12 + FLOW_D.x * 0.12;
      var tvy = _dir.y * sp + Math.sin(px * 0.4 - t * 0.18 + ph * 1.3) * 0.08 + 0.1 + FLOW_D.y * 0.06;
      var tvz = _dir.z * sp + Math.sin((px + py) * 0.3 + t * 0.2 + ph * 0.7) * 0.1;
      fVel[ix] = fVel[ix] * 0.9 + tvx * 0.1;
      fVel[ix + 1] = fVel[ix + 1] * 0.9 + tvy * 0.1;
      fVel[ix + 2] = fVel[ix + 2] * 0.9 + tvz * 0.1;
      fPos[ix] += fVel[ix] * dt;
      fPos[ix + 1] += fVel[ix + 1] * dt;
      fPos[ix + 2] += fVel[ix + 2] * dt;
      fLife[i] += dt;
      if (distC < fKill[i] * 0.45 || fLife[i] > 30) { spawnFlake(i, false); continue; }
      var birth = Math.min(1, fLife[i] / 2);
      var r2 = distC / fKill[i];
      var dissolve = 1 - Math.max(0, Math.min(1, (1 - r2) / 0.55)) * 0.9;
      var s = fSize[i] * birth * dissolve;
      if (s < 0.004) continue;
      var vx = fVel[ix], vy = fVel[ix + 1], vz = fVel[ix + 2];
      var hs = Math.sqrt(vx * vx + vz * vz) || 0.001;
      dummy.position.set(fPos[ix], fPos[ix + 1], fPos[ix + 2]);
      dummy.rotation.y = Math.atan2(vx, vz);
      dummy.rotation.x = Math.max(-0.7, Math.min(0.7, Math.atan2(vy, hs) * 0.8));
      dummy.rotation.z = Math.sin(t * 0.7 + ph) * 0.25;
      dummy.scale.set(s, s * 0.38, 1);
      dummy.updateMatrix();
      flakes.setMatrixAt(i, dummy.matrix);
    }
    flakes.instanceMatrix.needsUpdate = true;
  }

  /* ── 线缕与云絮：从地平线向上起，升向缺口方向，到高处淡出重来 ── */
  function makeRiseTex(w, h) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var x = c.getContext('2d');
    var g = x.createLinearGradient(0, h, 0, 0);
    g.addColorStop(0, 'rgba(255,255,255,0.85)');
    g.addColorStop(0.55, 'rgba(255,255,255,0.38)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    var m = x.createLinearGradient(0, 0, w, 0);
    m.addColorStop(0, 'rgba(255,255,255,0)');
    m.addColorStop(0.35, 'rgba(255,255,255,1)');
    m.addColorStop(0.65, 'rgba(255,255,255,1)');
    m.addColorStop(1, 'rgba(255,255,255,0)');
    x.globalCompositeOperation = 'destination-in';
    x.fillStyle = m; x.fillRect(0, 0, w, h);
    return new THREE.CanvasTexture(c);
  }
  var riseTex = makeRiseTex(256, 64);
  var risers = [];
  function addRiser(w, h, x, y, z, vy, op) {
    var m = new THREE.MeshBasicMaterial({ map: riseTex, transparent: true, opacity: op, depthWrite: false, side: THREE.DoubleSide });
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
    mesh.position.set(x, y, z);
    mesh.rotation.z = (w < 1) ? range(-0.14, 0.14) : range(-0.04, 0.04);
    mesh.renderOrder = 2;
    scene.add(mesh);
    risers.push({ mesh: mesh, m: m, x0: x, vy: vy, ph: rnd() * Math.PI * 2, y0: range(3.2, 5.2) });
  }
  /* 四道宽云絮（低、慢）+ 六条细线缕（窄、略快）——世界从边缘向上散 */
  addRiser(11, 2.6, -11.5, 4.4, -34, 0.075, 0.16);
  addRiser(13, 3.0, 13.5, 5.2, -36, 0.06, 0.14);
  addRiser(9, 2.2, 1.5, 3.8, -30, 0.09, 0.16);
  addRiser(12, 2.7, -4, 5.6, -37, 0.055, 0.12);
  addRiser(0.18, 10, -8.2, 4.8, -28, 0.16, 0.3);
  addRiser(0.15, 11, 8.8, 5.6, -31, 0.14, 0.26);
  addRiser(0.2, 9, 14.2, 4.2, -26, 0.18, 0.24);
  addRiser(0.14, 12, -2.4, 6.0, -33, 0.13, 0.24);
  addRiser(0.16, 9.5, 4.6, 5.0, -24, 0.19, 0.22);
  addRiser(0.18, 11, -13.8, 5.8, -30, 0.15, 0.22);

  /* ── 尺度锚点：三座细碑（前几世碑的回声，最远处那座最矮） ── */
  function makeGradTex() {
    var c = document.createElement('canvas'); c.width = 32; c.height = 128;
    var x = c.getContext('2d');
    var g = x.createLinearGradient(0, 0, 0, 128);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.55, '#f1f1f1');
    g.addColorStop(1, '#d6d6d6');
    x.fillStyle = g; x.fillRect(0, 0, 32, 128);
    return new THREE.CanvasTexture(c);
  }
  var gradTex = makeGradTex();
  var steleMat = new THREE.MeshStandardMaterial({ color: 0x6a625b, map: gradTex, roughness: 0.92, metalness: 0, flatShading: true });
  [[-8.6, -16, 0.34, 2.6, 0.4, 0.03], [10.4, -21, 0.42, 3.4, -0.3, -0.025], [-15, -26, 0.3, 2.2, 0.9, 0.04]]
  .forEach(function (s) {
    var st = new THREE.Mesh(new THREE.BoxGeometry(s[2], s[3], s[2] * 0.62), steleMat);
    st.position.set(s[0], s[3] / 2 + 0.02, s[1]);
    st.rotation.y = s[4];
    st.rotation.z = s[5];
    scene.add(st);
  });

  /* ── 场景内字平面：宣言后两行立成两幅字幡，剥落物从幡前穿过 ── */
  function makeTextPlane(text, colorInk, worldW) {
    var cvs = document.createElement('canvas');
    var ctx = cvs.getContext('2d');
    cvs.width = 512; cvs.height = 2048;
    var tex = new THREE.CanvasTexture(cvs);
    tex.anisotropy = 4;
    function draw() {
      var fontSize = 168;
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      ctx.fillStyle = colorInk;
      ctx.font = '500 ' + fontSize + 'px "Noto Serif SC Web", "Songti SC", serif';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      var x = cvs.width / 2;
      var step = fontSize * 1.14;
      var startY = cvs.height / 2 - (text.length - 1) * step / 2;
      for (var i = 0; i < text.length; i++) ctx.fillText(text[i], x, startY + i * step);
      tex.needsUpdate = true;
    }
    draw();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
    var mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(worldW, worldW * 4), mat);
    mesh.renderOrder = 5;
    scene.add(mesh);
    return mesh;
  }
  /* 竖排右起：右幡是第二行（较实），左幡是末行（较淡、更近缺口） */
  var tpR = makeTextPlane('它是人在即将醒来时', 'rgba(56,49,44,0.85)', 1.9);
  tpR.position.set(5.4, 4.7, -15.5);
  tpR.rotation.y = -0.22;
  var tpL = makeTextPlane('看见的最后一层世界。', 'rgba(58,55,50,0.6)', 1.8);
  tpL.position.set(-6.6, 5.3, -19);
  tpL.rotation.y = 0.3;

  /* ── 近景大纸屑：从镜头前漂过，偶尔盖住一点世界 ── */
  function makeSoftTex() {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var x = c.getContext('2d');
    var g = x.createRadialGradient(64, 64, 8, 64, 64, 62);
    g.addColorStop(0, 'rgba(255,255,255,0.9)');
    g.addColorStop(0.65, 'rgba(255,255,255,0.4)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  var softTex = makeSoftTex();
  var NEAR = 14;
  var nearMat = new THREE.MeshBasicMaterial({ map: softTex, transparent: true, opacity: 0.6, depthWrite: false, color: 0xf7f0e0, side: THREE.DoubleSide });
  var nearFlakes = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 0.6), nearMat, NEAR);
  var nearData = [];
  for (i = 0; i < NEAR; i++) {
    nearData.push({
      x: range(-10, 10), y: range(1, 7), z: range(2.5, 6.5),
      ax: range(0.3, 0.9), ay: range(0.12, 0.3),
      ph: rnd() * Math.PI * 2, s: range(0.6, 1.4), vr: range(-0.3, 0.3), rot: rnd() * Math.PI
    });
  }
  nearFlakes.renderOrder = 7;
  scene.add(nearFlakes);

  /* ── 镜头与醒/梦参数 ── */
  var camPos = { x: 0, y: 2.1, z: 9.5 };
  var look = { x: 0.6, y: 6.2, z: -30 };
  var pointer = { x: 0, y: 0 };
  var scrollP = 0;

  function readScroll() {
    var max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    scrollP = Math.min(1, Math.max(0, window.scrollY / max || 0));
    camPos.z = 9.5 - 3.0 * scrollP;
    camPos.y = 2.1 + 1.3 * scrollP;
    look.y = 6.2 + 0.7 * scrollP;
  }

  var fogCol = new THREE.Color(), sunCol = new THREE.Color();
  var hemiCol = new THREE.Color(), gndCol = new THREE.Color();

  function applyPalette(d) {
    palLerp('fog', d, fogCol);
    scene.fog.color.copy(fogCol);
    scene.background.copy(fogCol);
    palLerp('skyTop', d, skyU.uTop.value);
    skyU.uBot.value.copy(fogCol);
    palLerp('fA', d, groundU.uWA.value);
    palLerp('fB', d, groundU.uWB.value);
    palLerp('fC', d, groundU.uWC.value);
    palLerp('fD', d, groundU.uWD.value);
    groundU.uFogColor.value.copy(fogCol);
    palLerp('pool', d, groundU.uPoolCol.value);
    palLerp('tearCore', d, tearU.uCore.value);
    palLerp('tearEdge', d, tearU.uEdge.value);
    tearU.uFog.value.copy(fogCol);
    tearU.uDream.value = d;
    palLerp('hemiSky', d, hemiCol);
    hemi.color.copy(hemiCol);
    palLerp('hemiGnd', d, gndCol);
    hemi.groundColor.copy(gndCol);
    palLerp('sun', d, sunCol);
    sun.color.copy(sunCol);
    sun.intensity = WAKE.sunI + (DREAM.sunI - WAKE.sunI) * d;
    palLerp('fill', d, fill.color);
    palLerp('ink', d, flakeMat.color);
    palLerp('paper', d, nearMat.color);
    palLerp('thread', d, _t);
    for (var i = 0; i < risers.length; i++) risers[i].m.color.copy(_t);
  }

  function renderOnce() {
    camera.position.set(camPos.x + pointer.x * 0.35, camPos.y + pointer.y * -0.12, camPos.z);
    camera.lookAt(look.x, look.y, look.z);
    renderer.render(scene, camera);
  }
  function onResize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    /* 竖屏时横向视野窄，镜头向天缺偏转，别让主体出画 */
    var portrait = w / h < 0.9;
    look.x = portrait ? 3.0 : 0.6;
    camPos.x = portrait ? 1.7 : 0;
    renderOnce();
  }

  var lastT = 0, running = false, rafId = null;
  function loop(now) {
    requestAnimationFrame(loop);
    if (now - lastT < 33) return;
    var t = now / 1000;
    lastT = now;
    var dt = 0.033;

    var dream = Math.min(1, Math.max(0, 0.15 + 0.55 * scrollP + 0.05 * Math.sin(t * 0.05)));
    applyPalette(dream);
    skyU.uTime.value = t;
    groundU.uTime.value = t;
    tearU.uTime.value = t;

    updateFlakes(dt, t);

    /* 线缕/云絮：上升 + 微摆，高过缺口下缘后回地面重来 */
    for (var i = 0; i < risers.length; i++) {
      var r = risers[i];
      r.mesh.position.y += r.vy * dt;
      r.mesh.position.x = r.x0 + Math.sin(t * 0.11 + r.ph) * 0.5;
      if (r.mesh.position.y > 10.5) r.mesh.position.y = r.y0;
    }

    for (i = 0; i < NEAR; i++) {
      var n = nearData[i];
      n.x += Math.sin(t * 0.07 + n.ph) * n.ax * dt;
      n.y += Math.cos(t * 0.05 + n.ph * 1.4) * n.ay * dt;
      n.rot += n.vr * dt;
      if (n.x > 11) n.x = -11; if (n.x < -11) n.x = 11;
      if (n.y > 8) n.y = 0.8; if (n.y < 0.6) n.y = 7.8;
      dummy.position.set(n.x, n.y, n.z);
      dummy.rotation.set(0, 0, n.rot);
      dummy.scale.set(n.s, n.s, 1);
      dummy.updateMatrix();
      nearFlakes.setMatrixAt(i, dummy.matrix);
    }
    nearFlakes.instanceMatrix.needsUpdate = true;

    renderOnce();
  }
  function start() { if (running || reduceMotion) return; running = true; lastT = performance.now(); rafId = requestAnimationFrame(loop); }
  function stop() { running = false; if (rafId !== null) cancelAnimationFrame(rafId); rafId = null; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });

  /* 预热：让开场即处于流动中途（reduced-motion 也用这套静帧姿态） */
  for (var w = 0; w < 60; w++) updateFlakes(0.033, w * 0.033 + 10);
  for (i = 0; i < risers.length; i++) risers[i].mesh.position.y = range(risers[i].y0, 9);

  applyPalette(0.15);
  if (!reduceMotion) {
    start();
    window.addEventListener('pointermove', function (e) {
      pointer.x = (e.clientX / window.innerWidth - 0.5) * 2;
      pointer.y = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });
  }
  window.addEventListener('scroll', function () { readScroll(); if (reduceMotion) { applyPalette(0.15 + 0.55 * scrollP); renderOnce(); } }, { passive: true });
  window.addEventListener('resize', onResize);

  onResize();
  readScroll();
  renderOnce();
})();
</script>
</body>
</html>
