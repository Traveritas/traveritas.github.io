<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 F · 花与几何</title>
<style>
  :root {
    --paper: #f8f9f8;
    --ink: #232930;
    --ink-soft: #545f6a;
    --ink-faint: #5f6a75;
    --line: #dfe4e7;
    --mist: #a9bdc9;
    --mist-soft: #ccd8e0;
    --mist-ink: #4c6a80;
    --blush: #d8c4c9;
    --blush-soft: #e9dee1;
    --blush-ink: #7c6068;
    --font-display: 'Palatino Linotype', 'Iowan Old Style', Palatino, Georgia,
      'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', SimSun, serif;
    --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB',
      'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    overflow: hidden;
  }

  .stage {
    position: relative;
    height: 100dvh;
    overflow: clip;
    background:
      radial-gradient(66vw 62vh at 6% 4%, rgba(169, 189, 201, 0.22), transparent 70%),
      linear-gradient(118deg,
        rgba(169, 189, 201, 0.14) 0%,
        rgba(169, 189, 201, 0.03) 32%,
        rgba(216, 196, 201, 0.12) 55%,
        rgba(216, 196, 201, 0.28) 100%),
      var(--paper);
  }

  /* ── 结构区：圆环 + 突破圆环的百合 ── */
  .structure {
    position: absolute;
    right: 0; top: 0;
    width: 70vw; height: 100vh;
    z-index: 3;
    pointer-events: none;
  }

  .structure svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* 磨砂花瓣：与 SVG 中 rotate(-90) 的那枚外瓣精确对位
     （s = 1 viewBox 单位 = min(0.7vw, 1vh)；花心 C = (65vw - 4s, 50vh - 14s)） */
  .petal-frost {
    position: absolute;
    left: calc(65vw - min(2.8vw, 4vh) - min(8.05vw, 11.5vh));
    top: calc(50vh - min(64.4vw, 92vh));
    width: min(16.1vw, 23vh);
    height: min(54.6vw, 78vh);
    transform-origin: 50% 100%;
    transform: rotate(-90deg);
    z-index: 4;
    clip-path: polygon(50% 0%, 82% 20%, 100% 38.5%, 86% 70%, 50% 92.3%, 14% 70%, 0% 38.5%, 18% 20%);
    background: linear-gradient(to top, rgba(233, 222, 225, 0.34), rgba(233, 222, 225, 0.1));
    backdrop-filter: blur(8px) saturate(1.05);
    -webkit-backdrop-filter: blur(8px) saturate(1.05);
    pointer-events: none;
  }

  /* 从画面左侧延伸至圆环最低点（相接） */
  .baseline {
    position: absolute;
    left: 0;
    right: calc(34vw + min(2.8vw, 4vh));
    top: calc(36vh + min(18.9vw, 27vh));
    height: 1px;
    background: linear-gradient(to right, var(--line), rgba(109, 126, 138, 0.4));
    z-index: 2;
  }

  /* ── 文字碎片 ── */
  .frag {
    position: absolute;
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    line-height: 1.6;
    letter-spacing: 0.02em;
    color: var(--ink);
    z-index: 4;
  }

  .fx1 { top: 15vh; left: 9vw; font-size: max(1.9rem, 4.6vw); }

  .fx2 {
    top: 21vh; left: 32vw;
    font-size: max(0.95rem, 1.5vw);
    font-weight: 500;
    letter-spacing: 0.35em;
    color: var(--ink-faint);
  }

  .fx3 { top: 50vh; left: 12vw; font-size: max(0.95rem, 1.6vw); font-weight: 500; color: var(--ink-soft); }

  .fx4 { top: 60vh; left: 18vw; font-size: max(1.7rem, 3.6vw); }
  .fx4 em { font-style: normal; color: var(--mist-ink); }

  .fsub {
    position: absolute;
    top: 78vh; left: 19vw;
    margin: 0;
    font-size: 0.88rem;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    z-index: 4;
  }

  /* ── 竖排导航 ── */
  .nav {
    position: absolute;
    left: 3.5vw; top: 26vh;
    display: flex;
    flex-direction: column;
    gap: 2.4rem;
    z-index: 6;
  }

  .nav a {
    position: relative;
    writing-mode: vertical-rl;
    letter-spacing: 0.5em;
    padding: 0.5rem 0.75rem;
    color: var(--ink-soft);
    text-decoration: none;
    transition: color 0.18s ease;
  }

  .nav a::after {
    content: '';
    position: absolute;
    top: 45%;
    left: calc(100% + 0.4rem);
    width: 1.4rem;
    height: 1px;
    background: var(--line);
    transition: background 0.18s ease, width 0.18s ease;
  }

  .nav a:hover { color: var(--ink); }
  .nav a:hover::after { background: var(--mist); width: 2rem; }

  .brand {
    position: absolute;
    top: 4.5vh; left: 4vw;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-family: var(--font-display);
    color: var(--ink);
    text-decoration: none;
    z-index: 6;
  }

  .brand svg { width: 18px; height: 18px; color: var(--mist-ink); }

  /* 现实锚点：悬在圆环下弧上 */
  .anchor {
    position: absolute;
    top: 66vh; right: 40vw;
    z-index: 5;
    margin: 0;
    padding: 6px;
    background: rgba(255, 255, 255, 0.74);
    transform: rotate(-1deg);
  }

  .anchor img {
    display: block;
    width: 8.5vw;
    min-width: 100px;
    max-width: 150px;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    filter: grayscale(0.85) contrast(0.88) opacity(0.82);
  }

  :focus-visible { outline: 2px solid var(--mist-ink); outline-offset: 3px; }

  @media (prefers-reduced-transparency: reduce) {
    .petal-frost { background: rgba(233, 222, 225, 0.72); backdrop-filter: none; }
  }

  @media (max-width: 760px) {
    body { overflow: auto; }
    .stage { height: auto; min-height: 100dvh; padding: 24vh 9vw 10vh; }
    .structure { width: 130vw; height: 62vh; right: -42vw; top: -2vh; }
    .petal-frost { display: none; }
    .baseline { top: 66vh; right: 20vw; }
    .frag { position: static; display: block; margin: 0 0 2rem; }
    .fx1 { font-size: clamp(1.5rem, 7vw, 2rem); }
    .fx2 { font-size: 0.95rem; }
    .fx3 { font-size: 1rem; }
    .fx4 { font-size: clamp(1.4rem, 6.8vw, 1.9rem); }
    .fsub { position: static; display: block; margin-top: 0.5rem; }
    .anchor { position: static; margin: 3rem auto 0; }
    .nav { position: static; margin-top: 2rem; flex-direction: row; gap: 1.8rem; }
    .nav a { writing-mode: horizontal-tb; letter-spacing: 0.2em; }
    .nav a::after { display: none; }
  }
</style>
</head>
<body>
<div class="stage">

  <a class="brand" href="/">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <g stroke="currentColor" stroke-width="1.1" stroke-linecap="round" fill="none">
        <path d="M12 12 C 8.8 9.4, 7.9 5.4, 12 2 C 16.1 5.4, 15.2 9.4, 12 12 Z"/>
        <path d="M12 12 C 8.2 11.2, 5.5 8.2, 6.5 4.2 C 10.4 5.3, 12 8.4, 12 12 Z"/>
        <path d="M12 12 C 15.8 11.2, 18.5 8.2, 17.5 4.2 C 13.6 5.3, 12 8.4, 12 12 Z"/>
        <path d="M12 12 C 8.8 14.6, 7.9 18.6, 12 22 C 16.1 18.6, 15.2 14.6, 12 12 Z"/>
        <path d="M12 12 C 8.2 12.8, 5.5 15.8, 6.5 19.8 C 10.4 18.7, 12 15.6, 12 12 Z"/>
        <path d="M12 12 C 15.8 12.8, 18.5 15.8, 17.5 19.8 C 13.6 18.7, 12 15.6, 12 12 Z"/>
        <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/>
      </g>
    </svg>
    <span>Traveritas</span>
  </a>

  <nav class="nav" aria-label="站内入口">
    <a href="/articles/">随笔</a>
    <a href="/projects/">项目</a>
    <a href="/about/">关于</a>
  </nav>

  <!-- 结构：细线圆环（几何秩序）+ 突破圆环的百合（花像建筑的一部分） -->
  <div class="structure" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="fpetal" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="rgba(216,196,201,0.34)"/>
          <stop offset="1" stop-color="rgba(216,196,201,0.04)"/>
        </linearGradient>
        <linearGradient id="fpetal-in" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="rgba(169,189,201,0.24)"/>
          <stop offset="1" stop-color="rgba(169,189,201,0.03)"/>
        </linearGradient>
      </defs>

      <!-- 后层圆环（双环） -->
      <g fill="none">
        <circle cx="46" cy="36" r="27" stroke="rgba(76,106,128,0.32)" stroke-width="0.45"/>
        <circle cx="46" cy="36" r="31.5" stroke="rgba(76,106,128,0.16)" stroke-width="0.3"/>
      </g>

      <!-- 百合：花瓣伸出圆环之外 -->
      <g transform="translate(46 36)">
        <g fill="url(#fpetal)" stroke="rgba(76,106,128,0.28)" stroke-width="0.4">
          <path d="M 0 -6 C -10 -24, -11.5 -50, 0 -78 C 11.5 -50, 10 -24, 0 -6 Z" transform="rotate(0)"/>
          <path d="M 0 -6 C -10 -24, -11.5 -50, 0 -78 C 11.5 -50, 10 -24, 0 -6 Z" transform="rotate(45) scale(0.94)"/>
          <path d="M 0 -6 C -10 -24, -11.5 -50, 0 -78 C 11.5 -50, 10 -24, 0 -6 Z" transform="rotate(90) scale(1.02)"/>
          <path d="M 0 -6 C -10 -24, -11.5 -50, 0 -78 C 11.5 -50, 10 -24, 0 -6 Z" transform="rotate(135) scale(0.9)"/>
          <path d="M 0 -6 C -10 -24, -11.5 -50, 0 -78 C 11.5 -50, 10 -24, 0 -6 Z" transform="rotate(180) scale(0.97)"/>
          <path d="M 0 -6 C -10 -24, -11.5 -50, 0 -78 C 11.5 -50, 10 -24, 0 -6 Z" transform="rotate(225) scale(1.04)"/>
          <path d="M 0 -6 C -10 -24, -11.5 -50, 0 -78 C 11.5 -50, 10 -24, 0 -6 Z" transform="rotate(270) scale(0.93)"/>
          <!-- 指向左侧的这枚花瓣由 .petal-frost 覆盖为磨砂 -->
          <path d="M 0 -6 C -10 -24, -11.5 -50, 0 -78 C 11.5 -50, 10 -24, 0 -6 Z" transform="rotate(-90)" fill="none" stroke="rgba(76,106,128,0.14)"/>
        </g>
        <g fill="url(#fpetal-in)" stroke="rgba(76,106,128,0.22)" stroke-width="0.35">
          <path d="M 0 -5 C -7 -17, -8 -34, 0 -52 C 8 -34, 7 -17, 0 -5 Z" transform="rotate(22)"/>
          <path d="M 0 -5 C -7 -17, -8 -34, 0 -52 C 8 -34, 7 -17, 0 -5 Z" transform="rotate(112) scale(0.96)"/>
          <path d="M 0 -5 C -7 -17, -8 -34, 0 -52 C 8 -34, 7 -17, 0 -5 Z" transform="rotate(202) scale(1.01)"/>
          <path d="M 0 -5 C -7 -17, -8 -34, 0 -52 C 8 -34, 7 -17, 0 -5 Z" transform="rotate(292) scale(0.98)"/>
        </g>
        <!-- 花蕊 -->
        <g stroke="rgba(76,106,128,0.4)" stroke-width="0.4" fill="none" stroke-linecap="round">
          <path d="M 0 0 L 1 -88"/><circle cx="1" cy="-88" r="1.3" fill="rgba(76,106,128,0.4)" stroke="none"/>
          <path d="M 0 0 L 62 -58"/><circle cx="62" cy="-58" r="1.3" fill="rgba(76,106,128,0.4)" stroke="none"/>
          <path d="M 0 0 L 34 78"/><circle cx="34" cy="78" r="1.3" fill="rgba(76,106,128,0.4)" stroke="none"/>
          <path d="M 0 0 L -70 30"/><circle cx="-70" cy="30" r="1.3" fill="rgba(76,106,128,0.4)" stroke="none"/>
        </g>
        <circle r="2.2" fill="rgba(76,106,128,0.5)"/>
      </g>

      <!-- 前层圆弧：与主圆严格共圆，弧段压在数枚花瓣之上，构成穿插 -->
      <path d="M 23.9 51.5 A 27 27 0 0 0 58.7 59.9" fill="none"
            stroke="rgba(76,106,128,0.4)" stroke-width="0.5"/>
    </svg>
  </div>

  <!-- 磨砂花瓣（覆盖指向左侧的那枚外瓣） -->
  <div class="petal-frost" aria-hidden="true"></div>

  <div class="baseline" aria-hidden="true"></div>

  <h1 aria-label="这里不是梦，也不是现实。它是人在即将醒来时，看见的最后一层世界。" style="position:absolute;inset:0;margin:0;font-weight:inherit;font-size:inherit;z-index:4;">
    <span aria-hidden="true" style="position:absolute;inset:0;display:block;">
      <span class="frag fx1">这里不是梦，</span>
      <span class="frag fx2">也不是现实。</span>
      <span class="frag fx3">它是人在即将醒来时，</span>
      <span class="frag fx4">看见的<em>最后一层世界</em>。</span>
    </span>
  </h1>
  <p class="fsub">世界应当始终保留一种感觉：它可能马上消失。</p>

  <figure class="anchor">
    <img src="https://picsum.photos/seed/xingmeng-anchor/400/500" alt="" loading="lazy" />
  </figure>

</div>
</body>
</html>
