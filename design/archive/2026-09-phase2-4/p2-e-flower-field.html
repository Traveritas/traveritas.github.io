<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 E · 花田层次</title>
<style>
  :root {
    --paper: #f8f9f8;
    --ink: #232930;
    --ink-soft: #545f6a;
    --ink-faint: #5f6a75;
    --line: #dfe4e7;
    --mist: #a9bdc9;
    --mist-soft: #ccd8e0;
    --mist-ink: #4c6a80;
    --blush: #d8c4c9;
    --blush-soft: #e9dee1;
    --blush-ink: #7c6068;
    --font-display: 'Palatino Linotype', 'Iowan Old Style', Palatino, Georgia,
      'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', SimSun, serif;
    --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB',
      'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    overflow: hidden;
  }

  .stage {
    position: relative;
    height: 100dvh;
    overflow: clip;
    background:
      radial-gradient(66vw 62vh at 6% 4%, rgba(169, 189, 201, 0.22), transparent 70%),
      linear-gradient(118deg,
        rgba(169, 189, 201, 0.14) 0%,
        rgba(169, 189, 201, 0.03) 32%,
        rgba(216, 196, 201, 0.12) 55%,
        rgba(216, 196, 201, 0.3) 100%),
      var(--paper);
  }

  /* 低处横过的雾带（梦侧更浓），带真实磨砂、压在中景花上 */
  .stage::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 62vh; height: 38vh;
    background:
      linear-gradient(to bottom, rgba(233, 222, 225, 0), rgba(233, 222, 225, 0.26)),
      radial-gradient(60vw 40vh at 92% 100%, rgba(233, 222, 225, 0.34), transparent 70%);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 3;
    pointer-events: none;
  }

  /* ── 花田：绝对定位的花，远小近大、远淡近实 ── */
  .fl { position: absolute; pointer-events: none; }
  .fl svg { width: 100%; height: 100%; display: block; }

  /* 尺寸整体放大补偿 defs 装盒缩放（约 1/0.6） */
  .f-01 { top: 4vh;  left: 52vw; width: 34vw; height: 34vw; z-index: 3; }   /* 主花：俯视百合 */
  .f-02 { top: 44vh; left: 76vw; width: 19vw; height: 19vw; z-index: 3; filter: blur(1.2px); opacity: 0.9; }
  .f-03 { top: 70vh; left: 50vw; width: 24vw; height: 24vw; z-index: 3; filter: blur(2.2px); opacity: 0.8; }
  .f-04 { top: 30vh; left: 24vw; width: 9vw;  height: 9vw;  z-index: 2; }
  .f-05 { top: 58vh; left: 42vw; width: 6.5vw;height: 6.5vw;z-index: 2; }
  .f-06 { top: 78vh; left: 72vw; width: 10vw; height: 10vw; z-index: 3; filter: blur(2.6px); opacity: 0.75; }
  .f-07 { top: 18vh; left: 84vw; width: 8vw;  height: 8vw;  z-index: 2; opacity: 0.9; }
  .f-08 { top: 42vh; left: 58vw; width: 6vw;  height: 6vw;  z-index: 2; }
  .f-09 { top: 84vh; left: 28vw; width: 12vw; height: 12vw; z-index: 3; filter: blur(3px); opacity: 0.7; }
  .f-10 { top: 66vh; left: 86vw; width: 8.5vw;height: 8.5vw;z-index: 3; filter: blur(2px); opacity: 0.8; }
  .f-11 { top: 62vh; left: 10vw; width: 7vw;  height: 7vw;  z-index: 2; }
  .f-12 { top: 6vh;  left: 42vw; width: 8vw;  height: 8vw;  z-index: 2; opacity: 0.42; filter: blur(0.6px); }
  .f-13 { top: 36vh; left: 4vw;  width: 5vw;  height: 5vw;  z-index: 2; opacity: 0.4;  filter: blur(0.6px); }
  .f-14 { top: 76vh; left: 88vw; width: 5.5vw;height: 5.5vw;z-index: 3; filter: blur(3px); opacity: 0.65; }

  /* ── 文字碎片 ── */
  .frag {
    position: absolute;
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    line-height: 1.6;
    letter-spacing: 0.02em;
    color: var(--ink);
    z-index: 4;
  }

  .fx1 { top: 15vh; left: 9vw; font-size: max(1.9rem, 4.6vw); }

  .fx2 {
    top: 24vh; left: 40vw;
    font-size: max(0.95rem, 1.5vw);
    font-weight: 500;
    letter-spacing: 0.35em;
    color: var(--ink-faint);
  }

  .fx3 { top: 50vh; left: 12vw; font-size: max(0.95rem, 1.6vw); font-weight: 500; color: var(--ink-soft); }

  .fx4 { top: 59vh; left: 20vw; font-size: max(1.7rem, 3.6vw); }
  .fx4 em { font-style: normal; color: var(--mist-ink); }

  .fsub {
    position: absolute;
    top: 76vh; left: 21vw;
    margin: 0;
    font-size: 0.88rem;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    z-index: 4;
  }

  /* ── 竖排导航 ── */
  .nav {
    position: absolute;
    left: 3.5vw; top: 26vh;
    display: flex;
    flex-direction: column;
    gap: 2.4rem;
    z-index: 6;
  }

  .nav a {
    position: relative;
    writing-mode: vertical-rl;
    letter-spacing: 0.5em;
    padding: 0.5rem 0.75rem;
    color: var(--ink-soft);
    text-decoration: none;
    transition: color 0.18s ease;
  }

  .nav a::after {
    content: '';
    position: absolute;
    top: 45%;
    left: calc(100% + 0.4rem);
    width: 1.4rem;
    height: 1px;
    background: var(--line);
    transition: background 0.18s ease, width 0.18s ease;
  }

  .nav a:hover { color: var(--ink); }
  .nav a:hover::after { background: var(--mist); width: 2rem; }

  .brand {
    position: absolute;
    top: 4.5vh; left: 4vw;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-family: var(--font-display);
    color: var(--ink);
    text-decoration: none;
    z-index: 6;
  }

  .brand svg { width: 18px; height: 18px; color: var(--mist-ink); }

  /* 现实锚点：落在花田间 */
  .anchor {
    position: absolute;
    top: 40vh; right: 12vw;
    z-index: 5;
    margin: 0;
    padding: 6px;
    background: rgba(255, 255, 255, 0.74);
    transform: rotate(-1deg);
  }

  .anchor img {
    display: block;
    width: 9vw;
    min-width: 104px;
    max-width: 160px;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    filter: grayscale(0.85) contrast(0.88) opacity(0.82);
  }

  :focus-visible { outline: 2px solid var(--mist-ink); outline-offset: 3px; }

  @media (prefers-reduced-transparency: reduce) {
    .stage::after { backdrop-filter: none; -webkit-backdrop-filter: none; }
  }

  @media (max-width: 760px) {
    body { overflow: auto; }
    .stage { height: auto; min-height: 100dvh; padding: 24vh 9vw 10vh; }
    .frag { position: static; display: block; margin: 0 0 2rem; }
    .fx1 { font-size: clamp(1.5rem, 7vw, 2rem); }
    .fx2 { font-size: 0.95rem; }
    .fx3 { font-size: 1rem; }
    .fx4 { font-size: clamp(1.4rem, 6.8vw, 1.9rem); }
    .fsub { position: static; display: block; margin-top: 0.5rem; }
    .f-01 { top: 2vh; left: 46vw; width: 52vw; height: 52vw; }
    .f-02, .f-03, .f-06, .f-09, .f-10, .f-14 { display: none; }
    .f-04 { top: 12vh; left: 8vw; width: 16vw; }
    .f-05 { top: 28vh; left: 72vw; width: 12vw; }
    .f-07 { display: none; }
    .f-08 { top: 8vh; left: 30vw; width: 11vw; }
    .f-11, .f-12, .f-13 { display: none; }
    .anchor { position: static; margin: 3rem auto 0; }
    .nav { position: static; margin-top: 2rem; flex-direction: row; gap: 1.8rem; }
    .nav a { writing-mode: horizontal-tb; letter-spacing: 0.2em; }
    .nav a::after { display: none; }
  }
</style>
</head>
<body>
<div class="stage">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- 俯视百合（罗塞特）：六瓣 + 蕊（整体缩放进 viewBox 盒内，避免被 svg 盒裁切） -->
      <g id="rosette">
        <linearGradient id="pg" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="rgba(216,196,201,0.4)"/>
          <stop offset="1" stop-color="rgba(216,196,201,0.05)"/>
        </linearGradient>
        <g transform="translate(50 50) scale(0.57)">
          <g fill="url(#pg)" stroke="rgba(76,106,128,0.32)" stroke-width="1">
            <path d="M 0 -6 C -9 -22, -10.5 -48, 0 -76 C 10.5 -48, 9 -22, 0 -6 Z"/>
            <path d="M 0 -6 C -9 -22, -10.5 -48, 0 -76 C 10.5 -48, 9 -22, 0 -6 Z" transform="rotate(60) scale(0.97)"/>
            <path d="M 0 -6 C -9 -22, -10.5 -48, 0 -76 C 10.5 -48, 9 -22, 0 -6 Z" transform="rotate(120) scale(1.03)"/>
            <path d="M 0 -6 C -9 -22, -10.5 -48, 0 -76 C 10.5 -48, 9 -22, 0 -6 Z" transform="rotate(180) scale(0.95)"/>
            <path d="M 0 -6 C -9 -22, -10.5 -48, 0 -76 C 10.5 -48, 9 -22, 0 -6 Z" transform="rotate(240) scale(1.01)"/>
            <path d="M 0 -6 C -9 -22, -10.5 -48, 0 -76 C 10.5 -48, 9 -22, 0 -6 Z" transform="rotate(300) scale(0.99)"/>
          </g>
          <g stroke="rgba(76,106,128,0.45)" stroke-width="0.8" fill="none" stroke-linecap="round">
            <path d="M 0 0 L 0 -86"/><circle cx="0" cy="-86" r="1.8" fill="rgba(76,106,128,0.45)" stroke="none"/>
            <path d="M 0 0 L 60 -50"/><circle cx="60" cy="-50" r="1.8" fill="rgba(76,106,128,0.45)" stroke="none"/>
            <path d="M 0 0 L -60 -50"/><circle cx="-60" cy="-50" r="1.8" fill="rgba(76,106,128,0.45)" stroke="none"/>
          </g>
          <circle r="2.6" fill="rgba(76,106,128,0.5)"/>
        </g>
      </g>
      <!-- 侧视百合：弯茎 + 三瓣 + 蕊（同样缩放进盒） -->
      <g id="sidelily">
        <linearGradient id="sg" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="rgba(216,196,201,0.42)"/>
          <stop offset="1" stop-color="rgba(216,196,201,0.06)"/>
        </linearGradient>
        <g transform="translate(0 20) scale(0.8)">
        <g stroke="rgba(76,106,128,0.34)" stroke-width="1" fill="none" stroke-linecap="round">
          <path d="M 52 100 C 58 74, 46 50, 51 30"/>
          <path d="M 51 30 C 34 24, 24 8, 28 -8 C 40 2, 49 14, 51 30 Z" fill="url(#sg)"/>
          <path d="M 51 28 C 49 10, 54 -8, 62 -20 C 66 -4, 62 12, 53 29 Z" fill="url(#sg)"/>
          <path d="M 51 30 C 66 26, 78 14, 78 -2 C 64 6, 55 16, 51 30 Z" fill="url(#sg)"/>
          <path d="M 52 22 C 54 10, 58 2, 63 -4"/>
          <circle cx="63" cy="-5" r="1.6" fill="rgba(76,106,128,0.45)" stroke="none"/>
        </g>
        </g>
      </g>
      <!-- 蓝色异质花（俯视，少而克制） -->
      <g id="rosette-blue">
        <linearGradient id="pgb" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="rgba(169,189,201,0.4)"/>
          <stop offset="1" stop-color="rgba(169,189,201,0.05)"/>
        </linearGradient>
        <g transform="translate(50 50) scale(0.65)">
          <g fill="url(#pgb)" stroke="rgba(76,106,128,0.32)" stroke-width="1">
            <path d="M 0 -6 C -9 -22, -10.5 -48, 0 -76 C 10.5 -48, 9 -22, 0 -6 Z"/>
            <path d="M 0 -6 C -9 -22, -10.5 -48, 0 -76 C 10.5 -48, 9 -22, 0 -6 Z" transform="rotate(72) scale(0.96)"/>
            <path d="M 0 -6 C -9 -22, -10.5 -48, 0 -76 C 10.5 -48, 9 -22, 0 -6 Z" transform="rotate(144) scale(1.02)"/>
            <path d="M 0 -6 C -9 -22, -10.5 -48, 0 -76 C 10.5 -48, 9 -22, 0 -6 Z" transform="rotate(216) scale(0.98)"/>
            <path d="M 0 -6 C -9 -22, -10.5 -48, 0 -76 C 10.5 -48, 9 -22, 0 -6 Z" transform="rotate(288)"/>
          </g>
          <circle r="2.4" fill="rgba(76,106,128,0.5)"/>
        </g>
      </g>
    </defs>
  </svg>

  <a class="brand" href="/">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <g stroke="currentColor" stroke-width="1.1" stroke-linecap="round" fill="none">
        <path d="M12 12 C 8.8 9.4, 7.9 5.4, 12 2 C 16.1 5.4, 15.2 9.4, 12 12 Z"/>
        <path d="M12 12 C 8.2 11.2, 5.5 8.2, 6.5 4.2 C 10.4 5.3, 12 8.4, 12 12 Z"/>
        <path d="M12 12 C 15.8 11.2, 18.5 8.2, 17.5 4.2 C 13.6 5.3, 12 8.4, 12 12 Z"/>
        <path d="M12 12 C 8.8 14.6, 7.9 18.6, 12 22 C 16.1 18.6, 15.2 14.6, 12 12 Z"/>
        <path d="M12 12 C 8.2 12.8, 5.5 15.8, 6.5 19.8 C 10.4 18.7, 12 15.6, 12 12 Z"/>
        <path d="M12 12 C 15.8 12.8, 18.5 15.8, 17.5 19.8 C 13.6 18.7, 12 15.6, 12 12 Z"/>
        <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/>
      </g>
    </svg>
    <span>Traveritas</span>
  </a>

  <nav class="nav" aria-label="站内入口">
    <a href="/articles/">随笔</a>
    <a href="/projects/">项目</a>
    <a href="/about/">关于</a>
  </nav>

  <!-- 花田：重复但不规律 -->
  <div class="fl f-01" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#rosette"/></svg></div>
  <div class="fl f-02" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#sidelily"/></svg></div>
  <div class="fl f-03" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#rosette"/></svg></div>
  <div class="fl f-04" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#rosette"/></svg></div>
  <div class="fl f-05" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#rosette-blue"/></svg></div>
  <div class="fl f-06" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#rosette"/></svg></div>
  <div class="fl f-07" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#rosette"/></svg></div>
  <div class="fl f-08" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#rosette-blue"/></svg></div>
  <div class="fl f-09" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#sidelily"/></svg></div>
  <div class="fl f-10" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#rosette"/></svg></div>
  <div class="fl f-11" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#rosette"/></svg></div>
  <div class="fl f-12" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#rosette"/></svg></div>
  <div class="fl f-13" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#rosette-blue"/></svg></div>
  <div class="fl f-14" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#rosette"/></svg></div>

  <h1 aria-label="这里不是梦，也不是现实。它是人在即将醒来时，看见的最后一层世界。" style="position:absolute;inset:0;margin:0;font-weight:inherit;font-size:inherit;z-index:4;">
    <span aria-hidden="true" style="position:absolute;inset:0;display:block;">
      <span class="frag fx1">这里不是梦，</span>
      <span class="frag fx2">也不是现实。</span>
      <span class="frag fx3">它是人在即将醒来时，</span>
      <span class="frag fx4">看见的<em>最后一层世界</em>。</span>
    </span>
  </h1>
  <p class="fsub">世界应当始终保留一种感觉：它可能马上消失。</p>

  <figure class="anchor">
    <img src="https://picsum.photos/seed/xingmeng-anchor/400/500" alt="" loading="lazy" />
  </figure>

</div>
</body>
</html>
