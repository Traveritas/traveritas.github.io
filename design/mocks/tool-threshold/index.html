<!doctype html>
<html lang="zh-CN" data-ctx="home" data-face="wake" data-night="dawn" data-scene="essay">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>切面 · 工具层原型 — Traveritas</title>
<link rel="stylesheet" href="/fonts/noto/font.css">
<link rel="stylesheet" href="threshold.css">
<link rel="icon" href="data:,">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>

<!-- 线以上：天光。gate 语境直接吃 gate.astro 的 --sky-wake / --sky-dream -->
<div id="sky" aria-hidden="true"></div>
<!-- 线以下：水。碎光与水纹由 threshold.js 画（接 about-decor 的做法） -->
<canvas id="water" aria-hidden="true"></canvas>
<!-- 站内既有的两根线：14° 缝线与顶部发丝进度线（这里一并接住） -->
<div id="seam" aria-hidden="true"></div>
<div id="hairline" aria-hidden="true"><i></i></div>

<!-- 线以下的世界：正文 / 目录 / 入口 / 失线。工具升起时它一动不动 -->
<main id="world" aria-label="页面"></main>

<!-- 那根平切面线，加上线上排开的切片（一件工具一片） -->
<nav id="threshold" aria-label="工具">
  <div id="line" aria-hidden="true"></div>
  <div id="notches"></div>
  <div id="cursor" aria-hidden="true"><i class="cu-stem"></i><i class="cu-dot"></i></div>
  <div id="rail" aria-hidden="true"></div>
</nav>

<!-- 升起的面：从线上长出来，只占线以上那一半；同一件东西，三条路唤出的是它 -->
<div id="facewrap">
  <section id="face" role="dialog" aria-label="工具" aria-modal="false" hidden>
    <span class="face-gem" aria-hidden="true"></span>
    <div class="face-body" id="face-body"></div>
  </section>
</div>

<div id="hint" aria-hidden="true"><span class="h-key mono">T</span> 沿线挑一件</div>

<noscript><p class="nojs">这个原型需要脚本：一根线横过屏幕，线上排着十二片切片——挑一片，它就从线上升起来。</p></noscript>

<script src="../layout-plane/data.js"></script>
<script src="threshold.js"></script>
</body>
</html>
