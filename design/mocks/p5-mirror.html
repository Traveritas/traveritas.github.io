<title>方案 · 镜渊（活体）</title>
<style>
  /* ═══ 概念 ═══（Phase 5 · 会话 D · 镜面母题首次启用）
     雾原上立着一面顶天立地的巨镜。现实这一侧：碑上的宣言被蚀去大半，
     天色冷而平淡，空气是停的；镜中那一侧：同样的碑、同样的字，
     却完整、温热、微微发亮——镜子照出的不是现在，是这个世界还完整时的样子。
     局部规则（一条）：镜子记得世界忘记的。
     滚动 = 入梦：现实一侧越滚越冷越淡，镜中一侧越滚越暖越亮，
     镜面的液体涟漪随梦加深，深处镜中的暖光渗出来，在镜脚汇成一泊暖光。
     反射用真实投影纹理（Reflector 数学）：镜头移动时镜像视差成立——
     它是一面真的镜子，只是照错了时间。 */

  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-600-normal.woff2') format('woff2');
  }

  :root {
    --ink: #38353a;
    --ink-soft: #635d64;
    --ink-faint: #5f5960;
    --mist-ink: #5c6a7c;
    --font-display: 'Noto Serif SC Web', 'Noto Serif SC', 'Palatino Linotype', Georgia, 'Songti SC', SimSun, serif;
    --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); color: var(--ink); background: #e5e2dc; }

  .stage {
    position: fixed;
    inset: 0;

    background: linear-gradient(to bottom, #e8e3da 0%, #e2ddd7 46%, #d6d3d2 100%);
  }
  .scroll-length { height: 260vh; }
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .vignette {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;

      linear-gradient(to bottom, rgba(105, 96, 88, 0.12), transparent 20%),

  .nav {

    .nav a::after { display: none; }

    .slip { width: 100%; transform: none; }
    .stage { position: relative; min-height: 100dvh; }
    .scroll-length { display: none; }
    .manifesto { position: relative; top: 0; left: 0; margin: 10vh 9vw 0; }
  }

<script src="vendor/three.min.js"></script>
<script>
/* ═══ 镜渊 · THE MIRROR ═══
   主体 = 雾原上的巨镜（真实投影反射：镜像随镜头视差成立）；
   现实侧 = 冷淡雾原 + 蚀字残碑 + 停滞的空气；
   镜中侧 = 同构但更完整更温热的世界（碑更大、字全、浮尘在动、天更暖）；
   滚动 = 入梦：现实转冷、镜中转暖、镜面涟漪加深、镜脚渗出暖光泊。
   性能纪律：DPR≤1.5、反射 RT 768×1024 半分辨率、无后处理、
   ~30fps 节流、隐藏标签页暂停、reduced-motion 按滚动静帧渲染、WebGL 失败退静态渐变。 */
(function () {
try {
  if (!window.THREE) return;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var seed = 20260920;
  function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296 }
  function range(a, b) { return a + rnd() * (b - a) }

  var canvas = document.getElementById('gl');
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false }); }
  catch (e) { document.getElementById('stage').classList.add('no3d'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.autoClear = true;

  /* ── 三个世界：现实 scene / 镜中 mirrorScene ── */
  var scene = new THREE.Scene();
  var mScene = new THREE.Scene();

  /* 现实侧醒/梦色板 */
  var WAKE = {
    fog: 0xe8e2d8, skyTop: 0xcfc3b0,
    fA: 0xefe8db, fB: 0xe6dcc9, fC: 0xd5c7b1, fD: 0xb6a48b,
    ink: 0x4d4740, hemiSky: 0xf4ecdd, hemiGnd: 0xbfae95,
    sun: 0xfff0d8, sunI: 0.5, fill: 0xe4e6ec,
    pool: 0xf3ddba, mote: 0x9a938a, slab: 0x8f8b86
  };
  var DREAM = {
    fog: 0xdcdbe4, skyTop: 0xb2afc4,
    fA: 0xe7e6ec, fB: 0xdbdae3, fC: 0xc9c8d6, fD: 0xa8a7bd,
    ink: 0x4a4a58, hemiSky: 0xe4e2ec, hemiGnd: 0x9c99ae,
    sun: 0xe6dcf0, sunI: 0.34, fill: 0xd9dcec,
    pool: 0xecc9ad, mote: 0x8d8b9c, slab: 0x8a8892
  };
  /* 镜中世界色板（独立于现实侧，随梦更暖更亮；天顶更深、地面更沉——镜里要读出「一个世界」而不是一块板） */
  var MWAKE = {
    fog: 0xecd8c2, skyTop: 0xd0a279,
    fA: 0xf4e5d1, fB: 0xeDd5bb, fC: 0xe0c19e, fD: 0xb98a61,
    hemiSky: 0xf9ecd8, hemiGnd: 0xc4a077,
    sun: 0xffe9c2, sunI: 0.78, glow: 0xf6ddba
  };
  var MDREAM = {
    fog: 0xf2d8c6, skyTop: 0xd2927c,
    fA: 0xf8e8d8, fB: 0xf1d1ba, fC: 0xe6bca3, fD: 0xc08268,
    hemiSky: 0xfce8d4, hemiGnd: 0xc99a77,
    sun: 0xffdfb2, sunI: 0.95, glow: 0xf8cf9f
  };
  [WAKE, DREAM, MWAKE, MDREAM].forEach(function (p) {
    for (var k in p) p[k] = (k === 'sunI') ? p[k] : new THREE.Color(p[k]);
  });
  function lerpPal(key, d, target) { target.copy(WAKE[key]).lerp(DREAM[key], d); }
  function lerpMPal(key, d, target) { target.copy(MWAKE[key]).lerp(MDREAM[key], d); }

  var fogCol = new THREE.Color();
  scene.background = WAKE.fog.clone();
  scene.fog = new THREE.Fog(WAKE.fog.clone(), 13, 62);
  var mFogCol = new THREE.Color();
  mScene.background = MWAKE.fog.clone();
  mScene.fog = new THREE.Fog(MWAKE.fog.clone(), 12, 58);

  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 220);
  var vCam = new THREE.PerspectiveCamera(42, 1, 0.1, 220); /* 镜中虚拟相机 */

  /* ── 灯光 ── */
  var hemi = new THREE.HemisphereLight(0xf4ecdd, 0xbfae95, 0.92); scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xfff0d8, 0.5); sun.position.set(-6, 16, -10); scene.add(sun);
  var fill = new THREE.DirectionalLight(0xe4e6ec, 0.24); fill.position.set(7, 5, 4); scene.add(fill);

  var mHemi = new THREE.HemisphereLight(0xf9ecd8, 0xc4a077, 1.0); mScene.add(mHemi);
  var mSun = new THREE.DirectionalLight(0xffe9c2, 0.78); mSun.position.set(4, 18, -14); mScene.add(mSun);
  var mFill = new THREE.DirectionalLight(0xf0e0e6, 0.3); mFill.position.set(-8, 4, 6); mScene.add(mFill);

  /* ── 共享 fbm（连续域，无量化）── */
  var NOISE_GLSL = [
    'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
    'float noise(vec2 p) {',
    '  vec2 i = floor(p), f = fract(p);',
    '  float a = hash(i), b = hash(i + vec2(1.0, 0.0)), c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));',
    '  vec2 u = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);',
    '}',
    'float fbm(vec2 p) {',
    '  float v = 0.0, a = 0.5;',
    '  for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }',
    '  return v;',
    '}'
  ].join('\n');

  /* ── 天幕（两个世界各一）── */
  function makeSky() {
    var u = { uTime: { value: 0 }, uTop: { value: new THREE.Color() }, uBot: { value: new THREE.Color() } };
    var mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(260, 140),
      new THREE.ShaderMaterial({
        uniforms: u, depthWrite: false,
        vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
        fragmentShader: [
          'uniform float uTime; uniform vec3 uTop; uniform vec3 uBot; varying vec2 vUv;',
          NOISE_GLSL,
          'void main() {',
          '  vec3 col = mix(uBot, uTop, smoothstep(0.22, 0.96, vUv.y));',
          '  col *= 0.985 + 0.03 * fbm(vUv * vec2(6.0, 3.0) + vec2(uTime * 0.004, 0.0));',
          '  gl_FragColor = vec4(col, 1.0);',
          '}'
        ].join('\n')
      })
    );
    mesh.position.set(0, 30, -58);
    mesh.renderOrder = 0;
    return { mesh: mesh, u: u };
  }
  var sky = makeSky(); scene.add(sky.mesh);
  var mSky = makeSky(); mScene.add(mSky.mesh);

  /* ── 雾原地面（连续域扭曲晕染，两侧各一，可带暖光泊）── */
  function makeGround() {
    var u = {
      uTime: { value: 0 },
      uFogColor: { value: new THREE.Color() },
      uFogNear: { value: 13.0 },
      uFogFar: { value: 62.0 },
      uWA: { value: new THREE.Color() }, uWB: { value: new THREE.Color() },
      uWC: { value: new THREE.Color() }, uWD: { value: new THREE.Color() },
      uPoolPos: { value: new THREE.Vector2(0, -20) },
      uPoolCol: { value: new THREE.Color() },
      uPoolAmt: { value: 0.0 }
    };
    var mat = new THREE.ShaderMaterial({
      transparent: true,
      uniforms: u,
      vertexShader: [
        'varying vec3 vWorld; varying float vNdcY;',
        'void main() {',
        '  vec4 w = modelMatrix * vec4(position, 1.0);',
        '  vWorld = w.xyz;',
        '  vec4 pr = projectionMatrix * viewMatrix * w;',
        '  vNdcY = pr.y / pr.w;',
        '  gl_Position = pr;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform float uTime; uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar;',
        'uniform vec3 uWA; uniform vec3 uWB; uniform vec3 uWC; uniform vec3 uWD;',
        'uniform vec2 uPoolPos; uniform vec3 uPoolCol; uniform float uPoolAmt;',
        'varying vec3 vWorld; varying float vNdcY;',
        NOISE_GLSL,
        'void main() {',
        '  vec2 p = vWorld.xz * 0.045;',
        '  vec2 w1 = vec2(fbm(p + vec2(0.0, 3.7)), fbm(p + vec2(5.2, 0.0)));',
        '  vec2 w2 = vec2(fbm(p * 1.9 + w1 * 1.4 + vec2(1.7, 9.2)), fbm(p * 1.9 + w1 * 1.4 + vec2(8.3, 2.8)));',
        '  float h = fbm(p * 2.3 + w2 * 1.1 + vec2(uTime * 0.008, -uTime * 0.005));',
        '  h = h * 0.74 + 0.26 * fbm(p * 0.42 + vec2(uTime * 0.003, 0.0));',
        '  float t = h;',
        '  vec3 col = mix(uWA, uWB, smoothstep(0.0, 0.36, t));',
        '  col = mix(col, uWC, smoothstep(0.36, 0.64, t));',
        '  col = mix(col, uWD, smoothstep(0.64, 1.0, t));',
        '  float streak = fbm(vec2(vWorld.x * 0.3, vWorld.z * 1.3) + w1 * 0.8);',
        '  col *= 0.965 + 0.06 * streak;',
        '  float pd = length(vWorld.xz - uPoolPos);',
        '  col = mix(col, uPoolCol, exp(-pd * pd / 46.0) * 0.6 * uPoolAmt);',
        '  float dist = length(vWorld - cameraPosition);',
        '  float fogF = smoothstep(uFogNear, uFogFar, dist);',
        '  col = mix(col, uFogColor, fogF);',
        '  float deep = smoothstep(0.25, -0.85, vNdcY);',
        '  col *= 1.0 - 0.05 * deep;',
        '  float alpha = clamp(mix(0.85, 0.96, fogF) + deep * 0.25, 0.0, 1.0);',
        '  gl_FragColor = vec4(col, alpha);',
        '}'
      ].join('\n')
    });
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(280, 280, 72, 72), mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.renderOrder = 1;
    return { mesh: mesh, u: u, mat: mat };
  }
  var ground = makeGround(); scene.add(ground.mesh);
  var mGround = makeGround(); mScene.add(mGround.mesh);

  /* ── 石碑材质（灰面 + 程序明暗）── */
  function makeGradTex() {
    var c = document.createElement('canvas'); c.width = 32; c.height = 128;
    var x = c.getContext('2d');
    var g = x.createLinearGradient(0, 0, 0, 128);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#f1f1f1'); g.addColorStop(1, '#d8d8d8');
    x.fillStyle = g; x.fillRect(0, 0, 32, 128);
    return new THREE.CanvasTexture(c);
  }
  var gradTex = makeGradTex();

  /* ── 蚀字 / 全字 竖排字平面 ──
     charAlphas: 每字透明度数组；缺省项 = 0（被蚀尽，只留极淡的影子） */
  function makeTextPlane(text, inkColor, worldW, charAlphas, mirrorWorld) {
    var cvs = document.createElement('canvas');
    cvs.width = 512; cvs.height = 2048;
    var ctx = cvs.getContext('2d');
    var tex = new THREE.CanvasTexture(cvs);
    tex.anisotropy = 4;
    function draw() {
      var fontSize = 168;
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
      var x = cvs.width / 2;
      var step = fontSize * 1.14;
      var startY = cvs.height / 2 - (text.length - 1) * step / 2;
      for (var i = 0; i < text.length; i++) {
        var a = charAlphas ? (charAlphas[i] !== undefined ? charAlphas[i] : 0.05) : 0.94;
        if (a <= 0.051) {
          /* 蚀尽的字：留一个几乎看不见的浅影 */
          ctx.fillStyle = 'rgba(120, 112, 104, 0.055)';
          ctx.font = '500 ' + fontSize + 'px "Noto Serif SC Web", "Songti SC", serif';
          ctx.fillText(text[i], x, startY + i * step);
        } else {
          ctx.fillStyle = inkColor.replace('$A', a.toFixed(3));
          ctx.font = '500 ' + fontSize + 'px "Noto Serif SC Web", "Songti SC", serif';
          ctx.fillText(text[i], x, startY + i * step);
        }
      }
      tex.needsUpdate = true;
    }

    window.addEventListener('pointermove', function (e) {
      pointer.x = (e.clientX / window.innerWidth - 0.5) * 2;
      pointer.y = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });
  }
  window.addEventListener('scroll', function () { readScroll(); if (reduceMotion) { applyPalette(0.15 + 0.72 * scrollP); renderOnce(); } }, { passive: true });
  window.addEventListener('resize', onResize);

  onResize();
  readScroll();
  renderOnce();

  /* 测试模式（?auto）：rAF 被渲染器节流时（如无头/遮挡环境）用定时器驱动；
     ?p=0..1 直接锁定醒梦深度（无头截图用，正常浏览不受影响）。 */
  if (!reduceMotion && location.search.indexOf('auto') >= 0 && !start.__auto) {
    start.__auto = true;
    setInterval(function () { if (!document.hidden) loop(performance.now()); }, 33);
  }
} catch (e) { window.__swarmErr = (e && e.message) + ' @ ' + (e && e.stack ? String(e.stack).split('\n')[1] : '?'); }
})();
</script>
</body>
</html>
