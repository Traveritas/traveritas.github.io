<title>25:61 · 站台与温室（原型）</title>
<!--
  p21 · 关于页彩蛋 · 站台与温室（原型）

  入口设想：关于页梦面的「25:61」时刻 → /2561/（本稿只做入口之后的场景）。
  场景：A 站台（只留站台，不接列车）+ C 巨环与百合温室，架空、抽象。
  漫游：节点式点击。视点本身就是主体——一枚长春花蓝的菱形光点标出下一处可去的位置；
        点它，镜头沿预设路线滑过去。底部菱形列可跳到任意一处（途经中间各站）。
  OC：本稿不放立绘。第 4 站「花间」留出她的位置，只悬一枚齐肩高的菱形。
  形态依据：OC 的灰白 / 近黑 / 长春花蓝配色与菱形纹样；设定图上的文字一概不用。
  文案全部是占位，只为让节奏可感。

  调试查询串：
    ?node=0..4  直接落在某一站   ?freeze=1  冻结一切动效（截图用）
    ?ui=0       隐藏界面层       ?rm=1      模拟减少动效（瞬移、不漂）
  调试接口：window.__p21 = { go(n), state() }
-->
<style>
  :root {
    --paper: #f1efeb;
    --mist: #e3e5e9;
    --ink: #2e2c33;
    --soft: #625f6a;
    --peri: #8f97d0; /* 长春花蓝：本页唯一的异质色 */
    --font-display: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', SimSun, serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  }
  html, body {

    height: 100%;
    overflow: hidden;

    font-family: var(--font-display);

  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  body.hover #stage { cursor: pointer; }

  .veil {
    position: fixed; inset: 0; background: var(--mist); pointer-events: none;

  }
  .veil.off { opacity: 0; }

  .hud { position: fixed; inset: 0; pointer-events: none; }
  body.no-ui .hud { display: none; }

  .exit:hover, .exit:focus-visible { color: var(--ink); }

<div class="hud">

<script src="vendor/three.min.js"></script>
<script>
(() => {
  'use strict';

  /* ── 开关 ─────────────────────────────────────────────── */
  const Q = new URLSearchParams(location.search);
  const RM = Q.get('rm') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FREEZE = Q.get('freeze') === '1';
  if (Q.get('ui') === '0') document.body.classList.add('no-ui');

  /* ── 色板：OC 的灰白 / 近黑 / 长春花蓝 × 站点的雾灰与暖沙 ── */
  const C = {
    paper: 0xe9e7e3,
    mist: 0xdcdfe4,
    grey: 0xb4b2ba,
    rail: 0x8c8994,
    ink: 0x2e2c33,
    peri: 0x8f97d0,
    lamp: 0xfff1dc,
    stem: 0xc9cbd1,
    skyTop: 0xcfd6e2,
    skyHorizon: 0xe8e8ea,
    skyWarm: 0xecdcd6,
  };

  /* ── 渲染器 / 场景 / 镜头 ─────────────────────────────── */
  const canvas = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: FREEZE });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 900);

  scene.fog = new THREE.FogExp2(C.skyHorizon, 0.02);

  /* 天穹：雾蓝在上、近白在地平线，温室方向透一点粉（蓝＝距离，粉＝温度） */
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      top: { value: new THREE.Color(C.skyTop) },
      horizon: { value: new THREE.Color(C.skyHorizon) },
      warm: { value: new THREE.Color(C.skyWarm) },
      warmAmt: { value: 0.5 },
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 top; uniform vec3 horizon; uniform vec3 warm; uniform float warmAmt;
      varying vec3 vDir;
      void main() {
        float y = vDir.y;
        vec3 c = mix(horizon, top, smoothstep(0.02, 0.62, y));
        float g = pow(max(dot(vDir, normalize(vec3(0.18, 0.06, -1.0))), 0.0), 5.0);
        c = mix(c, warm, g * warmAmt * (1.0 - smoothstep(0.1, 0.5, y)));
        gl_FragColor = vec4(c, 1.0);
      }`,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), skyMat);
  scene.add(sky);

  /* 光：半球光打底 + 一盏偏暖主光 + 一盏雾蓝补光 */
  scene.add(new THREE.HemisphereLight(0xf6f4f0, 0xbfc3ce, 0.74));
  const key = new THREE.DirectionalLight(0xfff5ea, 0.6);
  key.position.set(-22, 40, 26);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xc9cff0, 0.26);
  fill.position.set(30, 12, -50);
  scene.add(fill);

  /* ── 材质：亮面低模（平直着色、低粗糙、不金属） ─────────── */
  const M = (color, o = {}) =>
    new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.5, metalness: 0, flatShading: true }, o));
  const mPaper = M(C.paper);
  const mMist = M(C.mist);
  const mGrey = M(C.grey);
  const mRail = M(C.rail, { roughness: 0.7 });
  const mInk = M(C.ink, { roughness: 0.8 });
  const mGlass = M(0xeef1f6, { transparent: true, opacity: 0.32, roughness: 0.15, depthWrite: false, side: THREE.DoubleSide });
  const mDome = M(0xf2f4f8, { transparent: true, opacity: 0.13, roughness: 0.1, depthWrite: false, side: THREE.DoubleSide });
  const mStem = M(C.stem, { roughness: 0.6 });

  /* world：会在水面下镜像一份的一切（灯光、光点、微尘不进来） */
  const world = new THREE.Group();

  const box = (w, h, d, mat, x, y, z) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    world.add(m);
    return m;
  };

  /* ── 站台 ─────────────────────────────────────────────── */
  const DECK = 1.22; // 站台面高度（水面 y = 0）
  box(6, 0.34, 48, mPaper, 0, DECK - 0.17, -18);            // 台面：z +6 → -42
  box(0.12, 0.012, 48, mInk, -2.55, DECK + 0.006, -18);      // 台边一线近黑
  for (let z = 4; z >= -40; z -= 5.5) {                      // 细柱入水
    for (const x of [-2.3, 2.3]) {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, DECK, 6), mGrey);
      p.position.set(x, DECK / 2 - 0.1, z);
      world.add(p);
    }
  }

  /* 候车棚：一片磨砂顶 + 两根发丝柱 */
  box(4.4, 0.08, 10, mGlass, 0.9, 4.7, -7.5);
  for (const z of [-3.2, -11.8]) box(0.07, 3.5, 0.07, mInk, 2.8, DECK + 1.75, z);

  /* 长椅 */
  box(2.3, 0.08, 0.56, mMist, 1.7, DECK + 0.46, -7.6);
  box(2.3, 0.5, 0.06, mMist, 1.7, DECK + 0.8, -7.86);
  for (const x of [0.75, 2.65]) box(0.06, 0.46, 0.5, mInk, x, DECK + 0.23, -7.6);

  /* 托特包（OC 的随身物）：近黑、挂一枚菱形 —— 可点 */
  const bag = new THREE.Group();
  bag.position.set(2.3, DECK + 0.73, -7.55);
  bag.rotation.y = -0.22;
  const bagBody = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.46, 0.13), mInk);
  bag.add(bagBody);
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.013, 4, 14, Math.PI), mInk);
  handle.position.y = 0.23;
  bag.add(handle);
  const charm = new THREE.Mesh(new THREE.OctahedronGeometry(0.045, 0), mGrey);
  charm.scale.set(1, 1.6, 0.5);
  charm.position.set(0.08, -0.02, 0.08);
  bag.add(charm);
  world.add(bag);

  /* 路灯：发丝杆 + 菱形灯罩 */
  const lampHeads = [];
  for (const [x, z] of [[2.75, -15], [-2.75, -27]]) {
    box(0.05, 3.7, 0.05, mInk, x, DECK + 1.85, z);
    const head = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.2, 0),
      M(C.lamp, { emissive: C.lamp, emissiveIntensity: 0.85 }),
    );
    head.scale.set(1, 1.5, 1);
    head.position.set(x, DECK + 3.95, z);
    world.add(head);
    lampHeads.push(head.position.clone());
  }

  /* 站牌：一个不存在的时刻 —— 可点 */
  const signTex = (() => {
    const cv = document.createElement('canvas');
    cv.width = 512; cv.height = 224;
    const g = cv.getContext('2d');
    g.fillStyle = '#f1efeb'; g.fillRect(0, 0, 512, 224);
    g.fillStyle = '#2e2c33';
    g.font = '300 118px "IBM Plex Mono", Consolas, monospace';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('25:61', 256, 98);
    g.fillStyle = '#6b6873';
    g.font = '26px "IBM Plex Mono", Consolas, monospace';
    g.fillText('异 相  ·  R E M', 256, 180);
    g.fillRect(56, 150, 400, 1.5);
    const t = new THREE.CanvasTexture(cv);
    t.anisotropy = 4;
    return t;
  })();
  const sign = new THREE.Group();
  sign.position.set(-1.5, DECK + 2.35, -3.4);
  sign.rotation.y = 0.28;
  const faceMat = new THREE.MeshBasicMaterial({ map: signTex });
  const board = new THREE.Mesh(new THREE.BoxGeometry(1.64, 0.72, 0.05), [mPaper, mPaper, mPaper, mPaper, faceMat, mPaper]);
  sign.add(board);
  for (const x of [-0.7, 0.7]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.04, 2.35, 0.04), mInk);
    post.position.set(x, -1.18, -0.02);
    sign.add(post);
  }
  world.add(sign);

  /* ── 轨道：浮在水面上，向前伸进雾里，渐次断成点 ─────────── */
  for (const x of [-5.1, -6.5]) {
    box(0.06, 0.05, 90, mRail, x, 0.32, 15);                 // z +60 → -30 实线
    let z = -30, len = 2.6, gap = 0.7;
    while (len > 0.05 && z > -95) {                          // 断成虚线，再断成点
      box(0.06, 0.05, len, mRail, x, 0.32, z - len / 2);
      z -= len + gap;
      len *= 0.8;
      gap *= 1.18;
    }
  }

  /* 站台尽头：四级台阶落到细堤，细堤通向温室 */
  for (let i = 0; i < 4; i++) box(2.4, 0.18, 0.5, mPaper, 0, DECK - 0.18 * (i + 1) + 0.09 - 0.09, -42.25 - i * 0.5);
  box(2.2, 0.16, 28, mPaper, 0, 0.42, -58);

  /* ── 巨环：一大一细，细环斜 14°（与全站缝线同一倾角） ──── */
  const ringY = 8.2;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(10.6, 0.44, 6, 72), M(C.paper, { roughness: 0.35 }));
  ring.position.set(0, ringY, -40);
  world.add(ring);
  const ring2 = new THREE.Mesh(new THREE.TorusGeometry(11.5, 0.05, 3, 120), mInk);
  ring2.position.set(0, ringY, -40.6);
  ring2.rotation.set(0, 0.09, (14 * Math.PI) / 180);
  world.add(ring2);

  /* ── 温室：菱形格栅穹顶（两组反向螺旋线交成菱格） ────────── */
  const GH = new THREE.Vector3(0, 0, -92);
  const R = 18, H = 24, NH = 26, PHI_MAX = (80 * Math.PI) / 180, TWIST = 1.15;
  const floor = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.4, R + 0.8, 0.5, 52), mPaper);
  floor.position.set(GH.x, 0.34, GH.z);
  world.add(floor);
  const tube = (pts, r, mat) => {
    const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), pts.length * 2, r, 3, false), mat);
    world.add(m);
  };
  const domePt = (theta, phi) =>
    new THREE.Vector3(GH.x + R * Math.cos(phi) * Math.cos(theta), 0.6 + H * Math.sin(phi), GH.z + R * Math.cos(phi) * Math.sin(theta));
  for (let k = 0; k < NH; k++) {
    for (const dir of [1, -1]) {
      const pts = [];
      for (let s = 0; s <= 22; s++) {
        const phi = (s / 22) * PHI_MAX;
        pts.push(domePt((k / NH) * Math.PI * 2 + dir * (phi / PHI_MAX) * TWIST, phi));
      }
      tube(pts, 0.055, mGrey);
    }
  }
  for (const phi of [0, PHI_MAX]) {
    const pts = [];
    for (let s = 0; s <= 64; s++) pts.push(domePt((s / 64) * Math.PI * 2, phi));
    tube(pts, phi === 0 ? 0.12 : 0.09, mInk);
  }
  const shell = new THREE.Mesh(new THREE.SphereGeometry(R, 26, 10, 0, Math.PI * 2, 0, Math.PI / 2 - 0.18), mDome);
  shell.scale.set(1, H / R, 1);
  shell.position.set(GH.x, 0.6, GH.z);
  world.add(shell);

  /* ── 百合（抽象）：一根发丝茎 + 六枚折起的菱形瓣 + 悬在花心上方、互不相连的三粒近黑点。
       不写实：没有卷瓣、没有叶脉、没有绿，只留百合的开合与比例。
       瓣是磨砂树脂（半透明），根部微粉、瓣尖近白 ── */
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const jit = (a) => (rnd() * 2 - 1) * a;

  const mResin = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide, roughness: 0.28, metalness: 0, transparent: true, opacity: 0.86 });
  const cRoot = new THREE.Color(0xe6cbd1), cMid = new THREE.Color(0xf0eeeb), cTip = new THREE.Color(0xf9f9fa);

  /* 一枚折起的菱形：沿长轴对折，脊线在上、两翼压低 —— 4 个点、2 个面 */
  function rhombGeo(len, wid, fold, widest, root = cRoot, tip = cTip) {
    const pos = [0, 0, 0, len * widest, -fold * wid, -wid, len, 0, 0, len * widest, -fold * wid, wid];
    const col = [root, cMid, tip, cMid].flatMap((c) => [c.r, c.g, c.b]);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex([0, 1, 2, 0, 2, 3]);
    g.computeVertexNormals();
    return g;
  }

  const UP = new THREE.Vector3(0, 1, 0);
  function lily(x, z, h, p, face) {
    const g = new THREE.Group();
    g.position.set(x, 0.55, z);

    /* 茎：几乎笔直的一根发丝，只微微偏一点 */
    const top = new THREE.Vector3(jit(0.04) * h, h, jit(0.04) * h);
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(Math.max(0.018, p * 0.022), Math.max(0.024, p * 0.03), top.length(), 5), mStem);
    stem.position.copy(top).multiplyScalar(0.5);
    stem.quaternion.setFromUnitVectors(UP, top.clone().normalize());
    g.add(stem);

    /* 叶：只有高的株才有，一枚细长菱形贴着茎斜出 */
    if (h > 3) {
      const leaf = new THREE.Mesh(rhombGeo(p * 1.5, p * 0.07, 0, 0.3, new THREE.Color(0xd9dbe0), new THREE.Color(0xeceef1)), mResin);
      leaf.position.copy(top).multiplyScalar(0.22 + rnd() * 0.1);
      leaf.rotation.set(0, face + 2 + jit(0.5), 1.15 + jit(0.15));
      g.add(leaf);
    }

    /* 花头：近乎朝天，只偏 10–20°；外三瓣开得平，内三瓣收得直 */
    const head = new THREE.Group();
    head.position.copy(top);
    head.rotation.y = face;
    const tilt = new THREE.Group();
    tilt.rotation.z = -(0.18 + jit(0.1));
    head.add(tilt);
    for (let i = 0; i < 6; i++) {
      const outer = i % 2 === 0;
      const pg = new THREE.Group();
      pg.rotation.y = (i / 6) * Math.PI * 2 + jit(0.1);
      const pm = new THREE.Mesh(rhombGeo(p * (outer ? 1 : 0.78) * (1 + jit(0.1)), p * (outer ? 0.26 : 0.2), 0.45, outer ? 0.42 : 0.36), mResin);
      pm.rotation.z = (outer ? 0.62 : 1.0) + jit(0.08); // 仰角：外约 36°、内约 57°
      pg.add(pm);
      tilt.add(pg);
    }
    /* 花心上方悬着三粒近黑点，不与花相连 */
    for (let i = 0; i < 3; i++) {
      const dot = new THREE.Mesh(new THREE.OctahedronGeometry(p * 0.03, 0), mInk);
      const ang = (i / 3) * Math.PI * 2 + rnd();
      dot.position.set(Math.cos(ang) * p * 0.09, p * (0.42 + i * 0.13), Math.sin(ang) * p * 0.09);
      tilt.add(dot);
    }
    g.add(head);
    world.add(g);
    return g;
  }

  /* 一株穿出穹顶天眼，几株到建筑尺度，一圈与人等高 */
  lily(GH.x + 1.2, GH.z - 1.5, 27, 6.2, 0.6);
  lily(GH.x - 8.5, GH.z - 6, 14, 4.2, -0.9);
  lily(GH.x + 9, GH.z + 5.5, 9.5, 3.2, 2.2);
  lily(GH.x + 6.5, GH.z - 9, 6.5, 2.4, 1.2);
  lily(GH.x - 10.5, GH.z + 5, 5.2, 2.0, -2.2);
  const smalls = [
    [-4, 7.5], [-7, 9], [5.2, 12], [-11, -1], [11.5, -2],          // 散落
    [-1, -12.5], [6.8, -11], [-2.2, -16], [9.5, -9], [8.5, -13], // 围着她的空地
  ];
  for (const [dx, dz] of smalls) lily(GH.x + dx, GH.z + dz, 1.1 + rnd() * 1.3, 0.45 + rnd() * 0.3, rnd() * 6.28);

  /* 站台两侧的水上也零星长几株（自然物对冲几何） */
  for (const [x, z, h] of [[5.2, -20, 1.6], [6.4, -23, 2.3], [-3.6, -34, 1.2], [4.4, -49, 2.8], [-3.8, -61, 1.9]]) {
    lily(x, z, h, 0.55 + rnd() * 0.25, rnd() * 6.28).position.y = 0.02;
  }

  /* 她的位置：一片空地，一枚齐肩高的菱形（发夹的形） —— 可点 */
  const HER = new THREE.Vector3(GH.x + 3, 0.6, GH.z - 13); // 温室深处，背靠穹壁
  const herRing = new THREE.Mesh(new THREE.RingGeometry(0.62, 0.66, 48), new THREE.MeshBasicMaterial({ color: C.ink, transparent: true, opacity: 0.35 }));
  herRing.rotation.x = -Math.PI / 2;
  herRing.position.set(HER.x, HER.y + 0.02, HER.z);
  world.add(herRing);

  scene.add(world);

  /* 水面倒影：world 整体沿 y 翻一份（行列式为负时 three 会自动翻转面朝向） */
  const mirror = world.clone();
  mirror.scale.y = -1;
  mirror.traverse((o) => o.layers.set(1));
  scene.add(mirror);
  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(1400, 1400),
    new THREE.MeshBasicMaterial({ color: C.skyHorizon, transparent: true, opacity: 0.8 }),
  );
  water.rotation.x = -Math.PI / 2;
  scene.add(water);

  /* 灯：路灯各一盏暖光（不进 world，免得倒影里再亮一次） */
  for (const p of lampHeads) {
    const l = new THREE.PointLight(C.lamp, 0.55, 11, 2);
    l.position.copy(p);
    scene.add(l);
  }
  /* 温室里斜落的几道光：长春花蓝，14° */
  const shaftMat = new THREE.MeshBasicMaterial({ color: C.peri, transparent: true, opacity: 0.07, depthWrite: false, side: THREE.DoubleSide, fog: false });
  for (const [dx, dz, s] of [[-5, 2, 1], [4, -4, 0.8], [-0.1, -13, 0.7]]) {
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.3 * s, 3.2 * s, 26, 10, 1, true), shaftMat);
    shaft.position.set(GH.x + dx, 13, GH.z + dz);
    shaft.rotation.z = (14 * Math.PI) / 180;
    scene.add(shaft);
  }

  /* 微尘：缓缓上浮 */
  const DUST = 420;
  const dustGeo = new THREE.BufferGeometry();
  const dustPos = new Float32Array(DUST * 3);
  for (let i = 0; i < DUST; i++) {
    dustPos[i * 3] = jit(16);
    dustPos[i * 3 + 1] = 0.5 + rnd() * 16;
    dustPos[i * 3 + 2] = 10 - rnd() * 118;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: 0.75, depthWrite: false }));
  scene.add(dust);

  /* ── 菱形光点（节点标记）与可点物 ────────────────────────── */
  const haloTex = (() => {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 128;
    const g = cv.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,0.9)');
    gr.addColorStop(0.35, 'rgba(255,255,255,0.28)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(cv);
  })();

  function makeDiamond(size, color) {
    const d = new THREE.Group();
    const core = new THREE.Mesh(new THREE.OctahedronGeometry(size, 0), new THREE.MeshBasicMaterial({ color, fog: false }));
    core.scale.set(1, 1.6, 1);
    const edge = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.OctahedronGeometry(size * 1.9, 0)),
      new THREE.LineBasicMaterial({ color: C.ink, transparent: true, opacity: 0.45, fog: false }),
    );
    edge.scale.set(1, 1.6, 1);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, color, transparent: true, opacity: 0.55, depthWrite: false, fog: false }));
    halo.scale.setScalar(size * 9);
    const hit = new THREE.Mesh(new THREE.SphereGeometry(size * 4, 8, 6), new THREE.MeshBasicMaterial({ visible: false }));
    d.add(halo, core, edge, hit);
    d.userData = { core, edge, halo, hit, hover: 0 };
    scene.add(d);
    return d;
  }

  /* 文案全部是占位；只为让节奏可感 */
  const NODES = [
    { key: '雾 · 入站', line: '雾里有一块站牌，上面写着一个多出来的时刻。',
      cam: [0.6, 3.1, 25], look: [0, 3.2, -10], at: [-0.2, 2.5, 6], fog: 0.022, warm: 0.3 },
    { key: '站台 · 候车', line: '长椅空着。灯亮着，像有人刚刚起身。',
      cam: [-1.9, 2.9, 3.4], look: [1.1, 2.3, -9.5], at: [-0.6, 2.45, 1.2], fog: 0.017, warm: 0.4 },
    { key: '巨环 · 门', line: '从这一侧看是环；走近以后，它更像一道门。',
      cam: [0, 2.95, -27.5], look: [0, 7.4, -46], at: [0, 2.6, -31], fog: 0.012, warm: 0.55 },
    { key: '温室 · 花', line: '花比穹顶更高。没有人觉得奇怪。',
      cam: [0, 2.45, -77], look: [0, 8.5, -95], at: [0, 2.3, -74.5], fog: 0.009, warm: 0.8 },
    { key: '花间 · 此处', line: '这里留着一小块空地，刚好站得下一个人。',
      cam: [-2.5, 2.0, -99.5], look: [3, 1.6, -105], at: [-1.5, 2.3, -93], fog: 0.01, warm: 0.9 },
  ];
  NODES.forEach((n) => (n.marker = makeDiamond(0.2, C.peri)));
  NODES.forEach((n) => n.marker.position.set(...n.at));

  const herDiamond = makeDiamond(0.07, C.peri);
  herDiamond.position.set(HER.x, 1.55, HER.z);
  herDiamond.userData.halo.material.opacity = 0.35;

  const ITEMS = [
    { obj: sign, node: 1, key: '站牌', line: '25:61。钟面上多出来的那一格，只在这里走动。' },
    { obj: bag, node: 1, key: '长椅上', line: '一只近黑的托特包，挂着一枚菱形。' },
    { obj: herDiamond, node: 4, key: '齐肩的高度', line: '一枚菱形悬在那里，轻轻转着，像在等谁来认领。' },
  ];

  /* ── 界面层 ──────────────────────────────────────────── */
  const pathEl = document.getElementById('path');
  const capEl = document.getElementById('cap');
  const capK = document.getElementById('capK');
  const capT = document.getElementById('capT');
  const hintEl = document.getElementById('hint');
  const seen = new Set();
  NODES.forEach((n, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', `前往：${n.key}`);
    b.innerHTML = '<i></i>';
    b.addEventListener('click', () => go(i));
    li.appendChild(b);
    pathEl.appendChild(li);
    n.btn = b;
  });

  let capTimer = 0;
  function caption(k, t) {
    clearTimeout(capTimer);
    capEl.classList.remove('on');
    capTimer = setTimeout(() => {
      capK.textContent = k;
      capT.textContent = t;
      capEl.classList.add('on');
    }, RM ? 0 : 380);
  }
  const hideCaption = () => { clearTimeout(capTimer); capEl.classList.remove('on'); };

  /* ── 漫游：沿途经各站的平滑曲线滑行 ─────────────────────── */
  const V = (a) => new THREE.Vector3(...a);
  let cur = Math.max(0, Math.min(NODES.length - 1, parseInt(Q.get('node') || '0', 10) || 0));
  let travel = null;
  const camPos = V(NODES[cur].cam);
  const camLook = V(NODES[cur].look);
  let fogD = NODES[cur].fog, warm = NODES[cur].warm;

  function arrive(i) {
    cur = i;
    seen.add(i);
    NODES.forEach((n, j) => {
      n.btn.classList.toggle('here', j === i);
      n.btn.classList.toggle('seen', seen.has(j) && j !== i);
      if (j === i) n.btn.setAttribute('aria-current', 'step'); else n.btn.removeAttribute('aria-current');
    });
    caption(NODES[i].key, NODES[i].line);
  }

  function go(i) {
    if (i === cur && !travel) return;
    if (i < 0 || i >= NODES.length) return;
    hintEl.classList.add('off');
    hideCaption();
    const from = travel ? travel.toIdx : cur;
    const step = i > from ? 1 : -1;
    const ps = [camPos.clone()], ls = [camLook.clone()];
    for (let j = from + step; j !== i + step; j += step) { ps.push(V(NODES[j].cam)); ls.push(V(NODES[j].look)); }
    if (ps.length === 2) {                                   // 直达时抬一个中点，路线不至于死直
      ps.splice(1, 0, ps[0].clone().lerp(ps[1], 0.5).add(new THREE.Vector3(0, 0.5, 0)));
      ls.splice(1, 0, ls[0].clone().lerp(ls[1], 0.5));
    }
    const pc = new THREE.CatmullRomCurve3(ps, false, 'centripetal');
    const lc = new THREE.CatmullRomCurve3(ls, false, 'centripetal');
    const dur = RM ? 0 : Math.min(7.5, Math.max(2.4, pc.getLength() * 0.085));
    travel = { pc, lc, t0: performance.now(), dur: dur * 1000, toIdx: i, fog0: fogD, warm0: warm };
    if (dur === 0) step1(1);
  }

  const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * t);
  function step1(k) {
    const e = ease(k);
    camPos.copy(travel.pc.getPoint(e));
    camLook.copy(travel.lc.getPoint(e));
    fogD = THREE.MathUtils.lerp(travel.fog0, NODES[travel.toIdx].fog, e);
    warm = THREE.MathUtils.lerp(travel.warm0, NODES[travel.toIdx].warm, e);
    if (k >= 1) { const i = travel.toIdx; travel = null; arrive(i); }
  }

  /* ── 指针：悬停 / 点击 ───────────────────────────────── */
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2(9, 9);
  const par = new THREE.Vector2(0, 0);
  let hovered = null;

  function targets() {
    const list = [];
    NODES.forEach((n, i) => { if (n.marker.visible && i !== cur) list.push({ o: n.marker.userData.hit, act: () => go(i), d: n.marker }); });
    if (!travel) ITEMS.forEach((it) => { if (it.node === cur) list.push({ o: it.obj, act: () => caption(it.key, it.line), d: it.obj.userData.core ? it.obj : null }); });
    return list;
  }
  function pick() {
    ray.setFromCamera(ptr, camera);
    const list = targets();
    const hits = ray.intersectObjects(list.map((x) => x.o), true);
    if (!hits.length) return null;
    return list.find((x) => { let o = hits[0].object; while (o) { if (o === x.o) return true; o = o.parent; } return false; }) || null;
  }
  canvas.addEventListener('pointermove', (e) => {
    ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    par.set(ptr.x, ptr.y);
    hovered = pick();
    document.body.classList.toggle('hover', !!hovered);
  });
  canvas.addEventListener('pointerleave', () => { par.set(0, 0); hovered = null; document.body.classList.remove('hover'); });
  canvas.addEventListener('click', (e) => {
    ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    const h = pick();
    if (h) h.act();
  });
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') go(Math.min(NODES.length - 1, (travel ? travel.toIdx : cur) + 1));
    if (e.key === 'ArrowLeft') go(Math.max(0, (travel ? travel.toIdx : cur) - 1));
    if (e.key === 'Escape') hideCaption();
  });

  /* ── 尺寸 ────────────────────────────────────────────── */
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 62 : 46;                       // 竖屏放宽视角，站台与巨环都能入画
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  /* 倒影单独一层、单独一遍：伸到水下的东西（巨环、细柱）翻上来会从水面冒出一截，
     所以第一遍只画倒影并切掉 y > 0，第二遍再画其余。灯光两层都要照到 */
  scene.traverse((o) => { if (o.isLight) o.layers.enable(1); });
  renderer.autoClear = false;
  const CLIP_BELOW = [new THREE.Plane(new THREE.Vector3(0, -1, 0), 0)];
  const NO_CLIP = [];

  /* ── 主循环 ──────────────────────────────────────────── */
  const drift = new THREE.Vector2(0, 0);
  const tmpLook = new THREE.Vector3();
  let last = performance.now();
  let clock = 0;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const live = !FREEZE && !RM;
    if (live) clock += dt;

    if (travel) step1(Math.min(1, (now - travel.t0) / travel.dur));

    /* 视差：指针带动一点点视线，不带动位置 */
    const k = live ? 1 - Math.exp(-dt * 2.2) : 1;
    const tx = live ? par.x : 0, ty = live ? par.y : 0;
    drift.x += (tx - drift.x) * k;
    drift.y += (ty - drift.y) * k;
    camera.position.copy(camPos);
    camera.position.y += live ? Math.sin(clock * 0.35) * 0.04 : 0;
    tmpLook.copy(camLook);
    tmpLook.x += drift.x * 0.9;
    tmpLook.y += drift.y * 0.45;
    camera.lookAt(tmpLook);
    sky.position.copy(camera.position);

    scene.fog.density = fogD;
    skyMat.uniforms.warmAmt.value = warm;
    scene.fog.color.setHex(C.skyHorizon).lerp(new THREE.Color(C.skyWarm), warm * 0.25);
    water.material.color.copy(scene.fog.color);

    /* 光点：只亮相邻两处；下一处更亮 */
    const next = travel ? -1 : cur + 1, prev = travel ? -1 : cur - 1;
    NODES.forEach((n, i) => {
      const m = n.marker, u = m.userData;
      const show = i === next || i === prev;
      m.visible = show;
      if (!show) return;
      const isHover = hovered && hovered.d === m;
      u.hover += ((isHover ? 1 : 0) - u.hover) * (live ? 1 - Math.exp(-dt * 8) : 1);
      const base = i === next ? 1 : 0.6;
      m.scale.setScalar(base * (1 + u.hover * 0.3));
      u.halo.material.opacity = (i === next ? 0.55 : 0.3) + u.hover * 0.3;
      m.position.y = n.at[1] + (live ? Math.sin(clock * 1.1 + i) * 0.12 : 0);
      u.core.rotation.y = live ? clock * 0.5 : 0.4;
      u.edge.rotation.y = live ? -clock * 0.22 : 0.2;
    });
    /* 她位置上的菱形：到了这一站才浮现，别的站看不见 */
    const hd = herDiamond.userData;
    const herOn = cur === 4 && !travel ? 1 : 0;
    hd.show = (hd.show || 0) + (herOn - (hd.show || 0)) * (live ? 1 - Math.exp(-dt * 1.6) : 1);
    herDiamond.visible = hd.show > 0.01;
    herDiamond.scale.setScalar(hd.show);
    hd.core.rotation.y = live ? clock * 0.6 : 0.4;
    hd.edge.rotation.y = live ? -clock * 0.3 : 0.2;
    herDiamond.position.y = 1.55 + (live ? Math.sin(clock * 0.9) * 0.03 : 0);

    /* 微尘上浮，超出顶端回到底部 */
    if (live) {
      const a = dust.geometry.attributes.position;
      for (let i = 0; i < DUST; i++) {
        let y = a.array[i * 3 + 1] + dt * (0.08 + (i % 7) * 0.012);
        if (y > 16.5) y = 0.5;
        a.array[i * 3 + 1] = y;
        a.array[i * 3] += Math.sin(clock * 0.3 + i) * dt * 0.02;
      }
      a.needsUpdate = true;
    }

    renderer.clear();
    camera.layers.set(1);
    renderer.clippingPlanes = CLIP_BELOW;
    renderer.render(scene, camera);
    camera.layers.set(0);
    renderer.clippingPlanes = NO_CLIP;
    renderer.render(scene, camera);
    if (!document.hidden) requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { last = performance.now(); requestAnimationFrame(frame); }
  });

  arrive(cur);
  if (cur > 0) hintEl.classList.add('off');
  requestAnimationFrame(frame);
  requestAnimationFrame(() => document.getElementById('veil').classList.add('off'));
  if (FREEZE || RM) document.getElementById('veil').style.transition = 'none';

  window.__p21 = {
    go,
    /* 某站光点当前的屏幕坐标（实测脚本用来真点它） */
    screenOf: (i) => {
      const v = NODES[i].marker.getWorldPosition(new THREE.Vector3()).project(camera);
      return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight, onScreen: v.z < 1 && Math.abs(v.x) < 1 && Math.abs(v.y) < 1 };
    },
    state: () => ({ node: cur, traveling: !!travel, key: NODES[cur].key, cam: camera.position.toArray().map((v) => +v.toFixed(2)), calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
  };
})();
</script>
</body>
</html>
