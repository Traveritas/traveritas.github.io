  <g transform="translate(16 16) scale(1.12) translate(-16 -16)">
    <use href="#p" transform="matrix(0.882948 0.469472 0.469472 -0.882948 -5.6388 22.6156)" class="bloom" filter="url(#b)"/>
    <g mask="url(#k)">
