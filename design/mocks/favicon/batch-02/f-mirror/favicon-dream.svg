<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="AveritA">
  <!-- 折叶 FOLD · 梦面：光挪到折过去的那一半，折痕与叶尖被点亮。醒面见 favicon.svg -->
  <title>AveritA</title>
  <defs>
    <style>
      .up{fill:#b6c0cf;fill-opacity:.72}
      .down{fill:#a195c1;fill-opacity:.95}
      .bloom{fill:#a195c1;opacity:.62}
      .downline{fill:none;stroke:#cfd8e4;stroke-width:.72;stroke-opacity:.52;stroke-linejoin:round}
      .crease{fill:none;stroke:#dfe6ee;stroke-width:1.15;stroke-opacity:.92;stroke-linejoin:round}
      .lit{fill:#e6ebf1;opacity:.95}
    </style>
    <path id="p" d="M16 4.8C14.29 8.19 9.596 10.803 9.596 14.403L22.404 17.597C22.404 13.997 17.71 8.19 16 4.8Z"/>
    <path id="c" d="M9.596 14.403H12.798V15.201H16V16H19.202V16.798H22.404V17.597"/>
    <mask id="k" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <use href="#c" fill="none" stroke="#000" stroke-width="1.15"/>
      <circle cx="15.6" cy="9.5" r="1.15" fill="#000"/>
    </mask>
    <filter id="b" x="-90%" y="-90%" width="280%" height="280%">
