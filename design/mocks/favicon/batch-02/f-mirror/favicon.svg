<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Traveritas">
  <!-- 折叶 FOLD · 醒面（reality-mix = 1）：正立的一半实心，折过去的一半是同一份墨的浅影。
       折痕是真的缺口（mask 切出来的六级台阶），所以整枚压成一种墨色也仍然成立。
       梦面见 favicon-dream.svg。 -->
  <title>Traveritas</title>
  <style>
    /* 独立 SVG 文档里 :root 就是根 svg。两种标签栏底色都活。 */
    :root { color: #232830; }
    @media (prefers-color-scheme: dark) { :root { color: #e6ebf1; } }
    .up { fill: currentColor; fill-opacity: 1; }
    .down { fill: currentColor; fill-opacity: .12; }
    .line { fill: none; stroke: currentColor; stroke-opacity: .40; stroke-width: .72; stroke-linejoin: round; }
  </style>
  <defs>
    <path id="p" d="M16 4.8C14.29 8.19 9.596 10.803 9.596 14.403L22.404 17.597C22.404 13.997 17.71 8.19 16 4.8Z"/>
    <path id="c" d="M9.596 14.403H12.798V15.201H16V16H19.202V16.798H22.404V17.597"/>
    <mask id="k" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <use href="#c" fill="none" stroke="#000" stroke-width="1.15"/>
      <circle cx="15.6" cy="9.5" r="1.15" fill="#000"/>
    </mask>
  </defs>
  <g transform="translate(16 16) scale(1.12) translate(-16 -16)">
    <g mask="url(#k)">
      <use href="#p" class="up"/>
      <use href="#p" transform="matrix(0.882948 0.469472 0.469472 -0.882948 -5.6388 22.6156)" class="down"/>
    </g>
    <use href="#p" transform="matrix(0.882948 0.469472 0.469472 -0.882948 -5.6388 22.6156)" class="line"/>
  </g>
</svg>
