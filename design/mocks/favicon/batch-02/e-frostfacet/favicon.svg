<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="醒梦之界">
  <title>醒梦之界 · 磨砂玻璃棱面</title>

  <!--
    一枚被敲下来的磨砂玻璃，里面裂着一道 14° 的线。
    默认 = 醒面（浅色主题）：冷灰、面与面之间界限清楚、那道线是合着的。
    prefers-color-scheme: dark 自动转为梦面：裂口张开、薄暮紫从里面出来、棱上换成虹彩。
    强制梦面：给根元素加 class="dream"。退成单色见 notes.md。
  -->
  <style>
    svg{
      /* 醒面 */
      --f-lit:#dfe8ef; --f-mid:#bcc7d1; --f-dim:#96a3af;
      --f-plate:#cbd6df; --f-sliver:#bfccd6; --f-chip:#7d8b99;
      --ink:#7a8794; --ink-w:.62; --ink-soft:.6;
      --rim:#fdfeff; --rim-w:.5; --rim-op:.95;
      --seal:#5d6a78;
      --crack-op:0; --glow-op:0; --streak-op:0; --chip-d-op:0;
    }
    @media (prefers-color-scheme: dark){
      svg{
        /* 梦面 */
        --f-lit:rgba(214,226,240,.20); --f-mid:rgba(150,136,192,.26); --f-dim:rgba(120,136,158,.15);
        --f-plate:rgba(200,214,230,.11); --f-sliver:rgba(190,206,224,.13); --f-chip:rgba(6,8,16,.66);
        --ink:rgba(208,222,238,.40); --ink-soft:.5;
        --rim:url(#ff-sheen); --rim-op:.7;
        --seal:rgba(224,236,250,.5);
        --crack-op:1; --glow-op:1; --streak-op:.55; --chip-d-op:1;
      }
    }
    svg.dream{
      --f-lit:rgba(214,226,240,.20); --f-mid:rgba(150,136,192,.26); --f-dim:rgba(120,136,158,.15);
      --f-plate:rgba(200,214,230,.11); --f-sliver:rgba(190,206,224,.13); --f-chip:rgba(6,8,16,.66);
      --ink:rgba(208,222,238,.40); --ink-soft:.5;
      --rim:url(#ff-sheen); --rim-op:.7;
      --seal:rgba(224,236,250,.5);
      --crack-op:1; --glow-op:1; --streak-op:.55; --chip-d-op:1;
    }
  </style>

  <defs>
    <!-- 棱上的虹彩：沿受光的那条边，冷白 → 薄暮紫 → 一点冷青 -->
    <linearGradient id="ff-sheen" gradientUnits="userSpaceOnUse" x1="5.8" y1="13.6" x2="16" y2="10.05">
      <stop offset="0" stop-color="#dceaf4"/>
      <stop offset=".45" stop-color="#c0a8e2"/>
      <stop offset="1" stop-color="#a8ccd0"/>
    </linearGradient>
    <!-- 裂口里透出来的光 -->
    <radialGradient id="ff-glow" gradientUnits="userSpaceOnUse" cx="10.6" cy="13.4" r="6.6">
      <stop offset="0" stop-color="#b0a0dc" stop-opacity=".62"/>
      <stop offset=".45" stop-color="#9684c4" stop-opacity=".26"/>
      <stop offset="1" stop-color="#9684c4" stop-opacity="0"/>
    </radialGradient>
    <!-- 那道 14° 的光从裂口出来，往右下淡进空气里 -->
    <linearGradient id="ff-streak" gradientUnits="userSpaceOnUse" x1="15" y1="14.4" x2="20.34" y2="15.73">
      <stop offset="0" stop-color="#c9b6ef" stop-opacity=".8"/>
      <stop offset="1" stop-color="#c9b6ef" stop-opacity="0"/>
    </linearGradient>
    <!-- 裂口只活在玻璃里面 -->
    <clipPath id="ff-glass">
      <polygon points="5.8,13.6 6.9,10.0 8.4,10.9 10.2,8.6 16.0,10.05 15.0,14.4 11.0,20.4 6.9,18.8"/>
    </clipPath>
  </defs>

  <g transform="translate(16 16) scale(1.74) translate(-13.15 -14.625)">

    <!-- 后面压着的两片：右上的一小片板、左下掉出来的一片薄屑 -->
    <polygon fill="var(--f-plate)" stroke="var(--ink)" stroke-width="var(--ink-w)" stroke-opacity="var(--ink-soft)"
             stroke-linejoin="round" points="12.4,7.3 18.6,6.85 19.7,10.8 14.2,10.4"/>
    <polygon fill="var(--f-sliver)" stroke="var(--ink)" stroke-width="var(--ink-w)" stroke-opacity="var(--ink-soft)"
             stroke-linejoin="round" points="5.7,16.4 7.9,20.6 6.2,22.3"/>

    <!-- 主体：三个面，明暗一路压下去；左上留一道咬口 -->
    <polygon fill="var(--f-lit)" points="6.37,12.25 6.9,10.0 8.4,10.9 10.2,8.6 16.0,10.05 15.0,14.4"/>
    <polygon fill="var(--f-mid)" points="6.37,12.25 9.36,19.76 6.9,18.8 5.8,13.6"/>
    <polygon fill="var(--f-dim)" points="6.37,12.25 15.0,14.4 11.0,20.4 9.36,19.76"/>
    <polygon fill="none" stroke="var(--ink)" stroke-width="var(--ink-w)" stroke-linejoin="round"
             points="5.8,13.6 6.9,10.0 8.4,10.9 10.2,8.6 16.0,10.05 15.0,14.4 11.0,20.4 6.9,18.8"/>
    <!-- 两个面相交的那道内棱 -->
    <line stroke="var(--ink)" stroke-width=".42" stroke-opacity="var(--ink-soft)"
          x1="6.37" y1="12.25" x2="9.36" y2="19.76"/>

    <!-- 那道 14° 的线：醒时合着，只是一条暗棱；梦时张开成一道楔口，光从里面出来 -->
    <g clip-path="url(#ff-glass)">
      <polygon fill="var(--seal)" points="6.34,12.38 14.94,14.63 15.06,14.17 6.40,12.12"/>
    </g>
    <circle fill="url(#ff-glow)" opacity="var(--glow-op)" cx="10.6" cy="13.4" r="6.6"/>
    <g clip-path="url(#ff-glass)" opacity="var(--crack-op)">
      <polygon fill="#c9b6ef" points="6.32,12.46 14.75,15.42 15.25,13.38 6.42,12.04"/>
    </g>
    <polygon fill="url(#ff-streak)" opacity="var(--streak-op)"
             points="14.93,14.69 20.32,15.80 20.36,15.66 15.07,14.11"/>

    <!-- 受光的那条棱上的一道高光（梦时换成虹彩） -->
    <polyline fill="none" stroke="var(--rim)" stroke-width="var(--rim-w)" stroke-opacity="var(--rim-op)"
              stroke-linecap="round" stroke-linejoin="round" points="5.8,13.6 6.9,10.0 8.4,10.9 10.2,8.6 16.0,10.05"/>

    <!-- 右侧脱离主体的一小块碎屑：醒时贴着，梦时又飘开一点、偏了几度 -->
    <polygon fill="var(--f-chip)" stroke="var(--ink)" stroke-width="var(--ink-w)" stroke-opacity="var(--ink-soft)"
             stroke-linejoin="round" opacity="calc(1 - var(--chip-d-op))"
             points="16.4,16.8 19.6,18.2 18.2,21.2 15.9,19.9"/>
    <polygon fill="var(--f-chip)" stroke="var(--ink)" stroke-width="var(--ink-w)" stroke-opacity="var(--ink-soft)"
             stroke-linejoin="round" opacity="var(--chip-d-op)" transform="rotate(-5 17.9 19.0) translate(.9 -.6)"
             points="16.4,16.8 19.6,18.2 18.2,21.2 15.9,19.9"/>
  </g>
</svg>
