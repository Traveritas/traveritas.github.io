<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Traveritas">
  <!--
    阶缝 Step Seam · Traveritas 标签页图标
    横阶 M4 6H16V12H28 : 踏面 12 / 竖步 6，弦 24×6 = atan(6/24) = 14.036°，与令牌 seam-angle: 14deg 同源
    中轴 M16 6V27      : 与竖步共线；台阶的下落本身就是标记的轴
    线宽 4 = 16px 下的 2px；方头 / 斜接。竖步是线宽的 1.5 倍，所以 16px 下仍是一次明确的错位。
    墨色：currentColor 打底（醒面深墨）；深色标签栏由 prefers-color-scheme 换成冷白 #e6ebf1。
    注意：prefers-color-scheme 跟的是系统主题，不一定是浏览器标签栏的深浅；
    真要两态，由页面脚本换 link rel=icon（见 notes.md 的「怎么换」）。
  -->
  <style>
    path { stroke: currentColor; }
    @media (prefers-color-scheme: dark) { path { stroke: #e6ebf1; } }
    @media (prefers-color-scheme: light) { path { stroke: #232830; } }
  </style>
  <g fill="none" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M4 6H16V12H28"/>
    <path d="M16 6V27"/>
  </g>
</svg>
