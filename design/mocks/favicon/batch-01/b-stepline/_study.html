<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>阶线 · 形之研究</title>
<style>
  :root { --ink:#232830; --paper:#f0f3f6; --night:#0c0f18; --glow:#e6ebf1; }
  * { box-sizing: border-box; }
  body { margin:0; padding:28px 32px 60px; background:#14161c; color:#c9cfd8;
    font:13px/1.5 system-ui, "Microsoft YaHei UI", sans-serif; }
  h1 { font-size:15px; font-weight:600; letter-spacing:.06em; margin:0 0 4px; color:#e6ebf1; }
  .sub { color:#7c8695; margin:0 0 24px; font-size:12px; }
  .grid { display:flex; flex-wrap:wrap; gap:18px; }
  .card { background:#1b1e26; border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:12px 14px 14px; }
  .name { font-size:11px; letter-spacing:.14em; color:#8f99a8; margin-bottom:10px; }
  .row { display:flex; align-items:flex-end; gap:14px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .cap { font-size:9px; letter-spacing:.1em; color:#6d7684; }
  .box { display:flex; align-items:center; justify-content:center; border-radius:5px; }
  .dark { background:#0c0f18; color:#e6ebf1; }
  .light { background:#f0f3f6; color:#232830; }
  .sq { width:56px; height:56px; }
  .s32 { width:32px; height:32px; }
  .s16 { width:16px; height:16px; }
  svg { display:block; }
</style>
</head>
<body>
<h1>阶线 · 形之研究</h1>
<p class="sub">同一枚 32 格内的候选形；每格看 56px 与 16px（真实标签尺寸）。</p>
<div class="grid" id="g"></div>
<script>
/* 全部落在 32 格上：竖 2 单位 / 横 8 单位 一步 = 1:4 = 14.04°（与 --seam-angle:14deg 同源） */
const C = [
  { n: 'A 长阶', s: 'M0 24V22H8V20H16V18H24V16H32', w: 3 },
  { n: 'B 阶与影', s: 'M4 19V17H12V15H20V13H28', w: 3, extra: 'M3 23V21H11V19H19V17H27', ew: 1.3, eo: .4 },
  { n: 'C T 字阶', s: 'M4 10V12H12V14H20V16H28', w: 4, extra: 'M16 14V28', ew: 4 },
  { n: 'D 立线', s: 'M2 27V25H10V23H18V21H26V8', w: 3 },
  { n: 'E 框阶', s: 'M2 25V23H10V21H18V19H26', w: 3, frame: 'M3 3H29V29H3Z' },
  { n: 'F 粗细', s: 'M4 24V22H12V20H20V18H28', w: 4, extra: 'M28 18H32', ew: 1.2 },
  { n: 'G 阶+坠点', s: 'M4 22V20H12V18H20V16H28', w: 3, extra: 'M16 16V29', ew: 1.6 },
  { n: 'H 双阶', s: 'M4 18V16H12V14H20V12H28', w: 2.4, extra: 'M4 26V24H12V22H20V20H28', ew: 2.4, eo: .5 },
  { n: 'I 阶散架', s: 'M4 24V22H12', w: 3.4, extra: 'M14 20H20.5', ew: 2.6, eo: .85, extra2: 'M23 18H27.5', e2w: 1.8, e2o: .6 },
];
function svg(c, cls) {
  const p = [];
  if (c.frame) p.push(`<path d="${c.frame}" stroke-width="2" opacity=".5" fill="none"/>`);
  p.push(`<path d="${c.s}" fill="none" stroke-width="${c.w}"/>`);
  if (c.extra) p.push(`<path d="${c.extra}" fill="none" stroke-width="${c.ew}" opacity="${c.eo ?? 1}"/>`);
  if (c.extra2) p.push(`<path d="${c.extra2}" fill="none" stroke-width="${c.e2w}" opacity="${c.e2o ?? 1}"/>`);
  return `<svg class="${cls}" viewBox="0 0 32 32" width="100%" height="100%"
    stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter">${p.join('')}</svg>`;
}
document.getElementById('g').innerHTML = C.map((c) => `
  <div class="card">
    <div class="name">${c.n}</div>
    <div class="row">
      <div class="cell"><div class="box dark sq">${svg(c)}</div><span class="cap">56 深</span></div>
      <div class="cell"><div class="box light sq">${svg(c)}</div><span class="cap">56 浅</span></div>
      <div class="cell"><div class="box dark s32">${svg(c)}</div><span class="cap">32</span></div>
      <div class="cell"><div class="box dark s16">${svg(c)}</div><span class="cap">16</span></div>
      <div class="cell"><div class="box light s16">${svg(c)}</div><span class="cap">16</span></div>
    </div>
  </div>`).join('');
</script>
</body>
</html>
