<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Traveritas">
  <!--
    阶缝 Step Seam · 梦面变体（reality-mix: 0）
    形与 favicon.svg 完全一致，只换墨色为薄暮紫，并让残影错位（对应 echo / ghost-ink 两枚令牌）。
    残影只在大尺寸（apple-touch / OG / 页内主视觉）出现；
    16px 标签栏用 favicon.svg 的那一份，只换墨色、不加残影与光晕。
    替换时机：与 title 的 data-wake / data-dream 同步（reality.ts 覆写 reality-mix 的那一帧）。
  -->
  <style>
    .main { stroke: #a195c1; }
    @media (prefers-color-scheme: light) { .main { stroke: #7f6fa8; } }
  </style>
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <g stroke="#817ba3" stroke-width="1.6" opacity=".34" transform="translate(2.4 2.4)">
      <path d="M4 6H16V12H28"/>
      <path d="M16 6V27"/>
    </g>
    <g class="main" stroke-width="4">
      <path d="M4 6H16V12H28"/>
      <path d="M16 6V27"/>
    </g>
  </g>
</svg>
