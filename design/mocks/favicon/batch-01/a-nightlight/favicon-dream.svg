<?xml version="1.0" encoding="UTF-8"?>
<!--
  夜里的光点 · 梦面 —— Traveritas 标签页图标（batch-01 / a-nightlight）
  与 favicon.svg 是同一枚：只换片色、晕的宽度、光核的软硬与色温，
  并把那根 14° 台阶线化到几乎不见（7%）。片边不再有发丝线，光漫到片的四角。

  落地：站内 reality.ts 的 onMixChange() 订阅口越过 0.5 时换 <link rel="icon"> 的 href，带一点回差。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Traveritas">
  <title>Traveritas</title>
  <defs>
    <clipPath id="t"><rect width="32" height="32" rx="8"/></clipPath>
    <radialGradient id="tile" cx="32%" cy="28%" r="98%">
      <stop offset="0" stop-color="#201830"/>
      <stop offset=".45" stop-color="#150e22"/>
      <stop offset="1" stop-color="#090711"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#e9dcf7" stop-opacity=".36"/>
      <stop offset=".28" stop-color="#c0aade" stop-opacity=".20"/>
      <stop offset=".62" stop-color="#8f7cb4" stop-opacity=".08"/>
      <stop offset="1" stop-color="#6f6193" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mid">
      <stop offset="0" stop-color="#f6effb" stop-opacity=".58"/>
      <stop offset=".5" stop-color="#d0c0e6" stop-opacity=".30"/>
      <stop offset="1" stop-color="#a694c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset=".34" stop-color="#f4edfa" stop-opacity=".94"/>
      <stop offset=".7" stop-color="#cebde5" stop-opacity=".40"/>
      <stop offset="1" stop-color="#b0a0cf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#tile)"/>
  <g clip-path="url(#t)">
    <path d="M-4 10.61h4v0.997h4v0.997h4v0.997h4v0.997h4v0.997h4v0.997h4v0.997h4v0.997h4v0.997h4v0.997h4v0.997"
          fill="none" stroke="#a6b4c6" stroke-opacity=".05" stroke-width=".55"/>
    <circle cx="12" cy="11.2" r="16" fill="url(#halo)"/>
    <circle cx="11.75" cy="10.95" r="5.4" fill="url(#mid)"/>
    <circle cx="11.5" cy="10.7" r="2.7" fill="url(#core)"/>
  </g>
</svg>
