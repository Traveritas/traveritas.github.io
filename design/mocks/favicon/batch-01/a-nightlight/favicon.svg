<?xml version="1.0" encoding="UTF-8"?>
<!--
  夜里的光点 · 醒面 —— Traveritas 标签页图标（batch-01 / a-nightlight）
  32×32，矢量，无外部资源，双击可开。

  一条 14° 的发丝台阶线斜穿夜的玻璃片，在左上那一点光那里被化掉一段；
  光核偏在左上（主页左上角那团冷光的位置），核心还往左上再偏一点，像光源在片外。

  单色退让（站内页眉 / 工具栏用，标签页不用）：整枚 currentColor 时
  退成「墨色的片 + 抠出的一点亮」——
    <svg viewBox="0 0 32 32" width="16" height="16">
      <mask id="p"><rect width="32" height="32" fill="#fff"/>
        <circle cx="11.5" cy="10.7" r="4.1" fill="url(#hole)"/></mask>
      <defs><radialGradient id="hole">
        <stop offset=".62" stop-color="#000"/><stop offset="1" stop-color="#fff"/>
      </radialGradient></defs>
      <g mask="url(#p)"><rect width="32" height="32" rx="8" fill="currentColor"/></g>
    </svg>
  注意：标签页图标是独立文档，currentColor 读不到页面的颜色，所以这份成品必须写死色值。

  16px 另有一版（见 index.html 的 #mark-w16）：去掉台阶线、晕收到 r9、核放大到 r3.1、片边提亮。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Traveritas">
  <title>Traveritas</title>
  <defs>
    <clipPath id="t"><rect width="32" height="32" rx="8"/></clipPath>
    <radialGradient id="tile" cx="34%" cy="30%" r="92%">
      <stop offset="0" stop-color="#181f2d"/>
      <stop offset=".42" stop-color="#101623"/>
      <stop offset=".78" stop-color="#0c111a"/>
      <stop offset="1" stop-color="#080b11"/>
    </radialGradient>
    <linearGradient id="step" gradientUnits="userSpaceOnUse" x1="-4" y1="10.61" x2="36" y2="20.58">
      <stop offset="0" stop-color="#a6b4c6" stop-opacity="0"/>
      <stop offset=".10" stop-color="#a6b4c6" stop-opacity=".13"/>
      <stop offset=".26" stop-color="#c3d0e0" stop-opacity=".19"/>
      <stop offset=".33" stop-color="#c3d0e0" stop-opacity=".04"/>
      <stop offset=".41" stop-color="#c3d0e0" stop-opacity="0"/>
      <stop offset=".50" stop-color="#a6b4c6" stop-opacity=".03"/>
      <stop offset=".62" stop-color="#a6b4c6" stop-opacity=".10"/>
      <stop offset=".86" stop-color="#a6b4c6" stop-opacity=".13"/>
      <stop offset="1" stop-color="#a6b4c6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#dbe6f3" stop-opacity=".30"/>
      <stop offset=".32" stop-color="#b7c7db" stop-opacity=".16"/>
      <stop offset=".64" stop-color="#8ea2bc" stop-opacity=".06"/>
      <stop offset="1" stop-color="#7d93b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mid">
      <stop offset="0" stop-color="#f0f6fb" stop-opacity=".58"/>
      <stop offset=".5" stop-color="#c9d8e9" stop-opacity=".30"/>
      <stop offset="1" stop-color="#a9bcd2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f5f9fd"/>
      <stop offset=".84" stop-color="#e2ecf6" stop-opacity=".92"/>
      <stop offset="1" stop-color="#d3dfec" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#tile)"/>
  <g clip-path="url(#t)">
    <path d="M-4 10.61h4v0.997h4v0.997h4v0.997h4v0.997h4v0.997h4v0.997h4v0.997h4v0.997h4v0.997h4v0.997h4v0.997"
          fill="none" stroke="url(#step)" stroke-width=".55"/>
    <circle cx="12" cy="11.2" r="11.5" fill="url(#halo)"/>
    <circle cx="11.75" cy="10.95" r="4.3" fill="url(#mid)"/>
    <circle cx="11.5" cy="10.7" r="2.5" fill="url(#core)"/>
  </g>
  <rect class="rim" x=".5" y=".5" width="31" height="31" rx="7.6" fill="none" stroke="#dfe7f0" stroke-opacity=".15"/>

  <!-- 深色标签栏里片的边几乎沉掉，把发丝线提亮一档（SVG 图标支持媒体查询） -->
  <style>
    @media (prefers-color-scheme: dark){
      .rim{stroke-opacity:.26}
    }
  </style>
</svg>
