<?xml version="1.0" encoding="UTF-8"?>
<!--
  夜里的光点 · 单色退让 —— batch-01 / a-nightlight
  整枚跟 currentColor 走。光晕、色温、玻璃片全不成立时，只剩两件事：一个容器，一点光。
  于是退成「墨色的片 + 抠出的一点亮」——片还在，光还在，左上角那个位置还在。

  用法：把下面的 <defs> 与 <g> 直接贴进页面（currentColor 只在同文档内继承；
  跨文档 <use href="favicon-mono.svg#m"> 在 file:// 下会被浏览器挡掉，别那样引）。
  16px 下这版比细线版更立得住：洞 r4.1 → 2px，片 16px，读作「暗片里一点亮」。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Traveritas" color="#232830">
  <title>Traveritas</title>
  <defs>
    <radialGradient id="hole">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".62" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>
    <mask id="punch">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="11.5" cy="10.7" r="4.1" fill="url(#hole)"/>
    </mask>
  </defs>
  <g id="m" mask="url(#punch)">
    <rect width="32" height="32" rx="8" fill="currentColor"/>
  </g>
</svg>
