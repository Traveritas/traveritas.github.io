<body class="bg-list">

  <div class="ave is-on is-said">
    <i class="a-lead"></i>
    <div class="a-card">
      <div class="a-portrait"><img src="./ref/faceflow.png" alt=""></div>
      <p class="a-name">Ave<i></i></p>
      <div class="a-body">
        <p class="ave-text"><span class="c on">这</span><span class="c on">边</span><span class="c on">是</span><span class="c on">断</span><span class="c on">章</span><span class="c on">，</span><span class="c on">长</span><span class="c on">一</span><span class="c on">些</span><span class="c on">的</span><span class="c on">字</span><span class="c on">都</span><span class="c on">放</span><span class="c on">在</span><span class="c on">这</span><span class="c on head">里</span><span class="a-end"><span class="c on head">。</span><span class="a-tail"><i></i><i></i><i></i></span></span></p>

      <button class="a-x">✕</button>
    </div>
  </div>
<div class="legend"><b>C · 无面之雾</b><em>没有面、没有边，只有一块边缘化到 0 的雾</em><div><i>1</i>雾：六枚不同心的径向椭圆叠出来，密度写在每枚的 stop 里，最外圈是 0</div><div><i>2</i>雾只有一层中性灰白，不加她的颜色；底图不糊、不压</div><div><i>3</i>名牌：一行小字 + 空心菱，压在雾的上缘，没有底片</div><div><i>4</i>头像槽：只剩一圈极淡的方块与半透的流光</div><div><i>5</i>× 平时 0.1，只有 hover 才认得出</div></div>
