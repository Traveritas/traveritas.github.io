<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ave 对话框材质 · D 像素场（与头像同源）</title>
<link rel="stylesheet" href="./kit.css">
<link rel="stylesheet" href="./overlay.css">
<link rel="stylesheet" href="./d-pixel.css">
</head>
<body class="bg-list">
  <div class="stage"><img class="bg" src="./ref/bg-list.png" alt=""></div>

  <div class="ave is-on is-said">
    <i class="a-lead"></i>
    <div class="a-card">
      <span class="a-field"><i></i><i></i><i></i></span>
      <div class="a-portrait"><img src="./ref/faceflow.png" alt=""></div>
      <div class="a-body">
        <p class="a-name">Ave<i></i></p>
        <p class="ave-text"><span class="c on">这</span><span class="c on">边</span><span class="c on">是</span><span class="c on">断</span><span class="c on">章</span><span class="c on">，</span><span class="c on">长</span><span class="c on">一</span><span class="c on">些</span><span class="c on">的</span><span class="c on">字</span><span class="c on">都</span><span class="c on">放</span><span class="c on">在</span><span class="c on">这</span><span class="c on head">里</span><span class="a-end"><span class="c on head">。</span><span class="a-tail"><i></i><i></i><i></i></span></span></p>
      </div>
      <button class="a-x">✕</button>
    </div>
  </div>
  <div class="legend"><b>D · 像素场</b><em>她的格从头像槽里流出来，把整句话托住</em>
    <div><i>1</i>格：5px，与头像槽同一格，锚在她槽的右上角</div>
    <div><i>2</i>场：内圈满格，往外按 Bayer 次序一格一格退掉，最后一圈散尽</div>
    <div><i>3</i>面：她的雾蓝 / 薄暮紫；没有模糊、没有描边、没有投影</div>
    <div><i>4</i>头像槽：边缘是 1–2 格的台阶，不是 1px 描边</div>
    <div><i>5</i>名牌：低对比小字 + 一颗空心菱</div></div>
</body>
</html>
