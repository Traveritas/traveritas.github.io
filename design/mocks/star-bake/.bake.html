<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>star-bake · 离线渲染</title>
<style>
  html, body { margin: 0; background: #101216; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
/* ─────────────────────────────────────────────────────────────
   离线渲染的一页：只做一件事 —— 把 Node 递过来的三角形画进画布，
   再交回一张 PNG。
   · 深度缓冲负责遮挡（这就是这一轮的全部要点）
   · 着色器不打算算光：每个三角形的调子已经由 CPU 按 Newell 法线算好、量化成四档，
     作为 attribute 送进来。GPU 只把它写成 **alpha**。
   · 所以交出去的是一张 alpha 掩码，不是一个颜色 —— 颜色留给 CSS。
   ───────────────────────────────────────────────────────────── */
import * as THREE from 'three';

/* 关掉色彩管理：这里的颜色**就是 sRGB 字节**，不做线性化往返 ——
   CSS 的 alpha 合成是在 sRGB 空间里做的，参考图也必须在同一个空间里算，比较才成立。 */
THREE.ColorManagement.enabled = false;

const cvs = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({
  canvas: cvs,
  antialias: true,          // MSAA 的 resolve 正好把边缘覆盖度摊进 alpha
  alpha: true,
  premultipliedAlpha: false,
  preserveDrawingBuffer: true,
  powerPreference: 'high-performance',
});
renderer.setPixelRatio(1);
renderer.setClearAlpha(0);
renderer.autoClear = true;

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-20, 20, 20, -20, -100, 100);
camera.position.set(0, 0, 50);
camera.lookAt(0, 0, 0);

/* alpha 掩码材质：RGB 恒为 0（墨），调子只写在 alpha 上。不混合、只靠深度缓冲。
   RGB 取 0 而不是白，是为了两件事：
     · 当 CSS mask 用时只读 alpha，RGB 是什么都无所谓；
     · 万一被当成 <img> 直接用，它叠在浅底上读出的是「墨」，不是「白」。 */
const maskMat = new THREE.ShaderMaterial({
  uniforms: {},
  vertexShader: /* glsl */`
    attribute float tone;
    varying float vTone;
    void main() {
      vTone = tone;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    varying float vTone;
    void main() {
      gl_FragColor = vec4(0.0, 0.0, 0.0, vTone);
    }`,
  transparent: true,
  blending: THREE.NoBlending,
  depthTest: true,
  depthWrite: true,
  side: THREE.DoubleSide,
});

/* 彩色参考材质：同一份几何、同一份调子，但直接算成 sRGB 颜色
   —— 用来验「alpha 掩码 × 一个色相」与「逐面真彩色」是不是同一张图 */
const colorMat = new THREE.ShaderMaterial({
  uniforms: {
    uInk: { value: new THREE.Color() },
    uGround: { value: new THREE.Color() },
  },
  vertexShader: /* glsl */`
    attribute float tone;
    varying float vTone;
    void main() {
      vTone = tone;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uInk;
    uniform vec3 uGround;
    varying float vTone;
    void main() {
      gl_FragColor = vec4(mix(uGround, uInk, vTone), 1.0);
    }`,
  transparent: false,
  depthTest: true,
  depthWrite: true,
  side: THREE.DoubleSide,
});

function makeGeom(positions, tones) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
  const t = new Float32Array(tones.length * 3);
  for (let i = 0; i < tones.length; i++) {
    t[i * 3] = tones[i];
    t[i * 3 + 1] = tones[i];
    t[i * 3 + 2] = tones[i];
  }
  g.setAttribute('tone', new THREE.BufferAttribute(t, 1));
  return g;
}

/**
 * 画一帧，返回 dataURL。
 * opts: { size, positions, tones, mode: 'mask'|'color', ink, ground, dpr }
 */
function draw(opts) {
  const { size, positions, tones, mode = 'mask', ink = '#232830', ground = '#f0f3f6', dpr = 1 } = opts;
  const px = Math.round(size * dpr);
  renderer.setSize(px, px, false);
  const k = size / 40; // 一单位 = size/40 像素
  camera.left = -20;
  camera.right = 20;
  camera.top = 20;
  camera.bottom = -20;
  camera.updateProjectionMatrix();
  /* 画布是 px×px，但取景框仍是 40 单位；相机不动，像素密度由 setSize 决定 */

  const geom = makeGeom(positions, tones);
  let mat;
  if (mode === 'color') {
    colorMat.uniforms.uInk.value.set(ink);
    colorMat.uniforms.uGround.value.set(ground);
    mat = colorMat;
  } else {
    mat = maskMat;
  }
  const mesh = new THREE.Mesh(geom, mat);
  scene.add(mesh);

  renderer.setClearColor(mode === 'color' ? new THREE.Color(ground) : 0x000000, mode === 'color' ? 1 : 0);
  renderer.clear();
  renderer.render(scene, camera);
  const url = cvs.toDataURL('image/png');

  scene.remove(mesh);
  geom.dispose();
  return url;
}

window.__bake = {
  info: () => {
    const gl = renderer.getContext();
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    return {
      webgl2: renderer.capabilities.isWebGL2,
      glVersion: gl.getParameter(gl.VERSION),
      renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
      maxSamples: gl.getParameter(gl.SAMPLES),
      depthBits: gl.getParameter(gl.DEPTH_BITS),
    };
  },
  /** frames: [{ name, positions, tones }] → [{ name, dataUrl }] */
  renderMask: (size, frames, dpr = 1) =>
    frames.map((f) => ({ name: f.name, dataUrl: draw({ size, positions: f.positions, tones: f.tones, mode: 'mask', dpr }) })),
  renderColor: (size, frames, ink, ground, dpr = 1) =>
    frames.map((f) => ({
      name: f.name,
      dataUrl: draw({ size, positions: f.positions, tones: f.tones, mode: 'color', ink, ground, dpr }),
    })),
  /** 采样一个像素（自检用：确认画布真的不是空的） */
  probe: () => ({ w: cvs.width, h: cvs.height }),
};

window.__ready = true;
</script>
</body>
</html>
