<title>方案 P5 · 回声穹骨（活体）</title>
<style>
  /* ═══ 概念 ═══
     镜头在一座「穹骨」巨构的内部下方：七道厚肋巨拱交织，没有墙、没有顶——
     说不清是穹顶的骨架、笼子，还是一座没有盖完的建筑。
     笼外的雾原上立着它的「回声」：更透明、更暖、几何走样的残影，
     极缓漂移，周期性淡出，又在别处重新凝出——世界在持续地重新回忆它。
     局部规则：入梦（滚动）时原构褪淡退后、回声变实走近（记忆比现实更近），
     穹笼缓缓合拢（拱内收、顶压低），竖排宣言被合拢的拱身真实切割。
     底盘继承：连续晕染水面着色器（调为低对比雾原）/ 三相位光循环 /
     字平面遮挡 / 性能纪律（DPR≤1.5、~30fps、无后处理、reduced-motion 静帧）。 */

  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-600-normal.woff2') format('woff2');
  }

  :root {
    --ink: #37363a;
    --ink-soft: #655f66;
    --ink-faint: #6f696f;
    --mist-ink: #5d6d80;
    --font-display: 'Noto Serif SC Web', 'Noto Serif SC', 'Palatino Linotype', Georgia, 'Songti SC', SimSun, serif;
    --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); color: var(--ink); background: #e2e0df; }

  .stage {
    position: fixed;
    inset: 0;
    overflow: clip;
    background: linear-gradient(to bottom, #dfe4e2 0%, #e6e4e0 55%, #d8d4d2 100%);
  }
  .scroll-length { height: 260vh; }  /* 首屏之外留 160vh 滚动余量 = 入梦行程 */
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .vignette {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;

  .rise { opacity: 0; transform: translateY(10px); animation: rise-in 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .rise.d1 { animation-delay: 0.15s; }
  .rise.d2 { animation-delay: 0.45s; }
  .rise.d3 { animation-delay: 0.7s; }

  .nav {

  .nav a {

  .slips { display: flex; gap: 1.2rem 1.8rem; align-items: flex-start; }
  .slip {

  }
  .slip::after {

  .slip .d { display: block; font-size: 0.72rem; letter-spacing: 0.12em; color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-bottom: 0.35rem; }

  .stage.no3d canvas#gl { display: none; }

  @media (prefers-reduced-motion: reduce) {

  }
  @media (max-width: 760px) {
    .side-note { display: none; }
    .nav { position: static; margin: 0.6rem 9vw 0; flex-direction: row; gap: 1.8rem; }
    .nav a { writing-mode: horizontal-tb; letter-spacing: 0.24em; font-size: 0.9rem; }
    .nav a::after { display: none; }
    .floating-ledger { position: static; margin: 2.8rem 9vw 8vh; }
    .slips { flex-direction: column; gap: 0.9rem; }
    .slip { width: 100%; transform: none; }
    .stage { position: relative; min-height: 100dvh; }
    .scroll-length { display: none; }
    .manifesto { position: relative; top: 0; left: 0; margin: 10vh 9vw 0; }
  }

<script src="vendor/three.min.js"></script>
<script>
/* ═══ 回声穹骨 ═══
   原构 = 七道厚肋巨拱（磨砂受光壳：半兰伯特 + 逆光透光 + 菲涅尔边缘）；
   回声 = 几何走样的残影（同语言更透明更暖，周期凝出 / 淡出 / 换位）；
   雾原 = 连续晕染着色器（继承自 J✦ 底盘，低对比雾面色板）；
   滚动 = 入梦：穹笼合拢、雾变浓、原构褪淡、回声变实走近。 */
(function () {
  if (!window.THREE) return;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var qs = {};
  location.search.replace(/[?&]([^=&]+)=([^&]*)/g, function (_, k, v) { qs[k] = decodeURIComponent(v); });
  var fastMode = 'fast' in qs;
  var stillMode = 'still' in qs;   /* 测试辅助：强制走 reduced-motion 静帧路径 */
  if (stillMode) reduceMotion = true;
  var pinScroll = 'pin' in qs ? Math.max(0, Math.min(1, parseFloat(qs.pin) || 0)) : null;
  var phaseLock = 'phase' in qs ? ((parseFloat(qs.phase) || 0) % 1 + 1) % 1 : null;
  var speed = fastMode ? 6 : 1;

  var seed = 42;
  function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  function range(a, b) { return a + rnd() * (b - a); }

  var canvas = document.getElementById('gl');
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false }); }
  catch (e) { document.getElementById('stage').classList.add('no3d'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

  var scene = new THREE.Scene();

  /* ── 三相位光循环：晨青 → 昼素 → 暮玫 →（回）晨青 ── */
  var PAL = [
    { /* 晨青 */
      wA: 0xeef1ef, wB: 0xdfe6e4, wC: 0xc2cfcd, wD: 0x93a7a8,
      dA: 0xe7e6ec, dB: 0xd6d4e0, dC: 0xb4b2c6, dD: 0x7e7c96,
      fogW: 0xdee6e3, fogD: 0xd6d4e0, hemiSky: 0xe9f0f1, hemiGnd: 0x9fb1b3,
      hemiD: 0xe2e0ea, gndD: 0x8a95a8, sun: 0xfff2e2, sunD: 0xd8cee2,
      sunI: 0.55, fill: 0xe6e2ea,
      skyTop: 0xc6d4d6, skyHor: 0xeeece6, rib: 0xe2e6e4, ghost: 0xecc9b6, glow: 0xf5c8a8,
      dream0: 0.24 },
    { /* 昼素 */
      wA: 0xf4f0e9, wB: 0xe9e1d4, wC: 0xd1c3b0, wD: 0xa2937f,
      dA: 0xece7e5, dB: 0xdbd2d2, dC: 0xbfb0b6, dD: 0x87797f,
      fogW: 0xe8e2d7, fogD: 0xdcd6d8, hemiSky: 0xf5efe3, hemiGnd: 0xb3a795,
      hemiD: 0xe4dcd8, gndD: 0x948a8a, sun: 0xfff0d0, sunD: 0xdcd2d8,
      sunI: 0.6, fill: 0xe7e0d8,
      skyTop: 0xd8d4c8, skyHor: 0xf4efe4, rib: 0xece6da, ghost: 0xe9bfa0, glow: 0xf0b98a,
      dream0: 0.2 },
    { /* 暮玫 */
      wA: 0xf2e7e5, wB: 0xe5d1cf, wC: 0xcba3a6, wD: 0x9c7480,
      dA: 0xebe5ec, dB: 0xd8cfdc, dC: 0xb6a6c2, dD: 0x7d6e88,
      fogW: 0xe6d6d5, fogD: 0xd8d2de, hemiSky: 0xf2e6e4, hemiGnd: 0xb29aa0,
      hemiD: 0xe0d6e0, gndD: 0x988ea0, sun: 0xffd9c2, sunD: 0xcdc4dc,
      sunI: 0.48, fill: 0xe2d8e2,
      skyTop: 0xc8c2d2, skyHor: 0xf2e2da, rib: 0xeadcd8, ghost: 0xeec0a8, glow: 0xf5b892,
      dream0: 0.34 }
  ];
  PAL.forEach(function (p) {
    ['wA','wB','wC','wD','dA','dB','dC','dD','fogW','fogD','hemiSky','hemiGnd','hemiD','gndD','sun','sunD','fill','skyTop','skyHor','rib','ghost','glow']
      .forEach(function (k) { p[k] = new THREE.Color(p[k]); });
  });
  var _c1 = new THREE.Color();
  function palMix(key, a, b, f) { _c1.copy(a[key]); return _c1.lerp(b[key], f); }
  function phaseMix(p) {
    p = ((p % 1) + 1) % 1;
    var seg = Math.floor(p * 3), st = p * 3 - seg;
    var f = Math.min(1, Math.max(0, (st - 0.15) / 0.7));
    f = f * f * (3 - 2 * f);
    return { a: PAL[seg], b: PAL[(seg + 1) % 3], f: f };
  }
  var fogWake = new THREE.Color(), fogDream = new THREE.Color();
  scene.background = fogWake.clone();
  scene.fog = new THREE.Fog(fogWake.clone(), 14, 66);

  var camera = new THREE.PerspectiveCamera(44, 1, 0.1, 400);

  var hemi = new THREE.HemisphereLight(0xf2efe6, 0xb0a496, 0.95);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xffe8c8, 0.55);
  sun.position.set(-4.2, 5.5, -7.5);
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0xe2dce8, 0.26);
  fill.position.set(6.5, 4.5, 3.5);
  scene.add(fill);
  var SUN_DIR = new THREE.Vector3(-0.42, 0.5, -0.76).normalize();

  /* ── 程序纹理：灰泥噪点（肋身磨砂颗粒 / 雾原共用家族） ── */
  function makeSurfTex() {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var x = c.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, 128, 128);
    var im = x.getImageData(0, 0, 128, 128);
    for (var i = 0; i < im.data.length; i += 4) {
      var v = 234 + Math.floor(rnd() * 21);
      im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
    }
    x.putImageData(im, 0, 0);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(2, 2);
    return t;
  }
  var surfTex = makeSurfTex();

  /* ── 天空穹：竖向渐变 + 朝着太阳的柔光晕（自定义着色器，不受雾） ── */
  var skyUniforms = {
    uTop: { value: new THREE.Color(0xc6d4d6) },
    uHor: { value: new THREE.Color(0xeeece6) },
    uSunDir: { value: SUN_DIR },
    uSunCol: { value: new THREE.Color(0xfff0dc) },
    uTime: { value: 0 }
  };
  var sky = new THREE.Mesh(
    new THREE.SphereGeometry(150, 32, 20),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, depthTest: false,
      uniforms: skyUniforms,
      vertexShader: [
        'varying vec3 vDir;',
        'void main() {',
        '  vDir = normalize(position);',
        '  gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0);',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform vec3 uTop; uniform vec3 uHor; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform float uTime;',
        'varying vec3 vDir;',
        'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
        'float noise(vec2 p) {',
        '  vec2 i = floor(p), f = fract(p);',
        '  vec2 u = f * f * (3.0 - 2.0 * f);',
        '  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);',
        '}',
        'void main() {',
        '  float h = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0);',
        '  vec3 col = mix(uHor, uTop, smoothstep(0.5, 0.92, h));',
        '  col = mix(col, uHor * 0.985, smoothstep(0.5, 0.38, h));',
        '  float sd = max(dot(normalize(vDir), normalize(uSunDir)), 0.0);',
        '  col += uSunCol * (pow(sd, 22.0) * 0.30 + pow(sd, 4.0) * 0.10);',
        '  float haze = noise(vec2(atan(vDir.x, vDir.z) * 2.4, vDir.y * 5.0) + uTime * 0.006);',
        '  col += (haze - 0.5) * 0.02;',
        '  gl_FragColor = vec4(col, 1.0);',
        '}'
      ].join('\n')
    })
  );
  sky.renderOrder = -1;
  scene.add(sky);

  /* ── 雾原：连续晕染着色器（J✦ 底盘原封继承，仅由色板调低对比） ── */
  var mistUniforms = {
    uTime: { value: 0 },
    uDream: { value: 0 },
    uFogColor: { value: fogWake.clone() },
    uFogNear: { value: 14.0 },
    uFogFar: { value: 66.0 },
    uWA: { value: new THREE.Color() }, uWB: { value: new THREE.Color() },
    uWC: { value: new THREE.Color() }, uWD: { value: new THREE.Color() },
    uDA: { value: new THREE.Color() }, uDB: { value: new THREE.Color() },
    uDC: { value: new THREE.Color() }, uDD: { value: new THREE.Color() }
  };
  var mist = new THREE.Mesh(
    new THREE.PlaneGeometry(190, 190, 72, 72),
    new THREE.ShaderMaterial({
      transparent: true,
      uniforms: mistUniforms,
      vertexShader: [
        'uniform float uTime;',
        'varying vec3 vWorld;',
        'varying float vNdcY;',
        'void main() {',
        '  vec4 w = modelMatrix * vec4(position, 1.0);',
        '  w.y += 0.04 * sin(w.x * 0.55 + uTime * 0.6) + 0.026 * sin(w.z * 0.4 + uTime * 0.45 + w.x * 0.2);',
        '  vWorld = w.xyz;',
        '  vec4 pr = projectionMatrix * viewMatrix * w;',
        '  vNdcY = pr.y / pr.w;',
        '  gl_Position = pr;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform float uTime;',
        'uniform float uDream;',
        'uniform vec3 uFogColor;',
        'uniform float uFogNear;',
        'uniform float uFogFar;',
        'uniform vec3 uWA; uniform vec3 uWB; uniform vec3 uWC; uniform vec3 uWD;',
        'uniform vec3 uDA; uniform vec3 uDB; uniform vec3 uDC; uniform vec3 uDD;',
        'varying vec3 vWorld;',
        'varying float vNdcY;',
        'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
        'float noise(vec2 p) {',
        '  vec2 i = floor(p), f = fract(p);',
        '  float a = hash(i), b = hash(i + vec2(1.0, 0.0)), c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));',
        '  vec2 u = f * f * (3.0 - 2.0 * f);',
        '  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);',
        '}',
        'float fbm(vec2 p) {',
        '  float v = 0.0, a = 0.5;',
        '  for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }',
        '  return v;',
        '}',
        'vec3 grad(float t, vec3 A, vec3 B, vec3 C, vec3 D) {',
        '  vec3 c = mix(A, B, smoothstep(0.0, 0.36, t));',
        '  c = mix(c, C, smoothstep(0.36, 0.64, t));',
        '  c = mix(c, D, smoothstep(0.64, 1.0, t));',
        '  return c;',
        '}',
        'void main() {',
        '  vec2 p = vWorld.xz * 0.052;',
        '  vec2 w1 = vec2(fbm(p + vec2(0.0, 3.7)), fbm(p + vec2(5.2, 0.0)));',
        '  vec2 w2 = vec2(fbm(p * 1.9 + w1 * 1.4 + vec2(1.7, 9.2)),',
        '                 fbm(p * 1.9 + w1 * 1.4 + vec2(8.3, 2.8)));',
        '  float h = fbm(p * 2.3 + w2 * 1.1 + vec2(uTime * 0.008, -uTime * 0.006));',
        '  h = h * 0.74 + 0.26 * fbm(p * 0.42 + vec2(uTime * 0.003, 0.0));',
        '  float dist = length(vWorld - cameraPosition);',
        '  float fogF = smoothstep(uFogNear, uFogFar, dist);',
        '  vec3 col = grad(h,',
        '    mix(uWA, uDA, uDream), mix(uWB, uDB, uDream),',

      a.gClose.rotation.x = a.lean + a.inward * c;    /* 微微向笼心收 */
      a.gAzi.rotation.y = a.azi + Math.sin(t * speed * 0.11 + a.ph) * a.drift;
      a.u.uFade.value = Math.min(1.15, dE * 1.15);           /* 原构明显褪向雾色 */
    }
    /* 宣言字随入梦微微下沉：竖排没入拱脚的雾里 */
    tp1.position.y = 2.6 - 1.0 * dE;
    tp2.position.y = 8.0 - 0.7 * dE;

    /* 倒拱：极缓的呼吸微倾，入梦时稍稍沉低 */
    fallenArc.holder.rotation.z = 0.42 + 0.02 * Math.sin(t * speed * 0.16 + fallenArc.ph) + 0.06 * dE;
    fallenArc.u.uFade.value = dE * 0.55;

    /* 回声：生命周期（凝出/驻留/淡出/换位）+ 入梦变实变近 */
    for (var e = 0; e < echoSlots.length; e++) {
      var s = echoSlots[e];
      var ph = ((t * speed) / s.T + s.off) % 1;
      if (s.lastPh > ph) {                            /* 一轮结束：换位重凝 */
        s.curAzi = range(-1.25, 1.25);
        s.curDist = range(26, 58);
      }
      s.lastPh = ph;
      var env = smooth01(ph / 0.14) * (1 - smooth01((ph - 0.84) / 0.16));
      if (s.lead) {
        /* lead 回声：醒时远而虚，入梦走近变实——记忆比现实更近 */
        var k = dE;
        var lx = s.baseX + (s.nearX - s.baseX) * k;
        var lz = s.baseZ + (s.nearZ - s.baseZ) * k;
        s.g.position.set(lx, 0, lz);
        s.g.scale.setScalar(s.s + (s.nearS - s.s) * k);
        var leadGhost = 0.62 - 0.4 * k;
        for (var j = 0; j < s.arcs.length; j++) {
          var la = s.arcs[j];
          la.u.uGhost.value = leadGhost;
          la.u.uAlpha.value = 0.16 + 0.3 * k;
          la.gClose.rotation.x = la.lean + la.inward * (0.2 + 0.5 * Math.sin(t * speed * 0.2 + la.ph));
          la.gAzi.rotation.y = la.azi + t * speed * 0.012;
        }
      } else {
        /* 远处回声：绕原点极缓漂移 + 生命周期呼吸 */
        s.curAzi += s.driftA * 0.033 * speed;
        var px = Math.sin(s.curAzi) * s.curDist, pz = Math.cos(s.curAzi) * s.curDist - 4;
        s.g.position.set(px, 0, pz);
        var vis = env * (0.72 + 0.5 * dE);
        for (var j2 = 0; j2 < s.arcs.length; j2++) {
          var ea = s.arcs[j2];
          ea.u.uGhost.value = 0.62;
          ea.u.uAlpha.value = (0.05 + 0.24 * vis) * s.alphaMul;
          ea.gClose.rotation.x = ea.lean + ea.inward * 0.3;
          ea.gAzi.rotation.y = ea.azi + t * speed * 0.01 * (1 + s.driftA * 4);
        }
      }
    }

    /* 尘光：缓升 + 横摆 */
    var mp = moteGeo.attributes.position;
    for (var q = 0; q < MOTES; q++) {
      var mb = moteBase[q];
      var yy = (mb.y + t * speed * mb.v) % 10.8;
      mp.setXYZ(q,
        mb.x + Math.sin(t * speed * 0.3 + mb.ph) * 0.5,
        0.3 + yy,
        mb.z + Math.cos(t * speed * 0.22 + mb.ph) * 0.4);
    }
    mp.needsUpdate = true;
    moteMat.opacity = 0.34 + 0.3 * dE;

    renderOnce();
  }
  function smooth01(x) { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); }

  function start() {
    if (running || reduceMotion) return;
    running = true; lastT = performance.now() - 40;
    rafId = requestAnimationFrame(loop);
    /* 测试辅助（?auto）：rAF 被渲染器节流时（如无头/遮挡环境）用定时器驱动 */
    if ('auto' in qs && !start.__auto) {
      start.__auto = true;
      setInterval(function () { if (!document.hidden) loop(performance.now()); }, 33);
    }
  }
  function stop() { running = false; if (rafId !== null) cancelAnimationFrame(rafId); rafId = null; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });

  if (!reduceMotion) {
    start();
    window.addEventListener('pointermove', function (e) {
      pointer.x = (e.clientX / window.innerWidth - 0.5) * 2;
      pointer.y = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });
  }
  window.addEventListener('scroll', function () { readScroll(); if (reduceMotion) renderOnce(); }, { passive: true });
  window.addEventListener('resize', onResize);

  applySeason(0.1, 0);
  onResize();
  readScroll();
  renderOnce();
  /* reduced-motion：也要给出一个静态但有内容的帧（醒态构图 + 若隐回声） */
  if (reduceMotion) {
    for (var e2 = 0; e2 < echoSlots.length; e2++) {
      var s2 = echoSlots[e2];
      for (var j3 = 0; j3 < s2.arcs.length; j3++) s2.arcs[j3].u.uAlpha.value = s2.lead ? 0.3 : 0.16;
    }
    renderOnce();
  }
})();
</script>
</body>
</html>
