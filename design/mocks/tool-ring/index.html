<!doctype html>
<html lang="zh-CN" data-ctx="home" data-pal="dawn" data-face="wake" data-view="roster">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traveritas · 环 / 罗盘</title>
<link rel="stylesheet" href="/fonts/noto/font.css">
<link rel="stylesheet" href="scene.css">
<link rel="stylesheet" href="ring.css">
<link rel="icon" href="data:,">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>

<main id="scene" aria-label="页面"></main>

<div id="veil" aria-hidden="true"></div>

<!-- 那件东西：一圈极淡的刻度环 + 十二片瓣 -->
<div id="ring" data-v="0" data-open="false">
  <!-- 花瓣玻璃的渐变：所有瓣共用一个定义。必须挂在 #ring 里面，
       否则 var(--glass-*) 会按 body 那一层解析，取不到环借来的那套夜色。
       色写在 CSS 里（表现属性不认 var()） -->
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <defs>
      <radialGradient id="petalGlass" cx="50%" cy="100%" r="112%">
        <stop class="gs0" offset="0"></stop>
        <stop class="gs1" offset="0.5"></stop>
        <stop class="gs2" offset="1"></stop>
      </radialGradient>
    </defs>
  </svg>
  <svg id="compass" viewBox="-170 -170 340 340" aria-hidden="true" focusable="false"></svg>
  <div id="petals"></div>
</div>

<!-- 瓣上张开的那片玻璃（在 #ring 之外：它按视口坐标摆，不跟着环缩放） -->
<div id="panel" role="group" aria-label="工具" hidden></div>

<!-- 常驻边缘露头 -->
<button id="peek" type="button" aria-label="唤出工具环">
  <svg viewBox="-60 -60 120 120" aria-hidden="true" focusable="false">
    <path class="pk-arc" d=""></path>
    <g class="pk-ticks"></g>
    <circle class="pk-dot" cx="0" cy="0" r="1.6"></circle>
  </svg>
  <span class="pk-tag"><b>环</b><i class="mono">RING</i></span>
</button>

<!-- 凝露光核：站内那一枚，由 ring.js 复刻并接住 -->
<div id="core-layer" aria-hidden="true"></div>

<p id="hint" class="hint">环在指针上 · 按住唤开 · <b class="mono">R</b> 唤到中央</p>

<noscript>
  <p class="nojs">这个原型需要脚本：工具是一枚长在指针上的环，静息时只是一圈极淡的刻度。</p>
</noscript>

<script src="../layout-plane/data.js"></script>
<script src="tools.js"></script>
<script src="scene.js"></script>
<script src="ring.js"></script>
</body>
</html>
