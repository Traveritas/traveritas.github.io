<!doctype html>
<html lang="zh-CN" data-scene="essay" data-view="explore">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traveritas · 拾得</title>
<link rel="stylesheet" href="/fonts/noto/font.css">
<link rel="stylesheet" href="../wander/wander.css">
<link rel="stylesheet" href="collect.css">
<link rel="icon" href="data:,">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>

<canvas id="light" aria-hidden="true"></canvas>
<canvas id="wx-back" class="wx" aria-hidden="true"></canvas>
<main id="stage" aria-label="窗"></main>
<canvas id="wx-front" class="wx" aria-hidden="true"></canvas>
<div id="heads" aria-label="版块"></div>
<div id="veil" aria-hidden="true"></div>
<div id="cx-hush" aria-hidden="true"></div>
<div id="cx-notes" aria-live="polite"></div>

<header class="chrome">
  <a class="brand" href="#" id="brand" data-ink>Traveritas</a>
  <nav class="scenes" aria-label="场景" data-ink>
    <button type="button" data-scene="essay" aria-pressed="true">随笔</button>
    <button type="button" data-scene="moment" aria-pressed="false">瞬间</button>
    <button type="button" data-scene="project" aria-pressed="false">项目</button>
  </nav>
  <div class="views" role="group" aria-label="视图" data-ink>
    <button type="button" data-view="explore" title="漫游（V）"><svg viewBox="0 0 18 14" aria-hidden="true"><rect x="1" y="2" width="6" height="4"/><rect x="10" y="1" width="4" height="3" opacity=".55"/><rect x="5" y="8.5" width="8" height="4.5"/></svg><span>漫游</span></button>
    <button type="button" data-view="grid" title="检索（V）"><svg viewBox="0 0 18 14" aria-hidden="true"><path d="M5.2 1 3.2 13M10 1 8 13M14.8 1 12.8 13"/></svg><span>检索</span></button>
  </div>
</header>

<!-- 拾得：正式版挂进左下的六芒星轨道，原型里先放一个小口袋 -->
<button type="button" id="cx-pocket" data-ink aria-haspopup="dialog" aria-expanded="false">
  <svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1"><circle cx="10" cy="10" r="3"/><circle cx="10" cy="10" r="7.5" stroke-dasharray="1.2 2.4"/></g></svg>
  <span>拾得</span><b id="cx-count">0</b>
</button>
<section id="cx-panel" role="dialog" aria-label="拾得" hidden>
  <header><h2>拾得</h2><button type="button" class="cx-x" aria-label="收起">×</button></header>
  <ol id="cx-list"></ol>
  <footer>
    <button type="button" id="cx-export">导出</button>
    <button type="button" id="cx-import">导入</button>
    <textarea id="cx-code" rows="3" spellcheck="false" hidden></textarea>
  </footer>
</section>
<aside id="cx-dev" hidden></aside>

<noscript><p class="nojs">这个原型需要脚本。</p></noscript>

<script src="../layout-plane/data.js"></script>
<script src="../wander/light.js"></script>
<script src="../wander/weather.js"></script>
<script src="../wander/faces.js"></script>
<script src="../wander/reader.js"></script>
<script src="../wander/wander.js"></script>
<script src="items.js"></script>
<script src="ornament.js"></script>
<script src="shells.js"></script>
<script src="collect.js"></script>
</body>
</html>
