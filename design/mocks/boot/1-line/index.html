<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>开屏 mock 1 · 一线先醒</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/fonts/noto/font.css" />
    <link rel="stylesheet" href="/fonts/plex/400.css" />
    <style>
      :root {
        --font-display: 'Noto Serif SC', 'Palatino Linotype', 'Iowan Old Style', Palatino,
          Georgia, serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas,
          'Microsoft YaHei UI', monospace;
        --amber: #9a86c4;
        --night: #0e0f1d;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--night);
      }
      body {
        overflow: hidden;
      }

      /* ── 首帧之前：只在 JS 已经起来的那一瞬把假首页藏住（data-boot=pre 由 <head> 里的
         内联脚本落地；无 JS 时这个属性永远不会出现 ⇒ 直接是首页静置的样子，不会留死幕） ── */
      html[data-boot='pre'] #home {
        opacity: 0;
        pointer-events: none;
      }
      /* 减动效 / 首访之外：整层不显示，也不参与合成 */
      html[data-boot='skip'] #boot {
        display: none;
      }

      /* ── 开屏层 ──────────────────────────────────────────────────────────
         只叠三样东西：一颗微点、两个沿 14° 跑的光头、一条拉亮的直线，
         外加一层极大的弱光晕。全部由 JS 写 transform / opacity，没有一处 @keyframes，
         所以 __boot.seek 能把它确定地推到任意一毫秒。 */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 6;
        overflow: hidden;
        pointer-events: none;
        contain: paint;
      }
      #boot > i {
        position: absolute;
        display: block;
      }

      /* 醒点：正中一颗极小的冷白核。它先亮，然后交出两个头 */
      .b-seed {
        left: 50%;
        top: 50%;
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #fdfbff 0%,
          rgb(238 232 250 / 0.92) 26%,
          rgb(190 180 226 / 0.34) 58%,
          transparent 78%
        );
        box-shadow:
          0 0 26px rgb(206 196 240 / 0.55),
          0 0 74px rgb(150 140 200 / 0.3);
        scale: 0.34;
        opacity: 0.3;
      }

      /* 光晕：极大、极弱，只在中心把靛夜「提亮一档」，不是蒙在字上的雾 */
      .b-wash {
        left: 50%;
        top: 50%;
        width: 150vmax;
        height: 150vmax;
        margin: -75vmax 0 0 -75vmax;
        background: radial-gradient(
          circle,
          rgb(160 152 202 / 0.2) 0%,
          rgb(120 114 165 / 0.1) 30%,
          transparent 60%
        );
        opacity: 0;
      }

      /* 那一线本身：300vmax 长的发丝，亮在正中 56%，两端早早淡掉。
         露出量写成 scaleX ⇒ 光带从中心往外长，和首页那条线从中心画出去的节奏同构。 */
      .b-ax {
        left: 50%;
        top: 50%;
        width: 300vmax;
        height: 1.2px;
        margin: -0.6px 0 0 -150vmax;
        rotate: 14deg;
        scale: 0.0001 1;
        background: linear-gradient(
          90deg,
          transparent 18%,
          rgb(214 206 240 / 0.1) 22%,
          rgb(246 242 255 / 0.66) 46.5%,
          rgb(250 247 255 / 0.8) 50%,
          rgb(246 242 255 / 0.66) 53.5%,
          rgb(214 206 240 / 0.1) 78%,
          transparent 82%
        );
        opacity: 0.95;
      }

      /* 光头：0×0 的锚点，JS 只写它的 translate（沿 14° 的屏幕坐标），子元素负责外形。
         珠子是一小片磨砂树脂的感觉：亮核 + 一圈很软的冷紫边，不加 blur（全屏以外也不必要） */
      .b-tip {
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        opacity: 0;
      }
      .b-tip > i {
        position: absolute;
        display: block;
      }
      .b-halo {
        left: 0;
        top: 0;
        width: 74px;
        height: 74px;
        margin: -37px 0 0 -37px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgb(214 206 242 / 0.26) 0%,
          rgb(170 160 215 / 0.1) 38%,
          transparent 68%
        );
      }
      .b-bead {
        left: 0;
        top: 0;
        width: 15px;
        height: 15px;
        margin: -7.5px 0 0 -7.5px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 42% 38%,
          #fff 0%,
          rgb(246 242 255 / 0.95) 22%,
          rgb(206 197 238 / 0.55) 52%,
          rgb(160 150 205 / 0.12) 76%,
          transparent 86%
        );
        box-shadow:
          0 0 18px rgb(206 197 240 / 0.7),
          0 0 46px rgb(150 140 200 / 0.34);
      }
      /* 拖尾：200px 的极细光带，亮的一端贴着头，另一端化进夜里。
         右行头的尾在头的左后方（局部 −x 转过 14°，右端正好落在锚点上）；
         左行头翻过来。 */
      .b-trail {
        left: 0;
        top: -0.6px;
        width: 200px;
        height: 1.2px;
      }
      .b-tip-r .b-trail {
        transform: rotate(14deg) translateX(-200px);
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgb(226 219 244 / 0.02) 26%,
          rgb(226 219 244 / 0.5) 86%,
          rgb(248 244 255 / 0.95) 100%
        );
      }
      .b-tip-l .b-trail {
        transform: rotate(14deg);
        background: linear-gradient(
          90deg,
          rgb(248 244 255 / 0.95) 0%,
          rgb(226 219 244 / 0.5) 14%,
          rgb(226 219 244 / 0.02) 74%,
          transparent 100%
        );
      }

      /* ── 对假首页的窄屏修正（共享文件 _shared/home-fragment.html 只读，不改；只在本地覆写）──
         共享片段把 EEG 画在固定的 1440×900 盒子里再用 preserveAspectRatio="none" 拉满屏，
         竖屏下横纵缩放差 3.5 倍 ⇒ 14° 会被拉成 ~41°，直接穿过大字与第一个栏头。
         这里把盒子按等比重排（宽 = 1.6 × 高，水平居中）：viewBox 的中心仍落在屏幕中心，
         线就回到真正的 14°。顺带把窄屏三个栏头挪到线下（真首页的算法：lineY(x+300)+30+k·46）。 */
      @media (max-width: 899px) {
        #home .h-eeg {
          left: 0;
          right: 0;
          width: calc(100vh * 1.6);
          height: 100vh;
          margin: 0 auto;
        }
        #home .h-entries .h-entry:nth-child(1) {
          top: calc(50vh + (min(100vw - 22px, 300px) - 50vw) * 0.2493 + 30px);
        }
        #home .h-entries .h-entry:nth-child(2) {
          top: calc(50vh + (min(100vw - 22px, 300px) - 50vw) * 0.2493 + 76px);
        }
        #home .h-entries .h-entry:nth-child(3) {
          top: calc(50vh + (min(100vw - 22px, 300px) - 50vw) * 0.2493 + 122px);
        }
      }
    </style>
    <script>
      /* 首帧之前就决定要不要放：放 ⇒ 先把假首页藏住，等开屏自己把它一处处点亮；
         不放（减动效）⇒ 直接首页。JS 起来但开屏脚本挂了，3s 后兜底揭幕，不留死幕。 */
      (function () {
        var r = document.documentElement;
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          r.dataset.boot = 'skip';
          return;
        }
        r.dataset.boot = 'pre';
        setTimeout(function () {
          if (r.dataset.boot === 'pre') r.removeAttribute('data-boot');
        }, 3000);
      })();
    </script>
  </head>

  <body>
    <!-- ─────────────────────────────────────────────────────────────
         假首页 · 交接标的（整块复制进你 index.html 的 <body> 末尾，别改 _shared 本身）

         这不是真首页，只还原「一眼认出」的那几件：
           靛夜底 + 像素化的流光（静态，一层底图 + 网点）+ 一根 14° 波形线
           + 左上小字与大字 + 线下三个栏头 + 左下时刻 + 右下出口 + 底部「下沉」。
         大字按站里的做法是「流光的一扇反相窗」——这里用 backdrop-filter 近似，
         效果对得上就够了；真首页是 canvas 反相 + 字形遮罩。

         它自带 window.HomeMock 三个旋钮，给你的开屏调用：
           HomeMock.line(0..1)       脑电线「从中心往两端画出」的进度（0 = 一个点都没有）
           HomeMock.focus(0..1)      大字的对焦（0 = blur 14px + 透明，1 = 清楚）
           HomeMock.pixels(px)       流光底图的一个粗颗粒提示（1 = 不粗，8 = 很粗）——
                                     只在你想「从粗到细」时用；不用就一直是 1
         不调也行：默认 line=1 focus=1 pixels=1，即首页静置的样子。
         若你的开屏完全接管了入场，就在自己的时间轴里调它们，别让两段各演一遍。
         ───────────────────────────────────────────────────────────── -->

    <div id="home" aria-label="首页（假）">

      </svg>

      <div class="h-head">
        <p class="h-kicker">个人网站</p>
        <h1 class="h-brand">Traveritas</h1>
      </div>

      <div class="h-entries">
        <a href="#" class="h-entry"><i></i><span class="no">01</span><b>断章</b><em>ESSAYS</em></a>
        <a href="#" class="h-entry"><i></i><span class="no">02</span><b>闪念</b><em>MOMENTS</em></a>
        <a href="#" class="h-entry"><i></i><span class="no">03</span><b>造物</b><em>PROJECTS</em></a>
      </div>

      <p class="h-clock">21:34 · 2026.10.18</p>
      <nav class="h-exits"><a href="#">GitHub</a><a href="#">RSS</a><a href="#">◇ NEXUS</a></nav>
      <p class="h-hint">下沉<i></i></p>
    </div>

    <style>
      /* 只在你自己的 index.html 里用；类名都带 h- 前缀，不会撞到开屏自己的样式 */
      #home {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: #0e0f1d;
        color: #ece8f2;
        --hx: 8vw;
        --tan14: 0.249328;
        font-family: var(--font-display, 'Noto Serif SC', serif);
      }

      /* 流光：三池夜色 + 一层网点（真站是 1/5 分辨率上采样的像素流光，这里用叠色近似） */
      .h-flow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(58vw 46vw at 6% 18%, #b9c2cf 0%, rgb(185 194 207 / 0.55) 34%, transparent 68%),
          radial-gradient(46vw 40vw at 46% 62%, rgb(29 23 41 / 0.9) 0%, transparent 70%),
          radial-gradient(50vw 44vw at 88% 78%, rgb(13 21 36 / 0.95) 0%, transparent 72%),
          radial-gradient(70vw 60vw at 70% 10%, rgb(40 36 64 / 0.7) 0%, transparent 70%),
          #0e0f1d;
        filter: saturate(0.92);
        transition: filter 0.4s linear;
      }
      .h-flow::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, rgb(236 232 242 / 0.1) 0 1px, transparent 1.2px);
        background-size: 5px 5px;
        opacity: 0.5;
      }

      .h-eeg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      .h-head {
        position: absolute;
        left: var(--hx);
        bottom: calc(50vh + (50vw - var(--hx)) * var(--tan14) + 22px);
      }
      .h-kicker {
        margin: 0 0 1.05rem 0.2em;
        font: 500 13px/1 var(--font-display, serif);
        letter-spacing: 0.62em;
        color: #9a97b0;
      }
      .h-brand {
        margin: 0;
        font: 500 clamp(54px, 7.4vw, 128px)/0.86 var(--font-display, serif);
        letter-spacing: 0.035em;
        color: #f1edf6;
        white-space: nowrap;
        /* 真站里大字是「流光的一扇反相窗」（canvas 反相 + 字形遮罩）。
           这里不真的反相：backdrop-filter 的矩形会把字周围切出一块亮板，反而失真。
           写成一块偏冷、略透明的浅字，近似它被流光照亮的样子就够。 */
        color: #eef0f7;
      }

      .h-entries {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .h-entries .h-entry {
        position: absolute;
        display: flex;
        align-items: baseline;
        gap: 10px;

        color: #e6e2ee;
        transition: letter-spacing 0.5s ease;
      }
      /* 三个栏头挂在线下：左右位置对应将来三栏的位置，纵向跟着那根 14° 线走 */
      .h-entries .h-entry:nth-child(1) { left: 33vw; top: calc(50vh + (33vw - 50vw) * var(--tan14) + 30px); }
      .h-entries .h-entry:nth-child(2) { left: 52vw; top: calc(50vh + (52vw - 50vw) * var(--tan14) + 46px); }
      .h-entries .h-entry:nth-child(3) { left: 71vw; top: calc(50vh + (71vw - 50vw) * var(--tan14) + 62px); }
      .h-entry i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #9a86c4;
        box-shadow: 0 0 10px 1px #9a86c4;
        align-self: center;
      }
      .h-entry .no { font: italic 400 13px/1 var(--font-display, serif); letter-spacing: 0.08em; color: #8d8aa3; }
      .h-entry b { font: 600 19px/1 var(--font-display, serif); letter-spacing: 0.34em; }
      .h-entry em { font: normal 400 9px/1 var(--font-mono, monospace); letter-spacing: 0.3em; color: #8d8aa3; }
      .h-entry:hover b { letter-spacing: 0.44em; }

      .h-clock,
      .h-exits {
        position: absolute;
        bottom: 26px;
        margin: 0;
        font: 400 10px/1 var(--font-mono, monospace);
        letter-spacing: 0.18em;
        color: #827f98;
      }
      .h-clock { left: var(--hx); }
      .h-exits { right: 7vw; display: flex; gap: 22px; }
      .h-exits a { color: inherit; text-decoration: none; }

      .h-hint {
        position: absolute;
        left: 50%;
        bottom: 22px;
        margin: 0;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        font: 500 11px/1 var(--font-display, serif);
        letter-spacing: 0.6em;

        color: #827f98;
      }
      .h-hint i { width: 1px; height: 26px; background: linear-gradient(rgb(236 230 244 / 0.5), transparent); }

      @media (max-width: 899px) {
        #home { --hx: 22px; }
        .h-brand { font-size: clamp(44px, 13vw, 72px); }
        .h-kicker { font-size: 12px; margin-bottom: 0.8rem; }
        .h-entries .h-entry:nth-child(1) { left: 22px; top: calc(50vh - 30px); }
        .h-entries .h-entry:nth-child(2) { left: 22px; top: calc(50vh + 16px); }
        .h-entries .h-entry:nth-child(3) { left: 22px; top: calc(50vh + 62px); }
        .h-clock { display: none; }
        .h-exits { right: 22px; }
      }
    </style>

    <script>
      window.HomeMock = (() => {
        const flow = document.querySelector('#home .h-flow');
        const brand = document.querySelector('#home .h-brand');
        const path = document.getElementById('h-eeg-path');
        const W = 1440, H = 900, TAN = Math.tan((14 * Math.PI) / 180);
        let reveal = 1, focus = 1, px = 1;
        /* 14° 轴上的波形线：整条线 = 视口对角线那么长，按 reveal 从中心往两端露出 */
        function draw() {
          const half = Math.hypot(W, H) / 2 + 40;
          const n = 220;
          let d = '';
          let last = null;
          for (let i = 0; i <= n; i++) {
            const s = i / n;
            const t = (s * 2 - 1) * half; // 沿线坐标
            const x = W / 2 + Math.cos(Math.atan(TAN)) * t;
            const y = H / 2 + Math.sin(Math.atan(TAN)) * t;
            const wob = 3.6 * (Math.sin(t * 0.5 + performance.now() / 2000) * 0.6 + Math.sin(t * 1.9) * 0.4);
            const ox = -Math.sin(Math.atan(TAN)) * wob;
            const oy = Math.cos(Math.atan(TAN)) * wob;
            const p = [x + ox, y + oy];
            d += (last ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
            last = p;
          }
          path.setAttribute('d', d);
          // 从中心往两端露：用线性渐变的遮罩近似（左半 + 右半各露 reveal 的一半）
          const m = `linear-gradient(90deg, transparent ${50 - reveal * 50}%, #000 ${50 - reveal * 50}%, #000 ${50 + reveal * 50}%, transparent ${50 + reveal * 50}%)`;
          path.style.maskImage = m;
          path.style.webkitMaskImage = m;
        }
        let raf = 0;
        const loop = () => { draw(); raf = requestAnimationFrame(loop); };
        loop();
        return {
          line(v) { reveal = v; draw(); },
          focus(v) { focus = v; brand.style.filter = v >= 1 ? '' : `blur(${((1 - v) * 14).toFixed(2)}px)`; brand.style.opacity = String(v); },
          pixels(v) {
            px = v;
            // 粗颗粒提示：把底图按倍数放大再裁回去（等价于降采样），真站是 1/5 分辨率 canvas
            if (v <= 1) { flow.style.transform = ''; flow.style.filter = 'saturate(0.92)'; return; }
            flow.style.transform = `scale(${v.toFixed(2)})`;
            flow.style.transformOrigin = '50% 45%';
            flow.style.filter = `saturate(0.92) blur(${(v * 0.6).toFixed(2)}px)`;
          },
          stop() { if (raf) cancelAnimationFrame(raf); raf = 0; },
        };
      })();
    </script>

    <!-- 开屏层：一颗点 → 一条线 → 一片光 → 一个字 → 三扇门 -->
    <div id="boot" aria-hidden="true">
      <i class="b-wash"></i>
      <i class="b-ax"></i>
      <i class="b-seed"></i>
      <i class="b-tip b-tip-r"><i class="b-trail"></i><i class="b-halo"></i><i class="b-bead"></i></i>
      <i class="b-tip b-tip-l"><i class="b-trail"></i><i class="b-halo"></i><i class="b-bead"></i></i>
    </div>

    <script>
      /* ══ 一线先醒 ══════════════════════════════════════════════════════════
         不另起一层「开屏画面」再撤掉。开屏做的只是：把首页本来就有的那几个旋钮
         （线的画出量、大字的对焦、流光的粗颗粒、四处字的显隐）从 0 一路推到 1，
         然后交还。所以最后一帧不是「看起来像首页」，就是首页静置的样子。

         甲 0–190      醒点：正中一颗微点先亮
         乙 130–840    醒线：两个光头沿 14° 从中心跑向两端，线在它们身后拉出来
         丙 210–1030   流光：从粗颗粒（scale 9）逐级收到本体，底下的夜色一点点浮上来
         丁 600–1500   名字对这焦：blur 14px → 0
         戊 960–1680   三扇门：01/02/03 依次落位（各 95ms 错开，400ms 落定）
         己 1300–1860  时刻 / 出口 / 下沉 收尾
         庚 2000       交还：开屏层撤掉，只剩站自己的那条会呼吸的线

         全部时间轴写在 JS 里，没有一处 @keyframes —— seek(ms) 能确定地停在任何一毫秒。 */
      (function () {
        var root = document.documentElement;
        var home = document.getElementById('home');
        var boot = document.getElementById('boot');
        var HM = window.HomeMock;
        var TOTAL = 2000;
        var COS = Math.cos((14 * Math.PI) / 180);
        var SIN = Math.sin((14 * Math.PI) / 180);

        var one = function (s, r) { return (r || home).querySelector(s); };
        var all = function (s) { return Array.prototype.slice.call(home.querySelectorAll(s)); };

        var E = {
          seed: one('.b-seed', boot),
          wash: one('.b-wash', boot),
          ax: one('.b-ax', boot),
          tipR: one('.b-tip-r', boot),
          tipL: one('.b-tip-l', boot),
          flow: one('.h-flow'),
          kicker: one('.h-kicker'),
          entries: all('.h-entry'),
          clock: one('.h-clock'),
          exits: one('.h-exits'),
          hint: one('.h-hint'),
          entriesBox: one('.h-entries'),
        };
        E.dots = E.entries.map(function (n) { return n.querySelector('i'); });

        var clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
        var seg = function (t, a, b) { return clamp01((t - a) / (b - a)); };
        var outC = function (p) { return 1 - Math.pow(1 - p, 3); };
        var outQ = function (p) { return 1 - Math.pow(1 - p, 5); };
        var inOutC = function (p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };

        /* 两个光头沿轴能走多远：到左右边缘再多走一点，让它们走出画 */
        var REACH = 0;
        function measure() {
          REACH = (Math.min(innerWidth, innerHeight * 1.6) / 2 + 80) / COS;
        }
        measure();
        addEventListener('resize', measure);

        /* 一档「浮上来」：位移 9px → 0，同时淡入。位移写在 translate 上，走合成器 */
        function rise(node, p, dist) {
          node.style.opacity = p.toFixed(3);
          node.style.translate = '0 ' + ((1 - p) * (dist || 8)).toFixed(1) + 'px';
        }

        function rest() {
          [E.flow, E.kicker, E.clock, E.exits, E.hint].forEach(function (n) { n.style.cssText = ''; });
          E.entries.forEach(function (n) { n.style.cssText = ''; });
          E.dots.forEach(function (n) { n.style.cssText = ''; });
          E.entriesBox.style.pointerEvents = '';
          if (HM) { HM.line(1); HM.focus(1); HM.pixels(1); }
          boot.style.display = 'none';
        }

        function apply(t) {
          if (t >= TOTAL) { rest(); return; }
          boot.style.display = '';
          E.entriesBox.style.pointerEvents = t >= 1300 ? '' : 'none';

          /* 甲 · 醒点 */
          var seedIn = outC(seg(t, 0, 190));
          var seedOut = inOutC(seg(t, 300, 620));
          E.seed.style.scale = (0.34 + 0.66 * seedIn).toFixed(3);
          E.seed.style.opacity = ((0.3 + 0.7 * seedIn) * (1 - seedOut)).toFixed(3);

          /* 乙 · 一线（头略早于线，线跟在头后面半步） */
          var front = outQ(seg(t, 130, 780));
          var reveal = outQ(seg(t, 170, 840));
          var hop = outC(seg(t, 110, 300)) * (1 - inOutC(seg(t, 630, 940)));
          var d = front * REACH;
          var dx = (d * COS).toFixed(2);
          var dy = (d * SIN).toFixed(2);
          E.tipR.style.translate = dx + 'px ' + dy + 'px';
          E.tipL.style.translate = '-' + dx + 'px -' + dy + 'px';
          E.tipR.style.opacity = E.tipL.style.opacity = hop.toFixed(3);
          /* 拖尾在起步时先短一截，免得一开场就是一根 200px 的棍子 */
          var tail = (0.25 + 0.75 * outC(seg(t, 130, 320))).toFixed(3);
          E.tipR.style.scale = E.tipL.style.scale = tail + ' 1';
          E.ax.style.scale = Math.max(0.0001, reveal).toFixed(4) + ' 1';
          E.ax.style.opacity = (0.95 * (1 - inOutC(seg(t, 690, 1160)))).toFixed(3);

          /* 丙 · 流光从粗到细；光晕在中心提一档再退下去 */
          E.flow.style.opacity = outC(seg(t, 210, 980)).toFixed(3);
          if (HM) HM.pixels(9 - 8 * inOutC(seg(t, 200, 1030)));
          E.wash.style.opacity =
            (0.9 * outC(seg(t, 140, 700)) * (1 - inOutC(seg(t, 860, 1420)))).toFixed(3);

          /* 丁 · 名字对这焦；线的交出量同步给首页自己那条 */
          if (HM) {
            HM.focus(outC(seg(t, 600, 1500)));
            HM.line(reveal);
          }
          rise(E.kicker, outC(seg(t, 880, 1320)), 6);

          /* 戊 · 三扇门 */
          E.entries.forEach(function (node, i) {
            var st = 960 + i * 95;
            var p = outC(seg(t, st, st + 400));
            rise(node, p, 9);
            /* 先是一粒放大的点（2.4×），随后收成 1 */
            E.dots[i].style.scale = (1 + 1.4 * (1 - p)).toFixed(3);
          });

          /* 己 · 时刻 / 出口 / 下沉 */
          rise(E.clock, outC(seg(t, 1300, 1700)), 6);
          rise(E.exits, outC(seg(t, 1350, 1740)), 6);
          rise(E.hint, outC(seg(t, 1420, 1820)), 6);
        }

        /* ── 时钟 ── */
        var t = 0;
        var t0 = 0;
        var frozen = -1;
        var raf = 0;

        function frame(now) {
          if (frozen >= 0) return;
          t = now - t0;
          if (t >= TOTAL) { apply(TOTAL); return; }
          apply(t);
          raf = requestAnimationFrame(frame);
        }

        apply(0);
        root.removeAttribute('data-boot');
        t0 = performance.now();
        raf = requestAnimationFrame(frame);

        window.__boot = {
          ready: false,
          pause: function () {
            if (frozen >= 0) return;
            cancelAnimationFrame(raf);
            frozen = t;
          },
          seek: function (ms) {
            cancelAnimationFrame(raf);
            t = Math.max(0, Math.min(TOTAL, +ms || 0));
            frozen = t;
            apply(t);
          },
          resume: function () {
            if (frozen < 0) return;
            frozen = -1;
            if (t >= TOTAL) return;
            t0 = performance.now() - t;
            raf = requestAnimationFrame(frame);
          },
        };
        document.fonts.ready.then(function () { window.__boot.ready = true; });
      })();
    </script>
  </body>
</html>
