    <style>
      :root {
        --font-display: 'Noto Serif SC', 'Songti SC', 'Times New Roman', serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', monospace;

        overflow: hidden;

      /* 流光的画布：像素化上采样，一块 = 5 屏 px */
      #bootface {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        pointer-events: none;
      }
      /* 5px 网点：和首页 .h-flow::after 是同一张网点。它从第一帧就在，
         整条时间轴就是让马赛克一级级收到这张网的格子上 */
      .boot-dot {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(circle, rgb(236 232 242 / 0.1) 0 1px, transparent 1.2px);
        background-size: 5px 5px;
        opacity: 0.5;
      }

      /* 不放（reduced-motion / 无 JS）时不许留死幕 */
      html[data-boot-skip] #bootface,
      html[data-boot-skip] .boot-dot {
        display: none;
      }
    </style>
    <script>
      /* 首帧前就定好，免得先闪一帧粗马赛克 */
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.dataset.bootSkip = '';
      }
    </script>

    <!-- ─────────────────────────────────────────────────────────────
     假首页 · 交接标的（整块复制进你 index.html 的 <body> 末尾，别改 _shared 本身）

     这不是真首页，只还原「一眼认出」的那几件：
       靛夜底 + 像素化的流光（静态，一层底图 + 网点）+ 一根 14° 波形线
       + 左上小字与大字 + 线下三个栏头 + 左下时刻 + 右下出口 + 底部「下沉」。
     大字按站里的做法是「流光的一扇反相窗」——这里用 backdrop-filter 近似，
     效果对得上就够了；真首页是 canvas 反相 + 字形遮罩。

     它自带 window.HomeMock 三个旋钮，给你的开屏调用：
       HomeMock.line(0..1)       脑电线「从中心往两端画出」的进度（0 = 一个点都没有）
       HomeMock.focus(0..1)      大字的对焦（0 = blur 14px + 透明，1 = 清楚）
       HomeMock.pixels(px)       流光底图的一个粗颗粒提示（1 = 不粗，8 = 很粗）——
                                 只在你想「从粗到细」时用；不用就一直是 1
     不调也行：默认 line=1 focus=1 pixels=1，即首页静置的样子。
     若你的开屏完全接管了入场，就在自己的时间轴里调它们，别让两段各演一遍。
     ───────────────────────────────────────────────────────────── -->

    <style>
      /* 只在你自己的 index.html 里用；类名都带 h- 前缀，不会撞到开屏自己的样式 */
      #home {

        inset: 0;
        z-index: 0;
        overflow: hidden;

      /* 流光：三池夜色 + 一层网点（真站是 1/5 分辨率上采样的像素流光，这里用叠色近似） */
      .h-flow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(58vw 46vw at 6% 18%, #b9c2cf 0%, rgb(185 194 207 / 0.55) 34%, transparent 68%),
          radial-gradient(46vw 40vw at 46% 62%, rgb(29 23 41 / 0.9) 0%, transparent 70%),
          radial-gradient(50vw 44vw at 88% 78%, rgb(13 21 36 / 0.95) 0%, transparent 72%),
          radial-gradient(70vw 60vw at 70% 10%, rgb(40 36 64 / 0.7) 0%, transparent 70%),
          #0e0f1d;
        filter: saturate(0.92);

      }
      .h-flow::after {

        position: absolute;

      .h-eeg {
        position: absolute;

      .h-head {
        position: absolute;
        left: var(--hx);

    <script>
      window.HomeMock = (() => {
        const flow = document.querySelector('#home .h-flow');
        const brand = document.querySelector('#home .h-brand');
        const path = document.getElementById('h-eeg-path');
        const W = 1440, H = 900, TAN = Math.tan((14 * Math.PI) / 180);
        let reveal = 1, focus = 1, px = 1;
        /* 14° 轴上的波形线：整条线 = 视口对角线那么长，按 reveal 从中心往两端露出 */
        function draw() {
          const half = Math.hypot(W, H) / 2 + 40;
          const n = 220;
          let d = '';
          let last = null;
          for (let i = 0; i <= n; i++) {
            const s = i / n;
            const t = (s * 2 - 1) * half; // 沿线坐标
            const x = W / 2 + Math.cos(Math.atan(TAN)) * t;
            const y = H / 2 + Math.sin(Math.atan(TAN)) * t;
            const wob = 3.6 * (Math.sin(t * 0.5 + performance.now() / 2000) * 0.6 + Math.sin(t * 1.9) * 0.4);
            const ox = -Math.sin(Math.atan(TAN)) * wob;
            const oy = Math.cos(Math.atan(TAN)) * wob;
            const p = [x + ox, y + oy];
            d += (last ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
            last = p;
          }
          path.setAttribute('d', d);
          // 从中心往两端露：用线性渐变的遮罩近似（左半 + 右半各露 reveal 的一半）
          const m = `linear-gradient(90deg, transparent ${50 - reveal * 50}%, #000 ${50 - reveal * 50}%, #000 ${50 + reveal * 50}%, transparent ${50 + reveal * 50}%)`;
          path.style.maskImage = m;
          path.style.webkitMaskImage = m;
        }
        let raf = 0;
        const loop = () => { draw(); raf = requestAnimationFrame(loop); };
        loop();
        return {
          line(v) { reveal = v; draw(); },
          focus(v) { focus = v; brand.style.filter = v >= 1 ? '' : `blur(${((1 - v) * 14).toFixed(2)}px)`; brand.style.opacity = String(v); },
          pixels(v) {
            px = v;
            // 粗颗粒提示：把底图按倍数放大再裁回去（等价于降采样），真站是 1/5 分辨率 canvas
            if (v <= 1) { flow.style.transform = ''; flow.style.filter = 'saturate(0.92)'; return; }
            flow.style.transform = `scale(${v.toFixed(2)})`;
            flow.style.transformOrigin = '50% 45%';
            flow.style.filter = `saturate(0.92) blur(${(v * 0.6).toFixed(2)}px)`;
          },
          stop() { if (raf) cancelAnimationFrame(raf); raf = 0; },
        };
      })();
    </script>

    <script>
      /* ══════════════════════════════════════════════════════════════════════════
         开屏 · 从粗到细

         一片流光（简化版 light.js：fbm 噪声 → 4 色域上色 → 量化 + Bayer 抖动），
         画在 1/5 分辨率的 2D 画布上、由 CSS 像素化放大。整条开屏就是这片流光
         「一级一级变细」：格 48 → 24 → 13 → 8 → 5 屏 px，量化阶 3 → 26。
         三级以前它是一张马赛克，五级时它正好落到首页那张 5px 网点上，
         然后画布把画面交还给首页自己的 .h-flow —— 最后一帧就是首页静置的样子。

         时间轴全在 JS 里（没有 CSS @keyframes），所以 seek(ms) 是确定的。
         ══════════════════════════════════════════════════════════════════════════ */
      (function () {
        'use strict';

        const SKIP = document.documentElement.dataset.bootSkip !== undefined;
        const PX = 5; // 画布分辨率：1 画布像素 = 5 屏 px（真站同款）
        const END = 2020;

        /* ── 四级细化 ── 每级先合拢 RAMP 毫秒，再停住让人看清 */
        const LV = [
          { at: 0, cell: 48, lv: 3, oct: 2 }, // 0 粗起：48px 一格、只有 3 阶
          { at: 180, cell: 24, lv: 6, oct: 2 }, // ① 细化
          { at: 430, cell: 13, lv: 10, oct: 2 }, // ② 细化
          { at: 760, cell: 8, lv: 16, oct: 3 }, // ③ 细化（多一级倍频）
          { at: 1150, cell: 5, lv: 26, oct: 3 }, // ④ 细化：落到 5px 网点、26 阶 = 首页 GRAIN
        ];
        const RAMP = 130;
        /* ── 交接：画布淡出，露出的就是首页自己的 .h-flow ── */
        const FADE0 = 1760;

        /* ── 首页那几件字的入场（全部由这条时间轴驱动，不让它们白演）── */
        const T_LINE = [700, 1500];
        const T_BRAND = [500, 1250];
        const T_KICK = [620, 900];
        const T_ENTRY = [900, 1240];
        const T_FOOT = [1300, 1580];

        /* ═══ 小工具 ═══ */
        const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
        const easeOut = (x) => 1 - (1 - x) * (1 - x) * (1 - x);
        const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
        const seg = (ms, a, b) => clamp01((ms - a) / (b - a));
        const sstep = (a, b, x) => {
          const t = clamp01((x - a) / (b - a));
          return t * t * (3 - 2 * t);
        };

        /* ═══ 噪声：值噪声 + fbm（照 light.js 的 fbm，4 倍频降成 2–3 倍频）═══ */
        const PERM = new Uint8Array(512);
        const RND = new Float32Array(256);
        (function seed() {
          let s = 0x2f6e2b1;
          const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
          for (let i = 0; i < 256; i++) RND[i] = rnd();
          for (let i = 0; i < 256; i++) PERM[i] = i;
          for (let i = 255; i > 0; i--) {
            const j = (rnd() * (i + 1)) | 0;
            const t = PERM[i];
            PERM[i] = PERM[j];
            PERM[j] = t;
          }
          for (let i = 0; i < 256; i++) PERM[256 + i] = PERM[i];
        })();

        function vnoise(x, y) {
          const xi = Math.floor(x),
            yi = Math.floor(y);
          const xf = x - xi,
            yf = y - yi;
          const u = xf * xf * (3 - 2 * xf);
          const v = yf * yf * (3 - 2 * yf);
          const X = xi & 255,
            Y = yi & 255;
          const p0 = PERM[X],
            p1 = PERM[X + 1];
          const n00 = RND[PERM[p0 + Y]],
            n10 = RND[PERM[p1 + Y]];
          const n01 = RND[PERM[p0 + Y + 1]],
            n11 = RND[PERM[p1 + Y + 1]];
          const a = n00 + (n10 - n00) * u;
          const b = n01 + (n11 - n01) * u;
          return a + (b - a) * v;
        }

        let OCT = 2;
        function fbm(x, y) {
          let a = 0.5,
            sum = 0;
          for (let i = 0; i < OCT; i++) {
            sum += a * vnoise(x, y);
            const nx = (0.8 * x - 0.6 * y) * 2.03 + 11.7;
            y = (0.6 * x + 0.8 * y) * 2.03 + 11.7;
            x = nx;
            a *= 0.5;
          }
          return sum * (OCT === 2 ? 1.3333 : 1.1428);
        }

        /* 两段域扭曲：q 把 p 推一下，再在那上面取一次 fbm */
        let PANX = 0,
          PANY = 0,
          TT = 0;
        function field(x, y) {
          const qx = fbm(x + PANX, y + PANY + TT * 0.05);
          const qy = fbm(x + 5.2 + PANX, y + 1.3 + PANY - TT * 0.04);
          return fbm(x + PANX + 1.7 * qx + 3.1, y + PANY + 1.7 * qy + 7.7);
        }

        /* ═══ 4 色域（sRGB 0–1，顺序：底 · 中 · 光带 · 亮芯 —— 同 light.js）═══ */
        const PAL = {
          home: new Float32Array([0.055, 0.06, 0.12, 0.12, 0.12, 0.23, 0.29, 0.27, 0.44, 0.8, 0.72, 0.78]),
          essay: new Float32Array([0.78, 0.82, 0.88, 0.68, 0.73, 0.82, 0.84, 0.87, 0.92, 0.9, 0.9, 0.9]),
          moment: new Float32Array([0.11, 0.09, 0.17, 0.23, 0.17, 0.3, 0.52, 0.33, 0.41, 0.88, 0.63, 0.43]),
          project: new Float32Array([0.05, 0.08, 0.14, 0.1, 0.17, 0.27, 0.22, 0.42, 0.5, 0.62, 0.8, 0.84]),
        };
        const CORE = 0.34; // 亮芯强度（首页 gr.y = 0.3）

        /* 三池夜色：位置与椭圆跟首页那四条 radial-gradient 对齐，
           所以开屏的构图从第一帧起就是首页的构图 */
        const POOL = [
          { pal: PAL.essay, cx: 0.06, cy: 0.18, rx: 0.58, ry: 0.46, k: 0.68, p: 1.3 },
          { pal: PAL.moment, cx: 0.46, cy: 0.62, rx: 0.46, ry: 0.4, k: 0.7, p: 1.5 },
          { pal: PAL.project, cx: 0.88, cy: 0.78, rx: 0.5, ry: 0.44, k: 0.72, p: 1.4 },
        ];

        const C3 = new Float32Array(3);
        function colorize(P, v) {
          const s1 = sstep(0.08, 0.5, v);
          const s2 = sstep(0.5, 0.86, v);
          const band = sstep(0.6, 0.74, v) * (1 - sstep(0.78, 0.94, v)) * 0.58 * CORE;
          const s3 = sstep(0.84, 1, v) * CORE;
          for (let k = 0; k < 3; k++) {
            const c0 = P[k],
              c1 = P[3 + k],
              c2 = P[6 + k],
              c3 = P[9 + k];
            let c = c0 + (c1 - c0) * s1;
            c += (c2 - c) * s2;
            c += c3 * band;
            c += (c3 - c) * s3;
            C3[k] = c;
          }
          return C3;
        }

        /* ═══ 画布 ═══ */
        const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
        let cv, ctx, img, buf32, cw = 0, ch = 0;
        let VW = 0, VH = 0;
        let BX = new Int32Array(4096), BY = new Int32Array(4096);
        let gOp = -1;

        const homeEl = document.getElementById('home');
        cv = document.createElement('canvas');
        cv.id = 'bootface';
        cv.setAttribute('aria-hidden', 'true');
        homeEl.insertBefore(cv, document.getElementById('h-eeg'));
        /* 网点跟着画布一起插进首页，压在流光之上、脑电线之下 */
        const dot = document.createElement('i');
        dot.className = 'boot-dot';
        dot.setAttribute('aria-hidden', 'true');
        homeEl.insertBefore(dot, document.getElementById('h-eeg'));

        ctx = cv.getContext('2d', { alpha: false });

        function resize() {
          VW = innerWidth;
          VH = innerHeight;
          cw = Math.ceil(VW / PX);
          ch = Math.ceil(VH / PX);
          cv.width = cw;
          cv.height = ch;
          cv.style.width = cw * PX + 'px';
          cv.style.height = ch * PX + 'px';
          img = ctx.createImageData(cw, ch);
          buf32 = new Uint32Array(img.data.buffer);
          const n = Math.max(cw, ch) + 2;
          if (n > BX.length) {
            BX = new Int32Array(n);
            BY = new Int32Array(n);
          }
          gOp = -1;
          lastFlow = -1;
        }

        function stageAt(ms) {
          let i = 0;
          while (i + 1 < LV.length && ms >= LV[i + 1].at) i++;
          const cur = LV[i];
          if (i === 0) return cur;
          const k = clamp01((ms - cur.at) / RAMP);
          OCT = cur.oct;
          if (k >= 1) return cur;
          const prev = LV[i - 1];
          const e = easeInOut(k);
          return {
            cell: prev.cell + (cur.cell - prev.cell) * e,
            lv: prev.lv + (cur.lv - prev.lv) * e,
            oct: cur.oct,
          };
        }

        function paintFlow(ms) {
          const st = stageAt(ms);
          OCT = st.oct;
          const c = st.cell / PX; // 一格 = 几个画布像素（可含小数）
          const lv = st.lv;
          TT = ms / 1000;
          PANX = TT * 0.016;
          PANY = TT * 0.011;

          /* 格边界（画布 px） */
          let bx = 0;
          BX[0] = 0;
          for (let i = 1; i <= cw; i++) {
            let x = Math.round(i * c);
            if (x > cw) x = cw;
            if (x > BX[bx]) BX[++bx] = x;
          }
          let by = 0;
          BY[0] = 0;
          for (let i = 1; i <= ch; i++) {
            let y = Math.round(i * c);
            if (y > ch) y = ch;
            if (y > BY[by]) BY[++by] = y;
          }

          const hw = cw * 0.5,
            hh = ch * 0.5;
          const inv = 0.72 / ch; // uv 缩放：uv = (画布px − 中心) / 画布高
          /* 三池的椭圆半径（CSS 里两条半轴都按 vw 算） */
          const px0 = POOL[0], px1 = POOL[1], px2 = POOL[2];
          const ax0 = px0.rx * VW, ay0 = px0.ry * VW;
          const ax1 = px1.rx * VW, ay1 = px1.ry * VW;
          const ax2 = px2.rx * VW, ay2 = px2.ry * VW;
          const kx0 = 1 / ax0, ky0 = 1 / ay0, kx1 = 1 / ax1, ky1 = 1 / ay1, kx2 = 1 / ax2, ky2 = 1 / ay2;
          const cx0 = px0.cx * VW, cy0 = px0.cy * VH;
          const cx1 = px1.cx * VW, cy1 = px1.cy * VH;
          const cx2 = px2.cx * VW, cy2 = px2.cy * VH;

          for (let j = 0; j < by; j++) {
            const y0 = BY[j],
              y1 = BY[j + 1];
            const yc = (y0 + y1) * 0.5;
            const uy = (yc - hh) * inv;
            const bY = BAYER[(j & 3) << 2];
            const sy = (yc + 0.5) * PX;
            const dy0 = (sy - cy0) * ky0,
              dy1 = (sy - cy1) * ky1,
              dy2 = (sy - cy2) * ky2;

            for (let i = 0; i < bx; i++) {
              const x0 = BX[i],
                x1 = BX[i + 1];
              const ux = ((x0 + x1) * 0.5 - hw) * inv;
              const sx = ((x0 + x1) * 0.5 + 0.5) * PX;

              /* 噪声亮度 */
              let f = field(ux, uy);
              let v = (f - 0.3) / 0.42;
              v = v < 0 ? 0 : v > 1 ? 1 : v;

              /* 三池权重：椭圆距离被噪声推一下，边缘就不是干净的圆弧 */
              let d0 = Math.sqrt((sx - cx0) * (sx - cx0) * kx0 * kx0 + dy0 * dy0) + (f - 0.5) * 0.3;
              let d1 = Math.sqrt((sx - cx1) * (sx - cx1) * kx1 * kx1 + dy1 * dy1) + (f - 0.5) * 0.3;
              let d2 = Math.sqrt((sx - cx2) * (sx - cx2) * kx2 * kx2 + dy2 * dy2) + (f - 0.5) * 0.3;
              let w0 = 1 - d0 / px0.k;
              let w1 = 1 - d1 / px1.k;
              let w2 = 1 - d2 / px2.k;
              w0 = w0 <= 0 ? 0 : Math.pow(w0, px0.p);
              w1 = w1 <= 0 ? 0 : Math.pow(w1, px1.p);
              w2 = w2 <= 0 ? 0 : Math.pow(w2, px2.p);
              let s = w0 + w1 + w2;
              if (s > 1) {
                w0 /= s;
                w1 /= s;
                w2 /= s;
              }

              /* 上色：靛夜底 + 三池 */
              let r, g, b;
              colorize(PAL.home, v);
              r = C3[0];
              g = C3[1];
              b = C3[2];
              if (w0 > 0.001) {
                colorize(PAL.essay, v);
                r += (C3[0] - r) * w0;
                g += (C3[1] - g) * w0;
                b += (C3[2] - b) * w0;
              }
              if (w1 > 0.001) {
                colorize(PAL.moment, v);
                r += (C3[0] - r) * w1;
                g += (C3[1] - g) * w1;
                b += (C3[2] - b) * w1;
              }
              if (w2 > 0.001) {
                colorize(PAL.project, v);
                r += (C3[0] - r) * w2;
                g += (C3[1] - g) * w2;
                b += (C3[2] - b) * w2;
              }
              /* 70% 10% 那团紫光，垫在三池底下 */
              const gx = (sx - 0.7 * VW) / (0.7 * VW);
              const gy = (sy - 0.1 * VH) / (0.6 * VW);
              const gd = 1 - Math.sqrt(gx * gx + gy * gy) / 0.7;
              if (gd > 0) {
                const a = gd * gd * 0.5;
                r += (0.157 - r) * a;
                g += (0.141 - g) * a;
                b += (0.251 - b) * a;
              }

              /* 量化 + 4×4 Bayer 抖动：抖动的格子跟着「格」走，不是跟着画布像素 */
              const dth = (BAYER[((j & 3) << 2) + (i & 3)] + 0.5) / 16 - 0.5;
              let qr = Math.floor(r * lv + 0.5 + dth) / lv;
              let qg = Math.floor(g * lv + 0.5 + dth) / lv;
              let qb = Math.floor(b * lv + 0.5 + dth) / lv;
              qr = qr < 0 ? 0 : qr > 1 ? 255 : (qr * 255 + 0.5) | 0;
              qg = qg < 0 ? 0 : qg > 1 ? 255 : (qg * 255 + 0.5) | 0;
              qb = qb < 0 ? 0 : qb > 1 ? 255 : (qb * 255 + 0.5) | 0;
              const c32 = 0xff000000 | (qb << 16) | (qg << 8) | qr;

              for (let y = y0; y < y1; y++) {
                const base = y * cw + x0;
                buf32.fill(c32, base, base + (x1 - x0));
              }
              void bY;
            }
          }
          ctx.putImageData(img, 0, 0);
        }

        /* ═══ 首页那几件字 ═══ */
        const HM = window.HomeMock;
        const elKick = document.querySelector('.h-kicker');
        const elEntries = [...document.querySelectorAll('.h-entry')];
        const elFoot = [document.querySelector('.h-clock'), document.querySelector('.h-exits'), document.querySelector('.h-hint')];
        let lastLine = -1,
          lastFocus = -1;

        function paintDom(ms) {
          if (HM) {
            const lv = easeOut(seg(ms, T_LINE[0], T_LINE[1]));
            if (Math.abs(lv - lastLine) > 0.002) {
              HM.line(lv);
              lastLine = lv;
            }
            const fv = easeInOut(seg(ms, T_BRAND[0], T_BRAND[1]));
            if (Math.abs(fv - lastFocus) > 0.002) {
              HM.focus(fv);
              lastFocus = fv;
            }
          }
          const k = easeOut(seg(ms, T_KICK[0], T_KICK[1]));
          elKick.style.opacity = k;
          for (let i = 0; i < elEntries.length; i++) {
            const a = T_ENTRY[0] + i * 100;
            const e = easeOut(seg(ms, a, a + 320));
            elEntries[i].style.opacity = e;
            elEntries[i].style.transform = 'translateY(' + ((1 - e) * 8).toFixed(2) + 'px)';
          }
          const f = easeOut(seg(ms, T_FOOT[0], T_FOOT[1]));
          for (const n of elFoot) n.style.opacity = f;

          const op = 1 - easeInOut(seg(ms, FADE0, END));
          if (Math.abs(op - gOp) > 0.002) {
            cv.style.opacity = op;
            gOp = op;
          }
        }

        /* ═══ 时钟 ═══ */
        let T = 0,
          t0 = 0,
          paused = false,
          raf = 0,
          lastFlow = -1,
          stats = { n: 0, sum: 0 };

        function frame(ms, force) {
          if (force || ms - lastFlow >= 32) {
            const a = performance.now();
            paintFlow(ms);
            stats.sum += performance.now() - a;
            stats.n++;
            lastFlow = ms;
          }
          paintDom(ms);
        }

        function tick(now) {
          if (paused) return;
          T = now - t0;
          if (T >= END) {
            T = END;
            frame(T, true);
            finish();
            return;
          }
          frame(T, false);
          raf = requestAnimationFrame(tick);
        }

        function finish() {
          raf = 0;
          cv.style.opacity = 0;
          cv.style.visibility = 'hidden';
          dot.style.visibility = 'hidden';
        }

        function start() {
          t0 = performance.now() - T;
          raf = requestAnimationFrame(tick);
        }

        /* ═══ 统一控制口 ═══ */
        window.__boot = {
          ready: false,
          get time() {
            return T;
          },
          get stats() {
            return stats.n
              ? { renders: stats.n, avgMs: +(stats.sum / stats.n).toFixed(2), cell: stageAt(T).cell | 0, lv: Math.round(stageAt(T).lv) }
              : { renders: 0, avgMs: 0 };
          },
          pause() {
            paused = true;
            if (raf) cancelAnimationFrame(raf);
            raf = 0;
          },
          seek(ms) {
            T = Math.max(0, Math.min(END, ms));
            if (T < FADE0) {
              cv.style.visibility = '';
              dot.style.visibility = '';
            }
            lastFlow = -1;
            gOp = -1;
            lastLine = -1;
            lastFocus = -1;
            frame(T, true);
          },
          resume() {
            if (T >= END) T = 0;
            paused = false;
            if (!raf) start();
          },
        };

        /* ═══ 起 ═══ */
        resize();
        addEventListener('resize', () => {
          resize();
          frame(T, true);
        });
        if (HM) HM.stop(); // 脑电线不让它自己跑，全部由时间轴写

        if (SKIP) {
          /* 不放：直接落首页静置 */
          window.__boot.seek(END);
          finish();
          window.__boot.ready = true;
          return;
        }

        /* 第一帧先是一张粗马赛克（此时字体还没到，但画面里没有字） */
        frame(0, true);
        T = 0;

        document.fonts.ready.then(() => {
          paintDom(0);
          window.__boot.ready = true;
          start();
        });
      })();
    </script>
  </body>
</html>
