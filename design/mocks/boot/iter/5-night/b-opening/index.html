<script>
  /* 首帧之前就定好放不放。data-boot 只由脚本加上 —— 无 JS 时 #boot 从不显示（不留死幕）；
     脚本起不来时 2.8s 自己摘掉。 */
  try {
    var R = document.documentElement;
    var off = matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]noboot=1/.test(location.search);
    if (off) R.setAttribute('data-boot-skip', '');
    else R.setAttribute('data-boot', '');
    setTimeout(function () { if (!window.__boot) R.removeAttribute('data-boot'); }, 2800);
  } catch (e) {}
</script>

<style>
  :root {
    --font-display: 'Noto Serif SC', 'Palatino Linotype', Palatino, serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    --amber: #9a86c4;
  }
  html, body { margin: 0; height: 100%; background: #0e0f1d; color: #ece8f2; }
  body { overflow: hidden; }

  /* ══ 开屏层 ══
     只放 transform / opacity 的动画；没有整屏 mask / filter / backdrop-filter。
     开屏自己不等任何资源：脚本跑到的那一帧就是第一帧。
     无 JS / reduced-motion：data-boot 从不写上，这一层永远 display:none。 */
  #boot {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    overflow: hidden;
    pointer-events: none;
    contain: strict;
  }
  html[data-boot] #boot { display: block; }
  html[data-boot-skip] #boot { display: none; }
  @media (prefers-reduced-motion: reduce) { #boot { display: none; } }

  /* 开屏里的那根 14° 线：与首页线同形（path 直接抄首页线），从中心沿轴展开。
     展开 = rotate(-14°) scaleX(k) rotate(14°) —— 只动 transform。 */
  .b-line {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    transform-origin: 50% 50%;
    will-change: transform, opacity;
  }
  .b-line path { fill: none; stroke-linecap: round; }

  /* 星：全站同一个四芒（光标星 / 星环 / 工具栏是同一枚）——主芒 + 梦态紫芯 + 45° 副芒 + 中心结 */
  .st {
    position: absolute;
    left: calc(-0.5 * var(--s, 32px));
    top: calc(-0.5 * var(--s, 32px));
    width: var(--s, 32px);
    height: var(--s, 32px);
    display: block;
    overflow: visible;
  }
  .st .st-main { fill: #f4effc; }
  .st .st-core { fill: rgb(176 156 222 / 0.55); }
  .st .st-minor { fill: rgb(154 134 196 / 0.4); }
  .st .st-knot { fill: #fff; opacity: 0.92; }

/* ══ B · 夜里的一道开口 ══
   夜是实体：一整片夜被轻轻划开一道极细的口子，按 14° 睡着；口子里是一粒星的光。
   口子向两侧呼吸张开，夜像雾一样退；最后口子的两条边合拢成一根发丝 ——
   那根发丝就是首页的脑电线（首页往下滚时，它正是劈成两条缝的那根线）。
   没有矩形带：整场只有一条缝、一粒星。 */

/* 夜：一整片（不是幕） */
.b-night {
  position: absolute;
  inset: 0;
  background: radial-gradient(120vmax 92vmax at 50% 50%, #101226 0%, #0a0c18 46%, #05060c 100%);
  opacity: 0.99;
  will-change: opacity;
}

/* 夜里的雾：一层更淡的夜气，退的时候比夜慢半拍，像雾先散、夜后收 */
.b-mist {
  position: absolute;
  inset: -12%;
  opacity: 0.55;
  will-change: transform, opacity;
  background:
    radial-gradient(72vmax 52vmax at 40% 36%, rgba(74, 66, 110, 0.3) 0%, rgba(74, 66, 110, 0) 70%),
    radial-gradient(64vmax 50vmax at 68% 72%, rgba(28, 38, 68, 0.52) 0%, rgba(28, 38, 68, 0) 72%);
}

/* 口子后面漏出来的光：一圈沿 14° 拉长的光晕 */
.b-spill {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
  opacity: 0;
  will-change: transform, opacity;
}
.b-spill::before {
  content: '';
  position: absolute;
  left: -56vmax;
  top: -20vmax;
  width: 112vmax;
  height: 40vmax;
  border-radius: 50%;
  transform: rotate(14deg);
  background: radial-gradient(closest-side, rgba(160, 140, 204, 0.42) 0%, rgba(120, 102, 168, 0.16) 42%, rgba(120, 102, 168, 0) 72%);
}

/* 口子里的光：一条按 14° 睡着的极细的光（宽度由 JS 按视口对角给，与那根线同长） */
.b-axis {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
  transform: rotate(14deg);
}
.b-cut {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--w, 1780px);
  height: 22px;
  margin: -11px 0 0 calc(var(--w, 1780px) * -0.5);

  background: radial-gradient(ellipse 50% 50% at 50% 50%,
    rgba(224, 214, 246, 0.86) 0%,
    rgba(196, 180, 234, 0.56) 15%,
    rgba(154, 134, 196, 0.28) 38%,
    rgba(154, 134, 196, 0) 66%);
}

/* 口子的两条边：两根极细的起伏发丝（不是矩形带，也不是描出来的静线）。
   形状直接抄首页那根线的 path；它们最后合拢成那根线。 */
.b-edge {

  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  opacity: 0;
  will-change: transform, opacity;
}
.b-edge path {

}

/* 口子里的星：与站内星同一枚四芒 */

  will-change: transform, opacity;
}

<script>
  window.HomeMock = (() => {
    const flow = document.querySelector('#home .h-flow');
    const brand = document.querySelector('#home .h-brand');
    const path = document.getElementById('h-eeg-path');
    const svg = document.getElementById('h-eeg');
    const TAN = Math.tan((14 * Math.PI) / 180);
    /* 线的几何按视口真实像素算：viewBox 跟着视口走，14° 在任何屏上都成立 */
    let W = innerWidth, H = innerHeight;
    let reveal = 1, focus = 1, px = 1;
    /* 14° 轴上的波形线：整条线 = 视口对角线那么长，按 reveal 从中心往两端露出 */
    function draw() {
      W = innerWidth;
      H = innerHeight;
      const vb = '0 0 ' + W + ' ' + H;
      if (svg.getAttribute('viewBox') !== vb) svg.setAttribute('viewBox', vb);
      const half = Math.hypot(W, H) / 2 + 40;
      const n = 220;
      let d = '';
      let last = null;
      for (let i = 0; i <= n; i++) {
        const s = i / n;
        const t = (s * 2 - 1) * half; // 沿线坐标
        const x = W / 2 + Math.cos(Math.atan(TAN)) * t;
        const y = H / 2 + Math.sin(Math.atan(TAN)) * t;
        const wob = 3.6 * (Math.sin(t * 0.5 + performance.now() / 2000) * 0.6 + Math.sin(t * 1.9) * 0.4);
        const ox = -Math.sin(Math.atan(TAN)) * wob;
        const oy = Math.cos(Math.atan(TAN)) * wob;
        const p = [x + ox, y + oy];
        d += (last ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
        last = p;
      }
      path.setAttribute('d', d);
      // 从中心往两端露：用线性渐变的遮罩近似（左半 + 右半各露 reveal 的一半）
      const m = `linear-gradient(90deg, transparent ${50 - reveal * 50}%, #000 ${50 - reveal * 50}%, #000 ${50 + reveal * 50}%, transparent ${50 + reveal * 50}%)`;
      path.style.maskImage = m;
      path.style.webkitMaskImage = m;
    }
    let raf = 0;
    const loop = () => { draw(); raf = requestAnimationFrame(loop); };
    loop();
    return {
      line(v) { reveal = v; draw(); },
      focus(v) { focus = v; brand.style.filter = v >= 1 ? '' : `blur(${((1 - v) * 14).toFixed(2)}px)`; brand.style.opacity = String(v); },
      pixels(v) {
        px = v;
        // 粗颗粒提示：把底图按倍数放大再裁回去（等价于降采样），真站是 1/5 分辨率 canvas
        if (v <= 1) { flow.style.transform = ''; flow.style.filter = 'saturate(0.92)'; return; }
        flow.style.transform = `scale(${v.toFixed(2)})`;
        flow.style.transformOrigin = '50% 45%';
        flow.style.filter = `saturate(0.92) blur(${(v * 0.6).toFixed(2)}px)`;
      },
      stop() { if (raf) cancelAnimationFrame(raf); raf = 0; },
    };
  })();
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   公共接缝 · 星 → 14° 线 → 首页静置

   开屏里所有运动都是 Web Animations，只写 transform / opacity（合成线程）。
   首页那根线的「从中心画出」由开屏接管：开屏层里放一份与首页线同形的线
   （path 直接从首页线抄过来），从中心沿 14° 轴展开；交接时把它换回首页线，
   两者同形，交接帧不动一格。首页大字那 1.6s 的对焦同样由开屏驱动，
   不让它在夜底下白演一遍。
   seek(ms) = 把所有 animation 的 currentTime 设成 ms，画面完全确定。
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  var root = document.documentElement;
  var box = document.getElementById('boot');
  var noop = function () {};

  window.__bootKit = {
    start: function (spec) {
      var TOTAL = spec.total;
      var HM = window.HomeMock;
      var anims = [];
      var cur = 0;
      var paused = false;
      var finished = false;
      var resizeHooks = [];

      /* 减少动效 / ?noboot=1：一帧不放，直接落首页 */
      if (!box || root.hasAttribute('data-boot-skip')) {
        window.__boot = { total: TOTAL, ready: true, skipped: true, pause: noop, seek: noop, resume: noop };
        return;
      }

      var homeSvg = document.getElementById('h-eeg');
      var homePath = document.getElementById('h-eeg-path');
      var bline = document.getElementById('b-line');
      var bcore = document.getElementById('b-line-core');
      var bglow = document.getElementById('b-line-glow');
      var brand = document.querySelector('#home .h-brand');

      /* 停掉假首页自己的 rAF，把线摆到静置（满）——开屏不要它在夜底下白画 */
      if (HM) { try { HM.stop(); HM.line(1); } catch (e) {} }

      var EASE = {
        out: 'cubic-bezier(.16,1,.3,1)',
        io: 'cubic-bezier(.5,0,.22,1)',
        soft: 'cubic-bezier(.33,.9,.24,1)',
        in: 'cubic-bezier(.6,.02,.85,.4)'
      };

      /* 开屏线：一根安静、平滑的 14° 线（v = 视口真实像素，viewBox 跟着视口 1:1）。
         它最后换上首页那根带脑电震颤的线 —— 交接时那一下「开始发颤」就是脑电线醒来的那一下。
         用平滑线的原因：reveal 是把线沿自身轴从中心拉开，高频震颤被压缩后会糊成一团锯齿。 */
      var TAN14 = Math.tan((14 * Math.PI) / 180);
      var ANG14 = Math.atan(TAN14);
      function bootD() {
        var W = innerWidth, H = innerHeight;
        var half = Math.hypot(W, H) / 2 + 40;
        var n = 120, d = '';
        for (var i = 0; i <= n; i++) {
          var s = i / n;
          var t = (s * 2 - 1) * half;
          var x = W / 2 + Math.cos(ANG14) * t;
          var y = H / 2 + Math.sin(ANG14) * t;
          var wob = 3.1 * Math.sin(t * 0.012 + 0.7) + 1.1 * Math.sin(t * 0.029 + 2.1);
          var ox = -Math.sin(ANG14) * wob;
          var oy = Math.cos(ANG14) * wob;
          d += (i ? 'L' : 'M') + (x + ox).toFixed(1) + ' ' + (y + oy).toFixed(1);
        }
        return d;
      }
      function syncLine() {
        var d = bootD();
        bcore.setAttribute('d', d);
        bglow.setAttribute('d', d);
        var vb = '0 0 ' + innerWidth + ' ' + innerHeight;
        if (bline.getAttribute('viewBox') !== vb) bline.setAttribute('viewBox', vb);
        if (homeSvg.getAttribute('viewBox') !== vb) homeSvg.setAttribute('viewBox', vb);
      }

      function track(el, keys) {
        var fr = keys.map(function (k) {
          var o = { offset: Math.min(1, Math.max(0, k[0] / TOTAL)), easing: k[2] || 'linear' };
          for (var p in k[1]) o[p] = k[1][p];
          return o;
        });
        if (fr[0].offset > 0) {
          var first = { offset: 0, easing: 'linear' };
          for (var p1 in fr[0]) if (p1 !== 'offset' && p1 !== 'easing') first[p1] = fr[0][p1];
          fr.unshift(first);
        }
        if (fr[fr.length - 1].offset < 1) {
          var last = { offset: 1, easing: 'linear' };
          for (var p2 in fr[fr.length - 1]) if (p2 !== 'offset' && p2 !== 'easing') last[p2] = fr[fr.length - 1][p2];
          fr.push(last);
        }
        fr.sort(function (a, b) { return a.offset - b.offset; });
        var a = el.animate(fr, { duration: TOTAL, fill: 'both', easing: 'linear' });
        a.pause();
        a.currentTime = cur;
        anims.push(a);
        return a;
      }

      function axis(k) {
        return 'rotate(14deg) scaleX(' + k.toFixed(5) + ') rotate(-14deg)';
      }

      var ctx = {
        total: TOTAL,
        track: track,
        ease: EASE,
        W: function () { return innerWidth; },
        H: function () { return innerHeight; },
        lineD: function () { return bcore.getAttribute('d') || ''; },
        bootD: bootD,
        lineLength: function () { return Math.hypot(innerWidth, innerHeight) + 80; },
        onResize: function (fn) { resizeHooks.push(fn); },
        syncLine: syncLine
      };

      /* ── 公共轨道 ─────────────────────────────────────────────────── */
      var LINE = spec.line || [TOTAL * 0.62, TOTAL * 0.94];
      var FOCUS = spec.focus || [TOTAL * 0.66, TOTAL * 0.95];
      var HAND = spec.handoff || [TOTAL * 0.91, TOTAL * 0.95];

      function common() {
        syncLine();

        /* 开屏线：先藏、再沿 14° 轴从中心展开（k = r(2−r)，与首页 reveal 同一条曲线） */
        var keys = [
          [0, { opacity: '0', transform: axis(0.004) }],
          [LINE[0], { opacity: '0', transform: axis(0.004) }]
        ];
        var i;
        for (i = 1; i <= 6; i++) {
          var r = i / 6;
          var k = r * (2 - r);
          keys.push([LINE[0] + (LINE[1] - LINE[0]) * r, { opacity: '1', transform: axis(Math.max(0.004, k)) }]);
        }
        keys.push([HAND[0], { opacity: '1', transform: axis(1) }]);
        keys.push([HAND[1], { opacity: '0', transform: axis(1) }]);
        track(bline, keys);

        /* 线的光晕：只在这一段有，交接前收回 0 —— 交接那一刻只剩与首页线同样的发丝 */
        track(bglow, [
          [0, { opacity: '0' }],
          [LINE[0], { opacity: '0' }],
          [LINE[0] + (LINE[1] - LINE[0]) * 0.34, { opacity: '0.5' }],
          [HAND[0], { opacity: '0' }]
        ]);

        /* 首页线：先在夜里藏着，交接帧换成它 */
        track(homeSvg, [
          [0, { opacity: '0' }],
          [HAND[0], { opacity: '0' }],
          [HAND[1], { opacity: '1' }]
        ]);

        /* 大字：从 blur(14px) 里对上焦（与全站 w-home-focus 同一条曲线） */
        var fd = Math.max(1, FOCUS[1] - FOCUS[0]);
        track(brand, [
          [FOCUS[0], { opacity: '0', filter: 'blur(14px)' }, 'cubic-bezier(.2,.7,.2,1)'],
          [FOCUS[0] + fd * 0.6, { opacity: '1' }],
          [FOCUS[1], { filter: 'blur(0px)' }]
        ]);
      }

      function clearAnims() {
        for (var i = 0; i < anims.length; i++) { try { anims[i].cancel(); } catch (e) {} }
        anims = [];
      }

      function buildAll() {
        clearAnims();
        common();
        spec.build(ctx);
        armFinish();
      }

      function finish() {
        if (finished) return;
        finished = true;
        clearAnims();
        root.removeAttribute('data-boot');
      }

      function armFinish() {
        var a = anims[0];
        if (!a) return;
        Promise.resolve(a.finished).then(function () {
          if (!paused && !finished) finish();
        }).catch(noop);
      }

      /* ── 统一控制口 ───────────────────────────────────────────────── */
      var api = {
        total: TOTAL,
        ready: false,
        pause: function () { paused = true; for (var i = 0; i < anims.length; i++) anims[i].pause(); },
        seek: function (ms) {
          cur = Math.max(0, Math.min(TOTAL, Number(ms) || 0));
          if (root.hasAttribute('data-boot-skip')) return;
          if (finished) { finished = false; buildAll(); }
          root.setAttribute('data-boot', '');
          for (var i = 0; i < anims.length; i++) { anims[i].pause(); anims[i].currentTime = cur; }
        },
        resume: function () {
          if (finished) { finished = false; cur = 0; buildAll(); }
          paused = false;
          for (var i = 0; i < anims.length; i++) anims[i].play();
        },
        time: function () { return cur; }
      };
      window.__boot = api;

      buildAll();
      for (var j = 0; j < anims.length; j++) anims[j].play();

      var rt = 0;
      addEventListener('resize', function () {
        clearTimeout(rt);
        rt = setTimeout(function () {
          var keep = cur;
          if (HM) { try { HM.line(1); } catch (e) {} }
          syncLine();
          for (var i = 0; i < resizeHooks.length; i++) resizeHooks[i]();
          if (!finished) {
            buildAll();
            api.seek(keep);
          }
        }, 180);
      });

      /* ready 等首页字体（最多 1500ms）。开屏自己不等任何资源。 */
      requestAnimationFrame(function () {
        var fonts = document.fonts ? document.fonts.ready : Promise.resolve();
        var cap = new Promise(function (r) { setTimeout(r, 1500); });
        Promise.race([fonts, cap]).then(function () {
          requestAnimationFrame(function () { api.ready = true; });
        });
      });
    }
  };
})();
</script>

<script>
/* B · 夜里的一道开口 · 总长 2260ms
   0 ── 320   夜是满的，什么也没有
   320 ─ 900  一道口子从中心沿 14° 划开：两条边是一对起伏的发丝，口子里亮起一线光，星在光里
   900 ─ 1320 呼吸：口子张开一息、再收一息；光晕跟着明暗
   1320 ─ 1900 夜像雾一样退；口子张到最开，光从里面漏出来；两条边开始向中间合
   1500 ─ 2040 那线光凝成开屏线、沿 14° 展开（首页的脑电线）
   1900 ─ 2045 两条边合拢成一根发丝；夜退尽；大字在 1640–2110 对焦
   2040 ─ 2095 开屏线换回首页线（同形）
   2095 ─ 2260 首页静置
*/
(function () {
  window.__bootKit.start({
    total: 2260,
    line: [1500, 2040],
    focus: [1640, 2110],
    handoff: [2046, 2101],
    build: function (ctx) {
      var t = ctx.track;
      var E = ctx.ease;
      var NX = -Math.sin((14 * Math.PI) / 180);
      var NY = Math.cos((14 * Math.PI) / 180);

      var night = document.getElementById('b-night');
      var mist = document.getElementById('b-mist');
      var spill = document.getElementById('b-spill');
      var cut = document.getElementById('b-cut');
      var ea = document.getElementById('b-edge-a');
      var eb = document.getElementById('b-edge-b');
      var starw = document.getElementById('b-starw');
      var halo = document.getElementById('b-halo');

      /* 口子的长度与两条边：形状直接抄首页线，viewBox 跟着视口走 */
      function syncGeom() {
        var len = ctx.lineLength();
        cut.style.setProperty('--w', len.toFixed(1) + 'px');
        var d = ctx.lineD();
        var vb = '0 0 ' + ctx.W() + ' ' + ctx.H();
        [ea, eb].forEach(function (el) {
          el.setAttribute('viewBox', vb);
          el.querySelector('path').setAttribute('d', d);
        });
      }
      syncGeom();
      ctx.onResize(syncGeom);

      function et(k, d) {
        return 'translate(' + (NX * d).toFixed(2) + 'px,' + (NY * d).toFixed(2) + 'px) rotate(14deg) scaleX(' +
          k.toFixed(5) + ') rotate(-14deg)';
      }
      /* [毫秒, 长度系数, 离开轴的距离 px, 不透明度, 缓动] */
      var EDGE = [
        [0, 0.004, 0, 0],
        [320, 0.02, 0, 0],
        [520, 0.16, 1.5, 0.35, E.out],
        [900, 0.5, 6, 0.6],
        [1050, 0.52, 7, 0.6],
        [1200, 0.53, 8, 0.6],
        [1320, 0.54, 7, 0.6],
        [1500, 0.56, 9, 0.55],
        [1680, 0.6, 12, 0.45],
        [1900, 0.99, 0.9, 0.32],
        [2045, 1, 0.6, 0]
      ];
      function edgeKeys(sign) {
        return EDGE.map(function (r) {
          return [r[0], { transform: et(r[1], sign * r[2]), opacity: String(r[3]) }, r[4]];
        });
      }
      t(ea, edgeKeys(1));
      t(eb, edgeKeys(-1));

      /* 口子里的光：与两条边同一个长度系数，法向上随呼吸张合 */
      t(cut, [
        [0, { opacity: '0', transform: 'scale(0.004, 0.18)' }],
        [360, { opacity: '0', transform: 'scale(0.004, 0.18)' }, E.out],
        [900, { opacity: '0.95', transform: 'scale(0.5, 0.9)' }],
        [1150, { opacity: '1', transform: 'scale(0.52, 1)' }],
        [1320, { opacity: '0.92', transform: 'scale(0.54, 0.86)' }],
        [1550, { opacity: '0.86', transform: 'scale(0.56, 1.15)' }, E.io],
        [1850, { opacity: '0', transform: 'scale(0.6, 1.35)' }]
      ]);

      t(spill, [
        [0, { opacity: '0', transform: 'scale(0.55)' }],
        [360, { opacity: '0', transform: 'scale(0.55)' }, E.out],
        [900, { opacity: '0.55', transform: 'scale(1)' }],
        [1250, { opacity: '0.42', transform: 'scale(1.06)' }],
        [1900, { opacity: '0', transform: 'scale(1.18)' }]
      ]);

      t(night, [
        [0, { opacity: '0.99' }],
        [1370, { opacity: '0.99' }, E.io],
        [2030, { opacity: '0' }]
      ]);

      t(mist, [
        [0, { opacity: '0.55', transform: 'scale(1)' }],
        [1350, { opacity: '0.55', transform: 'scale(1)' }, E.io],
        [2010, { opacity: '0', transform: 'scale(1.05)' }]
      ]);

      t(starw, [
        [0, { opacity: '0', transform: 'rotate(0deg) scale(0.4)' }],
        [300, { opacity: '0', transform: 'rotate(0deg) scale(0.4)' }, E.out],
        [700, { opacity: '1', transform: 'rotate(0deg) scale(1)' }],
        [1150, { opacity: '1', transform: 'rotate(2deg) scale(1.06)' }],
        [1500, { opacity: '1', transform: 'rotate(6deg) scale(1)' }, E.io],
        [1900, { opacity: '0', transform: 'rotate(14deg) scale(0.7)' }]
      ]);

      t(halo, [
        [0, { opacity: '0', transform: 'scale(0.5)' }],
        [360, { opacity: '0', transform: 'scale(0.5)' }, E.out],
        [820, { opacity: '0.85', transform: 'scale(1)' }],
        [1300, { opacity: '0.7', transform: 'scale(1.08)' }, E.io],
        [1900, { opacity: '0', transform: 'scale(1.5)' }]
      ]);
    }
  });
})();
</script>
