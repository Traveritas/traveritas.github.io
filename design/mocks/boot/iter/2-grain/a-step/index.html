<script>
/* ══════════════════════════════════════════════════════════════════════════
   A · 一段一段跳

   规则：**硬切**。没有合拢、没有缓动 —— 每次跳级都是这一帧和上一帧换一个世界。
   跳完就停住，停够时间让人看见「这一级长这样」，再跳下一级。

   级数：6 级 = 5 次跳。格 56 → 36 → 22 → 13 → 9 → 5 屏 px；
        量化 3 → 5 → 8 → 13 → 19 → 26 阶（末级 = 首页 GRAIN.home 的原值）。
   节奏：停顿 300 → 250 → 210 → 180 → 160 → 600 ms（跳级间隔依次收紧，
        世界越清楚、提级越快；最后一级停满 600ms 让大字对完焦）。
   末级不是「接近首页」，就是首页那张 5px / 26 阶的网点；画布随后淡出，
   交还给假首页自己的 .h-flow。

   这条时间轴是纯函数：timeline(ms, vw) → { cellPx, levels, octaves, dither, state }
   ══════════════════════════════════════════════════════════════════════════ */

(function () {
  'use strict';

  const TOTAL = 2000;
  const FADE = [1700, 1950];

  /* 6 级，5 次跳。at = 硬切发生的毫秒 */
  const CUTS = [
    { at: 0,    cell: 56, levels: 3,  oct: 2, dither: 0 },   // 0  一片粗马赛克
    { at: 300,  cell: 36, levels: 5,  oct: 2, dither: 0 },   // ①  跳
    { at: 550,  cell: 22, levels: 8,  oct: 2, dither: 0 },   // ②  跳
    { at: 760,  cell: 13, levels: 13, oct: 3, dither: 0 },   // ③  跳
    { at: 940,  cell: 9,  levels: 19, oct: 3, dither: 0.6 }, // ④  跳：网点开始长出来
    { at: 1100, cell: 5,  levels: 26, oct: 3, dither: 1 },   // ⑤  跳：落成首页的网点
  ];

  /* 纯函数：只依赖 ms 与视口宽。硬切 = 没有插值。 */
  function timeline(ms, vw) {
    let i = 0;
    while (i + 1 < CUTS.length && ms >= CUTS[i + 1].at) i++;
    const s = CUTS[i];
    return {
      cellPx: Grain.scaledCell(s.cell, vw), // 手机上粗段按视口收一点，末级仍是 5
      levels: s.levels,
      octaves: s.oct,
      dither: s.dither,       // 画布像素上的抖动（末级 = 首页满强度）
      state: i,           // 第几级（对比台据此标「这一帧跳了没有」）
      hard: true,         // 这一版全是硬切
    };
  }

  mountBoot({
    total: TOTAL,
    fade: FADE,
    timeline,
    /* 首页入场也踩在跳级的点上：第 1 跳时小字出来，第 2 跳起大字对焦，
       第 3 跳脑电线开始画，第 4/5 跳三个栏头依次落位。 */
    entry: {
      kicker: [300, 560],
      brand: [550, 1250],
      line: [760, 1450],
      entries: [940, 320],
      foot: [1250, 1520],
    },
  });
})();
</script>
