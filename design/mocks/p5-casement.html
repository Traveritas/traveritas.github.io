<script>
/* ============ 错误钩子（最先挂） ============ */
window.__swarmErr = 'none';
window.addEventListener('error', e => { __swarmErr = (e.message || 'err') + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno; document.title = '悬窗 · ' + __swarmErr; });
window.addEventListener('unhandledrejection', e => { __swarmErr = 'rej: ' + ((e.reason && e.reason.message) || e.reason); });
(function(){ const ce = console.error; console.error = function(){ try { __swarmErr = 'ce: ' + [].join.call(arguments, ' ').slice(0, 300); } catch(_){} ce.apply(console, arguments); }; })();

/* ============ 参数（裸旗标兼容） ============ */
const Q = {};
(function(){ const re = /[?&]([^=&]+)(?:=([^&]*))?/g; let m;
  while ((m = re.exec(location.search))) Q[decodeURIComponent(m[1])] = m[2] !== undefined ? decodeURIComponent(m[2]) : '';
})();
const IS_AUTO  = 'auto'  in Q;
const IS_FAST  = 'fast'  in Q;
const IS_STILL = 'still' in Q;
const IS_RM    = 'rm' in Q || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const PIN      = (Q.pin !== undefined && Q.pin !== '') ? clamp01(parseFloat(Q.pin) || 0) : null;
const INTRO_L  = (Q.intro !== undefined && Q.intro !== '') ? clamp01(parseFloat(Q.intro) || 0) : null;
const HOVER_F  = (Q.hover !== undefined && Q.hover !== '') ? parseInt(Q.hover) : null;
const FOCUS_F  = (Q.focus !== undefined && Q.focus !== '') ? parseInt(Q.focus) : null;
const TFIX     = (Q.t !== undefined && Q.t !== '') ? parseFloat(Q.t) : 12.0;

function clamp01(v){ return v<0?0:(v>1?1:v); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth(a,b,v){ const t = clamp01((v-a)/(b-a)); return t*t*(3-2*t); }
function easeInOut(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
const $ = id => document.getElementById(id);

/* ============ 调色板：晨→昼→暮→夜→深（含挂窗前 pre-dawn） ============ */
const PRE = { top:'#3c4452', mid:'#565b6b', bot:'#6f6d7a', fog:'#6a6a76', deep:'#4c4e58', ink:'#c9c3ba' };
const PAL = [ /* p 关键帧 0 / .3 / .62 / .85 / 1 */
  { top:'#c6d0d9', mid:'#e3e2df', bot:'#f2e9dc', fog:'#e9e5db', deep:'#b9b3a8', ink:'#3d434e', sun:[.30,.28], sunCol:'#f6d9a4', night:0    },
  { top:'#cdd7de', mid:'#e8e6e0', bot:'#f4ecdf', fog:'#ebe7dd', deep:'#bfb9ae', ink:'#3f4550', sun:[.47,.50], sunCol:'#f8e2b0', night:0    },
  { top:'#b2a4b5', mid:'#ddc3b8', bot:'#efcfae', fog:'#e0d2c6', deep:'#a8928c', ink:'#47404d', sun:[.74,.24], sunCol:'#f2b183', night:0    },
  { top:'#465064', mid:'#6f6d80', bot:'#9a8f99', fog:'#7c7886', deep:'#4e5361', ink:'#d9d0c4', sun:[.60,.74], sunCol:'#e9edf4', night:1    },
  { top:'#39414f', mid:'#626074', bot:'#8b8292', fog:'#6e6a78', deep:'#454a58', ink:'#dcd3c7', sun:[.58,.78], sunCol:'#dfe6ef', night:1    },
];
const KEYS = [0,.3,.62,.85,1];
function hex2rgb(h){ const n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
const RGB_PRE = {}; for (const k in PRE) RGB_PRE[k] = hex2rgb(PRE[k]);
const RGB_PAL = PAL.map(p => { const o = {}; for (const k in p) { if (typeof p[k] === 'string') o[k] = hex2rgb(p[k]); else o[k] = p[k]; } return o; });
const _cA = new THREE.Color(), _cB = new THREE.Color();

function palAt(p, wake, out){
  let i = 0; while (i < KEYS.length-2 && p > KEYS[i+1]) i++;
  const t = clamp01((p - KEYS[i]) / (KEYS[i+1] - KEYS[i]));
  const A = RGB_PAL[i], B = RGB_PAL[i+1];
  const mixK = (k) => [
    lerp(lerp(RGB_PRE[k][0], A[k][0], wake), B[k][0], t),
    lerp(lerp(RGB_PRE[k][1], A[k][1], wake), B[k][1], t),
    lerp(lerp(RGB_PRE[k][2], A[k][2], wake), B[k][2], t)];
  out.top = mixK('top'); out.mid = mixK('mid'); out.bot = mixK('bot');
  out.fog = mixK('fog'); out.deep = mixK('deep'); out.ink = mixK('ink');
  out.sun = [lerp(lerp(.42,A.sun[0],wake),B.sun[0],t), lerp(lerp(.18,A.sun[1],wake),B.sun[1],t)];
  const preSun = hex2rgb('#8f95a3');
  const scA = A.sunCol, scB = B.sunCol;
  out.sunCol = [
    lerp(lerp(preSun[0],scA[0],wake), scB[0], t),
    lerp(lerp(preSun[1],scA[1],wake), scB[1], t),
    lerp(lerp(preSun[2],scA[2],wake), scB[2], t)];
  out.night = lerp(0, lerp(A.night,B.night,t), wake);
}

/* ============ 共享 uniforms ============ */
const U = {
  uTop:{value:new THREE.Color()}, uMid:{value:new THREE.Color()}, uBot:{value:new THREE.Color()},
  uFog:{value:new THREE.Color()}, uDeep:{value:new THREE.Color()},
  uInk:{value:new THREE.Color()},
  uSun:{value:new THREE.Vector2(.3,.28)}, uSunCol:{value:new THREE.Color()},
  uNight:{value:0}, uWake:{value:1}, uTime:{value:0}, uAsp:{value:1.6},
  uFogNear:{value:9}, uFogFar:{value:46},
  uLightDir:{value:new THREE.Vector3(.34,.52,.8).normalize()},
};
const NOISE_GLSL = `
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); }
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x), u.y);
}`;
const FOG_GLSL = `
float fogF(vec3 w, vec3 cam){ return smoothstep(uFogNear, uFogFar, distance(w, cam)); }`;

/* ============ 初始化守卫（innerWidth 可能晚就绪/为 0） ============ */
let W = 0, H = 0, renderer = null, scene, camera, has3D = true;
const canvas = $('gl');
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
const isMobile = () => W < 761 || (W/Math.max(H,1)) < 0.75;

/* ============ 状态 ============ */
const S = {
  booted: false, L: IS_RM ? 1 : 0, t: TFIX, p: PIN !== null ? PIN : 0, pRaw: 0,
  hover: HOVER_F !== null ? HOVER_F : -1, focus: FOCUS_F !== null ? FOCUS_F : -1,
  camX: 0, autoT: 0, scrollHold: false, captionOn: false,
};

/* ============ 入口（入口次序：随笔 / 项目 / 关于） ============ */
const PANE_DEF = [
  { x:-9.0, y:2.55, z:2.4, yaw:-.10, name:'随笔', en:'ESSAYS · 三篇', capN:'三篇 · 由此进入', bob:.09, ph:0.0 },
  { x: 0.4, y:3.60, z:4.0, yaw: .04, name:'项目', en:'WORKS · 两件', capN:'两件 · 由此进入', bob:.11, ph:2.1 },
  { x: 9.2, y:2.20, z:2.0, yaw: .10, name:'关于', en:'ABOUT · 一页', capN:'一页 · 由此进入', bob:.08, ph:4.2 },
];
const GW = { x:-2.2, y:3.35, z:-6.5 }; // 巨窗

/* ============ 场景构建 ============ */
const panes = [];       // {pivot, inner, glass, interiorMat, plate, latch, open, openT, poolI}
let skyMesh, floorMesh, floorU, keyGroup, keyShadow = {x:0,z:0};
let giantGroup, manMesh, furMesh;
let giantWorldTex, giantWorldMat, giantGlass, lastLineMat, manMat, furMat;
let worldCanvas, worldCtx;

function buildScene(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(42, 1, .1, 220);

  /* ---- 天幕（挂相机全屏渐变+日盘+星） ---- */
  skyMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(2,2),
    new THREE.ShaderMaterial({
      depthWrite:false, depthTest:false, side:THREE.DoubleSide,
      uniforms:{ uTop:U.uTop,uMid:U.uMid,uBot:U.uBot,uSun:U.uSun,uSunCol:U.uSunCol,uNight:U.uNight,uWake:U.uWake,uTime:U.uTime,uAsp:U.uAsp },
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.9999,1.0); }`,
      fragmentShader:`
        uniform vec3 uTop,uMid,uBot,uSunCol; uniform vec2 uSun;
        uniform float uNight,uTime,uAsp;
        varying vec2 vUv;
        ${NOISE_GLSL}
        void main(){
          float y = vUv.y;
          vec3 col = y<0.5 ? mix(uBot,uMid,smoothstep(0.,.5,y)) : mix(uMid,uTop,smoothstep(.5,1.,y));
          float band = sin((vUv.x*3.1+uTime*0.016)*6.283 + sin(vUv.y*7.+uTime*.011)*2.1)*.5+.5;
          col += (band-.5)*0.016;
          vec2 d2 = vec2((vUv.x-uSun.x)*uAsp, vUv.y-uSun.y);
          float d = length(d2);
          col += uSunCol * (exp(-min(d*d*22.0,60.0))*0.36 + smoothstep(0.058,0.048,d)*0.72);
          vec2 g = floor(vUv*vec2(170.*uAsp,96.));
          float st = step(0.9976, h21(g)) * uNight * smoothstep(0.32,0.62,y);
          vec2 fc = fract(vUv*vec2(170.*uAsp,96.))-0.5;
          st *= smoothstep(.42,.08,length(fc));
          float tw = 0.55+0.45*sin(uTime*1.4 + h21(g+7.3)*40.0);
          col += vec3(.92,.94,1.)*st*tw*.55;
          col += (h21(vUv*913.7 + fract(uTime)*7.)-.5)*(1.5/255.);
          gl_FragColor = vec4(col,1.);
        }`
    }));
  skyMesh.frustumCulled = false; skyMesh.renderOrder = -100;
  scene.add(skyMesh);

  /* ---- 雾地（光池+钥匙软影） ---- */
  floorU = {
    uHorizon:U.uFog, uDeepC:U.uDeep, uFog:U.uFog, uFogNear:U.uFogNear, uFogFar:U.uFogFar,
    uTime:U.uTime,
    uP0:{value:new THREE.Vector4(0,0,2.2,0)}, uP1:{value:new THREE.Vector4(0,0,2.2,0)},
    uP2:{value:new THREE.Vector4(0,0,2.2,0)}, uP3:{value:new THREE.Vector4(0,0,4.5,0)},
    uPoolCol:{value:new THREE.Color('#ffd9a4')},
    uSh:{value:new THREE.Vector4(0,0,1.2,.55)}, uShK:{value:0},
  };
  floorMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(320,150),
    new THREE.ShaderMaterial({
      uniforms: floorU,
      vertexShader:`varying vec3 vW; void main(){ vec4 wp=modelMatrix*vec4(position,1.); vW=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`,
      fragmentShader:`
        uniform vec3 uHorizon,uDeepC,uFog,uPoolCol; uniform float uFogNear,uFogFar,uTime;
        uniform vec4 uP0,uP1,uP2,uP3,uSh; uniform float uShK;
        varying vec3 vW;
        ${NOISE_GLSL}
        vec3 pool(vec3 c, vec4 P, vec2 w){
          if(P.w<0.003) return c;
          float d = distance(w, P.xy);
          float a = exp(-min(d*d/(P.z*P.z),60.))*P.w;
          return mix(c, uPoolCol, clamp(a,0.,.85));
        }
        void main(){
          float dCam = distance(vW, cameraPosition);
          float k = smoothstep(2.,34., dCam);
          vec3 col = mix(uDeepC, uHorizon, k);
          col *= .965 + .055*vnoise(vW.xz*.16 + uTime*.02);
          col = pool(col,uP0,vW.xz); col = pool(col,uP1,vW.xz);
          col = pool(col,uP2,vW.xz); col = pool(col,uP3,vW.xz);
          if(uShK>0.003){
            vec2 e = vec2((vW.x-uSh.x)/uSh.z,(vW.z-uSh.y)/uSh.w);
            float a = exp(-min(dot(e,e)*2.2,60.))*uShK;
            col *= 1.-clamp(a,0.,.55);
          }
          col = mix(col, uFog, smoothstep(uFogNear,uFogFar,dCam));
          gl_FragColor = vec4(col,1.);
        }`
    }));
  floorMesh.rotation.x = -Math.PI/2; floorMesh.position.set(0,-2.4,-24);
  floorMesh.renderOrder = -10;
  scene.add(floorMesh);

  buildGiantWindow();
  buildTextPlanes();
  for (let i=0;i<3;i++) buildPane(i);
  buildKey();
}

/* ---- 巨窗：框住纯平面剪纸世界 ---- */
function matteMat(base, deep, rim){
  return new THREE.ShaderMaterial({
    uniforms:{
      uBase:{value:new THREE.Color(base)}, uDeep:{value:new THREE.Color(deep)},
      uRim:{value:new THREE.Color(rim||'#fffdf6')},
      uLightDir:U.uLightDir, uFog:U.uFog, uFogNear:U.uFogNear, uFogFar:U.uFogFar, uWake:U.uWake,
    },
    vertexShader:`varying vec3 vN,vV,vW; void main(){ vec4 wp=modelMatrix*vec4(position,1.); vW=wp.xyz;
      vN=normalize(mat3(modelMatrix)*normal); vV=cameraPosition-wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`
      uniform vec3 uBase,uDeep,uRim,uFog,uLightDir; uniform float uFogNear,uFogFar,uWake;
      varying vec3 vN,vV,vW;
      ${FOG_GLSL}
      void main(){
        vec3 N=normalize(vN),V=normalize(vV);
        float ndl=dot(N,uLightDir)*.5+.5;
        vec3 col=mix(uDeep,uBase,pow(ndl,1.5));
        col += uRim*pow(1.-max(dot(N,V),0.),2.6)*.5;
        col *= .22+.78*uWake; /* 挂窗前：剪影 */
        col = mix(col,uFog,fogF(vW,cameraPosition));
        gl_FragColor=vec4(col,1.);
      }`
  });
}

/* ---- 声明文字层 / 家具层（白膜 CanvasTexture × uColor） ---- */
function textMat(color){
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 256;
  const tex = new THREE.CanvasTexture(cv);
  tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    uniforms:{
      uMap:{value:tex}, uColor:{value:new THREE.Color(color)}, uOpacity:{value:0}, uWipe:{value:1},
      uFog:U.uFog, uFogNear:U.uFogNear, uFogFar:U.uFogFar, uFogK:{value:1},
    },
    vertexShader:`varying vec2 vUv; varying vec3 vW; void main(){ vUv=uv; vec4 wp=modelMatrix*vec4(position,1.); vW=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`
      uniform sampler2D uMap; uniform vec3 uColor,uFog; uniform float uOpacity,uWipe,uFogNear,uFogFar,uFogK;
      varying vec2 vUv; varying vec3 vW;
      ${FOG_GLSL}
      void main(){
        float a = texture2D(uMap,vUv).a * uOpacity;
        a *= smoothstep(0.,.05,uWipe-(1.-vUv.y));
        if(a<.003) discard;
        vec3 col = mix(uColor,uFog,fogF(vW,cameraPosition)*uFogK);
        gl_FragColor = vec4(col,a);
      }`
  });
  mat.userData.cv = cv; mat.userData.tex = tex;
  return mat;
}

/* ---- 平开窗扇（入口） ---- */
function frostMat(opt){
  return new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    uniforms:{
      uTint:{value:new THREE.Color(opt.tint||'#f4efe4')},
      uInner:{value:new THREE.Color(opt.inner||'#ffd9a4')},
      uInnerI:{value:opt.innerI!==undefined?opt.innerI:.5},
      uFrost:{value:opt.frost}, uBaseA:{value:opt.baseA!==undefined?opt.baseA:.08},
      uStreak:{value:opt.streak||0}, uCore:{value:opt.core||0},
      uLightDir:U.uLightDir, uFog:U.uFog, uFogNear:U.uFogNear, uFogFar:U.uFogFar, uTime:U.uTime,
    },
    vertexShader:`varying vec3 vN,vV,vW; varying vec2 vUv; varying float vLY; varying vec3 vLoc;
      void main(){ vUv=uv; vLY=position.y; vLoc=position; vec4 wp=modelMatrix*vec4(position,1.); vW=wp.xyz;
      vN=normalize(mat3(modelMatrix)*normal); vV=cameraPosition-wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`
      uniform vec3 uTint,uInner,uFog,uLightDir; uniform float uFrost,uBaseA,uStreak,uCore,uInnerI,uFogNear,uFogFar,uTime;
      varying vec3 vN,vV,vW; varying vec2 vUv; varying float vLY; varying vec3 vLoc;
      ${NOISE_GLSL}
      ${FOG_GLSL}
      void main(){
        vec3 N=normalize(vN),V=normalize(vV);
        float gr = vnoise(vLoc.xy*3.1+vLoc.z*.7)*.6 + vnoise(vLoc.zy*4.9)*.4;
        float fres = pow(1.-max(dot(N,V),0.),2.2);
        float back = pow(max(dot(V,-uLightDir),0.),2.4);
        float streak = 0.;
        if(uStreak>.5){ /* 擦痕：细软斜带 */
          float s1 = smoothstep(.016,.0,abs(fract(vUv.x*1.3+vUv.y*.62+.11)-.5));
          float s2 = smoothstep(.012,.0,abs(fract(vUv.x*.8-vUv.y*.4+.6)-.5));
          streak = (s1+s2)*.05;
        }
        float alpha = uBaseA + uFrost*(.3+.35*gr) + fres*.2 + streak + back*uInnerI*.22;
        vec3 col = mix(uTint, uInner, .3+.45*back*uInnerI);
        col += vec3(1.,.98,.92)*fres*.35;
        if(uCore>.5){
          col += uInner * smoothstep(.55,.0,abs(vLY-.35))*.55;
          alpha = max(alpha,.88);
        }
        alpha = clamp(alpha,0.,.96);
        col = mix(col,uFog,fogF(vW,cameraPosition));
        gl_FragColor = vec4(col,alpha);
      }`
  });
}

function mixc(a, b, t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);

  const g = Math.round(lerp(pa>>8&255, pb>>8&255, t));
  const bl = Math.round(lerp(pa&255, pb&255, t));
  return `rgb(${r},${g},${bl})`;
}

/* ============ compose：一切姿态均为状态纯函数 ============ */
function composeCamera(){
  const p = S.p;
  const mob = isMobile();
  const X0 = mob ? -8.0 : -11.5, X1 = mob ? 8.0 : 11.5;
  const camX = lerp(X0, X1, easeInOut(clamp01(p/.88)));
  const camY = (mob?2.3:1.75) - smooth(.45,.95,p)*.45;
  const camZ = (mob?21.5:13.2) - smooth(0,.3,p)*.6;
  let lx = camX*.42, ly = 2.55 - smooth(.45,.95,p)*.3, lz = 0;
  let fx = camX, fy = camY, fz = camZ;
  /* 终章：回到巨窗正前 */
  const fin = smooth(.86,1,p);
  fx = lerp(fx, GW.x, fin); fy = lerp(fy, 2.5, fin); fz = lerp(fz, mob?15.5:12.6, fin);
  lx = lerp(lx, GW.x, fin); ly = lerp(ly, GW.y-.4, fin); lz = lerp(lz, GW.z, fin);
  /* 聚焦入口窗 */
  if (S.focus >= 0){
    const D = PANE_DEF[S.focus], k = .6;
    fx = lerp(fx, D.x - 1.4, k); fy = lerp(fy, D.y + .1, k); fz = lerp(fz, D.z + 6.6, k*.7);
    lx = lerp(lx, D.x, .75); ly = lerp(ly, D.y, .75); lz = lerp(lz, D.z, .75);
  }
  camera.position.set(fx, fy, fz);
  camera.lookAt(lx, ly, lz);
  S.camX = fx;
}
function composePanes(){
  const dream = smooth(.45,.95,S.p);
  for (const P of panes){
    const D = P.def;
    const mob = isMobile();
    /* 挂窗：垂丝而降（自雾顶落下摆定） */
    const di = .06 + P.idx*.15;
    const drop = smooth(di, di+.24, S.L);
    P.pivot.position.x = D.x * (mob ? .68 : 1);
    P.pivot.position.y = D.y + Math.sin(S.t*.5 + D.ph)*D.bob + Math.sin(S.t*.23+D.ph*1.7)*D.bob*.4
      + (1-drop)*13;
    P.pivot.rotation.z = Math.sin(drop*10.5)*(1-drop)*.14;
    P.pivot.visible = drop > 0.001;
    /* 开窗角：hover / focus / 走过自动开缝 */
    const dist = Math.abs(S.camX - D.x);
    const visit = smooth(3.4,1.0,dist)*.32;
    const hov = (S.hover===P.idx) ? .55 : 0;
    const foc = (S.focus===P.idx) ? .62 : 0;
    let target = Math.max(visit, hov, foc);
    if (dream > .92 && S.focus !== P.idx) target = 0;
    P.openT = target;
    P.open += (P.openT - P.open) * ((IS_RM||IS_STILL) ? 1 : .08);
    P.inner.rotation.y = -P.open;
    P.latch.rotation.z = -P.open*1.6;
    P.imat.opacity = .8 + P.open*.06 + dream*.04;
    P.pivot.rotation.y = D.yaw + (dream>0.5 ? Math.sin(S.t*.11+D.ph)*.03*smooth(.5,.9,dream) : 0);
    /* 深梦：窗散（左窗远去/中窗升走/右窗远去），让出巨窗 */
    const drift = smooth(.86,.97,S.p);
    P.pivot.position.x = D.x * (mob ? .62 : 1) + drift*(P.idx===0?-5:(P.idx===2?5.2:0));
    P.pivot.position.y = P.pivot.position.y + drift*(P.idx===1?4.6:1.4)*(P.idx===1?1:.6);
    /* 光池 */
    const pool = floorU['uP'+P.idx].value;
    pool.x = D.x; pool.y = D.z; pool.z = 2.3 + P.open*.6;
    pool.w = (0.22 + P.open*.5 + dream*.22) * (S.booted?1:0);
  }
  /* 入梦：铭牌脱开（plate 下垂漂移） */
  for (const P of panes){
    const drift = smooth(.8,.96,S.p);
    P.plate.position.y = 1.68 + drift*(-.4 - (P.idx%2)*.5);
    P.plate.rotation.z = drift*.2*(P.idx-1);
  }
}
function composeKey(){
  const t = S.t, dream = smooth(.45,.95,S.p), fin = smooth(.84,.97,S.p);

    kx = GW.x + 1.6; ky = GW.y - 1.6 + Math.sin(t*.3)*.04*(1-fin); kz = GW.z + .13; // 停在玻璃面上（半穿而停）

    if (S.hover>=0 || S.focus>=0){

function renderOnce(){

let lastNow = 0, rafId = 0, autoT0 = 0, autoIv = 0, autoTick = 0;
const INTRO_DUR = 5200;
function autoStep(){
  const mul = IS_FAST ? 5 : 1;
  const now = performance.now();
  S.autoT = (now - autoT0)/1000 * mul;
  S.t += .033*mul;
  if (S.autoT < INTRO_DUR/1000){ S.L = clamp01(S.autoT/(INTRO_DUR/1000)); }
  else {
    if (!S.booted) boot();
    const st = S.autoT - INTRO_DUR/1000;
    S.p = autoPath(Math.min(st/26, 1));
  }
  updateLoadmask();
  if (INTRO_L !== null) S.L = INTRO_L;
  if ((autoTick++ % 2) === 0) renderOnce(); /* 虚拟时间下降渲染密度防丢上下文 */
  if (S.booted && S.autoT > INTRO_DUR/1000 + 26.5 && autoIv){ clearInterval(autoIv); autoIv = 0; }
}
function startLoop(){
  lastNow = performance.now();
  autoT0 = lastNow;
  if (IS_AUTO){
    /* 无头/虚拟时间环境 rAF 几乎不 tick（M 会话同款坑）：auto 用 setInterval 自驱 */
    autoIv = setInterval(autoStep, 33);
    return;
  }
  const tick = (now) => {
    rafId = requestAnimationFrame(tick);
    let dt = (now - lastNow)/1000; lastNow = now;
    if (dt > .1) dt = .1;
    S.t += dt;
    /* intro 时钟 */
    if (!S.booted){
      S.L = clamp01((performance.now() - S.t0)/INTRO_DUR);
      updateLoadmask();
      if (S.L >= 1) boot();
    } else {
      /* 滚动相位（每帧兜底读 scroll） */
      const doc = document.documentElement;
      const max = Math.max(doc.scrollHeight - innerHeight, 1);
      S.pRaw = clamp01((window.scrollY || doc.scrollTop || 0)/max);
      S.p += (S.pRaw - S.p)*Math.min(dt*6, 1);
      if (S.pRaw > .02) document.body.classList.add('scrolled');
    }
    if (PIN !== null) S.p = PIN;
    if (INTRO_L !== null) S.L = INTRO_L;
    renderOnce();
  };
  rafId = requestAnimationFrame(tick);
}
/* auto 分镜：驻留三窗 + 终章 */
const AKEYS = [[0,0],[.11,0],[.2,.235],[.3,.235],[.4,.5],[.5,.5],[.6,.775],[.7,.775],[.86,1],[1,1]];
function autoPath(u){
  for (let i=0;i<AKEYS.length-1;i++){
    if (u <= AKEYS[i+1][0]){
      const [u0,p0] = AKEYS[i], [u1,p1] = AKEYS[i+1];
      return lerp(p0, p1, smooth(0,1,(u-u0)/Math.max(u1-u0,.0001)));
    }
  }
  return 1;
}
