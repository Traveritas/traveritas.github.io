<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 C · 醒与梦的边界</title>
<style>
  :root {
    --paper: #f8f9f8;
    --ink: #232930;
    --ink-soft: #545f6a;
    --ink-faint: #6f7a85;
    --line: #dfe4e7;
    --mist: #a9bdc9;
    --mist-soft: #ccd8e0;
    --mist-ink: #4c6a80;
    --blush: #d8c4c9;
    --blush-soft: #e9dee1;
    --blush-ink: #8d6f77;
    --font-display: 'Palatino Linotype', 'Iowan Old Style', Palatino, Georgia,
      'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', SimSun, serif;
    --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB',
      'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    overflow: hidden;
  }

  /* 两态底色：左上醒（冷），右下梦（暖），一道宽而软的雾界 */
  .stage {
    position: relative;
    height: 100dvh;
    background:
      radial-gradient(66vw 62vh at 6% 4%, rgba(169, 189, 201, 0.3), transparent 70%),
      linear-gradient(118deg,
        rgba(169, 189, 201, 0.22) 0%,
        rgba(169, 189, 201, 0.06) 30%,
        rgba(216, 196, 201, 0.12) 52%,
        rgba(216, 196, 201, 0.3) 100%),
      var(--paper);
  }

  /* ── 宣言：跨过边界，向梦侧逐渐柔化 ── */
  .manifesto {
    position: absolute;
    left: 15vw; top: 24vh;
    margin: 0;
    z-index: 3;
  }

  .manifesto .main {
    position: relative;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.5rem, 3.3vw, 2.6rem);
    line-height: 1.85;
    letter-spacing: 0.03em;
    margin: 0;
    max-width: 22em;
  }

  /* 清晰底本 */
  .manifesto .base { display: block; }

  /* 梦侧模糊叠影：仅右半渐显，轻微错位 */
  .manifesto .dream {
    position: absolute;
    inset: 0;
    display: block;
    color: var(--blush-ink);
    filter: blur(4px);
    opacity: 0.7;
    transform: translate(0.16em, 0.12em);
    mask-image: linear-gradient(to right, transparent 12%, black 62%);
    -webkit-mask-image: linear-gradient(to right, transparent 12%, black 62%);
    pointer-events: none;
  }

  .manifesto .sub {
    margin: 2rem 0 0;
    font-size: 0.92rem;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
  }

  /* ── 界上碎块：左半清晰，右半磨砂 ── */
  .boundary-shard {
    position: absolute;
    top: 12vh; left: 58vw;
    width: 24vw; height: 62vh;
    z-index: 2;
  }

  .boundary-shard svg { width: 100%; height: 100%; display: block; }

  /* ── 竖排导航（单列，短线引向内容） ── */
  .nav {
    position: absolute;
    left: 3.5vw; top: 26vh;
    display: flex;
    flex-direction: column;
    gap: 2.4rem;
    z-index: 6;
  }

  .nav a {
    position: relative;
    writing-mode: vertical-rl;
    letter-spacing: 0.5em;
    padding: 0.4rem 0;
    color: var(--ink-soft);
    text-decoration: none;
    transition: color 0.18s ease;
  }

  .nav a::after {
    content: '';
    position: absolute;
    top: 45%;
    left: calc(100% + 0.5rem);
    width: 1.4rem;
    height: 1px;
    background: var(--line);
    transition: background 0.18s ease, width 0.18s ease;
  }

  .nav a:hover { color: var(--ink); }
  .nav a:hover::after { background: var(--mist); width: 1.9rem; }

  .brand {
    position: absolute;
    top: 4.5vh; left: 4vw;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-family: var(--font-display);
    color: var(--ink);
    text-decoration: none;
    z-index: 6;
  }

  .brand svg { width: 16px; height: 16px; color: var(--mist-ink); }

  :focus-visible {
    outline: 2px solid var(--mist-ink);
    outline-offset: 3px;
  }

  @media (max-width: 720px) {
    body { overflow: auto; }

    .stage { height: auto; min-height: 100dvh; padding: 20vh 10vw 16vh; }

    .manifesto { position: static; }
    .manifesto .main { font-size: clamp(1.35rem, 6.6vw, 1.9rem); }

    .boundary-shard { top: 8vh; left: 62vw; width: 34vw; height: 34vh; opacity: 0.85; }

    .nav { position: static; margin-bottom: 3rem; flex-direction: row; gap: 1.8rem; }
    .nav a { writing-mode: horizontal-tb; letter-spacing: 0.2em; border-right: none; padding: 0.2rem 0 0.6rem; }
    .nav a::after { display: none; }
  }
</style>
</head>
<body>
<div class="stage">

  <a class="brand" href="/">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 1.6 19.9 8.7 16.9 22.2 7.3 22.4 4.1 9.5Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M12 1.6 9.4 22.3M12 1.6l4.9 20.6M4.1 9.5l15.8-.8" stroke="currentColor" stroke-width="0.55" stroke-opacity="0.5"/>
    </svg>
    <span>Traveritas</span>
  </a>

  <!-- 竖排导航 -->
  <nav class="nav" aria-label="站内入口">
    <a href="/articles/">随笔</a>
    <a href="/projects/">项目</a>
    <a href="/about/">关于</a>
  </nav>

  <!-- 界上碎块 -->
  <div class="boundary-shard" aria-hidden="true">
    <svg viewBox="0 0 100 220" preserveAspectRatio="none">
      <defs>
        <clipPath id="shardclip">
          <path d="M30 0 L88 22 L104 96 L82 204 L30 220 L4 150 L0 62 Z"/>
        </clipPath>
      </defs>
      <!-- 左半：清晰描边 -->
      <path d="M30 0 L88 22 L104 96 L82 204 L30 220 L4 150 L0 62 Z"
            fill="rgba(204, 216, 224, 0.20)" stroke="rgba(76,106,128,0.35)" stroke-width="0.6"/>
      <!-- 右半：磨砂 -->
      <foreignObject x="50" y="0" width="54" height="220" clip-path="url(#shardclip)">
        <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;background:rgba(233,222,225,0.5);backdrop-filter:blur(14px) saturate(1.05);-webkit-backdrop-filter:blur(14px) saturate(1.05);"></div>
      </foreignObject>
      <!-- 晶面细线 -->
      <path d="M30 0 L44 110 L30 220 M88 22 L60 96 M4 150 L44 110 L82 204 M0 62 L60 96 L104 96"
            stroke="rgba(76,106,128,0.18)" stroke-width="0.4" fill="none"/>
    </svg>
  </div>

  <!-- 宣言（跨边界） -->
  <div class="manifesto">
    <p class="main">
      <span class="base">这里不是梦，也不是现实。它是人在<br/>即将醒来时，看见的最后一层世界。</span>
      <span class="dream" aria-hidden="true">这里不是梦，也不是现实。它是人在<br/>即将醒来时，看见的最后一层世界。</span>
    </p>
    <p class="sub">醒与梦之间，没有明显的开关。</p>
  </div>

</div>
</body>
</html>
