<!doctype html>
<html><head><meta charset="utf-8"><title>blit probe</title>
<style>body{margin:0;background:#f0f3f6}canvas{display:block}</style>
</head><body>
<canvas id="c" width="400" height="200"></canvas>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
<script type="module">
import { FormView, paintGrid } from './src.js';

const canvas = document.getElementById('c');
const view = new FormView(canvas, { width: 400, height: 200, dprCap: 1, ground: 0x2a2b38 });

/* 左格：深底；右格：白底。应当是两个完全不同的实色方块。 */
paintGrid(view, [
  { x: 0, y: 0, size: 200, form: 'flower', mat: 'frost', ground: 0x2a2b38, pose: { rx: 24, ry: 26 } },
  { x: 200, y: 0, size: 200, form: 'flower', mat: 'frost', ground: 0xf0f3f6, pose: { rx: 24, ry: 26 } },
], { width: 400, height: 200 });

const ctx = canvas.getContext('2d');
const probe = (x, y) => {
  const d = ctx.getImageData(x, y, 1, 1).data;
  return [d[0], d[1], d[2], d[3]].join(',');
};
window.__blit = {
  topLeft: probe(6, 6),
  leftMid: probe(20, 100),
  rightMid: probe(220, 100),
  leftCorner: probe(190, 190),
  rightCorner: probe(390, 190),
};
</script>
</body></html>
