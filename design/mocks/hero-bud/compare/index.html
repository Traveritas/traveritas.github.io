<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晶苞 · 梦面对比</title>
<style>
  :root { --bg: #efe8ee; --fg: #232830; --fg-soft: #56606d; --fg-faint: #858f9d; --amber: #d9a05b; --line: rgba(35,40,48,.12); }
  * { box-sizing: border-box; }
  body { margin: 0; background: linear-gradient(180deg, #f4eff3, #ebe3e9); color: var(--fg);
    font: 13px/1.6 system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; padding: 28px 16px 40px; }
  header { max-width: 1320px; margin: 0 auto 20px; }
  .kicker { font: 11px/1 ui-monospace, Consolas, monospace; letter-spacing: .14em; color: var(--amber); }
  h1 { font: 600 20px/1.4 'Noto Serif SC', 'Songti SC', serif; margin: 6px 0 4px; }
  p { margin: 0; color: var(--fg-soft); }
  .grid { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .col { border: 1px solid var(--line); border-radius: 4px; background: rgba(255,255,255,.35); padding: 12px; }
  .col h2 { font: 600 14px/1.4 'Noto Serif SC', serif; margin: 0; }
  .col .tag { font: 11px ui-monospace, Consolas, monospace; color: var(--fg-faint); letter-spacing: .08em; }
  .col p { font-size: 12px; margin: 4px 0 8px; min-height: 3.2em; }
  figure { margin: 0; position: relative; aspect-ratio: 1; background: radial-gradient(circle, #f3ecf5 0 45%, transparent 70%); }
  figure img { width: 100%; height: 100%; display: block; }
  figcaption { position: absolute; left: 6px; bottom: 4px; font: 10px ui-monospace, Consolas, monospace; color: var(--fg-faint); }
  .wake { max-width: 1320px; margin: 0 auto 14px; display: flex; gap: 14px; align-items: center; }
  .wake figure { width: 160px; flex: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">HERO · CRYSTAL BUD · DREAM FORMS</div>
  <h1>梦面形态对比</h1>
  <p>醒面四者相同（下方小图）。每列上图为展开一半，下图为完全展开。</p>
</header>
<div class="wake"><figure><img src="wake.webp" alt="醒面"><figcaption>醒 · 共用</figcaption></figure></div>
<div class="grid">
  <div class="col"><span class="tag">v1 · BEND</span><h2>平滑外卷</h2><p>参照：当前已保存的版本。</p>
    <figure><img src="bend_55.webp" alt=""><figcaption>0.55</figcaption></figure><figure><img src="bend_100.webp" alt=""><figcaption>1.0</figcaption></figure></div>
  <div class="col"><span class="tag">01 · FOLD</span><h2>折面瓣</h2><p>每片在中段一道直折痕向外折，外轮 62°、内轮 42°。轮廓仍是百合，但每段都是平面。</p>
    <figure><img src="fold_55.webp" alt=""><figcaption>0.55</figcaption></figure><figure><img src="fold_100.webp" alt=""><figcaption>1.0</figcaption></figure></div>
  <div class="col"><span class="tag">02 · STRATA</span><h2>层裂</h2><p>每片厚板沿厚度劈成三层薄片，外层开得最多，像扇面错开；板本身不弯。</p>
    <figure><img src="strata_55.webp" alt=""><figcaption>0.55</figcaption></figure><figure><img src="strata_100.webp" alt=""><figcaption>1.0</figcaption></figure></div>
  <div class="col"><span class="tag">05 · STAR</span><h2>滑移成星</h2><p>每片板在自身平面内绕形心转 30° 并沿法向浮出，尖角伸出原轮廓，成为一个更松的星状晶体。</p>
    <figure><img src="star_55.webp" alt=""><figcaption>0.55</figcaption></figure><figure><img src="star_100.webp" alt=""><figcaption>1.0</figcaption></figure></div>
</div>
</body>
</html>
