<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>probe7 presets</title>
    <style>
      body { margin: 0; background: #f0f3f6; font: 11px system-ui, sans-serif; }
      .row { display: flex; gap: 26px; padding: 12px 16px; flex-wrap: wrap; align-items: flex-end; }
      .c { text-align: center; }
      .c span { display: block; font-size: 10px; color: #56606d; margin-top: 4px; }
      .lead { padding: 12px 16px 0; font-weight: 600; color: #232830; }
      .g { padding: 16px; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <div id="wrap"></div>
    <script type="module">
      import { svg, PRESETS, PRESET_KEYS } from './src.js';
      const rows = [];
      for (const size of [400, 200]) {
        rows.push(`<div class="lead">预设 · ${size}px</div><div class="row">`);
        for (const k of PRESET_KEYS) {
          const p = PRESETS[k];
          rows.push(`<div class="c">${svg(p.opts, { size })}<span>${p.name} · ${k}</span></div>`);
        }
        rows.push(`<div class="c">${svg({ legacy: true }, { size })}<span>现役 flat</span></div></div>`);
      }
      rows.push(`<div class="lead">预设 · 200px 深底</div><div class="row">`);
      for (const k of PRESET_KEYS) rows.push(`<div class="c">${svg(PRESETS[k].opts, { size: 200, ground: 'dark' })}<span>${PRESETS[k].name}</span></div>`);
      rows.push('</div>');
      rows.push(`<div class="lead">尺寸 48 / 96</div><div class="row">`);
      for (const size of [48, 96]) for (const k of PRESET_KEYS) rows.push(`<div class="c">${svg(PRESETS[k].opts, { size })}<span>${size} · ${PRESETS[k].name}</span></div>`);
      rows.push(`<div class="c">${svg({ legacy: true }, { size: 48 })}<span>48 现役</span></div></div>`);
      document.getElementById('wrap').innerHTML = rows.join('');
    </script>
  </body>
</html>
