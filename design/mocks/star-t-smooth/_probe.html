<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>probe</title>
    <style>
      body { margin: 0; background: #f0f3f6; font: 12px system-ui, sans-serif; }
      .row { display: flex; gap: 10px; padding: 10px; flex-wrap: wrap; align-items: flex-end; }
      .c { text-align: center; }
      .c span { display: block; font-size: 10px; color: #56606d; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <div class="row" id="a"></div>
    <script type="module">
      import { svg } from './src.js';
      const m = (o, size = 260, view = 'full') => svg(o, { size, view });
      const box = (html, label) => `<div class="c">${html}<span>${label}</span></div>`;
      const rows = [];
      // 1. legacy
      rows.push(box(m({ legacy: true }), 'legacy flat'));
      rows.push(box(m({ legacy: true, tones: { steps: 2, min: 0.486, max: 0.774, depth: 1 }, hub: { mode: 'table', radius: 1.7, lift: 0 } }), 'legacy 2tone'));
      // 2. ridge fold sweep
      for (const fold of [0, 0.4, 0.8, 1.2, 1.7, 2.4]) rows.push(box(m({ fold }), 'fold ' + fold));
      document.getElementById('a').innerHTML = rows.join('');
    </script>
  </body>
</html>
