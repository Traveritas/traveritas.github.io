<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#f0f3f6;font:11px system-ui}.r{display:flex;gap:10px;padding:8px;flex-wrap:wrap;align-items:flex-end}.c{text-align:center}.c span{display:block;font-size:10px;color:#56606d}svg{display:block}</style></head><body><div class="r" id="w"></div>
<script type="module">
import { svg, star } from './src.js';
const out=[];
for(const fillet of [0,0.06,0.12,0.18,0.24,0.30]){
  const o={sides:8,fold:1.2,fillet,tones:{steps:5,min:0.1,max:0.94,depth:0.22}};
  out.push(`<div class="c">${svg(o,{size:300,view:'core',box:11})}<span>fillet ${fillet} · ${star(o).stats.paths}p/${star(o).stats.cells}c</span></div>`);
}
for(const fillet of [0,0.12,0.24]){
  const o={sides:8,fold:1.2,fillet,tones:{steps:5,min:0.1,max:0.94,depth:0.22}};
  out.push(`<div class="c">${svg(o,{size:300,view:{box:4.2,cx:4.6,cy:4.4}})}<span>edge ${fillet}</span></div>`);
}
document.getElementById('w').innerHTML=out.join('');
</script></body></html>
