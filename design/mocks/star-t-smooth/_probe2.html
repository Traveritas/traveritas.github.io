<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>probe2</title>
    <style>
      body { margin: 0; background: #f0f3f6; font: 12px system-ui, sans-serif; }
      .row { display: flex; gap: 8px; padding: 8px; flex-wrap: wrap; align-items: flex-end; }
      .c { text-align: center; }
      .c span { display: block; font-size: 10px; color: #56606d; }
      .lead { padding: 6px 10px 0; font-weight: 600; color: #232830; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <div id="wrap"></div>
    <script type="module">
      import { svg } from './src.js';
      const F = 1.2;
      const rows = [];
      const add = (title, list) => {
        rows.push(`<div class="lead">${title}</div><div class="row">`);
        for (const [o, lab, size, view] of list) rows.push(`<div class="c">${svg(o, { size, view })}<span>${lab}</span></div>`);
        rows.push('</div>');
      };
      // 尖端（放大看）
      add('① 尖端 · 放大 viewBox 7.4', [
        [{ fold: F, tip: { kind: 'cusp' } }, 'cusp', 220, 'zoom'],
        [{ fold: F, tip: { kind: 'flat', len: 0.5 } }, 'flat .5', 220, 'zoom'],
        [{ fold: F, tip: { kind: 'flat', len: 1.2 } }, 'flat 1.2', 220, 'zoom'],
        [{ fold: F, tip: { kind: 'flat', len: 2.6 } }, 'flat 2.6', 220, 'zoom'],
        [{ fold: F, tip: { kind: 'round', rho: 0.3, segs: 3 } }, 'round .3/3', 220, 'zoom'],
        [{ fold: F, tip: { kind: 'round', rho: 0.7, segs: 3 } }, 'round .7/3', 220, 'zoom'],
        [{ fold: F, tip: { kind: 'round', rho: 0.7, segs: 4 } }, 'round .7/4', 220, 'zoom'],
        [{ fold: F, tip: { kind: 'round', rho: 1.5, segs: 4 } }, 'round 1.5/4', 220, 'zoom'],
      ]);
      // 棱（倒角带）
      add('③ 棱 · 正面 viewBox 9', [
        [{ fold: F, rim: 0 }, 'rim 0', 220, 'zoomCore'],
        [{ fold: F, rim: 0.08 }, 'rim .08', 220, 'zoomCore'],
        [{ fold: F, rim: 0.16 }, 'rim .16', 220, 'zoomCore'],
        [{ fold: F, rim: 0.3 }, 'rim .30', 220, 'zoomCore'],
        [{ fold: F, rim: 0.16, turn: 0.4 }, 'rim .16 t.4', 220, 'zoomCore'],
        [{ fold: F, rim: 0.16, turn: -0.5 }, 'rim .16 t-.5', 220, 'zoomCore'],
      ]);
      // 截面
      add('④ 截面 · 整颗', [
        [{ fold: F, sides: 4 }, '4 边', 260, 'full'],
        [{ fold: F, sides: 6 }, '6 边', 260, 'full'],
        [{ fold: F, sides: 8 }, '8 边', 260, 'full'],
        [{ fold: F, sides: 6, rim: 0.14 }, '6 边 + 棱', 260, 'full'],
        [{ fold: F, sides: 8, rim: 0.14 }, '8 边 + 棱', 260, 'full'],
      ]);
      // 中心
      add('中心 · 放大 viewBox 9', [
        [{ fold: F, hub: { mode: 'none' } }, 'none', 220, 'zoomCore'],
        [{ fold: F, hub: { mode: 'table', radius: 2.3 } }, 'table 2.3', 220, 'zoomCore'],
        [{ fold: F, hub: { mode: 'table', radius: 3.2 } }, 'table 3.2', 220, 'zoomCore'],
        [{ fold: F, hub: { mode: 'split', radius: 2.6 } }, 'split 2.6', 220, 'zoomCore'],
        [{ fold: F, hub: { mode: 'pale', radius: 2.6 } }, 'pale', 220, 'zoomCore'],
        [{ fold: F, notch: 0, hub: { mode: 'none' } }, 'notch0 none', 220, 'zoomCore'],
        [{ fold: F, notch: 2.6, hub: { mode: 'none' } }, 'notch2.6 none', 220, 'zoomCore'],
      ]);
      document.getElementById('wrap').innerHTML = rows.join('');
    </script>
  </body>
</html>
