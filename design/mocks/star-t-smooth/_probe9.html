<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>probe9 sections</title>
    <style>
      body { margin: 0; background: #f0f3f6; font: 11px system-ui, sans-serif; }
      .row { display: flex; gap: 12px; padding: 10px 14px; flex-wrap: wrap; align-items: flex-end; }
      .c { text-align: center; } .c span { display: block; font-size: 10px; color: #56606d; margin-top: 3px; }
      .lead { padding: 10px 14px 0; font-weight: 600; } svg { display: block; }
    </style>
  </head>
  <body>
    <div id="wrap"></div>
    <script type="module">
      import { svg, star } from './src.js';
      const rows = [];
      const T = { steps: 5, min: 0.1, max: 0.94, depth: 0.22 };
      for (const [title, view, box] of [['整颗 200', 'full', null], ['中心放大 box 11', 'core', 11], ['尖端放大 box 8', 'tip', 8]]) {
        rows.push(`<div class="lead">${title}</div><div class="row">`);
        for (const sides of [4, 6, 8]) {
          const o = { sides, fold: 1.2, fillet: 0, tones: T };
          rows.push(`<div class="c">${svg(o, { size: 240, view, box: box || 7.2 })}<span>${sides} 边 无圆角<br>${star(o).stats.paths} path / ${star(o).stats.cells} 片</span></div>`);
        }
        for (const sides of [6, 8]) {
          const o = { sides, fold: 1.2, fillet: 0.14, tones: T };
          rows.push(`<div class="c">${svg(o, { size: 240, view, box: box || 7.2 })}<span>${sides} 边 圆角 .14<br>${star(o).stats.paths} path / ${star(o).stats.cells} 片</span></div>`);
        }
        rows.push('</div>');
      }
      document.getElementById('wrap').innerHTML = rows.join('');
    </script>
  </body>
</html>
