<script type="module">
import { svg, star } from './src.js';
const cands = {

  'softC 6边 f.7': {sides:6,fold:0.7,fillet:0.22,tip:{kind:'round',rho:0.24,segs:3},tones:{steps:3,min:0.26,max:0.82,depth:0.3},hub:{mode:'pale',radius:2.5}},
  'frostA 6边 f1.0': {sides:6,fold:1.0,fillet:0.14,tip:{kind:'flat',len:0.5},tones:{steps:4,min:0.18,max:0.88,depth:0.24},hub:{mode:'table',radius:2.3}},

};
const out=[];
for(const [k,o] of Object.entries(cands)){
  const st=star(o).stats;
  out.push(`<div class="c">${svg(o,{size:300})}<span>${k}<br>${st.paths}p / ${st.cells}c / ${st.tones.length}档</span></div>`);
}
document.getElementById('w').innerHTML=out.join('');
</script></body></html>
