<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>probe6</title>
    <style>
      body { margin: 0; background: #f0f3f6; font: 11px system-ui, sans-serif; }
      .row { display: flex; gap: 14px; padding: 10px 14px; flex-wrap: wrap; align-items: flex-end; }
      .c { text-align: center; }
      .c span { display: block; font-size: 10px; color: #56606d; margin-top: 3px; }
      .lead { padding: 10px 14px 0; font-weight: 600; color: #232830; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <div id="wrap"></div>
    <script type="module">
      import { svg } from './src.js';
      const nrm = (v) => { const l = Math.hypot(...v); return v.map((x) => x / l); };
      const rows = [];
      const add = (title, list) => {
        rows.push(`<div class="lead">${title}</div><div class="row">`);
        for (const [o, lab] of list) rows.push(`<div class="c">${svg(o, { size: 300 })}<span>${lab}</span></div>`);
        rows.push('</div>');
      };
      const cands = {
        'up+z 0.5': [0, 0.5, 0.866],
        'up+z 0.26': [0, 0.259, 0.966],
        'up+z 0.87': [0, 0.866, 0.5],
        'screen-up': [0, 1, 0.02],
        'left-up+z': [-0.34, 0.52, 0.79],
        'view+z': [0, 0, 1],
        'x+.3y+.9z': [0.337, 0.174, 0.925],
        'x-.3y+.5z': [-0.337, 0.5, 0.8],
      };
      add('光向 · 8 边 / 脊 1.2 / 圆角 0.12', Object.entries(cands).map(([k, v]) => [{ sides: 8, fold: 1.2, fillet: 0.12, light: nrm(v) }, k]));
      add('光向 · 4 边 / 脊 1.2', Object.entries(cands).map(([k, v]) => [{ sides: 4, fold: 1.2, light: nrm(v) }, k]));
      document.getElementById('wrap').innerHTML = rows.join('');
    </script>
  </body>
</html>
