<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>工具星 · 声音主图标方案对照</title>
<style>
  :root {
    --bg: #f0f3f6;
    --bg-sunken: #e5ebf2;
    --fg: #232830;
    --fg-soft: #56606d;
    --fg-faint: #858f9d;
    --line: rgba(35, 40, 48, 0.12);
    --amber: #9a86c4;
    --chrome-bg: rgba(247, 249, 253, 0.78);
    --chrome-edge: rgba(255, 255, 255, 0.84);
    --chrome-hi: rgba(255, 255, 255, 0.74);
    --chrome-sh: rgba(35, 40, 48, 0.14);
    --font-body: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei UI', sans-serif;
    --font-mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  }
  :root[data-face='dream'] {
    --bg: #121327;
    --bg-sunken: #0c0d1b;
    --fg: #ece7f3;
    --fg-soft: #b7b0c8;
    --fg-faint: #847e98;
    --line: rgba(236, 231, 243, 0.14);
    --chrome-bg: rgba(22, 22, 42, 0.78);
    --chrome-edge: rgba(190, 180, 230, 0.24);
    --chrome-hi: rgba(236, 231, 243, 0.12);
    --chrome-sh: rgba(0, 0, 0, 0.44);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 32px 44px;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    transition: background-color .35s, color .35s;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.06em;
  }
  header small {
    font: 11px var(--font-mono);
    color: var(--fg-faint);
    letter-spacing: 0.1em;
    margin-left: 10px;
  }
  .bar { display: flex; gap: 8px; }
  .pill {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--chrome-bg);
    color: var(--fg-soft);
    padding: 5px 12px;
    border-radius: 999px;
    font: 12px var(--font-body);
    cursor: pointer;
    transition: color .2s, border-color .2s, background-color .2s;
  }
  .pill[aria-pressed='true'] {
    color: var(--amber);
    border-color: color-mix(in srgb, var(--amber) 55%, transparent);
  }

  /* Grid of candidates */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }
  .card {
    background: var(--chrome-bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px 18px 15px;
    cursor: pointer;
    transition: border-color .2s, transform .2s, box-shadow .2s;
    position: relative;
  }
  .card:hover { border-color: color-mix(in srgb, var(--fg) 26%, transparent); }
  .card.is-picked {
    border-color: var(--amber);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--amber) 35%, transparent);
  }
  .card.is-ref { border-style: dashed; }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .card-title { font-size: 13px; font-weight: 500; letter-spacing: 0.03em; }
  .card-tag {
    font: 10px var(--font-mono);
    color: var(--fg-faint);
    letter-spacing: 0.08em;
  }
  .samples {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 6px 12px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 10px;
  }
  .sample-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .sample-col span {
    font: 10px var(--font-mono);
    color: var(--fg-faint);
    letter-spacing: 0.06em;
  }
  .box-lg {
    width: 64px;
    height: 64px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: color-mix(in srgb, var(--bg-sunken) 70%, transparent);
    color: var(--fg);
  }
  .box-sm {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: var(--fg-soft);
    background: color-mix(in srgb, var(--fg) 4%, transparent);
  }
  .box-sm.is-on { color: var(--fg); }
  .card-desc {
    margin: 0;
    font-size: 12px;
    line-height: 1.55;
    color: var(--fg-soft);
  }

  /* Icon base (matches Toolstar.astro) */
  .ts-ico {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.25;
    stroke-linecap: round;
    stroke-linejoin: round;
    overflow: visible;
  }
  .box-lg .ts-ico { width: 52px; height: 52px; }
  .ts-ico .ts-fill { fill: currentColor; fill-opacity: 0.2; stroke: none; }
  .ts-ico .ts-fill--face { fill-opacity: 0.32; }
  .ts-ico .ts-dot { fill: currentColor; stroke: none; }
  .ts-ico .ts-knob { fill: var(--bg); }

  /* ── Candidate states & animations ── */
  /* 0: Current */
  .snd-0.is-on path { animation: pulse-all 2.4s ease-in-out infinite; }
  @keyframes pulse-all { 0%,100% { stroke-opacity: .9; } 20% { stroke-opacity: .35; } }

  /* 1: Faceted Speaker */
  .snd-1 .wave { transition: opacity .35s, transform .35s; transform-box: view-box; transform-origin: 12px 12px; }
  .snd-1:not(.is-on) .wave { opacity: 0.25; transform: translateX(-1px) scale(0.92); }
  .snd-1.is-on .w1 { animation: wave-lit 2.2s ease-in-out infinite; }
  .snd-1.is-on .w2 { animation: wave-lit 2.2s ease-in-out 0.38s infinite; }
  @keyframes wave-lit { 0%,100% { opacity: 0.95; } 45% { opacity: 0.28; } }

  /* 2A: 14° Tuning Fork */
  .snd-2a .res { transition: opacity .35s, transform .35s; transform-box: view-box; transform-origin: 12px 7.5px; }
  .snd-2a:not(.is-on) .res { opacity: 0.22; transform: scaleX(0.86); }
  .snd-2a.is-on .res { animation: fork-res 2.2s ease-in-out infinite alternate; }
  @keyframes fork-res { from { opacity: 0.35; transform: scaleX(0.92); } to { opacity: 0.95; transform: scaleX(1.06); } }

  /* 2B: Crystal Wind Chime */
  .snd-2b .clapper { transform-box: view-box; transform-origin: 12px 13px; transition: transform .35s; }
  .snd-2b .wisp { transition: opacity .35s; }
  .snd-2b:not(.is-on) .wisp { opacity: 0.16; }
  .snd-2b.is-on .clapper { animation: sway 2.8s ease-in-out infinite alternate; }
  .snd-2b.is-on .wisp-l { animation: wave-lit 2.8s ease-in-out infinite; }
  .snd-2b.is-on .wisp-r { animation: wave-lit 2.8s ease-in-out 1.4s infinite; }
  @keyframes sway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }

  /* 3: Dual-phase Standing Wave */
  .snd-3 .wave-main, .snd-3 .wave-echo {
    transform-box: view-box;
    transform-origin: 12px 12px;
    transition: transform .45s cubic-bezier(0.16,1,0.3,1), opacity .4s;
  }
  .snd-3:not(.is-on) .wave-main { transform: scaleY(0.32); opacity: 0.72; }
  .snd-3:not(.is-on) .wave-echo { transform: scaleY(0.18); opacity: 0.22; }
  .snd-3.is-on .wave-main { animation: sw-a 2.4s ease-in-out infinite alternate; }
  .snd-3.is-on .wave-echo { opacity: 0.45; animation: sw-b 3.1s ease-in-out infinite alternate; }
  @keyframes sw-a { from { transform: scaleY(0.76); } to { transform: scaleY(1.06); } }
  @keyframes sw-b { from { transform: scaleY(-0.55); } to { transform: scaleY(0.88); } }

  /* 4: Centered Resonant Bars */
  .snd-4 line {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform .4s cubic-bezier(0.16,1,0.3,1);
  }
  .snd-4:not(.is-on) line { transform: scaleY(0.36); }
  .snd-4.is-on line:nth-child(1) { animation: bar-b 1.9s ease-in-out infinite alternate; }
  .snd-4.is-on line:nth-child(2) { animation: bar-b 1.45s ease-in-out 0.2s infinite alternate; }
  .snd-4.is-on line:nth-child(3) { animation: bar-b 2.25s ease-in-out 0.1s infinite alternate; }
  .snd-4.is-on line:nth-child(4) { animation: bar-b 1.65s ease-in-out 0.35s infinite alternate; }
  .snd-4.is-on line:nth-child(5) { animation: bar-b 2.05s ease-in-out 0.15s infinite alternate; }
  @keyframes bar-b { from { transform: scaleY(0.42); } to { transform: scaleY(1.04); } }

  /* 5: Centered Crystal + 3 Arcs */
  .snd-5 .arc { transition: opacity .35s; }
  .snd-5:not(.is-on) .a1 { opacity: 0.5; }
  .snd-5:not(.is-on) .a2 { opacity: 0.35; }
  .snd-5:not(.is-on) .a3 { opacity: 0.24; }
  .snd-5.is-on .a1 { animation: arc-seq 2.4s ease-in-out 0s infinite; }
  .snd-5.is-on .a2 { animation: arc-seq 2.4s ease-in-out 0.32s infinite; }
  .snd-5.is-on .a3 { animation: arc-seq 2.4s ease-in-out 0.64s infinite; }
  @keyframes arc-seq { 0%,100% { opacity: 0.95; } 35% { opacity: 0.24; } }

  /* ── Context strip: actual Toolstar ring order ── */
  .ctx-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 780px) { .ctx-wrap { grid-template-columns: 1fr; } }
  .ctx-panel {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px 20px;
    background: var(--chrome-bg);
  }
  .ctx-panel h2 {
    margin: 0 0 14px;
    font-size: 12px;
    font-weight: 500;
    color: var(--fg-soft);
    letter-spacing: 0.08em;
    display: flex;
    justify-content: space-between;
  }
  .ctx-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .ctx-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--fg-soft);
    position: relative;
  }
  .ctx-btn.is-hi {
    color: var(--amber);
    background: color-mix(in srgb, var(--amber) 10%, transparent);
  }
  .ctx-sep {
    width: 1px;
    height: 18px;
    background: var(--line);
    margin: 0 4px;
  }
  .orbit-box {
    position: relative;
    height: 204px;
    overflow: hidden;
    border-radius: 6px;
    background:
      radial-gradient(circle at 38px 166px, var(--chrome-bg) 0, var(--chrome-bg) 144px, transparent 145px),
      linear-gradient(135deg, color-mix(in srgb, var(--amber) 10%, var(--bg-sunken)), var(--bg));
    border: 1px solid var(--line);
  }
  .orbit-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .orbit-item {
    position: absolute;
    width: 36px;
    height: 36px;
    margin: -18px 0 0 -18px;
    display: grid;
    place-items: center;
    color: var(--fg-soft);
    border-radius: 50%;
  }
  .orbit-item.is-hi { color: var(--amber); }
</style>
</head>
<body>
  <header>
    <div>
      <h1>工具星 · 声音主图标候选对照<small>VIEWBOX 24×24 · STROKE 1.25</small></h1>
    </div>
    <div class="bar">
      <button class="pill" id="btn-face" aria-pressed="false">昼 / 夜</button>
      <button class="pill" id="btn-sound" aria-pressed="true">状态：有声</button>
    </div>
  </header>

  <section class="grid" id="grid"></section>

  <section class="ctx-wrap">
    <div class="ctx-panel">
      <h2><span>同圈 6 图标并排（22px 原寸）</span><span id="picked-name" style="font-family:var(--font-mono)"></span></h2>
      <div class="ctx-row" id="strip-row"></div>
    </div>
    <div class="ctx-panel">
      <h2><span>工具星弧轨实境（星心半径 104px）</span><span style="font-family:var(--font-mono)">点上方卡片切换</span></h2>
      <div class="orbit-box" id="orbit-box"></div>
    </div>
  </section>
<script>
const OTHER = {
  face: '<circle cx="12" cy="12" r="7"/><g><path class="ts-fill ts-fill--face" d="M13.69 5.21A7 7 0 0 1 10.31 18.79Z"/><path d="M14.3 2.8 9.7 21.2"/></g>',
  go: '<path class="ts-fill" d="M12 4.5 18.5 8.25 12 12 5.5 8.25Z"/><path d="M12 4.5 18.5 8.25V15.75L12 19.5 5.5 15.75V8.25Z M5.5 8.25 12 12 18.5 8.25 M12 12V19.5"/>',
  find: '<circle cx="10.5" cy="10.5" r="5.5"/><path d="M14.6 14.6 19.5 19.5"/>',
  page: '<path d="M7 4V20 M7 7.5H16 M7 11.5H12.5 M7 15.5H17.5"/>',
  set: '<path d="M4 7H20 M4 12H20 M4 17H20"/><circle class="ts-knob" cx="9" cy="7" r="1.9"/><circle class="ts-knob" cx="15.5" cy="12" r="1.9"/><circle class="ts-knob" cx="11" cy="17" r="1.9"/>',
};

const CANDIDATES = [
  {
    id: '0',
    cls: 'snd-0',
    ref: true,
    title: '0 · 现版（参照）',
    tag: 'CURRENT',
    desc: '左下一点 + 右上三弧。小尺寸偏向 RSS 视觉，重心略偏左下，三条弧合在单条 path 里。',
    svg: '<circle class="ts-dot" cx="4.5" cy="16" r="1.3"/><path d="M10 16A5.5 5.5 0 0 0 4.5 10.5 M14.5 16A10 10 0 0 0 10.99 8.4 M19 16A14.5 14.5 0 0 0 16.51 7.87"/>',
  },
  {
    id: '1',
    cls: 'snd-1',
    title: '1 · 棱面声腔',
    tag: 'GEOMETRIC HORN',
    desc: '折线梯形声腔配半透明亮面，右侧两道对称细弧。辨识度最高，与立体的「去处」同属几何薄面语言。',
    svg: '<path class="ts-fill" d="M7.8 9.4 12.6 5.6V18.4L7.8 14.6Z"/><path d="M4.6 9.4H7.8L12.6 5.6V18.4L7.8 14.6H4.6Z M7.8 9.4V14.6"/><path class="wave w1" d="M15.1 9.5A3.6 3.6 0 0 1 15.1 14.5"/><path class="wave w2" d="M17.5 7.4A6.7 6.7 0 0 1 17.5 16.6"/>',
  },
  {
    id: '2a',
    cls: 'snd-2a',
    title: '2A · 14° 音叉',
    tag: 'TUNING FORK',
    desc: '顺着全站 14° 倾角的修长音叉，与「换面」的 14° 切线成对呼应。有声时叉口外侧两道微弧轻呼吸。',
    svg: '<g transform="rotate(14 12 12)"><path d="M9.6 4.4V11.1A2.4 2.4 0 0 0 14.4 11.1V4.4 M12 13.5V18.8"/><circle class="ts-dot" cx="12" cy="19.3" r="1.2"/><path class="res" d="M6.4 5.2A4.8 4.8 0 0 0 6.4 10.2 M17.6 5.2A4.8 4.8 0 0 1 17.6 10.2"/></g>',
  },
  {
    id: '2b',
    cls: 'snd-2b',
    title: '2B · 玻璃风铃',
    tag: 'WIND CHIME',
    desc: '修长薄透的玻璃铃罩下悬垂一枚细长风签，避开通知铃铛感；有声时微摆并泛出左右两缕轻波。',
    svg: '<path class="ts-fill" d="M7.6 12.8C7.6 8.6 9.3 6 12 6C14.7 6 16.4 8.6 16.4 12.8Z"/><path d="M12 4V6 M7.6 12.8C7.6 8.6 9.3 6 12 6C14.7 6 16.4 8.6 16.4 12.8Z"/><g class="clapper"><path d="M12 12.8V16.6"/><path class="ts-fill" d="M12 16.6 13.6 18.6 12 20.6 10.4 18.6Z"/><path d="M12 16.6 13.6 18.6 12 20.6 10.4 18.6Z"/></g><path class="wisp wisp-l" d="M4.8 8.6A7.2 7.2 0 0 0 4.8 13.2"/><path class="wisp wisp-r" d="M19.2 8.6A7.2 7.2 0 0 1 19.2 13.2"/>',
  },
  {
    id: '3',
    cls: 'snd-3',
    title: '3 · 双相驻波',
    tag: 'STANDING WAVE',
    desc: '单条平滑正弦波叠一层淡色反相残影，暗合昼夜双态并行的环境声。静音时收为极浅的静波。',
    svg: '<path class="wave-echo" stroke-width="1" stroke-dasharray="1.6 2.2" stroke-opacity="0.45" d="M3.8 12C6.2 12 7.3 15.8 9.8 15.8C12 15.8 13.2 8.2 15.4 8.2C17.4 8.2 18.2 12 20.2 12"/><path class="wave-main" d="M3.8 12C5.8 12 6.8 6.5 9.1 6.5C11.4 6.5 12.6 17.5 14.9 17.5C17.2 17.5 18.2 12 20.2 12"/>',
  },
  {
    id: '4',
    cls: 'snd-4',
    title: '4 · 居中共鸣竖弦',
    tag: 'RESONANT BARS',
    desc: '5 根有机高低的居中细竖线，与「本页」「设置」共用刻度线语汇。若采用，可顺手将环境声子图标改为水平缓波。',
    svg: '<line x1="5" y1="10" x2="5" y2="14"/><line x1="8.5" y1="7.2" x2="8.5" y2="16.8"/><line x1="12" y1="5" x2="12" y2="19"/><line x1="15.5" y1="8.2" x2="15.5" y2="15.8"/><line x1="19" y1="10.4" x2="19" y2="13.6"/>',
  },
  {
    id: '5',
    cls: 'snd-5',
    title: '5 · 晶核三弧',
    tag: 'CRYSTAL ARCS',
    desc: '保留「展开三圈音量」的巧思：左侧居中菱形晶核 + 右向对称三弧，去 RSS 味，三弧独立错峰逐层亮起。',
    svg: '<path class="ts-fill" d="M6.8 8.8 9.4 12 6.8 15.2 4.2 12Z"/><path d="M6.8 8.8 9.4 12 6.8 15.2 4.2 12Z"/><path class="arc a1" d="M11.6 8.8A5.2 5.2 0 0 1 11.6 15.2"/><path class="arc a2" d="M14.2 6.8A8.5 8.5 0 0 1 14.2 17.2"/><path class="arc a3" d="M16.8 4.8A11.8 11.8 0 0 1 16.8 19.2"/>',
  },
];

const q = new URLSearchParams(location.search);
let face = q.get('face') === 'dream' ? 'dream' : 'wake';
let soundOn = q.get('sound') !== 'off';
let picked = q.get('pick') || '1';

const grid = document.getElementById('grid');
const stripRow = document.getElementById('strip-row');
const orbitBox = document.getElementById('orbit-box');
const pickedName = document.getElementById('picked-name');
const btnFace = document.getElementById('btn-face');
const btnSound = document.getElementById('btn-sound');

function svgEl(cls, inner, extra = '') {
  return `<svg class="ts-ico ${cls} ${extra}" viewBox="0 0 24 24" aria-hidden="true">${inner}</svg>`;
}

function render() {
  document.documentElement.dataset.face = face === 'dream' ? 'dream' : '';
  btnFace.setAttribute('aria-pressed', String(face === 'dream'));
  btnFace.textContent = face === 'dream' ? '当前：夜面（梦）' : '当前：昼面（醒）';
  btnSound.setAttribute('aria-pressed', String(soundOn));
  btnSound.textContent = soundOn ? '状态：有声（动效开）' : '状态：静音';

  grid.innerHTML = CANDIDATES.map((c) => `
    <article class="card ${c.ref ? 'is-ref' : ''} ${c.id === picked ? 'is-picked' : ''}" data-id="${c.id}">
      <div class="card-head">
        <span class="card-title">${c.title}</span>
        <span class="card-tag">${c.tag}</span>
      </div>
      <div class="samples">
        <div class="sample-col">
          <div class="box-lg">${svgEl(c.cls, c.svg, soundOn ? 'is-on' : '')}</div>
          <span>52px 细节</span>
        </div>
        <div class="sample-col">
          <div class="box-sm">${svgEl(c.cls, c.svg, '')}</div>
          <span>22px 静</span>
        </div>
        <div class="sample-col">
          <div class="box-sm is-on">${svgEl(c.cls, c.svg, 'is-on')}</div>
          <span>22px 响</span>
        </div>
      </div>
      <p class="card-desc">${c.desc}</p>
    </article>
  `).join('');

  grid.querySelectorAll('.card').forEach((el) => {
    el.addEventListener('click', () => { picked = el.dataset.id; render(); });
  });

  const cur = CANDIDATES.find((c) => c.id === picked) || CANDIDATES[1];
  pickedName.textContent = cur.title;

  // Strip: face | sound go find page set
  stripRow.innerHTML = `
    <div class="ctx-btn" title="换面">${svgEl('', OTHER.face)}</div>
    <div class="ctx-sep"></div>
    <div class="ctx-btn is-hi" title="声音">${svgEl(cur.cls, cur.svg, soundOn ? 'is-on' : '')}</div>
    <div class="ctx-btn" title="去处">${svgEl('', OTHER.go)}</div>
    <div class="ctx-btn" title="寻找">${svgEl('', OTHER.find)}</div>
    <div class="ctx-btn" title="本页">${svgEl('', OTHER.page)}</div>
    <div class="ctx-btn" title="设置">${svgEl('', OTHER.set)}</div>
  `;

  // Orbit simulation (exact Toolstar geometry: R=104, start=86°, step=15.4°, gapAfter=0)
  const cx = 38, cy = 166, R = 104, step = 88 / (6 - 1 + 0.7);
  const items = [
    { k: 0, html: svgEl('', OTHER.face) },
    { k: 1, html: svgEl(cur.cls, cur.svg, soundOn ? 'is-on' : ''), hi: true },
    { k: 2, html: svgEl('', OTHER.go) },
    { k: 3, html: svgEl('', OTHER.find) },
    { k: 4, html: svgEl('', OTHER.page) },
    { k: 5, html: svgEl('', OTHER.set) },
  ];
  const starSvg = `<g transform="translate(${cx},${cy})" fill="currentColor">
    <path d="M-1.5 0L0 -13L1.5 0Z" opacity=".82"/><path d="M-1.5 0L0 13L1.5 0Z" opacity=".48"/>
    <path d="M0 -1.5L11.2 -6.5L0 1.5Z" opacity=".82"/><path d="M0 -1.5L-11.2 6.5L0 1.5Z" opacity=".48"/>
    <path d="M0 -1.5L11.2 6.5L0 1.5Z" opacity=".68"/><path d="M0 -1.5L-11.2 -6.5L0 1.5Z" opacity=".62"/>
    <circle r="1.8" fill="var(--amber)"/>
  </g>`;
  let orbitHtml = `<svg class="orbit-svg" viewBox="0 0 420 204" preserveAspectRatio="xMinYMax meet">
    <circle cx="${cx}" cy="${cy}" r="28" fill="none" stroke="currentColor" stroke-opacity="0.22" stroke-dasharray="1 5"/>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="currentColor" stroke-opacity="0.12"/>
    ${starSvg}
  </svg>`;
  for (const it of items) {
    const a = 86 - (it.k + (it.k > 0 ? 0.7 : 0)) * step;
    const rad = (a * Math.PI) / 180;
    const x = cx + R * Math.cos(rad);
    const y = cy - R * Math.sin(rad);
    orbitHtml += `<div class="orbit-item ${it.hi ? 'is-hi' : ''}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px">${it.html}</div>`;
  }
  orbitBox.innerHTML = orbitHtml;
}

btnFace.addEventListener('click', () => { face = face === 'dream' ? 'wake' : 'dream'; render(); });
btnSound.addEventListener('click', () => { soundOn = !soundOn; render(); });
render();
</script>
</body>
</html>
