<!doctype html>
<html lang="zh-CN" data-face="wake">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星 · 竖排 / 同心轨道</title>
<link rel="stylesheet" href="/fonts/noto/font.css">
<link rel="stylesheet" href="star.css">
<link rel="icon" href="data:,">
</head>
<body>

<!-- 原型切换（不属于设计本体） -->
<nav class="proto" aria-label="原型切换">
  <div class="seg" data-key="v">
    <button data-val="A">A · 竖排</button>
    <button data-val="B">B · 同心轨道</button>
  </div>
  <div class="seg" data-key="ctx">
    <button data-val="index">目录页</button>
    <button data-val="read">阅读页</button>
  </div>
</nav>

<!-- 底子：一张假页面，用真实内容 -->
<main id="page"></main>

<!-- 那件东西 -->
<div class="dock" id="dock">
  <button class="star" id="star" type="button" aria-expanded="false" aria-controls="colA" aria-label="工具">
    <svg viewBox="-20 -20 40 40" aria-hidden="true"><g id="starG"></g></svg>
  </button>
  <div class="colA" id="colA" role="toolbar" aria-orientation="vertical" aria-label="工具"></div>
  <section class="sheet" id="sheetA" aria-live="polite"></section>
</div>

<!-- B：轨道层 -->
<div class="orbit" id="orbit">
  <svg class="tracks" id="tracks"></svg>
  <div class="orb-layer" id="orbLayer"></div>
  <section class="sheet sheet-b" id="sheetB"></section>
</div>

<div class="flip" id="flip"></div>
<div class="toast" id="toast"></div>

<script src="../layout-plane/data.js"></script>
<script src="star.js"></script>
</body>
</html>
