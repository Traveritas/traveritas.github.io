<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>压印 · 醒梦</title>
<meta name="theme-color" content="#ece8de">
<link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.0.5/500.css">
<link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.0.5/600.css">
<style>
  :root{ --ink:#37424d; --ink-faint:#5f6a75; --gold:#a9853f; }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:auto}
  body{
    background:#ccd6dc;
    font-family:"Noto Serif SC", serif;
    color:var(--ink);
    overflow-x:hidden;
  }
  #fallback{
    position:fixed;inset:0;z-index:0;display:none;
    background:linear-gradient(160deg,#d8dcdf 0%,#e3ddd6 55%,#efe3d5 100%);
  }
  body.no-gl #fallback{display:block}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block}
  #scrollspace{height:470vh;position:relative;z-index:0;pointer-events:none}

  /* ══ DOM UI 层 ══ */
  .ui{position:fixed;z-index:10}
  #brand{
    top:4.4vh;left:4vw;
    font-size:15px;font-weight:600;letter-spacing:.3em;color:var(--ink);
    opacity:0;transition:opacity .9s ease .15s;
  }
  body.ready #brand{opacity:1}
  #brand small{
    display:block;margin-top:7px;
    font-size:10px;font-weight:500;letter-spacing:.32em;color:var(--ink-faint);opacity:.72;
  }
  /* 印次：顶右小字 + 五枚印次点 */
  #pressinfo{
    top:4.8vh;right:4vw;text-align:right;
    font-size:10.5px;letter-spacing:.34em;color:var(--ink-faint);
    opacity:0;transition:opacity .9s ease .3s;
  }
  body.ready #pressinfo{opacity:.92}
  #pressinfo .dots{display:flex;gap:7px;justify-content:flex-end;margin-top:8px}
  #pressinfo .dots i{
    width:5px;height:5px;border-radius:50%;
    border:1px solid var(--ink-faint);opacity:.5;
    transition:background .5s ease,opacity .5s ease,transform .5s ease;
    transform:scale(.86);
  }
  #pressinfo .dots i.on{background:var(--ink);border-color:var(--ink);opacity:.85;transform:scale(1)}
  #pressinfo .dots i.gold{border-color:var(--gold)}
  #pressinfo .dots i.gold.on{background:var(--gold);border-color:var(--gold)}

  /* 版权页：版记（JS 投影锚定到纸面左下框内；窄屏退化为视口固定） */
  #colophon{
    left:0;top:0;z-index:10;
    width:236px;padding:14px 4px 10px 16px;
    opacity:0;transform:translateY(10px);
    transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.22,.9,.3,1),filter .8s ease;
    pointer-events:none;
    filter:grayscale(.4) opacity(.52);        /* 未上墨：淡 */
  }
  #colophon.on{opacity:.62;transform:translateY(0);pointer-events:auto}
  #colophon.on.inked{opacity:1}
  #colophon.inked{filter:none}
  #colophon h2{
    font-size:10px;font-weight:500;letter-spacing:.5em;color:var(--ink-faint);
    margin-bottom:9px;
  }
  #colophon .row{display:flex;align-items:baseline;gap:10px;margin:8px 0;text-decoration:none}
  /* 活字钉：镜像小铅字，hover 翻正上墨 */
  #colophon .nail{
    flex:0 0 auto;width:19px;height:19px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,#5a646d,#454f58);
    border-radius:2.5px;
    box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 1px 2px rgba(40,50,60,.25);
    transform:translateY(1.5px);
  }
  #colophon .nail span{
    display:block;font-size:11.5px;font-weight:600;color:#dfe5e9;
    transform:scaleX(-1);                       /* 活字是反的 */
    transition:transform .45s cubic-bezier(.3,1.4,.4,1),color .45s ease;
  }
  #colophon .row:hover .nail{background:linear-gradient(150deg,#4d5761,#333d46)}
  #colophon .row:hover .nail span{transform:scaleX(0);color:#f2ede2}  /* 翻正：中途翻过背面 */
  #colophon .row:hover .nail span{animation:nailflip .55s cubic-bezier(.3,1.2,.4,1) forwards}
  @keyframes nailflip{
    0%{transform:scaleX(-1);color:#dfe5e9}
    49%{transform:scaleX(0);color:#dfe5e9}
    51%{transform:scaleX(0);color:#2c353d}
    100%{transform:scaleX(1);color:#f2ede2}
  }
  #colophon .t{
    font-size:13px;font-weight:500;letter-spacing:.22em;color:var(--ink);
    transition:letter-spacing .35s ease;
  }
  #colophon .row:hover .t{letter-spacing:.3em}
  #colophon .lead{
    flex:1 1 auto;height:1px;position:relative;top:-3px;
    background-image:radial-gradient(circle,rgba(55,66,77,.55) .8px,transparent 1.1px);
    background-size:6px 3px;background-repeat:repeat-x;opacity:.7;
  }
  #colophon .d{
    flex:0 0 auto;font-size:10px;letter-spacing:.14em;color:var(--ink-faint);
  }

  #hint{
    right:4vw;bottom:4.6vh;
    font-size:11px;letter-spacing:.32em;color:var(--ink-faint);
    opacity:.85;transition:opacity .8s ease;
  }
  #hint.off{opacity:0}
  #vignette{
    inset:0;z-index:5;pointer-events:none;
    background:
      linear-gradient(to bottom, rgba(90,86,80,.07), rgba(90,86,80,0) 22%),
      radial-gradient(ellipse 126% 106% at 50% 46%, rgba(0,0,0,0) 58%, rgba(74,66,60,.14) 100%);
  }

  /* ══ 无 GL 静态回退：宣言直接以 DOM 排出 ══ */
  #staticManifesto{
    position:fixed;inset:0;z-index:2;display:none;
    padding:16vh 8vw;
  }
  body.no-gl #staticManifesto{display:block}
  #staticManifesto .s1{font-size:max(1.8rem,4vw);font-weight:600}
  #staticManifesto .s2{font-size:.95rem;letter-spacing:.35em;color:var(--ink-faint);margin-top:1.4rem}
  #staticManifesto .s3{font-size:max(1.2rem,2.4vw);margin-top:9vh;color:var(--ink-soft,#4d5a64)}
  #staticManifesto .s4{font-size:max(1.5rem,3.2vw);font-weight:600;margin-top:1.2rem}

  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ══ 加载页：活字排版 ══ */
  #loader{
    position:fixed;inset:0;z-index:40;
    background:
      radial-gradient(70vw 60vh at 18% 8%, rgba(169,189,201,.16), transparent 70%),
      radial-gradient(60vw 55vh at 86% 92%, rgba(216,196,201,.15), transparent 70%),
      #ece8de;
    transition:opacity .65s ease;
  }
  #loader.done{opacity:0;pointer-events:none}
  .ld-brand{
    position:absolute;top:4.4vh;left:4vw;
    font-size:14px;font-weight:600;letter-spacing:.34em;color:var(--ink);
  }
  .ld-brand small{display:block;margin-top:6px;font-size:9.5px;letter-spacing:.3em;color:var(--ink-faint);font-weight:500}
  .ld-status{
    position:absolute;top:4.8vh;right:4vw;text-align:right;
    font-size:10.5px;letter-spacing:.36em;color:var(--ink-faint);
  }
  .ld-status .rule{
    display:block;height:1px;width:130px;margin:9px 0 0 auto;
    background:rgba(55,66,77,.16);position:relative;overflow:hidden;
  }
  .ld-status .rule i{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    background:var(--ink);transition:width .3s ease;
  }
  #ldForm{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);
    display:flex;flex-direction:column;gap:clamp(14px,2.6vh,26px);
    width:min(80vw,760px);
  }
  .ld-line{
    display:flex;justify-content:flex-start;gap:.14em;
    font-size:clamp(19px,3vw,36px);
  }
  .ld-line:nth-child(1){margin-left:6%}
  .ld-line:nth-child(2){margin-left:34%}
  .ld-line:nth-child(3){margin-left:2%}
  .ld-line:nth-child(4){margin-left:18%}
  .ld-t{
    width:1.28em;height:1.28em;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(152deg,#59636c,#414b54);
    border-radius:.06em;position:relative;
    box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 2px 3px rgba(40,50,60,.18);
    opacity:0;transform:translateY(-14px);
    transition:transform .4s cubic-bezier(.25,.9,.35,1);
  }
  .ld-t::after{ /* 铅字侧壁 */
    content:"";position:absolute;left:6%;right:6%;bottom:-2px;height:3px;
    background:rgba(35,42,49,.5);border-radius:0 0 2px 2px;
  }
  .ld-t span{
    font-size:.82em;font-weight:600;color:#dfe5e9;line-height:1;
    transform:scaleX(-1);                       /* 活字：反字 */
    transition:transform .3s ease,color .3s ease;
  }
  .ld-t.set{opacity:1;transform:translateY(0)}  /* opacity 走类翻转（无头环境动画会冻结），缓动交给 transform */
  #loader.pressed .ld-t{background:transparent;box-shadow:none}
  #loader.pressed .ld-t::after{opacity:0}
  #loader.pressed .ld-t span{
    transform:scaleX(1);color:#333d47;
    transition:transform .4s cubic-bezier(.3,1.25,.4,1),color .4s ease;
  }
  #ldTray{
    position:absolute;left:50%;bottom:9vh;transform:translateX(-50%);
    display:flex;gap:9px;padding:8px 12px 10px;
    border:1px solid rgba(55,66,77,.22);border-bottom-width:3px;border-radius:3px;
    background:rgba(255,255,255,.28);
  }
  #ldTray .ld-t{opacity:.9;transform:none;width:20px;height:20px}
  #ldTray .ld-t span{font-size:12px}
  #ldPlaten{
    position:absolute;left:-2%;right:-2%;top:0;height:26%;
    background:linear-gradient(to bottom, rgba(44,53,61,.20), rgba(44,53,61,.05) 70%, rgba(44,53,61,0));
    transform:translateY(-130%);
    pointer-events:none;
  }
  #loader.pressed #ldPlaten{animation:platen .5s cubic-bezier(.5,0,.3,1) forwards}
  @keyframes platen{
    0%{transform:translateY(-130%)}
    100%{transform:translateY(460%)}
  }
  .ld-skip{
    position:absolute;right:4vw;bottom:4.6vh;
    font-size:10.5px;letter-spacing:.3em;color:var(--ink-faint);opacity:.7;
  }
  @media (max-width:760px){
    #brand{top:3.2vh;left:5.6vw;font-size:13px}
    #pressinfo{top:3.6vh;right:5.6vw}
    #pressinfo .label{display:none}
    #colophon{
      position:fixed !important;left:5.6vw !important;top:auto !important;bottom:3.8vh !important;
      width:auto;padding:0;transform:none;
    }
    #colophon h2{display:none}
    #colophon .row{margin:5px 0}
    #colophon .t{font-size:12.5px}
    #colophon .d{display:none}
    #colophon .lead{display:none}
    #hint{display:none}
    .ld-line{font-size:clamp(15px,4.6vw,24px)}
    #ldTray{bottom:7vh}
  }
  @media (prefers-reduced-motion: reduce){
    .ld-t{transition-duration:.01s !important;animation-duration:.01s !important}
  }
</style>
</head>
<body>
<div id="fallback"></div>
<canvas id="gl"></canvas>
<div id="scrollspace"></div>

<h1 class="sr-only">这里不是梦，也不是现实。它是人在即将醒来时，看见的最后一层世界。世界应当始终保留一种感觉：它可能马上消失。</h1>

<!-- 无 GL 静态回退 -->
<div id="staticManifesto" aria-hidden="true">
  <div class="s1">这里不是梦，</div>
  <div class="s2">也不是现实。</div>
  <div class="s3">它是人在即将醒来时，</div>
  <div class="s4">看见的最后一层世界。</div>
</div>

<div class="ui" id="brand">醒梦集<small>Traveritas · 活字初印</small></div>
<div class="ui" id="pressinfo" aria-hidden="true">
  <span class="label" id="piText">待印</span>
  <div class="dots"><i></i><i></i><i></i><i></i><i class="gold"></i></div>
</div>

<div class="ui" id="colophon" aria-label="站内入口 · 版记">
  <h2>版 记</h2>
  <a class="row" href="#/articles" aria-label="随笔">
    <span class="nail" aria-hidden="true"><span>随</span></span>
    <span class="t">随笔</span><span class="lead"></span><span class="d">想明白的路</span>
  </a>
  <a class="row" href="#/projects" aria-label="项目">
    <span class="nail" aria-hidden="true"><span>项</span></span>
    <span class="t">项目</span><span class="lead"></span><span class="d">做成过的事</span>
  </a>
  <a class="row" href="#/about" aria-label="关于">
    <span class="nail" aria-hidden="true"><span>关</span></span>
    <span class="t">关于</span><span class="lead"></span><span class="d">执笔者自述</span>
  </a>
</div>
<div class="ui" id="hint" aria-hidden="true">向下滚动 · 开印</div>
<div class="ui" id="vignette"></div>

<!-- ══ 加载页：活字排版 ══ -->
<div id="loader" role="status" aria-label="排版中">
  <div class="ld-brand">醒梦集<small>TRAVERITAS PRESS · 初版</small></div>
  <div class="ld-status"><span id="ldPhase">拣字</span><div class="rule"><i id="ldRule"></i></div></div>
  <div id="ldForm"></div>
  <div id="ldTray" aria-hidden="true"></div>
  <div id="ldPlaten"></div>
  <div class="ld-skip" id="ldSkip">点按任意处 · 跳过</div>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
"use strict";
/* 错误捕获：window.onerror + console.error 双钩子（着色器编译错误只走 console.error） */
var ERRS = [];
window.__swarmErr = null;
function fail(e){ var m = (e && (e.stack||e.message)) || String(e); ERRS.push(m); window.__swarmErr = ERRS.join(' || '); document.title = 'ERR'; }
window.addEventListener('error', function(ev){ fail(ev.error || ev.message); });
(function(){
  var oce = console.error.bind(console);
  console.error = function(){ try{ ERRS.push([].slice.call(arguments).join(' ')); window.__swarmErr = ERRS.join(' || '); }catch(_){} oce.apply(null, arguments); };
})();

try{

/* ================= 参数解析（裸旗标兼容） ================= */
var Q = {};
location.search.replace(/[?&]([^=&]+)(?:=([^&]*))?/g, function(m,k,v){ Q[k] = (v===undefined)? '' : v; return ''; });
var AUTO  = ('auto'  in Q);
var FAST  = ('fast'  in Q) ? 6 : 1;
var PIN   = ('pin'   in Q) ? Math.min(1, Math.max(0, parseFloat(Q.pin))) : null;
var STILL = ('still' in Q);
var RM    = ('rm'    in Q) || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
if (RM) STILL = true;

/* ================= 文案 ================= */
var LINES = [
  '这里不是梦，',
  '也不是现实。',
  '它是人在即将醒来时，',
  '看见的最后一层世界。'
];
var GOLD_SUB = '最后一层世界';

/* ================= 基础 ================= */
var canvas = document.getElementById('gl');
var renderer;
try{ renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:true, preserveDrawingBuffer:true, powerPreference:'high-performance'}); }
catch(e){ fail(e); document.body.classList.add('no-gl'); loaderFail(); return; }
var DPR = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(Math.max(1,innerWidth), Math.max(1,innerHeight));
renderer.setClearColor(0xccd6dc, 1);

var scene  = new THREE.Scene();
scene.fog  = new THREE.FogExp2(0xccd6dc, 0.024);       // 供 Basic 材质（色版/印样/浮尘）用
var camera = new THREE.PerspectiveCamera(42, Math.max(0.1,innerWidth/Math.max(1,innerHeight)), 0.1, 300);

/* ================= 调色板：冷晨（醒）→ 暖纸（梦被记下） ================= */
function h2r(h){ return new THREE.Color(h); }
var PAL = {
  fog:   [h2r('#c2ced6'), h2r('#e7d4c6')],
  paper: [h2r('#f0ece2'), h2r('#f3e6d5')],
  ink:   [h2r('#37424d'), h2r('#4a3e3a')],
  washA: [h2r('#a9bdc9'), h2r('#cbb2a9')],
  washB: [h2r('#c9c3cc'), h2r('#ddc1b2')],
  wm:    [h2r('#93a7b4'), h2r('#a97f63')],
  gold:   h2r('#a9853f')
};
var _bg = new THREE.Color(), _paper = new THREE.Color(), _ink = new THREE.Color(),
    _wa = new THREE.Color(), _wb = new THREE.Color(), _wm = new THREE.Color();
function lerpPal(pair, t, out){ out.copy(pair[0]).lerp(pair[1], t); return out; }
function smooth(a,b,x){ return THREE.MathUtils.smoothstep(x, a, b); }

var FOG_D = 0.0165;
var NOISE2 = [
  'float n2(vec2 p){',
  '  vec2 i = floor(p), f = fract(p);',
  '  f = f*f*(3.0-2.0*f);',
  '  float a = fract(sin(dot(i, vec2(127.1,311.7)))*43758.5453);',
  '  float b = fract(sin(dot(i+vec2(1.,0.), vec2(127.1,311.7)))*43758.5453);',
  '  float c = fract(sin(dot(i+vec2(0.,1.), vec2(127.1,311.7)))*43758.5453);',
  '  float d = fract(sin(dot(i+vec2(1.,1.), vec2(127.1,311.7)))*43758.5453);',
  '  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);',
  '}'
].join('\n');
var FOGFN = 'float fogF(float d){ return 1.0 - exp(-d*d*uFogD*uFogD); }';

/* ================= 版面几何常量（纸面局部坐标，中心为原点） ================= */
var PAPW = 17.8, PAPH = 10.0;                 // 纸张尺寸
var LAYOUT = [
  { x:-4.50, y: 3.25, ch:0.72, track:0.07 },
  { x: 3.70, y: 2.10, ch:0.44, track:0.52 },
  { x:-3.20, y:-0.70, ch:0.60, track:0.08 },
  { x: 1.30, y:-2.55, ch:1.02, track:0.06 }
];
var PRESSES = [
  { a:0.045, b:0.245, via:[ 0.25, 3.25] },
  { a:0.265, b:0.465, via:[ 0.70, 2.55] },
  { a:0.485, b:0.685, via:[ 0.90, 0.30] },
  { a:0.705, b:0.885, via:[ 1.10, 0.15] }
];
var FINAL = { a:0.90, b:1.0, x:0.55, y:-3.52 };
var WM = { x:3.50, y:1.70, s:6.8 };
var CIRC = -0.50;                              // 字面触及纸面（字面朝 +z 观者，压印=向纸沉入）
var RESTZ = 1.15;

/* ================= 活字压印时间轴（p 的纯函数） ================= */
function winU(p, w){ return Math.min(1, Math.max(0, (p - w.a) / (w.b - w.a))); }
function useWin(p, i){
  var w = PRESSES[i];
  if(i===3 && p > w.b){ finalPose(p, poseOut); return true; }   // 终压接管
  return p>=w.a && p<=w.b;
}
function seg(u, t0, t1){ return Math.min(1, Math.max(0, (u - t0) / Math.max(0.0001, t1 - t0))); }
function ss(x){ return x*x*(3-2*x); }
function pressPose(i, u, out){
  var L = LAYOUT[i], w = PRESSES[i];
  var px = L.x - lineW(i)/2 + 0.55, py = L.y;   // 压在线首
  var prev = (i===0) ? [-3.4, 3.80] : [ LAYOUT[i-1].x - lineW(i-1)/2 + 0.55, LAYOUT[i-1].y + 1.5 ];
  var k0=[prev[0],prev[1],RESTZ], k1=[w.via[0],w.via[1],0.06], k2=[px+0.30,py+1.30,1.05],
      k3=[px,py,CIRC], k4=[px,py,CIRC], k5=[px,py+1.5,RESTZ];
  var u1=0.18, u2=0.40, u3=0.55, u4=0.68, u5=1.0;
  var a,b,t;
  if(u<=u1){ a=k0;b=k1;t=ss(seg(u,0,u1)); }
  else if(u<=u2){ a=k1;b=k2;t=ss(seg(u,u1,u2)); }
  else if(u<=u3){ a=k2;b=k3;t=ss(seg(u,u2,u3)); }
  else if(u<=u4){ a=k3;b=k4;t=0; }
  else { a=k4;b=k5;t=ss(seg(u,u4,u5)); }
  out.pos[0]=a[0]+(b[0]-a[0])*t; out.pos[1]=a[1]+(b[1]-a[1])*t; out.pos[2]=a[2]+(b[2]-a[2])*t;
  out.contact = ss(seg(u,0.53,0.57));
  return out;
}
function finalPose(p, out){
  var u = winU(p, FINAL);
  var t = ss(seg(u, 0.0, 0.62));
  out.pos[0] = 0.9 + (FINAL.x - 0.9)*ss(seg(u,0,0.35));
  out.pos[1] = -1.05 + (FINAL.y + 1.05)*ss(seg(u,0,0.4));

    switch(idx){
      case 1: segs.push([left,bot]); break;
      case 2: segs.push([bot,right]); break;
      case 3: segs.push([left,right]); break;
      case 4: segs.push([top,right]); break;
      case 5: segs.push([top,left]); segs.push([bot,right]); break;
      case 6: segs.push([top,bot]); break;
      case 7: segs.push([top,left]); break;
      case 8: segs.push([left,top]); break;
      case 9: segs.push([top,bot]); break;
      case 10: segs.push([top,right]); segs.push([left,bot]); break;
      case 11: segs.push([top,right]); break;
      case 12: segs.push([left,right]); break;
      case 13: segs.push([bot,right]); break;
      case 14: segs.push([left,bot]); break;

    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function polyArea(lp){
  var a=0;
  for(var i=0,j=lp.length-1;i<lp.length;j=i++) a += (lp[j][0]*lp[i][1] - lp[i][0]*lp[j][1]);
  return Math.abs(a/2);
}
function buildRelief(ch){
  var loops = traceGlyph(ch);
  if(!loops.length) return null;
  // 嵌套深度（evenodd）：偶数层=外环，奇数层=所属最小偶层环的洞
  var depth = loops.map(function(lp,i){
    var d=0;
    for(var j=0;j<loops.length;j++){ if(j!==i && pip(lp[0], loops[j])) d++; }
    return d;
  });
  var areas = loops.map(polyArea);
  var shapes = [];
  loops.forEach(function(lp,i){
    if(depth[i]%2===0){
      var sh = new THREE.Shape(lp.map(function(p){ return new THREE.Vector2(p[0],p[1]); }));
      shapes.push({shape:sh, holes:[], i:i});
    }
  });
  loops.forEach(function(lp,i){
    if(depth[i]%2===1){
      // 找包含它的最小偶层环
      var best=-1, bestA=Infinity;
      for(var j=0;j<loops.length;j++){
        if(depth[j]%2===0 && pip(lp[0], loops[j]) && areas[j]<bestA){ bestA=areas[j]; best=j; }
      }
      for(var s=0;s<shapes.length;s++){
        if(shapes[s].i===best){
          shapes[s].holes.push(new THREE.Path(lp.map(function(p){ return new THREE.Vector2(p[0],p[1]); })));
          break;
        }
      }
    }
  });
  var group = new THREE.Group();
  var mat = new THREE.ShaderMaterial({
    uniforms:reliefUni, vertexShader:frostedVert, fragmentShader:frostedFrag(), transparent:true, depthWrite:true
  });
  shapes.forEach(function(item){
    var g = new THREE.ExtrudeGeometry(item.shape, {
      depth:0.17, bevelEnabled:true, bevelThickness:0.03, bevelSize:0.022, bevelSegments:1, steps:1
    });
    var m = new THREE.Mesh(g, mat);
    group.add(m);
  });
  return group;
}

function lineTexture(text, ch, track, gold){
  var px = 128;
  var c = document.createElement('canvas');
  var probe = c.getContext('2d');
  var font = (gold?'600 ':'500 ') + px + 'px "Noto Serif SC", serif';
  probe.font = font;
  var ls = px*track, w = 0;
  for(var i=0;i<text.length;i++) w += probe.measureText(text[i]).width + ls;
  c.width = Math.ceil(w + px*0.5); c.height = Math.ceil(px*1.5);
  var ctx = c.getContext('2d');
  ctx.font = font; ctx.fillStyle = '#fff'; ctx.textBaseline='middle';
  var x = px*0.25;
  for(var j=0;j<text.length;j++){
    if(!gold || GOLD_SUB.indexOf(text[j])>=0){
      // 套金只印「最后一层世界」，并带套印微偏
      ctx.fillText(text[j], x + (gold? px*0.055 : 0), c.height*0.54 + (gold? -px*0.04 : 0));
    }
    x += ctx.measureText(text[j]).width + ls;
  }
  var tex = new THREE.CanvasTexture(c);
  tex.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  return {tex:tex, w:c.width/px*ch, h:c.height/px*ch};
}

function update(p, t){
  var palT = Math.min(1, p*0.62 + smooth(0.90,1.0,p)*0.38);

  wmMat.opacity = 0.17 + behindK*0.15 + smooth(0.90,1.0,p)*0.14;

    var dry = smooth(0.58,0.96,u);
    L.mesh.material.color.copy(L.base).lerp(_ink, palT).multiplyScalar(1 + (1-dry)*0.22);
    var di = smooth(0.50,0.56,u)*(1 - 0.30*smooth(0.72,1.0,u));
    paperUni['uD'+i].value.set(
      (LAYOUT[i].x - lineW(i)/2 + 0.55), LAYOUT[i].y, di, 1.30);
    var glow = di * Math.exp(-Math.pow((u-0.545)*16,2));
    paperUni['uG'+i].value = glow*0.9;

      (LAYOUT[i].x - lineW(i)/2 + 0.55), LAYOUT[i].y,

    inked += smooth(0.58,0.66,u);

  typeGroup.position.y += Math.sin(t*0.27+1.7)*0.06*(1-p);

  shadow.position.set(typeGroup.position.x, typeGroup.position.y - 0.25, 0.02*KS);

  sheet2.position.y = -3.4*KS + Math.cos(t*0.05)*0.6;

  var inkedAll = p > 0.955;

    if(e >= T.at) T.el.classList.add('set');
  }
  var tray = ldTray.children, tHide = Math.floor(e*8);
  for(var k=0;k<tray.length;k++) tray[k].style.opacity = (k < tHide) ? '0' : '0.9';
  var ph = e<0.14?'拣字': e<0.6?'排字': e<0.78?'校版': e<0.9?'上墨':'付印';
  if(ldPhase.textContent !== ph) ldPhase.textContent = ph;
  ldRule.style.width = Math.round(e*100)+'%';
  if(e >= 0.88 && !loaderEl.classList.contains('pressed')) loaderEl.classList.add('pressed');
  if(done) finishLoader();
  return done;
}
function finishLoader(){
  if(loaderDone) return;
  loaderDone = true;
  loaderEl.classList.add('done');
  document.body.classList.add('ready');
  setTimeout(function(){ if(loaderEl.parentNode) loaderEl.parentNode.removeChild(loaderEl); }, 800);
  dropT0 = null;                                    // 活字落场开始
}
if(AUTO || STILL || RM){ /* auto：循环内推进 */ }
else{
  loaderEl.addEventListener('click', function(){ if(!loaderDone && loaderT0!==null) { /* 快进 */ loaderT0 = performance.now() - (LDUR*1000/FAST)*0.97; } });
  setTimeout(function(){ if(!loaderDone && loaderT0===null) loaderT0 = performance.now(); }, 350);
}
var dropT0 = null, dropK = 0;
function dropUpdate(dt){
  if(!loaderDone){ return; }
  if(dropT0 === null) dropT0 = 0;
  dropT0 += dt;
  var k = Math.min(1, dropT0/0.9);
  dropK = 1 - Math.pow(1-k, 3);
}

/* ================= 滚动 ================= */
var space = document.getElementById('scrollspace');
function readScroll(){
  var max = space.offsetHeight - innerHeight;
  return max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
}
var targetP = 0, smoothP = 0;
function enforceScrollHold(){
  if(PIN !== null && !STILL){ targetP = PIN; window.scrollTo(0, (space.offsetHeight - innerHeight)*PIN); }
}
enforceScrollHold();
targetP = (PIN !== null) ? PIN : readScroll();
smoothP = targetP;

function applyStill(){
  updateCamera(smoothP);
  update(smoothP, 0);
  renderer.render(scene, camera);
}
applyStill();                                       // 初始位姿就地写入 + 首帧

window.addEventListener('scroll', function(){
  if(PIN === null && !AUTO) targetP = readScroll();
  if(STILL || RM){ smoothP = (PIN !== null) ? PIN : readScroll(); applyStill(); }
}, {passive:true});

/* ================= ?auto 调度 ================= */
var SCHED = [
  [0.0,0],[3.2,0],[6.0,0.10],[8.6,0.168],[10.4,0.24],
  [13.0,0.30],[15.8,0.389],[17.6,0.465],
  [20.2,0.52],[23.2,0.609],[25.0,0.685],
  [27.6,0.74],[30.6,0.817],[32.4,0.885],
  [35.2,0.94],[37.6,0.985],[39.0,1.0],[41.0,1.0]
];
var autoT0 = null;
function autoP(now){
  if(autoT0 === null) autoT0 = now;
  var t = ((now - autoT0)*FAST/1000) % (SCHED[SCHED.length-1][0] + 0.0001);
  for(var i=0;i<SCHED.length-1;i++){
    if(t >= SCHED[i][0] && t <= SCHED[i+1][0]){
      var a = SCHED[i], b = SCHED[i+1];
      var u = (t - a[0]) / Math.max(0.001, b[0] - a[0]);
      return a[1] + (b[1]-a[1]) * (u*u*(3-2*u));
    }
  }
  return 1;
}

/* ================= 主循环 ================= */
var clock = {t:0, last:null};
function loop(now){
  if(clock.last === null) clock.last = now;
  var dt = Math.min(0.05, (now - clock.last)/1000);
  clock.last = now; clock.t += dt;
  if(!loaderDone) loaderUpdate(now);
  else dropUpdate(dt);
  if(AUTO){ targetP = autoP(now); enforceScrollHold(); }
  else if(PIN === null){ targetP = readScroll(); }
  smoothP += (targetP - smoothP) * Math.min(1, dt*4.2);
  if(Math.abs(targetP - smoothP) < 0.0004) smoothP = targetP;
  updateCamera(smoothP);
  update(smoothP, clock.t);
  if(!loaderDone){ typeGroup.visible = false; }     // 排版未毕，活字候场
  else{
    var drop = 1 - dropK;                           // 落场：从上方落下
    typeGroup.position.y += drop * 2.4;
    typeGroup.visible = dropK > 0.03 || STILL || RM;
  }
  renderer.render(scene, camera);
  if(!STILL && !RM) requestAnimationFrame(loop);
}

/* ================= 视口 ================= */
function onResize(){
  var aspect = innerWidth/Math.max(1,innerHeight);
  camera.fov = aspect < 0.8 ? 54 : 42;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  renderer.setSize(Math.max(1,innerWidth), Math.max(1,innerHeight));
  applyScale();
  if(STILL || RM) applyStill();
}
window.addEventListener('resize', onResize);
applyScale();
onResize();

/* ================= 无头验证接口 ================= */
window.__renderOnce = function(p){
  smoothP = targetP = Math.min(1, Math.max(0, p===undefined?smoothP:p));
  dropK = 1;
  updateCamera(smoothP);
  update(smoothP, clock.t);
  renderer.render(scene, camera);
};
window.__mockSnap = function(){
  if(canvas.width < 4){ onResize(); }
  loop(performance.now());
  return renderer.domElement.toDataURL('image/png');
};
window.__mockDbg = {scene:scene, camera:camera, paper:paper, type:typeGroup, renderer:renderer};
window.__probe = function(x, y){                    // 屏幕坐标（左上原点），渲染一帧并直读像素
  renderer.render(scene, camera);
  var gl = renderer.getContext();
  var dpr = renderer.getPixelRatio();
  var px = new Uint8Array(4);
  gl.readPixels(Math.round(x*dpr), renderer.domElement.height - Math.round(y*dpr), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  return [px[0], px[1], px[2], px[3]];
};
window.__loaderState = function(){ return {done:loaderDone, pressed:loaderEl.classList.contains('pressed'), n:tileEls.filter(function(T){return T.el.classList.contains('set');}).length}; };
window.__finishLoader = finishLoader;

onResize();
if(STILL || RM){
  finishLoader();
  applyStill();
}else if(AUTO){
  /* 本环境 rAF 可能被节流到不 tick：auto 一律 setInterval 驱动（33ms） */
  setInterval(function(){ loop(performance.now()); }, 33);
  loop(performance.now());
}else{
  requestAnimationFrame(loop);
}

}catch(e){ fail(e); document.body.classList.add('no-gl'); }
})();
</script>
</body>
