<!doctype html>
<html lang="zh-CN">
<head>

<title>方案 P5 · 玻璃园（活体）</title>
<style>
  /* ═══ 概念 ═══（P5 · 会话 E · 母题「花」的翻案稿）
     花两次被否，否的是「一朵花被摆在那里」这个动作。本稿把花改成正在发生的事：
     一株巨型玻璃百合开在雾原上，花开是持续进行的动作——
     瓣以每分钟计的速度继续张开、翻卷；成熟的大瓣偶尔脱落，
     飘坠溶进雾里，原位必有新瓣接着长（「花瓣落下处，必有新瓣生长」）。
     花冠永远不完整，也永远在开：世界可能消失，但从未停止生长。
     足下小花以分钟级节奏循环「抽茎—结蕾—开—沉回」，聚簇成片，
     每朵开过的花在雾里留一圈淡金色的记忆环（雾记住每一朵开过的花）。
     滚动 = 从花田里向上浮起，直到与花冠对视；入梦越深，
     花开得越盛、越透明，雾转冷，记忆环是冷世界里唯一的暖。
     材质：磨砂玻璃瓣（fresnel 边光 + 连续域霜感），全程无量化无点彩。 */

  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-600-normal.woff2') format('woff2');
  }

  :root {
    --ink: #3a383d;
    --ink-soft: #5f5c62;

    --mist-ink: #5d6d80;

    --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); color: var(--ink); background: #efe8dd; }

  .stage {
    position: fixed;
    inset: 0;
    overflow: clip;
    background: linear-gradient(to bottom, #f3ede2 0%, #ece2d8 40%, #d9d4d4 100%);
  }
  .scroll-length { height: 320vh; }
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .vignette {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;

  .rise { opacity: 0; transform: translateY(10px); animation: rise-in 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .rise.d1 { animation-delay: 0.15s; }
  .rise.d2 { animation-delay: 0.45s; }

  .manifesto .l1 { display: block; font-size: clamp(1.35rem, 2.8vw, 2.6rem); font-weight: 500; letter-spacing: 0.04em; }

  .brand {
    position: absolute; top: 4.5vh; left: 4vw; z-index: 10;

    font-family: var(--font-display); font-weight: 500; font-size: 1.02rem;

    text-shadow: 0 1px 18px rgba(var(--halo), 0.9);
  }
  .brand .ring { width: 11px; height: 11px; border: 1.5px solid var(--mist-ink); border-radius: 50%; opacity: 0.85; }

  .nav {
    position: absolute; right: 3.4vw; top: 24vh; z-index: 10;

  .nav a {
    position: relative; writing-mode: vertical-rl; letter-spacing: 0.5em;

  .side-note {

  }

  .floating-ledger { position: absolute; left: 26vw; right: 16vw; bottom: 6vh; z-index: 10; }
  .floating-ledger h2 {
    margin: 0 0 1rem; font-weight: 500; font-size: 0.82rem;

    text-shadow: 0 1px 14px rgba(var(--halo), 0.9);
  }
  .slips { display: flex; gap: 1.2rem 1.8rem; align-items: flex-start; }
  .slip {
    position: relative; display: block; padding: 0.85rem 1rem 0.95rem;

  .slip:nth-child(2) { width: 15.5rem; transform: rotate(0.7deg) translateY(10px); }
  .slip:nth-child(3) { width: 12.5rem; transform: rotate(-0.5deg) translateY(3px); }
  .slip .d { display: block; font-size: 0.72rem; letter-spacing: 0.12em; color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-bottom: 0.35rem; }
  .slip .t { display: block; font-family: var(--font-display); font-size: 0.98rem; color: var(--ink); line-height: 1.55; }
  .slip:hover .t { color: var(--mist-ink); }

  .stage.no3d canvas#gl { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; opacity: 1; transform: none; }
  }
  @media (max-width: 760px) {
    .side-note { display: none; }
    .brand { position: static; display: inline-flex; margin: 3.2vh 9vw 0; }
    .nav { position: static; margin: 0.6rem 9vw 0; flex-direction: row; gap: 1.8rem; }
    .nav a { writing-mode: horizontal-tb; letter-spacing: 0.24em; font-size: 0.9rem; }
    .nav a::after { display: none; }
    .floating-ledger { position: static; margin: 2.8rem 9vw 8vh; }
    .slips { flex-direction: column; gap: 0.9rem; }
    .slip { width: 100% !important; transform: none !important; }
    .stage { position: relative; min-height: 100dvh; }
    .scroll-length { display: none; }
    .manifesto { position: relative; top: 0; left: 0; margin: 10vh 9vw 0; }
  }
</style>

<script src="vendor/three.min.js"></script>
<script>
/* ═══ 玻璃园 ═══
   巨型玻璃百合：花开是持续动作（bloomP 极慢爬行 + 滚动入梦加深）；
   瓣几何 = 沿脊线积分的缎带（竖直→弧形外张→瓣尖下勾的百合弧线），
   非机械对称（瓣长/开角/歪斜抖动）。大瓣周期性脱落（fall → 溶入雾 → 新瓣长回）。
   足下小花田聚簇生长，开花时在雾里留记忆环（mist shader 的 12 个环槽）。
   材质 = 磨砂玻璃（fresnel 边光 + 连续霜感），雾 = 连续域渐变（无量化）。 */
(function () {
  if (!window.THREE) return;
  try {
  var reduceMotion = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) || location.search.indexOf('rm') >= 0;

  /* ── 测试参数：?pose=<0..1> 锁定开花/入梦相位便于截图；?auto 兼容 rAF 节流环境 ── */
  var qs = location.search;
  var poseLock = -1;
  var mPose = qs.match(/pose=([0-9.]+)/);
  if (mPose) poseLock = Math.min(1, Math.max(0, parseFloat(mPose[1])));

  var seed = 195;
  function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  function range(a, b) { return a + rnd() * (b - a); }

  var canvas = document.getElementById('gl');
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false }); }
  catch (e) { document.getElementById('stage').classList.add('no3d'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

  var scene = new THREE.Scene();

  /* ── 双极色板：醒（奶油杏 + 瓷白玻璃）↔ 梦（雾青紫 + 透明冷玻璃，记忆环是唯一暖） ── */
  var WAKE = {
    mistA: 0xf5eee2, mistB: 0xe6d3ba, mistC: 0xd0b099, fog: 0xeee3d6,
    hemiSky: 0xf6ecdc, hemiGnd: 0xbfa692, sun: 0xffe6c8, fill: 0xe4e2e8,
    petalBase: 0xf8f2ea, petalTip: 0xd8d9de, petalBlush: 0xe9c8c2,
    rim: 0xb4c6d8, ring: 0xd8b184, stem: 0xcfc3b8
  };
  var DREAM = {
    mistA: 0xe2e1ea, mistB: 0xc4c3d4, mistC: 0xa2a2bc, fog: 0xdcdbe6,
    hemiSky: 0xe0dfe8, hemiGnd: 0x9494a8, sun: 0xd8d4e2, fill: 0xd4d8e4,
    petalBase: 0xe6e4ec, petalTip: 0xbcc0d2, petalBlush: 0xd0bcc8,
    rim: 0xa8b2cc, ring: 0xe6c08c, stem: 0xb4b0c0
  };
  var PALKEYS = ['mistA','mistB','mistC','fog','hemiSky','hemiGnd','sun','fill','petalBase','petalTip','petalBlush','rim','ring','stem'];
  [WAKE, DREAM].forEach(function (p) { PALKEYS.forEach(function (k) { p[k] = new THREE.Color(p[k]); }); });
  var _c1 = new THREE.Color();
  function lerpPal(key, f, out) { _c1.copy(WAKE[key]); out.copy(_c1.lerp(DREAM[key], f)); }

  var fogColor = new THREE.Color();
  scene.background = new THREE.Color(0xeee3d6);
  scene.fog = new THREE.Fog(0xeee3d6, 10, 48);

  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 160);

  var hemi = new THREE.HemisphereLight(0xf6ecdc, 0xbfa692, 0.95);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xffe6c8, 0.55);
  sun.position.set(-6, 9, 5);
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0xe4e2e8, 0.3);
  fill.position.set(7, 5, -4);
  scene.add(fill);

  /* ═══ 瓣几何：脊线积分（φ(u)=开角 smoothstep + 瓣尖下勾），缎带截面带杯弧 ═══
     开花角直接烘进几何（每帧重建很便宜），mesh 不再承担 rotation.x。 */
  var NU = 16, NV = 7;
  function petalGrid() {
    var geo = new THREE.BufferGeometry();
    var nVerts = (NU + 1) * (NV + 1);
    var aU = new Float32Array(nVerts);
    var aV = new Float32Array(nVerts);
    var idx = [];
    for (var i = 0; i <= NU; i++) {
      for (var j = 0; j <= NV; j++) {
        var k = i * (NV + 1) + j;
        aU[k] = i / NU;
        aV[k] = j / NV * 2 - 1;
      }
    }
    for (var i2 = 0; i2 < NU; i2++) {
      for (var j2 = 0; j2 < NV; j2++) {
        var a = i2 * (NV + 1) + j2, b = a + NV + 1;
        idx.push(a, b, a + 1, b, b + 1, a + 1);
      }
    }
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(nVerts * 3), 3));
    geo.setAttribute('aU', new THREE.BufferAttribute(aU, 1));
    geo.setAttribute('aV', new THREE.BufferAttribute(aV, 1));
    geo.setIndex(idx);
    return geo;
  }
  function rebuildPetal(geo, P, theta, recMul, lenMul) {
    var pos = geo.attributes.position.array;
    var aV = geo.attributes.aV.array;
    var len = P.len * lenMul;
    var ds = len / NU;
    var r = 0.03, y = 0.0, azd = 0;
    for (var i = 0; i <= NU; i++) {
      var u = i / NU;
      if (i > 0) {
        var um = (i - 0.5) / NU;
        var phiM = theta * (um * um * (3 - 2 * um)) +
          P.droop * recMul * Math.pow(Math.max(0, (um - 0.56) / 0.44), 2);
        phiM = Math.min(phiM, 2.5);
        r += Math.sin(phiM) * ds;
        y += Math.cos(phiM) * ds;
        azd += P.lean / NU;
      }
      var wProf = Math.pow(Math.max(Math.sin(Math.PI * Math.pow(u, 0.66)), 0), 0.8);
      var w = Math.max(wProf * P.w * (1 - 0.16 * u), 0.002);
      /* 脊线切向/法向（径向平面内） */
      var phiU = Math.min(theta * (u * u * (3 - 2 * u)) +
        P.droop * recMul * Math.pow(Math.max(0, (u - 0.56) / 0.44), 2), 2.5);
      var nx = Math.cos(phiU), ny = -Math.sin(phiU);
      var ca = Math.cos(azd), sa = Math.sin(azd);
      for (var j = 0; j <= NV; j++) {
        var v = j / NV * 2 - 1;
        var e = v < 0 ? 1 + P.asymL * u : 1 + P.asymR * u;
        var across = v * w * e;
        /* 杯弧：根部边缘向花心收拢（承光），瓣尖略反卷 */
        var cupSign = 1 - 1.6 * Math.min(1, Math.max(0, (u - 0.5) / 0.5));
        var cup = -P.cup * v * v * cupSign;
        /* 微波澜：缘部极轻的活体起伏 */
        var ruf = Math.sin(u * 9.0 + P.seed * 19.0) * 0.028 * v;
        var lx = r + nx * (cup + ruf);
        var ly = y + ny * (cup + ruf);
        var lz = across;
        var k = (i * (NV + 1) + j) * 3;
        pos[k] = lx * ca + lz * sa;
        pos[k + 1] = ly;
        pos[k + 2] = -lx * sa + lz * ca;
      }
    }
    geo.attributes.position.needsUpdate = true;
    geo.computeVertexNormals();
  }

  /* ═══ 磨砂玻璃瓣材质（共享；雾手动混合） ═══ */
  var petalUniforms = {
    uTime: { value: 0 },
    uDream: { value: 0 },
    uFogColor: { value: new THREE.Color(0xeee3d6) },
    uFogNear: { value: 10.0 },
    uFogFar: { value: 48.0 },
    uBase: { value: new THREE.Color(0xf8f2ea) },
    uTip: { value: new THREE.Color(0xd8d9de) },
    uBlush: { value: new THREE.Color(0xe9c8c2) },
    uRim: { value: new THREE.Color(0xb4c6d8) },
    uOpacity: { value: 1.0 }
  };
  function frostGLSL() {
    return [
      'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
      'float noise(vec2 p) {',
      '  vec2 i = floor(p), f = fract(p);',
      '  float a = hash(i), b = hash(i + vec2(1.0, 0.0)), c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));',
      '  vec2 u = f * f * (3.0 - 2.0 * f);',
      '  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);',
      '}',
      'float fbm(vec2 p) {',
      '  float v = 0.0, a = 0.5;',
      '  for (int i = 0; i < 3; i++) { v += a * noise(p); p *= 2.13; a *= 0.5; }',
      '  return v;',
      '}'
    ].join('\n');
  }
  var petalMat = new THREE.ShaderMaterial({
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    uniforms: petalUniforms,
    vertexShader: [
      'attribute float aU;',
      'attribute float aV;',
      'uniform float uTime;',
      'varying float vU; varying float vV; varying float vSeed;',
      'varying vec3 vNormalW; varying vec3 vWorld;',
      'void main() {',
      '  vU = aU; vV = aV; vSeed = aU * 7.31 + aV * 3.7;',
      '  vec3 p = position;',
      '  vec4 w = modelMatrix * vec4(p, 1.0);',
      '  vWorld = w.xyz;',
      '  vNormalW = normalize(mat3(modelMatrix) * normal);',
      '  gl_Position = projectionMatrix * viewMatrix * w;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform float uTime;',
      'uniform float uDream;',
      'uniform vec3 uFogColor;',
      'uniform float uFogNear;',
      'uniform float uFogFar;',
      'uniform vec3 uBase; uniform vec3 uTip; uniform vec3 uBlush; uniform vec3 uRim;',
      'uniform float uOpacity;',
      'varying float vU; varying float vV; varying float vSeed;',
      'varying vec3 vNormalW; varying vec3 vWorld;',
      frostGLSL(),
      'void main() {',
      '  vec3 V = normalize(cameraPosition - vWorld);',
      '  float ndv = abs(dot(normalize(vNormalW), V));',
      '  /* 瓣体渐变：根部瓷白 → 中段冷调 → 瓣尖一点腮红（随 uDream 收敛） */',
      '  vec3 col = mix(uBase, uTip, smoothstep(0.08, 0.72, vU));',
      '  col = mix(col, uBlush, smoothstep(0.62, 1.0, vU) * (0.55 - 0.3 * uDream));',
      '  /* 霜感：连续 fbm 明度波动，磨砂玻璃的哑光 */',
      '  float frost = fbm(vec2(vU * 3.4 + vSeed * 2.3, vV * 1.6) + uTime * 0.008);',
      '  col *= 0.94 + 0.09 * frost;',
      '  /* 玻璃边光：掠射角发亮 */',
      '  float fres = pow(1.0 - ndv, 2.4);',
      '  col += uRim * fres * 0.6;',
      '  /* 缘线：瓣侧边缘一线更亮（玻璃厚度的暗示） */',
      '  float edge = smoothstep(0.7, 0.97, abs(vV)) * (1.0 - smoothstep(0.88, 1.0, vU));',
      '  col += uRim * edge * 0.5;',
      '  float dist = length(vWorld - cameraPosition);',
      '  float fogF = smoothstep(uFogNear, uFogFar, dist);',
      '  col = mix(col, uFogColor, fogF);',
      '  float alpha = mix(0.34, 0.8, fres);',
      '  alpha = mix(alpha, 0.6, 1.0 - frost * 0.5);',
      '  alpha *= uOpacity * (1.0 - fogF * 0.5) * (1.0 - uDream * 0.15);',
      '  gl_FragColor = vec4(col, alpha);',
      '}'
    ].join('\n')
  });

  /* ═══ 花冠：外轮 5 大瓣 + 内轮 4 瓣，全部百合弧线 ═══ */

  /* ═══ 小花田：聚簇成片（10 个花簇 + 散点），分钟级生长循环 ═══ */
  function makeFloretTexture(core, edge, line) {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var x = c.getContext('2d');
    x.clearRect(0, 0, 128, 128);
    for (var k = 0; k < 5; k++) {
      var a = k / 5 * Math.PI * 2 + (rnd() - 0.5) * 0.3;
      var r = range(34, 46), wPet = range(16, 21);
      x.save();
      x.translate(64, 64);
      x.rotate(a);
      var g = x.createLinearGradient(0, -r * 1.1, 0, 0);
      g.addColorStop(0, edge);
      g.addColorStop(1, core);
      x.beginPath();
      x.ellipse(0, -r * 0.6, wPet * 0.5, r * 0.6, 0, 0, Math.PI * 2);
      x.fillStyle = g;
      x.fill();
      x.strokeStyle = line;
      x.lineWidth = 1.4;
      x.stroke();
      x.restore();
    }
    x.beginPath(); x.arc(64, 64, 9, 0, Math.PI * 2);
    x.fillStyle = 'rgba(224, 178, 112, 0.95)';
    x.fill();
    return new THREE.CanvasTexture(c);
  }

  var flowerData = [];
  (function plantField() {
    var clumps = [];
    for (var c = 0; c < 10; c++) clumps.push({ x: range(-15, 15), z: range(-4.5, -24), r: range(1.3, 2.8) });
    var placed = 0, guard = 0;
    while (placed < FLOWERS && guard++ < 6000) {
      var x, z;
      if (rnd() < 0.62) {
        var cl = clumps[Math.floor(rnd() * clumps.length)];
        x = cl.x + (rnd() + rnd() - 1) * cl.r;
        z = cl.z + (rnd() + rnd() - 1) * cl.r * 0.8;
      } else {
        x = range(-19, 19);
        z = range(-4, -27);
      }
      if (z > -3 || z < -27.5) continue;
      if (Math.abs(x) < 5.4 && z > -12) continue;           /* 文字走廊 */
      if (Math.hypot(x - 5.6, z + 12.8) < 2.4) continue;    /* 茎基 */
      var dup = false;
      for (var i = 0; i < flowerData.length; i++) {
        if (Math.hypot(flowerData[i].x - x, (flowerData[i].z - z) * 1.7) < 0.75) { dup = true; break; }
      }
      if (dup) continue;
      var depth = Math.min(1, Math.max(0, (-z - 3.5) / 24));
      var tone = rnd();
      flowerData.push({
        x: x, z: z,
        h: (0.36 - depth * 0.16) * range(0.7, 1.35),
        s: (0.78 - depth * 0.34) * range(0.75, 1.3),
        phase: rnd() * 120, dur: range(55, 110),
        sway: range(0.5, 1.5),
        g: tone < 0.62 ? 0 : (tone < 0.85 ? 1 : 2)
      });
      placed++;
    }
    /* 分配各色组容量 */
    var gCount = [0, 0, 0];
    for (var j = 0; j < flowerData.length; j++) gCount[flowerData[j].g]++;
    for (var g2 = 0; g2 < 3; g2++) floretGroups[g2].count = gCount[g2];
  })();

  var dummy = new THREE.Object3D();

  function updateFlowers(t, dt, dream) {
    gCursor[0] = gCursor[1] = gCursor[2] = 0;
    for (var i = 0; i < FLOWERS; i++) {
      var d = flowerData[i];
      if (!d) continue;
      var u = ((t + d.phase) % d.dur) / d.dur;
      var g = u < 0.2 ? u / 0.2 : (u > 0.88 ? Math.max(0, 1 - (u - 0.88) / 0.12) : 1);
      g = g * g * (3 - 2 * g);
      var bloomU = Math.min(1, Math.max(0, (u - 0.24) / 0.3));
      var open = bloomU * bloomU * (3 - 2 * bloomU);
      dummy.position.set(d.x, 0, d.z);
      dummy.rotation.set(Math.sin(t * 0.35 + d.sway * 9) * 0.05, d.sway * 6.28, Math.cos(t * 0.3 + d.sway * 7) * 0.045);
      dummy.scale.set(1, Math.max(0.001, d.h * g), 1);
      dummy.updateMatrix();
      stems.setMatrixAt(i, dummy.matrix);
      var fy = d.h * g + 0.02;
      dummy.position.set(d.x + Math.sin(t * 0.4 + d.sway * 5) * 0.02, fy, d.z);
      dummy.rotation.set(0, d.sway * 6.28 + t * 0.02 * d.sway, 0);
      var fs = Math.max(0.001, d.s * (0.3 + 0.7 * open));
      dummy.scale.set(fs, fs, fs);
      dummy.updateMatrix();
      var gi = d.g;
      floretGroups[gi].setMatrixAt(gCursor[gi]++, dummy.matrix);
      var stg = open > 0.5;
      if (stg && !lastStage[i] && g > 0.9 && rnd() < 0.7) emitRing(d.x, d.z);
      lastStage[i] = stg;
    }
    stems.instanceMatrix.needsUpdate = true;
    for (var g3 = 0; g3 < 3; g3++) floretGroups[g3].instanceMatrix.needsUpdate = true;
  }

  function makeTextPlane(text, vertical, colorInk, worldW) {
    var cvs = document.createElement('canvas');
    var ctx = cvs.getContext('2d');
    var ratio = vertical ? [512, 2048] : [2048, 512];
    cvs.width = ratio[0]; cvs.height = ratio[1];
    var tex = new THREE.CanvasTexture(cvs);
    tex.anisotropy = 4;
    function draw() {
      var fontSize = vertical ? 168 : 148;
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      ctx.fillStyle = colorInk;
      ctx.font = '500 ' + fontSize + 'px "Noto Serif SC Web", "Songti SC", serif';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      if (vertical) {
        var x = cvs.width / 2;
        var step = fontSize * 1.12;
        var startY = cvs.height / 2 - (text.length - 1) * step / 2;
        for (var i = 0; i < text.length; i++) ctx.fillText(text[i], x, startY + i * step);
      } else {
        ctx.fillText(text, cvs.width / 2, cvs.height / 2);
      }
      tex.needsUpdate = true;
    }
    draw();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
    var mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
    var h = worldW * (ratio[1] / ratio[0]);
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(worldW, h), mat);
    mesh.renderOrder = 3;
    scene.add(mesh);
    return mesh;
  }

  function mixHex(a, b, f) {
    var A = hexToRgb(a), B = hexToRgb(b);
    return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * f) + ',' + Math.round(A[1] + (B[1] - A[1]) * f) + ',' + Math.round(A[2] + (B[2] - A[2]) * f) + ')';
  }
  function applyDreamToDom(dp) {
    if (Math.abs(dp - lastApplied) < 0.02) return;
    lastApplied = dp;
    rootStyle.setProperty('--ink', mixHex('#3a383d', '#4c4f58', dp));
    rootStyle.setProperty('--ink-soft', mixHex('#5f5c62', '#6a6e78', dp));
    rootStyle.setProperty('--ink-faint', mixHex('#6f6b70', '#757982', dp));
    rootStyle.setProperty('--mist-ink', mixHex('#5d6d80', '#6a7088', dp));
    var halo = mixHex('#f6eee2', '#e8e6ee', dp);
    rootStyle.setProperty('--halo', halo.replace('rgb(', '').replace(')', ''));
    rootStyle.setProperty('--slip-bg', 'rgba(' + Math.round(252 - 14 * dp) + ',' + Math.round(250 - 12 * dp) + ',' + Math.round(244 - 6 * dp) + ',' + (0.9 - 0.1 * dp).toFixed(2) + ')');
  }

  function renderOnce() {
    camera.position.set(camPos.x + camBase.xShift + pointer.x * 0.45, camPos.y + pointer.y * -0.16, camPos.z);
    camera.lookAt(look.x + camBase.lookShift, look.y, look.z);
    renderer.render(scene, camera);
  }
  var camBase = { zBack: 0, yUp: 0, xShift: 0, lookShift: 0 };
  function onResize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    /* 窄屏：镜头后撤、右移对准花冠，3D 字平面减淡让位给 DOM 内容 */
    var narrow = Math.min(1, Math.max(0, (1.25 - w / h) / 0.65));
    camBase = { zBack: narrow * 4.6, yUp: narrow * 1.1, xShift: narrow * 1.6, lookShift: narrow * 3.0 };
    var tOpa = 1 - narrow * 0.78;
    tp1.material.opacity = tOpa;
    tp2.material.opacity = tOpa;
    renderOnce();
  }

  /* ═══ 开花参数 ═══ */
  var bloomP = poseLock >= 0 ? poseLock : 0.62;
  var dreamLock = poseLock >= 0 ? poseLock : -1;
  function easeC(u) { u = Math.min(1, Math.max(0, u)); return u * u * (3 - 2 * u); }

  function updatePetals(t) {
    for (var i = 0; i < petals.length; i++) {
      var pt = petals[i];
      if (pt.def.echo) {
        var bpe = easeC(Math.min(1, Math.max(0, bloomP * 1.1 - 0.15)));
        var th = pt.def.theta + Math.sin(t * 0.16 + pt.P.seed * 9) * 0.012;
        rebuildPetal(pt.geo, pt.P, th, 0.9, 1);
        pt.group.rotation.y += 0.00006;
        continue;
      }
      var bp = easeC(Math.min(1, Math.max(0, bloomP * 1.18 - pt.def.lag)));
      var breathe = 0.012 * Math.sin(t * 0.22 + pt.P.seed * 8.0);
      var theta = pt.def.tilt0 + pt.def.span * bp + breathe;
      var recMul = 0.45 + 0.65 * bp;
      var lenMul = 0.88 + 0.12 * bp;
      rebuildPetal(pt.geo, pt.P, theta, recMul, lenMul);
      pt.group.rotation.y = pt.def.az + 0.02 * Math.sin(t * 0.3 + pt.P.seed * 7);
    }
    stamens.rotation.y = Math.sin(t * 0.1) * 0.03;
  }

  function updateFallers(t, dt) {
    fallMat.uniforms.uTime.value = t;
    for (var i = 0; i < fallers.length; i++) {
      var fl = fallers[i];
      if (!fl.active) {
        fl.delay -= dt;
        if (fl.delay <= 0) respawnFaller(fl);
        continue;
      }
      fl.t += dt;
      var u = fl.t / fl.dur;
      if (u >= 1) { fl.active = false; fl.delay = range(6, 16); fl.mesh.visible = false; continue; }
      fl.mesh.position.y -= dt * (0.13 + u * 0.2);
      fl.mesh.position.x += Math.sin(fl.t * 0.45 + i * 2.1) * dt * 0.24;
      fl.mesh.position.z += Math.cos(fl.t * 0.38 + i) * dt * 0.1;
      fl.mesh.rotation.x += dt * 0.16;
      fl.mesh.rotation.y += dt * 0.1;
      fallMat.uniforms.uOpacity.value = u < 0.08 ? u / 0.08 : Math.max(0, 1 - Math.max(0, (u - 0.6) / 0.4)) * 0.78;
    }
  }

  /* ═══ 主循环（30fps 节流） ═══ */
  var lastT = 0, running = false, rafId = null;
  window.__p5Err = null;
  function applyPalette(dp) {
    lerpPal('mistA', dp, mistUniforms.uA.value);
    lerpPal('mistB', dp, mistUniforms.uB.value);
    lerpPal('mistC', dp, mistUniforms.uC.value);
    lerpPal('fog', dp, fogColor);
    lerpPal('ring', dp, mistUniforms.uRing.value);
    lerpPal('petalBase', dp, petalUniforms.uBase.value);
    lerpPal('petalTip', dp, petalUniforms.uTip.value);
    lerpPal('petalBlush', dp, petalUniforms.uBlush.value);
    lerpPal('rim', dp, petalUniforms.uRim.value);
    lerpPal('sun', dp, sun.color);
    lerpPal('fill', dp, fill.color);
    lerpPal('hemiSky', dp, hemi.color);
    lerpPal('hemiGnd', dp, hemi.groundColor);
    scene.fog.color.copy(fogColor);
    scene.background.copy(fogColor);
    petalUniforms.uFogColor.value.copy(fogColor);
    mistUniforms.uFogColor.value.copy(fogColor);
    petalUniforms.uDream.value = dp;
    mistUniforms.uDream.value = dp;
    sun.intensity = 0.55 - 0.2 * dp;
  }
  function loop(now) {
    requestAnimationFrame(loop);
    if (now - lastT < 33) return;
    var dt = Math.min(0.1, (now - lastT) / 1000);
    lastT = now;
    var t = now / 1000;

    readScroll();
    enforceScrollHold();
    var dreamTarget = dreamLock >= 0 ? dreamLock : Math.min(1, scrollP * 1.05 + 0.08 * Math.sin(t * 0.045) + 0.06);
    dreamP += (dreamTarget - dreamP) * 0.06;
    if (poseLock < 0) bloomP = Math.min(1, 0.62 + t * 0.0022 + scrollP * 0.1);

    applyPalette(dreamP);
    fallMat.uniforms.uDream.value = dreamP;
    fallMat.uniforms.uFogColor.value.copy(fogColor);
    fallMat.uniforms.uBase.value.copy(petalUniforms.uBase.value);
    fallMat.uniforms.uTip.value.copy(petalUniforms.uTip.value);
    fallMat.uniforms.uBlush.value.copy(petalUniforms.uBlush.value);
    fallMat.uniforms.uRim.value.copy(petalUniforms.uRim.value);

    /* 镜头：从花田向上浮起，直到与花冠对视 */
    camPos.z = 11.8 - 4.2 * scrollP + camBase.zBack;
    camPos.y = 2.3 + 2.8 * scrollP + camBase.yUp;
    look.y = 2.7 + 4.8 * scrollP;
    look.x = 0.6 + 1.1 * scrollP;

    petalUniforms.uTime.value = t;
    mistUniforms.uTime.value = t;
    updatePetals(t);
    updateFallers(t, dt);
    updateFlowers(t, dt, dreamP);
    updateRings(dt);
    applyDreamToDom(dreamP);
    renderOnce();
  }
  function start() { if (running || reduceMotion) return; running = true; lastT = performance.now(); rafId = requestAnimationFrame(loop); }
  function stop() { running = false; if (rafId !== null) cancelAnimationFrame(rafId); rafId = null; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });

  window.addEventListener('scroll', function () {
    readScroll();
    if (reduceMotion) {
      dreamP = Math.min(1, scrollP * 1.05 + 0.06);
      applyPalette(dreamP);
      applyDreamToDom(dreamP);
      renderOnce();
    }
  }, { passive: true });
  window.addEventListener('resize', onResize);

  if (!reduceMotion) {
    start();
    window.addEventListener('pointermove', function (e) {
      pointer.x = (e.clientX / window.innerWidth - 0.5) * 2;
      pointer.y = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });
    if (qs.indexOf('auto') >= 0) {
      setInterval(function () { if (!document.hidden) loop(performance.now()); }, 33);
    }
  } else {
    /* 静帧：花半开、一只瓣悬在半空、雾里两枚记忆环 */
    bloomP = 0.66;
    dreamP = Math.min(1, scrollP * 1.05 + 0.06);
    applyPalette(dreamP);
    var t0 = 12.3;
    petalUniforms.uTime.value = t0;
    mistUniforms.uTime.value = t0;
    updatePetals(t0);
    updateFlowers(t0, 0, dreamP);
    emitRing(-4.2, -8.5);
    emitRing(8.8, -14);
    ringSlots[0].age = 4;
    mistUniforms.uRingP.value[0].z = 4;
    ringSlots[1].age = 8;
    mistUniforms.uRingP.value[1].z = 8;
    respawnFaller(fallers[0]);
    fallers[0].t = 7;
    fallers[0].mesh.position.y = 4.2;
    fallMat.uniforms.uOpacity.value = 0.6;
    applyDreamToDom(dreamP);
  }

  onResize();
  readScroll();
  /* 测试辅助：?scroll=<0..1> 直接落到指定滚动位（readScroll 每帧兜底，无需 scroll 事件）。
     程序化 scrollTo 在部分环境会被加载流程重置，故每帧强制校正直到生效。 */
  var mScroll = qs.match(/scroll=([0-9.]+)/);
  var scrollHold = -1;
  if (mScroll) scrollHold = Math.min(1, Math.max(0, parseFloat(mScroll[1])));
  function enforceScrollHold() {
    if (scrollHold < 0) return;
    var maxS = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    var target = scrollHold * maxS;
    if (Math.abs(window.scrollY - target) > 2) window.scrollTo(0, target);
  }
  enforceScrollHold();
  renderOnce();
  } catch (e) {
    window.__p5Err = (e && e.message) + ' @ ' + (e && e.stack ? String(e.stack).split('\n')[1] : '?');
  }
})();
</script>
</body>
</html>
