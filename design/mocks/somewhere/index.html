<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>somewhere · 五份场景</title>
    <link rel="stylesheet" href="./shell.css" />
    <style>
      html,
      body {
        overflow: auto;
        height: auto;
        background: #0b0c14;
      }
      .wrap {
        max-width: 1240px;
        margin: 0 auto;
        padding: 64px 28px 120px;
      }
      h1 {
        margin: 0 0 10px;
        font: 500 26px/1.4 var(--font-display);
        letter-spacing: 0.12em;
        color: #ece8f2;
      }
      .lede {
        margin: 0 0 44px;
        max-width: 44em;
        font: 400 14px/1.9 var(--font-display);
        color: #8d88a2;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        gap: 30px;
      }
      .card {
        display: block;
        text-decoration: none;
        color: inherit;
      }
      .frame {
        position: relative;
        aspect-ratio: 16 / 10;
        border-radius: 4px;
        overflow: hidden;
        background: #12131f;
        box-shadow: inset 0 0.6px 0 rgb(255 255 255 / 0.14), 0 0.6px 0 rgb(0 0 0 / 0.5), 0 0 0 0.5px rgb(255 255 255 / 0.06);
      }
      .frame iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        pointer-events: none;
        transform: scale(1);
      }
      .cap {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-top: 14px;
      }
      .cap .no {
        font: italic 400 13px/1 var(--font-display);
        color: #5d5875;
      }
      .cap b {
        font: 600 15px/1 var(--font-display);
        letter-spacing: 0.22em;
        color: #ddd8ea;
      }
      .cap i {
        font: normal 400 10px/1 var(--font-mono);
        letter-spacing: 0.22em;
        color: #5d5875;
      }
      .note {
        margin-top: 8px;
        font: 400 12.5px/1.8 var(--font-display);
        color: #78728e;
      }
      .sep {
        margin: 56px 0 30px;
        border: 0;
        border-top: 1px solid rgb(255 255 255 / 0.07);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>somewhere · 五份场景</h1>
      <p class="lede">
        在检索页再往下的一片空间。地址 /somewhere/。<br />
        进来先是检索的三栏，向下滚一回（或上划、或按 ↓），两条 14° 的斜缝收拢、转 90°，落成天与地——栏就没了。
        底下是同一支流光着色器，只换了三段的色。<br />
        缩略图是活的，但接不了鼠标：点开看。
      </p>

      <div class="grid" id="grid"></div>

      <hr class="sep" />
      <p class="note">
        地址参数：<code>?arrive</code> 立刻转场（截图用） · <code>?arrive=900</code> 等 900ms 再转 ·
        <code>?face=wake</code> 看醒面 · <code>?px=4</code> 换流光像素格。
      </p>
    </div>

    <script>
      const SCENES = [
        { f: 's-A.html', no: 'A', t: '远处的地形', en: 'TERRAIN', d: '一片永远够不着的远方：层层的脊线，最近的一层也在很远处。' },
        { f: 's-B.html', no: 'B', t: '走近才成形', en: 'DEPTH', d: '远处全是几乎一样的影子；走到焦平面，它才成为一件东西。' },
        { f: 's-C.html', no: 'C', t: '一条很长的路', en: 'PASSAGE', d: '望不到头的路收在一个点上；推得再远，它也没有变短。' },
        { f: 's-D.html', no: 'D', t: '可以往下沉', en: 'SINK', d: '地平线在头顶；越往下光越少，同一件事会以另一种形态再出现。' },
        { f: 's-E.html', no: 'E', t: '一处室内', en: 'ROOM', d: '看得见边界的一间屋；空，但不像是没做完。' },
      ];
      const grid = document.getElementById('grid');
      for (const s of SCENES) {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = `./${s.f}?arrive=1`;
        a.target = '_blank';
        a.innerHTML = `
          <div class="frame"><iframe src="./${s.f}?arrive=1" loading="lazy" tabindex="-1" title="${s.t}"></iframe></div>
          <div class="cap"><span class="no">${s.no}</span><b>${s.t}</b><i>${s.en}</i></div>
          <div class="note">${s.d}</div>`;
        grid.appendChild(a);
      }
    </script>
  </body>
</html>
