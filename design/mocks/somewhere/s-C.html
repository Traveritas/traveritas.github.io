<!doctype html>
<html lang="zh-CN" data-arrived="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>一处很长的地方 · somewhere</title>
    <link rel="stylesheet" href="./shell.css" />
    <link rel="stylesheet" href="./s-C.css" />
  </head>
  <!--
    这一页只负责「摆层」：流光在最底下（#light，shell.js 的 WebGL），
    路在它上面（#road，Canvas2D），字在最上面。
    所有空间逻辑都在 s-C.js 里。

    为什么路的画布不接事件：#stage 之外的这一层 pointer-events: none，
    手势全部由 shell.js 的全局监听吃——拖拽平移、滚轮推拉，这里不另起一套。
  -->
  <body>
    <canvas id="light"></canvas>
    <canvas id="road" aria-hidden="true"></canvas>

    <div class="sw-corner sw-tl">一条很长的路 · 一处很长的地方</div>

    <p class="sw-corner c-keys">
      <span class="c-keys-d">滚轮 / ↓ 键 · 往前</span>
      <span class="c-keys-t">上划 · 往前</span>
      <br /><span class="c-keys-d">拖动 · 看两边</span>
      <span class="c-keys-t">按住拖动 · 看两边</span>
    </p>

    <a class="sw-corner sw-br" href="./index.html">← 回索引</a>

    <p class="sw-hint" aria-hidden="true"><span>向下</span><i></i></p>

    <script type="module" src="./s-C.js"></script>
  </body>
</html>
