<!doctype html>
<html lang="zh-CN" data-arrived="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>somewhere · 焦平面</title>
    <link rel="stylesheet" href="./shell.css" />
    <link rel="stylesheet" href="./s-B.css" />
  </head>
  <body>
    <!-- 背景：shell.js 的流光场（全页唯一一个 WebGL 上下文） -->
    <canvas id="light"></canvas>

    <!-- 雾：一张低分辨率 2D 画布，装下全部「还没成形」的东西。
         上百件按 1/3 分辨率画成粗颗粒，屏幕放大后自然成了像素块——
         这就是「远处是像素」那一档；只有清楚的那几件才交给上面的 DOM。 -->
    <canvas id="board" aria-hidden="true"></canvas>

    <!-- 地平线：只画一根发丝，让这片东西有个上下 -->
    <div class="b-horizon" id="horizon" aria-hidden="true"></div>

    <!-- 最近的那几件（成形中的）用 DOM：它们是这件事里唯一看得清的东西 -->
    <div class="sw-stage" id="stage"></div>

    <h1 class="b-sr">一处走近才成形的地方</h1>
    <p class="b-sr">
      远处的东西都还只是轮廓，彼此几乎一样。往前走一段，其中一件会慢慢清楚起来；
      走开，它又散回雾里。
    </p>

    <div class="sw-corner sw-tl">somewhere · 焦平面</div>
    <a class="sw-corner sw-br" href="./index.html" style="bottom: 58px">← 回索引</a>
    <div class="sw-corner sw-br" id="stat"></div>
    <p class="sw-hint"><span>向下</span><i></i></p>

    <script type="module" src="./s-B.js"></script>
  </body>
</html>
