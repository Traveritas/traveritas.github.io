<!doctype html>
<html lang="zh-CN" data-arrived="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>远处 · somewhere</title>
    <link rel="stylesheet" href="./shell.css" />
    <link rel="stylesheet" href="./s-A.css" />
  </head>
  <body>
    <!-- 背景只有这一张 WebGL：shell.js 的流光场（正式站那支着色器）。
         下面两块 2D 画布都画在它上面，不新开 GL 上下文。 -->
    <canvas id="light" aria-hidden="true"></canvas>
    <!-- 远景：九道脊线，一张「印好的版」。只在手动了之后重画。 -->
    <canvas id="plate" aria-hidden="true"></canvas>
    <!-- 近景：薄雾、贴地的几道细线、几十粒浮尘。每帧都动，所以另放一张，免得拖着远景一起重画。 -->
    <canvas id="near" aria-hidden="true"></canvas>

    <div class="sw-corner sw-tl">somewhere · 远处</div>
    <p class="sa-verse">越往前，它越像没有动过。</p>
    <div class="sw-corner sw-br"><a href="./index.html">← 回索引</a></div>
    <p class="sa-cue" id="cue" aria-hidden="true"><i></i><span class="sa-cue-d">拖拽 · 平移　　滚轮 · 向前</span><span class="sa-cue-m">拖动 · 上下</span></p>

    <script type="module" src="./s-A.js"></script>
  </body>
</html>
