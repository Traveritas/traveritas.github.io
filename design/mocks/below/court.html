<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>below · 院落</title>
    <link rel="stylesheet" href="./common.css" />
    <style>
      #light { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; }
      #world { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: grab; }
      html.hot #world { cursor: pointer; }
      #page { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
      .say {
        position: fixed; left: 0; top: 0; z-index: 10; margin: 0; pointer-events: none;
        transform: translate(-50%, -100%); white-space: nowrap;
        font: 400 13.5px/1.8 var(--font-display); letter-spacing: 0.08em;
        padding: 6px 14px; border-radius: 3px;
        color: var(--say-fg, #eee8f2); background: var(--say-bg, rgba(20, 18, 34, 0.42));
        border: 1px solid var(--say-edge, rgba(232, 226, 240, 0.18));
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        opacity: 0; transition: opacity 0.5s ease;
      }
      .say.on { opacity: 1; }
      .say small { display: block; font: 400 9.5px/1.6 var(--font-mono); letter-spacing: 0.2em; opacity: 0.55; }
      .keys { position: fixed; left: 26px; bottom: 24px; z-index: 50; font: 400 10.5px/1.9 var(--font-mono); letter-spacing: 0.12em; color: rgba(210, 206, 224, 0.5); opacity: 0; transition: opacity 1.2s ease 0.6s; pointer-events: none; }
      html.done .keys { opacity: 1; }
      @media (max-width: 640px) { .keys { display: none; } }
      html.day .corner, html.day .keys { color: rgba(40, 46, 60, 0.5); }
      html.day .hint { color: rgba(40, 46, 60, 0.55); }
    </style>
  </head>
  <body>
    <canvas id="light" aria-hidden="true"></canvas>
    <canvas id="world" aria-label="院落"></canvas>
    <div id="page" aria-hidden="true"></div>
    <p class="hint"><span>向下</span><i></i></p>
    <div class="corner tl"><a href="./index.html">BELOW · 院落</a></div>
    <div class="keys">拖拽 环顾 · 点地面 走过去 · WASD / 方向键 走 · 点东西 碰一碰</div>
    <div class="corner br" id="stat"></div>
    <script src="/vendor/three.min.js"></script>
    <script type="module" src="./court.js"></script>
  </body>
</html>
