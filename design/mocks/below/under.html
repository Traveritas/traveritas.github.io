<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>below · 检索页的底下</title>
    <link rel="stylesheet" href="./common.css" />
    <style>
      #scene { position: fixed; inset: 0; overflow: hidden; perspective-origin: 50% 50%; background: #06070b; }
      .plane { position: absolute; left: 0; top: 0; transform-origin: 0 0 0; backface-visibility: visible; will-change: transform; }
      #sheet canvas, #floor canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #light { image-rendering: pixelated; }
      /* 从底下看：同一块玻璃，隔着磨砂 */
      #sheet.under { filter: blur(1.3px) brightness(0.8) saturate(0.9);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 42%), linear-gradient(to right, transparent 0%, #000 16%, #000 84%, transparent 100%); -webkit-mask-composite: source-in; mask-image: linear-gradient(to bottom, transparent 0%, #000 42%), linear-gradient(to right, transparent 0%, #000 16%, #000 84%, transparent 100%); mask-composite: intersect; }
      #floor { -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 42%), linear-gradient(to right, transparent 0%, #000 16%, #000 84%, transparent 100%); -webkit-mask-composite: source-in; mask-image: linear-gradient(to bottom, transparent 0%, #000 42%), linear-gradient(to right, transparent 0%, #000 16%, #000 84%, transparent 100%); mask-composite: intersect; }
      #ground { background: radial-gradient(closest-side, #0d0e15, #06070b); }
      #glow { position: fixed; left: 0; right: 0; height: 40vh; margin-top: -20vh; pointer-events: none; z-index: 1;
        background: radial-gradient(60% 50% at 50% 50%, rgba(120, 112, 150, 0.16), transparent 70%); opacity: 0; }
      #sheet.under::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(230, 226, 240, 0.22); }
      #haze { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; opacity: 0; filter: blur(14px); transform: scale(1.08); z-index: 5; }
      #say {
        position: fixed; left: 50%; bottom: 9vh; transform: translateX(-50%); z-index: 20; margin: 0;
        font: 400 13px/2 var(--font-display); letter-spacing: 0.2em; color: rgba(226, 222, 236, 0.66);
        opacity: 0; transition: opacity 1.6s ease; pointer-events: none; text-align: center; white-space: nowrap;
      }
      html.done #say { opacity: 1; }
      html.rm #scene { animation: fadein 0.7s ease; }
      @keyframes fadein { from { opacity: 0 } }
    </style>
  </head>
  <body>
    <div id="scene">
      <div id="ground" class="plane"></div>
      <div id="glow"></div>
      <div id="floor" class="plane"><canvas id="floorc"></canvas></div>
      <div id="sheet" class="plane"><canvas id="light"></canvas></div>
    </div>
    <canvas id="haze" aria-hidden="true"></canvas>
    <p class="hint"><span>向下</span><i></i></p>
    <div class="corner tl"><a href="./index.html">BELOW · 检索页的底下</a></div>
    <div class="corner br" id="stat"></div>
    <script type="module" src="./under.js"></script>
  </body>
</html>
