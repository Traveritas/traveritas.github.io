<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>below · 院落 · 点击</title>
    <link rel="stylesheet" href="./common.css" />
    <style>
      #light { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; }
      #world { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: grab; }
      html.hot #world { cursor: pointer; }
      #page { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
      .say {
        position: fixed; left: 0; top: 0; z-index: 10; margin: 0; pointer-events: none;
        transform: translate(-50%, -100%); white-space: nowrap;
        font: 400 13.5px/1.8 var(--font-display); letter-spacing: 0.08em;
        padding: 6px 14px; border-radius: 3px;
        color: var(--say-fg, #eee8f2); background: var(--say-bg, rgba(20, 18, 34, 0.42));
        border: 1px solid var(--say-edge, rgba(232, 226, 240, 0.18));
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        opacity: 0; transition: opacity 0.5s ease;
      }
      .say.on { opacity: 1; }
      .say small { display: block; font: 400 9.5px/1.6 var(--font-mono); letter-spacing: 0.2em; opacity: 0.55; }
      .keys { position: fixed; left: 26px; bottom: 24px; z-index: 50; font: 400 10.5px/1.9 var(--font-mono); letter-spacing: 0.12em; color: rgba(210, 206, 224, 0.5); opacity: 0; transition: opacity 1.2s ease 0.6s; pointer-events: none; }
      html.done .keys { opacity: 1; }
      @media (max-width: 640px) { .keys { display: none; } }
      html.day .corner, html.day .keys { color: rgba(40, 46, 60, 0.5); }
      html.day .hint { color: rgba(40, 46, 60, 0.55); }
    </style>
  </head>
  <body>
    <canvas id="light" aria-hidden="true"></canvas>
    <canvas id="world" aria-label="院落"></canvas>
    <div id="page" aria-hidden="true"></div>
    <p class="hint"><span>向下</span><i></i></p>
    <div class="corner tl"><a href="./index.html">BELOW · 院落 II</a></div>
    <div class="keys">点两侧 转身 · 点门洞 过去 · 点东西 碰一碰 · 点上方 回到检索</div>
    <div class="edge l" id="edgeL"><i>‹</i></div>
    <div class="edge r" id="edgeR"><i>›</i></div>
    <div class="edge t" id="edgeT"><span>回到检索</span></div>
    <p class="say door" id="doorTag">过去</p>
    <style>
      .edge { position: fixed; z-index: 8; pointer-events: none; opacity: 0; transition: opacity 0.35s ease; display: flex; align-items: center; justify-content: center; color: rgba(236, 232, 244, 0.7); }
      .edge.on { opacity: 1; }
      .edge.l, .edge.r { top: 16%; bottom: 0; width: 22%; }
      .edge.l { left: 0; background: linear-gradient(90deg, rgba(240, 236, 248, 0.07), transparent); justify-content: flex-start; padding-left: 26px; }
      .edge.r { right: 0; background: linear-gradient(270deg, rgba(240, 236, 248, 0.07), transparent); justify-content: flex-end; padding-right: 26px; }
      .edge i { font: 300 34px/1 var(--font-display); font-style: normal; }
      .edge.t { left: 0; right: 0; top: 0; height: 16%; background: linear-gradient(180deg, rgba(240, 236, 248, 0.08), transparent); align-items: flex-start; padding-top: 26px; }
      .edge.t span { font: 500 11px/1 var(--font-display); letter-spacing: 0.5em; padding-left: 0.5em; }
      html.day .edge { color: rgba(40, 46, 60, 0.6); }
      html.day .edge.l { background: linear-gradient(90deg, rgba(40, 46, 60, 0.06), transparent); }
      html.day .edge.r { background: linear-gradient(270deg, rgba(40, 46, 60, 0.06), transparent); }
      html.day .edge.t { background: linear-gradient(180deg, rgba(40, 46, 60, 0.06), transparent); }
      .say.door { font-size: 11px; letter-spacing: 0.4em; padding: 4px 10px 4px 14px; }
      html:not(.done) .keys { opacity: 0; }
    </style>
    <div class="corner br" id="stat"></div>
    <script src="/vendor/three.min.js"></script>
    <script type="module" src="./court2.js"></script>
  </body>
</html>
