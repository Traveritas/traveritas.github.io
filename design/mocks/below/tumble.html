<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>below · 会翻的房间</title>
    <link rel="stylesheet" href="./common.css" />
    <style>
      #light { position: fixed; left: -9999px; top: 0; width: 100vw; height: 100vh; }
      #world { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      html.hot #world { cursor: pointer; }
      #page { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
      .say {
        position: fixed; left: 0; top: 0; z-index: 10; margin: 0; pointer-events: none; white-space: nowrap;
        font: 400 13.5px/1.8 var(--font-display); letter-spacing: 0.08em; padding: 6px 14px; border-radius: 3px;
        color: var(--say-fg); background: var(--say-bg); border: 1px solid var(--say-edge);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity 0.4s ease;
      }
      .say.on { opacity: 1; }
      .say small { display: block; font: 400 9.5px/1.6 var(--font-mono); letter-spacing: 0.2em; opacity: 0.55; }
      .edge { position: fixed; z-index: 8; pointer-events: none; opacity: 0; transition: opacity 0.35s ease; display: flex; align-items: center; color: var(--edge-fg); }
      .edge.on { opacity: 1; }
      .edge.l, .edge.r { top: 16%; bottom: 0; width: 22%; }
      .edge.l { left: 0; background: linear-gradient(90deg, var(--edge-bg), transparent); padding-left: 24px; }
      .edge.r { right: 0; background: linear-gradient(270deg, var(--edge-bg), transparent); justify-content: flex-end; padding-right: 24px; }
      .edge i { font: 300 30px/1 var(--font-display); font-style: normal; }
      .edge.t { left: 0; right: 0; top: 0; height: 16%; justify-content: center; align-items: flex-start; padding-top: 26px; background: linear-gradient(180deg, var(--edge-bg), transparent); }
      .edge span { font: 500 11px/1 var(--font-display); letter-spacing: 0.5em; padding-left: 0.5em; }
      .keys { position: fixed; left: 26px; bottom: 24px; z-index: 50; font: 400 10.5px/1.9 var(--font-mono); letter-spacing: 0.12em; color: var(--edge-fg); opacity: 0; transition: opacity 1s ease 0.4s; pointer-events: none; }
      html.done .keys { opacity: 0.7; }
      @media (max-width: 640px) { .keys { display: none; } }
      html.day .corner, html.day .hint { color: rgba(40, 46, 60, 0.55); }
    </style>
  </head>
  <body>
    <canvas id="light" aria-hidden="true"></canvas>
    <canvas id="world" aria-label="会翻的房间"></canvas>
    <div id="page" aria-hidden="true"></div>
    <p class="hint"><span>向下</span><i></i></p>
    <div class="edge l" id="edgeL"><i>↺</i></div>
    <div class="edge r" id="edgeR"><i>↻</i></div>
    <div class="edge t" id="edgeT"><span>回到检索</span></div>
    <div class="keys">点左右 把房间往那边翻 · 点东西 碰一碰 · 点上方 回到检索</div>
    <div class="corner tl"><a href="./index.html">BELOW · 会翻的房间</a></div>
    <div class="corner br" id="stat"></div>
    <script src="/vendor/three.min.js"></script>
    <script type="module" src="./tumble.js"></script>
  </body>
</html>
