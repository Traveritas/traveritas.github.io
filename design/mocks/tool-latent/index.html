<!doctype html>
<html lang="zh-CN" data-ctx="home" data-face="wake" data-sound="off">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>潜影 · 显影 — Traveritas</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/fonts/noto/font.css" />
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="latent.css" />
</head>
<body>

<!-- ── 画面：那张已经成像的相纸 ─────────────────────────────── -->
<div class="field" aria-hidden="true">
  <div class="field-sky" id="sky"></div>
  <div class="field-grain"></div>
</div>

<header class="brand">
  <a class="brand-mark" href="?ctx=home">Traveritas</a>
  <span class="brand-line mono" id="brandLine">LATENT · EMULSION</span>
</header>

<main class="stage" id="stage"></main>

<!-- ── 潜影：工具层。没有边框、没有面板、没有玻璃，只有浓度 ── -->
<div class="latent" id="latent" role="group" aria-label="工具区">
  <div class="trace" id="trace" aria-hidden="true">
    <i class="trace-dot"></i>
  </div>

  <div class="ring" id="ring">
    <div class="ring-field" id="ringField">
      <div class="ticks" id="ticks" aria-hidden="true"></div>
      <div class="nodes" id="nodes"></div>
      <div class="core" id="core">
        <div class="core-box" id="coreBox"></div>
      </div>
      <i class="cursor" id="cursor" aria-hidden="true"></i>
    </div>
  </div>

  <p class="say" id="say" aria-live="polite"></p>
</div>

<script src="/layout-plane/data.js"></script>
<script src="page.js"></script>
<script src="latent.js"></script>
</body>
</html>
