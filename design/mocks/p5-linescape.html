<title>方案 P5 · 线野（活体）</title>
<style>
  /* ═══ 概念 ═══（P5 · 会话 E · 母题「细线」+ 抽象水面语法的极限化）
     世界没有面，只有线：大地是一张活着的等高线场——
     每条线都是真实地形函数的同高线，随地形呼吸而缓慢变形；
     线聚处成物（山坡处等高线自然收密），线散处成雾（平缓处疏开淡出）。
     唯一的「建筑」：最深洼地上方悬着一群巨大的线环——
     它们是从地形上飞起的等高线，每一只都被一根细垂线拴在它升起的地方。
     最高的一只是淡金色的（全场景唯一异质色，冷世界里快要醒的那一只）。
     滚动 = 走进线野深处、抬起头与环群对视；入梦越深，
     线越飘移、环群越散、垂线被风拉弯，纸色转冷而金环更亮。
     全程无后处理、无量化色带：线即线，纸即纸。 */

  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-600-normal.woff2') format('woff2');
  }

  :root {
    --ink: #3a3940;
    --ink-soft: #5e5f68;
    --ink-faint: #6e6f78;
    --mist-ink: #5d6d80;
    --halo: 244, 240, 232;
    --slip-bg: rgba(252, 250, 245, 0.9);
    --slip-line: rgba(255, 255, 255, 0.62);
    --slip-shade: rgba(80, 76, 86, 0.3);
    --font-display: 'Noto Serif SC Web', 'Noto Serif SC', 'Palatino Linotype', Georgia, 'Songti SC', SimSun, serif;
    --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); color: var(--ink); background: #ede8de; }

  .stage {
    position: fixed;
    inset: 0;
    overflow: clip;

  .scroll-length { height: 320vh; }
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .vignette {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;

  .rise { opacity: 0; transform: translateY(10px); animation: rise-in 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

  .floating-ledger { position: absolute; left: 26vw; right: 16vw; bottom: 6vh; z-index: 10; }
  .floating-ledger h2 {

  }
  .slips { display: flex; gap: 1.2rem 1.8rem; align-items: flex-start; }
  .slip {
    position: relative; display: block; padding: 0.85rem 1rem 0.95rem;

  .slip::after {

  .slip .d { display: block; font-size: 0.72rem; letter-spacing: 0.12em; color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-bottom: 0.35rem; }
  .slip .t { display: block; font-family: var(--font-display); font-size: 0.98rem; color: var(--ink); line-height: 1.55; }

  .stage.no3d canvas#gl { display: none; }

  @media (prefers-reduced-motion: reduce) {

  }
  @media (max-width: 760px) {

    .brand { position: static; display: inline-flex; margin: 3.2vh 9vw 0; }
    .nav { position: static; margin: 0.6rem 9vw 0; flex-direction: row; gap: 1.8rem; }
    .nav a { writing-mode: horizontal-tb; letter-spacing: 0.24em; font-size: 0.9rem; }
    .nav a::after { display: none; }
    .floating-ledger { position: static; margin: 2.8rem 9vw 8vh; }
    .slips { flex-direction: column; gap: 0.9rem; }
    .slip { width: 100% !important; transform: none !important; }
    .stage { position: relative; min-height: 100dvh; }
    .scroll-length { display: none; }
    .manifesto { position: relative; top: 0; left: 0; margin: 10vh 9vw 0; }
  }
</style>

<script src="vendor/three.min.js"></script>
<script>
/* ═══ 线野 ═══
   大地 = 真实地形函数的等高线（marching squares，每两帧重建一次，单 draw call）；
   地形 = 多频正弦叠加 + 洼地/丘阜高斯，随时间极缓呼吸；
   悬环 = 从地形飞起的等高线（细管圆环），每只被一根 1px 垂线拴在升起处；
   升线 = 少量线缕周期性地从地面升起、飘散（dream 加速）。
   配色 = 纸与雾蓝灰线，淡金最高环为唯一异质色。 */
(function () {
  if (!window.THREE) return;
  try {
  var reduceMotion = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) || location.search.indexOf('rm') >= 0;
  var qs = location.search;

  var seed = 37;
  function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  function range(a, b) { return a + rnd() * (b - a); }

  var canvas = document.getElementById('gl');
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false }); }
  catch (e) { document.getElementById('stage').classList.add('no3d'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

  var scene = new THREE.Scene();

  /* ── 双极色板：醒（暖纸 × 雾蓝灰线）↔ 梦（青紫纸 × 蓝紫线，金环更亮） ── */
  var WAKE = { paper: 0xefeae0, ink: 0x69727f, inkSoft: 0x79828e, ring: 0x5d6672, gold: 0xc9a063, hemiSky: 0xf3eee4, hemiGnd: 0xc4bcae, sun: 0xfff2dd };
  var DREAM = { paper: 0xe0dfea, ink: 0x8a8fae, inkSoft: 0x9aa0b8, ring: 0x767c98, gold: 0xe4bc82, hemiSky: 0xe2e1ec, hemiGnd: 0xa8a6b8, sun: 0xdcd8ea };
  var PALKEYS = ['paper', 'ink', 'inkSoft', 'ring', 'gold', 'hemiSky', 'hemiGnd', 'sun'];
  [WAKE, DREAM].forEach(function (p) { PALKEYS.forEach(function (k) { p[k] = new THREE.Color(p[k]); }); });
  var _c1 = new THREE.Color();
  function lerpPal(key, f, out) { _c1.copy(WAKE[key]); out.copy(_c1.lerp(DREAM[key], f)); }

  var paperCol = new THREE.Color(0xefeae0);
  scene.background = paperCol;
  scene.fog = new THREE.Fog(0xefeae0, 9, 50);

  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 150);

  var hemi = new THREE.HemisphereLight(0xf3eee4, 0xc4bcae, 0.9);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xfff2dd, 0.5);
  sun.position.set(-5, 9, 4);
  scene.add(sun);

  /* ═══ 地形函数：多频正弦 + 高斯洼地/丘阜，极缓呼吸 ═══ */
  var PH = [];
  for (var pi = 0; pi < 8; pi++) PH.push(rnd() * Math.PI * 2);
  var bowl = { x: -3, z: -24, r: 7.5, depth: 2.9 };
  var moundA = { x: 9, z: -14, r: 5.5, h: 1.55 };
  var moundB = { x: -15, z: -34, r: 6.5, h: 1.15 };
  function gauss(dx, dz, r) { var d2 = (dx * dx + dz * dz) / (r * r); return Math.exp(-d2 * 1.38); }
  function terrainH(x, z, t) {
    var n = 0.52 * Math.sin(0.16 * x + 0.3 * z + PH[0] + t * 0.012) +
            0.34 * Math.sin(0.31 * x - 0.22 * z + PH[1] - t * 0.009) +
            0.2 * Math.sin(0.52 * x + 0.41 * z + PH[2] + t * 0.007) +
            0.11 * Math.sin(0.84 * x - 0.6 * z + PH[3] - t * 0.011);
    var bd = bowl.depth * (1 + 0.12 * Math.sin(t * 0.045));
    var mh = moundA.h * (1 + 0.1 * Math.sin(t * 0.037 + 2));
    n -= bd * gauss(x - bowl.x, z - bowl.z, bowl.r);
    n += mh * gauss(x - moundA.x, z - moundA.z, moundA.r);
    n += moundB.h * gauss(x - moundB.x, z - moundB.z, moundB.r);
    return n;
  }

  /* ═══ 等高线场：marching squares → 单个 LineSegments ═══
     不规则层级：随机跳级 + 少量双线；强度 = 中间层最实、极端层淡出。 */
  var GX = 118, GZ = 84;
  var XMIN = -40, XMAX = 40, ZMIN = -50, ZMAX = -4;
  var DX = (XMAX - XMIN) / GX, DZ = (ZMAX - ZMIN) / GZ;
  var LEVELS = [];
  (function buildLevels() {
    var n = 26, lo = -3.3, hi = 2.35;
    for (var i = 0; i < n; i++) {
      var u = i / (n - 1);
      var lv = lo + (hi - lo) * u;
      var skip = (i % 5 === 2) && (i > 4) && (i < n - 3);        /* 跳级：不规则留白 */
      if (skip) continue;
      LEVELS.push({ h: lv, k: 0.5 + 0.5 * Math.sin(Math.PI * u), jitter: 0 });
    }
    /* 三组双线（贴邻重复，像图纸上的强调线） */
    [[5, 0.022], [12, -0.024], [19, 0.02]].forEach(function (d) {
      var src = LEVELS[d[0] % LEVELS.length];
      LEVELS.push({ h: src.h + d[1], k: src.k * 0.62, jitter: 0 });
    });
  })();
  var MAXSEG = 9000;
  var linePos = new Float32Array(MAXSEG * 2 * 3);
  var lineCol = new Float32Array(MAXSEG * 2 * 3);
  var lineGeo = new THREE.BufferGeometry();
  lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3).setUsage(THREE.DynamicDrawUsage));
  lineGeo.setAttribute('color', new THREE.BufferAttribute(lineCol, 3).setUsage(THREE.DynamicDrawUsage));
  var lineMat = new THREE.LineBasicMaterial({ vertexColors: true, fog: true });
  var contours = new THREE.LineSegments(lineGeo, lineMat);
  contours.frustumCulled = false;
  scene.add(contours);

  var hGrid = new Float32Array((GX + 1) * (GZ + 1));
  var inkCur = new THREE.Color(0x69727f);
  var inkSoftCur = new THREE.Color(0x79828e);
  var goldCur = new THREE.Color(0xc9a063);
  function rebuildContours(t, dream) {
    /* 1. 高度场 */
    var i, j;
    for (j = 0; j <= GZ; j++) {
      var z = ZMIN + j * DZ;
      for (i = 0; i <= GX; i++) {
        hGrid[j * (GX + 1) + i] = terrainH(XMIN + i * DX, z, t);
      }
    }
    /* 2. marching squares：等高线上的点高度就是 lv 本身，
          交点只需求出穿越边的 (x,z)。 */
    var seg = 0;
    function emit(x1, z1, x2, z2, y, k) {
      if (seg >= MAXSEG) return;
      var b = seg * 6;
      linePos[b] = x1; linePos[b + 1] = y; linePos[b + 2] = z1;
      linePos[b + 3] = x2; linePos[b + 4] = y; linePos[b + 5] = z2;
      var cr = inkCur.r * k, cg = inkCur.g * k, cb = inkCur.b * k;
      lineCol[b] = cr; lineCol[b + 1] = cg; lineCol[b + 2] = cb;
      lineCol[b + 3] = cr; lineCol[b + 4] = cg; lineCol[b + 5] = cb;
      seg++;
    }
    for (var L = 0; L < LEVELS.length; L++) {
      var lv = LEVELS[L].h, k = LEVELS[L].k;
      for (j = 0; j < GZ; j++) {
        var z0 = ZMIN + j * DZ, z1 = z0 + DZ;
        var row0 = j * (GX + 1), row1 = (j + 1) * (GX + 1);
        for (i = 0; i < GX; i++) {
          var x0 = XMIN + i * DX, x1 = x0 + DX;
          var h00 = hGrid[row0 + i], h10 = hGrid[row0 + i + 1];
          var h01 = hGrid[row1 + i], h11 = hGrid[row1 + i + 1];
          var c = (h00 > lv ? 1 : 0) | (h10 > lv ? 2 : 0) | (h11 > lv ? 4 : 0) | (h01 > lv ? 8 : 0);
          if (c === 0 || c === 15) continue;
          /* 边交点：top/bottom 沿 x，left/right 沿 z */
          var tx = x0 + DX * (lv - h00) / (h10 - h00);
          var bx = x0 + DX * (lv - h01) / (h11 - h01);
          var lz = z0 + DZ * (lv - h00) / (h01 - h00);
          var rz = z0 + DZ * (lv - h10) / (h11 - h10);
          switch (c) {
            case 1: case 14: emit(x0, lz, tx, z0, lv, k); break;
            case 2: case 13: emit(tx, z0, x1, rz, lv, k); break;
            case 3: case 12: emit(x0, lz, x1, rz, lv, k); break;
            case 4: case 11: emit(x1, rz, bx, z1, lv, k); break;
            case 6: case 9: emit(tx, z0, bx, z1, lv, k); break;
            case 7: case 8: emit(x0, lz, bx, z1, lv, k); break;
            case 5: emit(x0, lz, tx, z0, lv, k); emit(x1, rz, bx, z1, lv, k); break;
            case 10: emit(tx, z0, x1, rz, lv, k); emit(x0, lz, bx, z1, lv, k); break;
          }
        }
      }
    }
    lineGeo.attributes.position.needsUpdate = true;
    lineGeo.attributes.color.needsUpdate = true;
    lineGeo.setDrawRange(0, seg * 2);
  }

  /* ═══ 悬环群：从洼地飞起的等高线 ═══ */
  var rings = [];
  var ringDefs = [
    { x: -2.0, y: 6.8, z: -28, R: 5.2, tube: 0.085, tilt: [0.5, 0.2, 0.12], spin: 0.010, bob: 0.5 },
    { x: 2.8, y: 4.9, z: -25.5, R: 2.7, tube: 0.065, tilt: [0.9, -0.3, -0.2], spin: -0.016, bob: 0.36 },
    { x: -6.5, y: 4.2, z: -26.5, R: 2.1, tube: 0.06, tilt: [1.15, 0.4, 0.3], spin: 0.02, bob: 0.3 },
    { x: 5.8, y: 8.4, z: -31, R: 3.6, tube: 0.07, tilt: [0.35, -0.5, -0.35], spin: -0.012, bob: 0.44 },
    { x: -9.5, y: 6.4, z: -32.5, R: 2.5, tube: 0.06, tilt: [0.7, 0.65, 0.2], spin: 0.017, bob: 0.34 },
    { x: 0.5, y: 10.6, z: -34, R: 1.9, tube: 0.055, tilt: [1.3, -0.2, -0.1], spin: 0.022, bob: 0.4, gold: true },
    { x: -4.0, y: 12.0, z: -35.5, R: 1.4, tube: 0.05, tilt: [0.6, 0.3, 0.5], spin: -0.02, bob: 0.3 }
  ];
  var ringMat = new THREE.MeshStandardMaterial({ color: 0x5d6672, roughness: 0.82, metalness: 0.05 });
  var goldMat = new THREE.MeshStandardMaterial({ color: 0xc9a063, roughness: 0.55, metalness: 0.15 });
  var tetherMat = new THREE.LineBasicMaterial({ color: 0x5d6672, transparent: true, opacity: 0.6, fog: true });
  ringDefs.forEach(function (d, idx) {
    var m = new THREE.Mesh(new THREE.TorusGeometry(d.R, d.tube, 8, 72), d.gold ? goldMat : ringMat);
    var g = new THREE.Group();
    g.add(m);
    g.position.set(d.x, d.y, d.z);
    g.rotation.set(d.tilt[0], d.tilt[1], d.tilt[2]);
    scene.add(g);
    rings.push({ g: g, m: m, d: d, phase: rnd() * Math.PI * 2 });
    /* 垂线：拴在它升起的地方（环正下方的地形点） */
    var N = 12;
    var pos = new Float32Array(N * 3);
    var tg = new THREE.BufferGeometry();
    tg.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
    var tl = new THREE.Line(tg, tetherMat);
    tl.frustumCulled = false;
    scene.add(tl);
    rings[idx].tether = { geo: tg, n: N };
  });

  function updateTethers(t, dream) {
    for (var i = 0; i < rings.length; i++) {
      var r = rings[i];
      var tp = r.tether.geo.attributes.position.array;
      /* 底端 = 升起处地形点（固定），顶端 = 环的最低点；中途被风拉弯 */
      var bx = r.d.x, bz = r.d.z;
      var by = terrainH(bx, bz, t) + 0.02;
      var ringLow = r.d.y + Math.sin(t * 0.14 + r.phase) * r.d.bob * (0.4 + dream * 1.3) - Math.cos(r.d.tilt[0]) * r.d.R * 0.98;
      var sway = Math.sin(t * 0.4 + i * 2.2) * (0.14 + dream * 0.55);
      var sway2 = Math.cos(t * 0.31 + i) * (0.1 + dream * 0.4);
      for (var k = 0; k < r.tether.n; k++) {
        var u = k / (r.tether.n - 1);
        var bend = Math.sin(u * Math.PI) * sway;
        var bend2 = Math.sin(u * Math.PI) * sway2;
        var stretch = 1 + dream * 0.06 * Math.sin(u * 3.1 + t * 0.5);
        tp[k * 3] = bx + bend * (0.4 + u * 0.6);
        tp[k * 3 + 1] = by + (ringLow - by) * u * stretch;
        tp[k * 3 + 2] = bz + bend2 * (0.4 + u * 0.6);
      }
      r.tether.geo.attributes.position.needsUpdate = true;
    }
    tetherMat.opacity = 0.6 - dream * 0.18;
  }

  /* ═══ 升线：从地面升起飘散的线缕 ═══ */
  var risers = [];
  for (var ri = 0; ri < 9; ri++) {
    var N2 = 14;
    var pos2 = new Float32Array(N2 * 3);
    var g2 = new THREE.BufferGeometry();
    g2.setAttribute('position', new THREE.BufferAttribute(pos2, 3).setUsage(THREE.DynamicDrawUsage));
    var m2 = new THREE.LineBasicMaterial({ color: 0x69727f, transparent: true, opacity: 0, fog: true });
    var l2 = new THREE.Line(g2, m2);
    l2.frustumCulled = false;
    scene.add(l2);
    risers.push({
      line: l2, geo: g2, mat: m2, n: N2,
      x: 0, z: 0, dir: 1, t0: range(2, 40), dur: range(14, 22), active: false
    });
  }
  function respawnRiser(r) {
    r.x = range(-26, 26);
    r.z = range(-10, -40);
    r.dir = rnd() < 0.5 ? 1 : -1;
    r.t0 = 0;
    r.active = true;
  }
  function updateRisers(t, dt, dream) {
    for (var i = 0; i < risers.length; i++) {
      var r = risers[i];
      if (!r.active) {
        r.t0 += dt;
        var wait = range(3, 14) / (1 + dream * 2.2);
        if (r.t0 > wait) respawnRiser(r);
        continue;
      }
      r.t0 += dt;
      var u = r.t0 / r.dur;
      if (u >= 1) { r.active = false; r.mat.opacity = 0; r.t0 = 0; continue; }
      var lift = u * u * (5.5 + dream * 2.5);
      var fade = u < 0.18 ? u / 0.18 : Math.max(0, 1 - (u - 0.5) / 0.5);
      var tp = r.geo.attributes.position.array;
      for (var k = 0; k < r.n; k++) {
        var xx = r.x + r.dir * k * 0.55;
        var zz = r.z + Math.sin(k * 0.7 + r.t0 * 0.6 + i) * 0.3;
        var wob = Math.sin(r.t0 * 0.8 + k * 0.9 + i * 2) * (0.12 + dream * 0.5) * u * 3;
        tp[k * 3] = xx + wob;
        tp[k * 3 + 1] = terrainH(xx, zz, t) + 0.03 + lift * (0.75 + 0.25 * Math.sin(k * 0.5 + i)) + k * 0.05 * u;
        tp[k * 3 + 2] = zz + wob * 0.6;
      }
      r.geo.attributes.position.needsUpdate = true;
      r.mat.opacity = fade * (0.5 - dream * 0.15);
    }
  }

  /* ═══ 场景内字平面：竖排立在线野中（线从字上穿过），横排在最大环的洞里 ═══ */
  function makeTextPlane(text, vertical, colorInk, worldW) {
    var cvs = document.createElement('canvas');
    var ctx = cvs.getContext('2d');
    var ratio = vertical ? [512, 2048] : [2048, 512];
    cvs.width = ratio[0]; cvs.height = ratio[1];
    var tex = new THREE.CanvasTexture(cvs);
    tex.anisotropy = 4;
    function draw() {
      var fontSize = vertical ? 168 : 148;
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      ctx.fillStyle = colorInk;
      ctx.font = '500 ' + fontSize + 'px "Noto Serif SC Web", "Songti SC", serif';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      if (vertical) {
        var x = cvs.width / 2;
        var step = fontSize * 1.12;
        var startY = cvs.height / 2 - (text.length - 1) * step / 2;
        for (var i = 0; i < text.length; i++) ctx.fillText(text[i], x, startY + i * step);
      } else {
        ctx.fillText(text, cvs.width / 2, cvs.height / 2);
      }
      tex.needsUpdate = true;
    }
    draw();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
    var mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
    var h = worldW * (ratio[1] / ratio[0]);
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(worldW, h), mat);
    scene.add(mesh);
    return mesh;
  }
  var tp1 = makeTextPlane('它是人在即将醒来时', true, 'rgba(58,57,64,0.85)', 2.0);
  tp1.position.set(-11.2, 2.3, -16);
  tp1.rotation.y = 0.34;
  var tp2 = makeTextPlane('看见的最后一层世界', false, 'rgba(72,68,76,0.62)', 7.4);
  tp2.position.set(-2.0, 6.9, -31.8);

  /* ═══ 镜头 / 滚动 / 梦 ═══ */
  var camPos = { x: 1.2, y: 1.7, z: 5.5 };
  var look = { x: -1.5, y: 3.4, z: -30 };
  var pointer = { x: 0, y: 0 };
  var scrollP = 0, dreamP = 0;
  function readScroll() {
    var max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    scrollP = Math.min(1, Math.max(0, window.scrollY / max || 0));
  }

  var rootStyle = document.documentElement.style;
  var lastApplied = -1;
  function hexToRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function mixHex(a, b, f) {
    var A = hexToRgb(a), B = hexToRgb(b);
    return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * f) + ',' + Math.round(A[1] + (B[1] - A[1]) * f) + ',' + Math.round(A[2] + (B[2] - A[2]) * f) + ')';
  }
  function applyDreamToDom(dp) {
    if (Math.abs(dp - lastApplied) < 0.02) return;
    lastApplied = dp;
    rootStyle.setProperty('--ink', mixHex('#3a3940', '#4c4d58', dp));
    rootStyle.setProperty('--ink-soft', mixHex('#5e5f68', '#6c6d7a', dp));
    rootStyle.setProperty('--ink-faint', mixHex('#6e6f78', '#767784', dp));
    rootStyle.setProperty('--mist-ink', mixHex('#5d6d80', '#6e7490', dp));
    rootStyle.setProperty('--halo', mixHex('#f4f0e8', '#e4e3ec', dp).replace('rgb(', '').replace(')', ''));
    rootStyle.setProperty('--slip-bg', 'rgba(' + Math.round(252 - 16 * dp) + ',' + Math.round(250 - 14 * dp) + ',' + Math.round(245 - 9 * dp) + ',' + (0.9 - 0.1 * dp).toFixed(2) + ')');
  }

  function renderOnce() {
    camera.position.set(camPos.x + pointer.x * 0.5, camPos.y + pointer.y * -0.18, camPos.z);
    camera.lookAt(look.x, look.y, look.z);
    renderer.render(scene, camera);
  }
  /* 镜头 = 滚动的纯函数：主循环与静帧路径共用 */
  function updateCamera() {
    camPos.z = 5.5 - 7.2 * scrollP + camBase.zBack;
    camPos.y = 1.7 + 2.6 * scrollP + camBase.yUp;
    look.y = 3.4 + 4.6 * scrollP;
    look.x = -1.5 - 0.5 * scrollP;
  }
  function applyStaticState() {
    dreamP = Math.min(1, scrollP * 1.1 + 0.05);
    applyPalette(dreamP);
    updateCamera();
    applyDreamToDom(dreamP);
  }
  var camBase = { zBack: 0, yUp: 0, xShift: 0, lookShift: 0 };
  function onResize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    var narrow = Math.min(1, Math.max(0, (1.25 - w / h) / 0.65));
    camBase = { zBack: narrow * 3.6, yUp: narrow * 0.8, xShift: narrow * 0.6, lookShift: narrow * 1.0 };
    var tOpa = 1 - narrow * 0.72;
    tp1.material.opacity = tOpa;
    tp2.material.opacity = tOpa;
    renderOnce();
  }

  /* ═══ 色板应用 ═══ */
  function applyPalette(dp) {
    lerpPal('paper', dp, paperCol);
    lerpPal('ink', dp, inkCur);
    lerpPal('inkSoft', dp, inkSoftCur);
    lerpPal('gold', dp, goldCur);
    lerpPal('inkSoft', dp, ringMat.color);      /* 环与线同族，略深一档 */
    ringMat.color.multiplyScalar(0.88);
    tetherMat.color.copy(ringMat.color);
    goldMat.color.copy(goldCur);
    lerpPal('hemiSky', dp, hemi.color);
    lerpPal('hemiGnd', dp, hemi.groundColor);
    lerpPal('sun', dp, sun.color);
    scene.fog.color.copy(paperCol);
    scene.background.copy(paperCol);
    sun.intensity = 0.5 - 0.18 * dp;
  }

  /* ═══ 主循环（30fps 节流；等高线每两帧重建） ═══ */
  var lastT = 0, running = false, rafId = null, frameNo = 0;
  window.__p5Err = null;
  function loop(now) {
    requestAnimationFrame(loop);
    if (now - lastT < 33) return;
    var dt = Math.min(0.1, (now - lastT) / 1000);
    lastT = now;
    var t = now / 1000;
    frameNo++;

    readScroll();
    enforceScrollHold();
    var dreamTarget = Math.min(1, scrollP * 1.1 + 0.05 + 0.05 * Math.sin(t * 0.04));
    dreamP += (dreamTarget - dreamP) * 0.06;
    applyPalette(dreamP);
    applyDreamToDom(dreamP);

    /* 镜头：走进线野，抬头与环群对视 */
    updateCamera();

    /* 环的动态：自旋 + 浮沉；入梦漂移加剧 */
    for (var i = 0; i < rings.length; i++) {
      var r = rings[i];
      r.m.rotation.z = t * r.d.spin * (1 + dreamP * 1.6) + r.phase;
      r.g.position.y = r.d.y + Math.sin(t * 0.14 + r.phase) * r.d.bob * (0.4 + dreamP * 1.3);
      r.g.position.x = r.d.x + Math.sin(t * 0.06 + r.phase * 2) * dreamP * 1.1;
    }
    updateTethers(t, dreamP);
    updateRisers(t, dt, dreamP);
    if (frameNo % 2 === 0) rebuildContours(t, dreamP);
    renderOnce();
  }
  function start() { if (running || reduceMotion) return; running = true; lastT = performance.now(); rafId = requestAnimationFrame(loop); }
  function stop() { running = false; if (rafId !== null) cancelAnimationFrame(rafId); rafId = null; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });

  window.addEventListener('scroll', function () {
    readScroll();
    if (reduceMotion) {
      applyStaticState();
      rebuildContours(performance.now() / 1000, dreamP);
      renderOnce();
    }
  }, { passive: true });
  window.addEventListener('resize', onResize);

  /* ── 测试辅助：?scroll=<0..1> 强制落位（部分环境程序化 scrollTo 会被重置，故每帧校正） ── */
  var mScroll = qs.match(/scroll=([0-9.]+)/);
  var scrollHold = -1;
  if (mScroll) scrollHold = Math.min(1, Math.max(0, parseFloat(mScroll[1])));
  function enforceScrollHold() {
    if (scrollHold < 0) return;
    var maxS = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    var target = scrollHold * maxS;
    if (Math.abs(window.scrollY - target) > 2) window.scrollTo(0, target);
  }

  if (!reduceMotion) {
    start();
    window.addEventListener('pointermove', function (e) {
      pointer.x = (e.clientX / window.innerWidth - 0.5) * 2;
      pointer.y = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });
    if (qs.indexOf('auto') >= 0) {
      setInterval(function () { if (!document.hidden) loop(performance.now()); }, 33);
    }
  } else {
    /* 静帧：等高线场成形、环群悬停、两缕升线凝固在半空 */
    applyStaticState();
    var t0 = 21.7;
    rebuildContours(t0, dreamP);
    for (var i0 = 0; i0 < rings.length; i0++) {
      var r0 = rings[i0];
      r0.m.rotation.z = t0 * r0.d.spin + r0.phase;
      r0.g.position.y = r0.d.y + Math.sin(t0 * 0.14 + r0.phase) * r0.d.bob * 0.4;
    }
    updateTethers(t0, dreamP);
    respawnRiser(risers[0]); risers[0].t0 = 5;
    risers[0].dur = 20;
    respawnRiser(risers[1]); risers[1].t0 = 9;
    risers[1].dur = 22;
    updateRisers(t0, 0, dreamP);
    applyDreamToDom(dreamP);
  }
  /* ?scroll 在静帧模式下没有主循环校正，用延时重试兜底 */
  if (scrollHold >= 0) {
    setTimeout(function () {
      enforceScrollHold();
      if (reduceMotion) {
        readScroll();
        applyStaticState();
        renderOnce();
      }
    }, 800);
    setTimeout(enforceScrollHold, 1800);
  }

  onResize();
  readScroll();
  enforceScrollHold();
  renderOnce();
  } catch (e) {
    window.__p5Err = (e && e.message) + ' @ ' + (e && e.stack ? String(e.stack).split('\n')[1] : '?');
  }
})();
</script>
</body>
</html>
