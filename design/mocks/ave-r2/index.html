<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ave 对话框 r2</title>
<style>
  /* Ave 对话框 r2：星从框后越界（star-set 的 B），框本身往站上的界面语言靠。
     四版：1 卡片同门 / 2 工具栏薄片 / 3 字幕 / 4 斜缝。底图是 ave-r1/ref 的真截图。 */
  :root {
    --serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', SimSun, serif;
    --mono: 'IBM Plex Mono', Consolas, 'Microsoft YaHei UI', monospace;
    --seam: 14deg;
    --hue: #6f8bab; --tint: #a1b8cf; --deep: #415369;
  }
  body.dreamy { --hue: #8a7cb8; --tint: #a399c7; --deep: #4f4a66; }
  body.light { --fg: #232830; --faint: #858f9d; --glass: rgb(240 243 246 / .62); --edge: rgb(255 255 255 / .72); --hi: rgb(255 255 255 / .6); --lo: rgb(35 40 48 / .10); --ink: rgb(35 40 48 / .42); --chip-ink: #fff; }
  body.dark { --fg: #e4e8f0; --faint: #8b94a8; --glass: rgb(20 26 42 / .58); --edge: rgb(255 255 255 / .16); --hi: rgb(255 255 255 / .10); --lo: rgb(0 0 0 / .25); --ink: rgb(228 232 240 / .42); --chip-ink: #e9edf5; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { overflow: hidden; background: #1a2334 center / cover no-repeat; font: 14px/1.7 system-ui, 'Microsoft YaHei UI', sans-serif; }

  .bar { position: fixed; top: 74px; right: 22px; z-index: 50; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    font: 12px var(--mono); color: #3a4250; }
  .row { display: flex; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border-radius: 999px; overflow: hidden; background: rgb(240 243 246 / .86); box-shadow: 0 0 0 1px rgb(35 40 48 / .12); }
  .seg button, .btn { border: 0; background: none; padding: 3px 11px; font: inherit; color: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #232830; color: #f0f3f6; }
  .btn { border-radius: 999px; background: rgb(240 243 246 / .86); box-shadow: 0 0 0 1px rgb(35 40 48 / .12); }
  .tag { background: rgb(240 243 246 / .86); padding: 2px 10px; border-radius: 999px; box-shadow: 0 0 0 1px rgb(35 40 48 / .12); }

  /* ── 公共骨架 ── */
  .ave { position: fixed; right: 22px; bottom: 58px; z-index: 20; width: min(23rem, calc(100vw - 44px)); color: var(--fg); }
  .ave .host { position: absolute; pointer-events: none; z-index: 0; }
  .ave .host canvas { display: block; }
  .card { position: relative; z-index: 1; opacity: 0; translate: 0 6px;
    transition: opacity .45s cubic-bezier(.16,1,.3,1), translate .5s cubic-bezier(.16,1,.3,1); }
  .ave.on .card { opacity: 1; translate: 0 0; transition-delay: .18s; }
  .glass { background: var(--glass); backdrop-filter: blur(18px) saturate(1.08); -webkit-backdrop-filter: blur(18px) saturate(1.08); }
  .face { flex: none; width: 44px; height: 44px; background: url(../ave-r1/ref/faceflow.png) center / cover; image-rendering: pixelated; }
  body.noface .face { display: none; }
  .x { position: absolute; border: 0; background: none; padding: 0; width: 20px; height: 20px; display: grid; place-items: center; color: var(--faint); opacity: .6; cursor: pointer; }
  .x:hover { opacity: 1; }

  /* 逐字揭开的线 / 线头 / 句尾碎屑（与现行同一套节拍） */
  .say { margin: 0; font: 500 15px/2 var(--serif); overflow-wrap: anywhere; }
  .say .c { padding-bottom: 3px; background: linear-gradient(var(--ink), var(--ink)) 0 100% / 0 1px no-repeat;
    transition: background-size .22s cubic-bezier(.3,.7,.2,1), color .3s; }
  .say .c:not(.on) { color: transparent; }
  .say .c.on { background-size: 100% 1px; }
  .say .c.head { background-image: linear-gradient(var(--hue), var(--hue)); background-size: 100% 2px; }
  .ave.leaving .say .c { background-size: 0 1px; background-position: 100% 100%; transition-delay: calc(var(--i) * 14ms); }
  .tail { display: inline-flex; align-items: flex-end; gap: 3px; height: 1em; margin-left: 5px; vertical-align: -.36em; }
  .tail i { width: 1px; background: var(--ink); opacity: 0; translate: 0 -4px; transition: opacity .35s, translate .5s cubic-bezier(.3,.7,.2,1); }
  .tail i:nth-child(1) { height: 7px; } .tail i:nth-child(2) { height: 4px; transition-delay: .12s; } .tail i:nth-child(3) { height: 2px; transition-delay: .24s; }
  .ave.done .tail i { opacity: 1; translate: 0 0; }

  /* ── 1 卡片同门：与漫游 / 检索的卡片同一套——矩形、发丝边、等宽小字的抬头行 ── */
  .v1 .card { padding: 10px 16px 14px; border: 1px solid var(--edge); border-radius: 2px;
    box-shadow: inset 0 1px 0 var(--hi), 0 1px 0 var(--lo); }
  .v1 .hd { display: flex; align-items: center; gap: 8px; font: 10.5px var(--mono); letter-spacing: .12em; color: var(--faint); }
  .v1 .hd .o { width: 7px; height: 7px; border: 1px solid currentColor; border-radius: 50%; }
  .v1 .hd .who { color: var(--fg); opacity: .8; }
  .v1 .hd .t { margin-left: auto; margin-right: 22px; }
  .v1 .x { top: 7px; right: 8px; }
  .v1 .body { display: flex; gap: 14px; margin-top: 8px; align-items: flex-start; }
  .v1 .face { box-shadow: 0 0 0 1px var(--edge); margin-top: 6px; }
  .v1 .say, .v4 .say { flex: 1; min-width: 0; }

  /* ── 2 工具栏薄片：与左下工具栏的薄片 / 返回键同一种树脂——6px 圆角、上亮的边、一道内侧高光 ── */
  .v2 .card { display: flex; gap: 14px; padding: 14px 18px 14px 14px; border: 1px solid var(--edge); border-radius: 6px;
    box-shadow: inset 0 1px 1px var(--hi), 0 0 0 .5px var(--lo), 0 10px 30px -18px rgb(20 26 42 / .5); }
  .v2 .face { border-radius: 3px; box-shadow: 0 0 0 1px var(--edge); }
  .v2 .name { font: 500 12px var(--serif); letter-spacing: .2em; color: var(--hue); display: flex; align-items: center; gap: 6px; }
  body.dark .v2 .name { color: var(--tint); }
  .v2 .name i { width: 5px; height: 5px; border: 1px solid currentColor; rotate: 45deg; }
  .v2 .x { top: 8px; right: 8px; }
  .v2 .main { min-width: 0; flex: 1; padding-right: 10px; }

  /* ── 3 字幕：没有框，只有每一行字底下一条磨砂——像影片的字幕条；星在字的左后方 ── */
  .v3 .card { padding-left: 0; }
  .v3 .name { display: inline-flex; align-items: center; gap: 7px; font: 10px var(--mono); letter-spacing: .2em; color: var(--chip-ink);
    background: var(--deep); padding: 2px 9px; margin-bottom: 6px; }
  .v3 .name i { width: 5px; height: 5px; border: 1px solid currentColor; rotate: 45deg; opacity: .8; }
  .v3 .say { display: inline; padding: 3px 10px; line-height: 2.25; background: var(--glass); -webkit-box-decoration-break: clone; box-decoration-break: clone;
    box-shadow: inset 0 1px 0 var(--hi); }
  body.dark .v3 .say { background: rgb(20 26 42 / .78); }
  body.light .v3 .say { background: rgb(240 243 246 / .86); }
  .v3 .x { position: relative; display: inline-grid; vertical-align: middle; margin-left: 6px; }
  .v3 .face { display: none; }

  /* ── 4 斜缝：左缘按全站的 14° 斜切，星卡在缝外；斜缝顺着往上、往下各伸出一截发丝 ── */
  .v4 .card { --cut: 34px; padding: 16px 20px 15px calc(var(--cut) + 16px);
    clip-path: polygon(var(--cut) 0, 100% 0, 100% 100%, 0 100%); }
  .v4 .rim { position: absolute; inset: 0; z-index: -1; pointer-events: none; background: var(--edge);
    clip-path: polygon(evenodd, var(--cut) 0, 100% 0, 100% 100%, 0 100%, var(--cut) 0,
      calc(var(--cut) + 1.25px) 1px, 1.25px calc(100% - 1px), calc(100% - 1px) calc(100% - 1px), calc(100% - 1px) 1px, calc(var(--cut) + 1.25px) 1px); }
  .v4 .seam { position: absolute; z-index: 2; left: 0; bottom: 0; width: 1px; height: calc(100% + 120px); background: linear-gradient(to top, transparent, var(--edge) 18%, var(--edge) 70%, transparent);
    transform-origin: bottom; transform: translateY(40px) skewX(calc(-1 * var(--seam))); opacity: 0; transition: opacity .6s .1s; }
  .ave.on .v4-seam-on { opacity: 1; }
  .v4 .top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .v4 .name { font: 10px var(--mono); letter-spacing: .24em; color: var(--fg); border: 1px solid var(--edge); padding: 1px 9px; opacity: .85; }
  .v4 .face { width: 40px; height: 40px; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  .v4 .row2 { display: flex; gap: 12px; align-items: flex-start; }
  .v4 .x { top: 8px; right: 8px; }
</style>
</head>
<body class="dark">
  <div class="bar">
    <div class="row"><span class="tag">版本</span><span class="seg" id="ver"><button data-v="1" aria-pressed="true">1 卡片同门</button><button data-v="2">2 工具栏薄片</button><button data-v="3">3 字幕</button><button data-v="4">4 斜缝</button></span></div>
    <div class="row"><span class="tag">底</span><span class="seg" id="bg"><button data-v="list" aria-pressed="true">检索</button><button data-v="explore">漫游</button><button data-v="dusk">深夜</button><button data-v="dream">梦</button></span></div>
    <div class="row"><span class="tag">头像</span><span class="seg" id="face"><button data-v="1" aria-pressed="true">有</button><button data-v="0">无</button></span>
      <button class="btn" id="next">下一句</button><button class="btn" id="close">收起</button></div>
  </div>

  <aside class="ave" id="ave"><div class="host"></div><div class="slot"></div></aside>

  <template id="t1">
    <div class="card glass">
      <div class="hd"><i class="o"></i><span class="who">AVE</span><span class="t"></span></div>
      <button class="x" aria-label="收起">×</button>
      <div class="body"><div class="face"></div><p class="say"></p></div>
    </div>
  </template>
  <template id="t2">
    <div class="card glass">
      <div class="face"></div>
      <div class="main"><div class="name">Ave<i></i></div><p class="say"></p></div>
      <button class="x" aria-label="收起">×</button>
    </div>
  </template>
  <template id="t3">
    <div class="card">
      <div><span class="name">AVE<i></i></span></div>
      <p class="say"></p><button class="x" aria-label="收起">×</button>
    </div>
  </template>
  <template id="t4">
    <div class="card glass">
      <i class="rim"></i>
      <div class="top"><span class="name">AVE</span></div>
      <div class="row2"><div class="face"></div><p class="say"></p></div>
      <button class="x" aria-label="收起">×</button>
    </div>
    <i class="seam v4-seam-on"></i>
  </template>

<script type="module">
  import { mount, spin, set } from '../star-set/star-set.js';

  const LINES = ['欢迎来到这里，这里有不少有意思的东西哦~', '这边是随笔，长一些的字都放在这里。', '已经很晚了呢。', '这颗星星里有很多有用的东西，比如说：让祢听到我的声音'];
  const BG = { list: 'dark', explore: 'light', dusk: 'dark', dream: 'dark' };
  /* 星：大小、中心（相对 .ave 左上角）。越界：比框大一圈，压在框的左上角后面 */
  const STAR = { 1: [230, 22, 8], 2: [230, 30, 18], 3: [250, -40, 34], 4: [210, 6, 34] };

  const ave = document.getElementById('ave');
  const host = ave.querySelector('.host');
  const slotEl = ave.querySelector('.slot');
  let ver = '1', li = 0, timers = [], star = null;

  function placeStar() {
    const [size, cx, cy] = STAR[ver];
    host.innerHTML = '';
    host.style.width = host.style.height = size + 'px';
    host.style.left = cx - size / 2 + 'px';
    host.style.top = cy - size / 2 + 'px';
    star = mount(host, 'mid', { size, noAuto: true, hidden: true, dark: document.body.classList.contains('dark') });
  }

  function build() {
    ave.className = 'ave v' + ver;
    slotEl.innerHTML = document.getElementById('t' + ver).innerHTML;
    slotEl.querySelectorAll('.x').forEach((x) => (x.onclick = leave));
    placeStar();
  }

  function type() {
    timers.forEach(clearTimeout); timers = [];
    const el = slotEl.querySelector('.say');
    const chars = [...LINES[li]];
    el.innerHTML = chars.map((c, i) => `<span class="c" style="--i:${i}">${c}</span>`).join('') + '<span class="tail"><i></i><i></i><i></i></span>';
    const t = slotEl.querySelector('.t'); if (t) t.textContent = new Date().toTimeString().slice(0, 5);
    const cs = el.querySelectorAll('.c');
    cs.forEach((c, i) => timers.push(setTimeout(() => {
      c.classList.add('on');
      cs.forEach((x, j) => x.classList.toggle('head', j > i - 2 && j <= i));
      if (i === cs.length - 1) timers.push(setTimeout(() => ave.classList.add('done'), 260));
    }, 520 + i * 75)));
  }

  function enter() {
    ave.classList.remove('on', 'done', 'leaving'); void ave.offsetWidth;
    ave.classList.add('on');
    type();
    spin(star, { entry: true });
  }
  function leave() {
    timers.forEach(clearTimeout);
    ave.classList.add('leaving'); ave.classList.remove('done');
    setTimeout(() => spin(star, { exit: true, done: () => ave.classList.remove('on', 'leaving') }), 250);
  }

  function seg(id, fn) {
    document.getElementById(id).addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      e.currentTarget.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
      fn(b.dataset.v);
    });
  }
  function setBg(k) {
    document.body.style.backgroundImage = `url(../ave-r1/ref/bg-${k}.png)`;
    document.body.classList.toggle('dark', BG[k] === 'dark');
    document.body.classList.toggle('light', BG[k] === 'light');
    document.body.classList.toggle('dreamy', k === 'dream');
    set('dream', k === 'dream' ? 1 : 0);
    if (star) { star.dark = BG[k] === 'dark'; star.dirty = true; }
  }
  seg('ver', (v) => { ver = v; build(); enter(); });
  seg('bg', (k) => setBg(k));
  seg('face', (v) => document.body.classList.toggle('noface', v === '0'));
  document.getElementById('next').onclick = () => { li = (li + 1) % LINES.length; enter(); };
  document.getElementById('close').onclick = leave;
  set('auto', 0);

  const qs = new URLSearchParams(location.search);
  ver = qs.get('v') || '1';
  setBg(qs.get('bg') || 'list');
  if (qs.get('face') === '0') document.body.classList.add('noface');
  document.querySelectorAll('#ver button').forEach((x) => x.setAttribute('aria-pressed', x.dataset.v === ver));
  document.querySelectorAll('#bg button').forEach((x) => x.setAttribute('aria-pressed', x.dataset.v === (qs.get('bg') || 'list')));
  build();
  if (qs.has('still')) {
    document.head.insertAdjacentHTML('beforeend', '<style>*{transition:none!important}</style>');
    ave.classList.add('on', 'done');
    slotEl.querySelector('.say').innerHTML = [...LINES[li]].map((c, i, a) => `<span class="c on${i >= a.length - 2 ? ' head' : ''}">${c}</span>`).join('') + '<span class="tail"><i></i><i></i><i></i></span>';
    star.mesh.scale.setScalar(1); star.dirty = true;
  } else setTimeout(enter, 500);
</script>
</body>
</html>
