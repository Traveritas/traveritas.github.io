<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>花形印记 · 图标方案</title>
<style>
  :root {
    --paper: #f8f9f8;
    --ink: #232930;
    --ink-soft: #545f6a;
    --ink-faint: #5f6a75;
    --line: #dfe4e7;
    --mist-ink: #4c6a80;
    --blush: #d8c4c9;
    --font-display: 'Palatino Linotype', 'Iowan Old Style', Palatino, Georgia,
      'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', SimSun, serif;
    --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB',
      'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    padding: clamp(2rem, 6vw, 5rem);
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    margin: 0 0 0.6rem;
  }

  .lede { margin: 0 0 3.5rem; color: var(--ink-soft); max-width: 38em; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2.5rem;
  }

  .cell {
    border-top: 1px solid var(--line);
    padding-top: 1.4rem;
  }

  .cell h2 {
    font-size: 0.95rem;
    font-weight: 500;
    margin: 0 0 1.4rem;
    color: var(--ink-soft);
  }

  .big {
    color: var(--mist-ink);
    margin-bottom: 1.6rem;
  }

  .big svg { width: 96px; height: 96px; }

  .row { display: flex; align-items: center; gap: 1.6rem; flex-wrap: wrap; }

  .row .note { font-size: 0.8rem; color: var(--ink-faint); }

  /* 页头场景 */
  .brand-demo {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-family: var(--font-display);
    color: var(--ink);
  }

  .brand-demo svg { width: 18px; height: 18px; color: var(--mist-ink); }

  /* favicon 场景：模拟浏览器标签 */
  .tab-demo {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    border: 1px solid var(--line);
    border-radius: 6px 6px 0 0;
    padding: 0.45rem 0.9rem;
    font-size: 0.8rem;
    color: var(--ink-soft);
    background: #fff;
  }

  .tab-demo svg { width: 16px; height: 16px; color: var(--mist-ink); }
</style>
</head>
<body>

<h1>花形印记 · 图标方案</h1>
<p class="lede">站名印记与 favicon 的四个候选，均为单色线稿（currentColor，可随语境变色）。大图看形态细节，下方为页头与浏览器标签中的实际尺寸效果。</p>

<div class="grid">

  <!-- M1 俯视百合（罗塞特） -->
  <div class="cell">
    <h2>方案一 · 俯视百合</h2>
    <div class="big">
      <svg viewBox="0 0 24 24" fill="none">
        <g stroke="currentColor" stroke-width="0.9" stroke-linecap="round" fill="none">
          <path d="M12 12 C 8.8 9.4, 7.9 5.4, 12 2 C 16.1 5.4, 15.2 9.4, 12 12 Z"/>
          <path d="M12 12 C 8.2 11.2, 5.5 8.2, 6.5 4.2 C 10.4 5.3, 12 8.4, 12 12 Z"/>
          <path d="M12 12 C 15.8 11.2, 18.5 8.2, 17.5 4.2 C 13.6 5.3, 12 8.4, 12 12 Z"/>
          <path d="M12 12 C 8.8 14.6, 7.9 18.6, 12 22 C 16.1 18.6, 15.2 14.6, 12 12 Z"/>
          <path d="M12 12 C 8.2 12.8, 5.5 15.8, 6.5 19.8 C 10.4 18.7, 12 15.6, 12 12 Z"/>
          <path d="M12 12 C 15.8 12.8, 18.5 15.8, 17.5 19.8 C 13.6 18.7, 12 15.6, 12 12 Z"/>
          <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
        </g>
      </svg>
    </div>
    <div class="row">
      <span class="brand-demo">
        <svg viewBox="0 0 24 24" fill="none"><use href="#m1"/></svg>
        Traveritas
      </span>
      <span class="tab-demo">
        <svg viewBox="0 0 24 24" fill="none"><use href="#m1"/></svg>
        Traveritas
      </span>
      <span class="tab-demo">
        <svg viewBox="0 0 24 24"><use href="#m1solid"/></svg>
        Traveritas（实心变体）
      </span>
      <span class="note">实心变体用于 16px favicon</span>
    </div>
  </div>

  <!-- M2 侧视百合 -->
  <div class="cell">
    <h2>方案二 · 侧视百合</h2>
    <div class="big">
      <svg viewBox="0 0 24 24" fill="none">
        <g stroke="currentColor" stroke-width="0.9" stroke-linecap="round" fill="none">
          <path d="M13 22 C 13.8 17.6, 12 13.4, 12.4 9.6"/>
          <path d="M12.4 9.6 C 9.6 8.9, 7.6 6.6, 7.8 3.8 C 10.5 5.2, 12 7.4, 12.4 9.6 Z"/>
          <path d="M12.4 9.3 C 12.1 6.9, 12.9 4.5, 14.4 2.6 C 15.2 5, 14.7 7.4, 13 9.5"/>
          <path d="M12.5 9.7 C 15.3 9.2, 17.8 7.4, 18.4 4.8 C 15.6 5.7, 13.6 7.5, 12.5 9.7 Z"/>
          <path d="M12.7 8 C 13.2 6.2, 14 4.9, 15.1 4"/>
          <circle cx="15.2" cy="3.9" r="0.7" fill="currentColor" stroke="none"/>
        </g>
      </svg>
    </div>
    <div class="row">
      <span class="brand-demo">
        <svg viewBox="0 0 24 24" fill="none"><use href="#m2"/></svg>
        Traveritas
      </span>
      <span class="tab-demo">
        <svg viewBox="0 0 24 24" fill="none"><use href="#m2"/></svg>
        Traveritas
      </span>
    </div>
  </div>

  <!-- M3 几何花窗 -->
  <div class="cell">
    <h2>方案三 · 几何花窗</h2>
    <div class="big">
      <svg viewBox="0 0 24 24" fill="none">
        <g stroke="currentColor" stroke-width="0.9" stroke-linecap="round" fill="none">
          <circle cx="12" cy="12" r="9.4"/>
          <path d="M12 2.6 V 8.6 M12 15.4 V 21.4 M2.6 12 H 8.6 M15.4 12 H 21.4
                   M5.3 5.3 L 9.6 9.6 M14.4 14.4 L 18.7 18.7 M18.7 5.3 L 14.4 9.6 M9.6 14.4 L 5.3 18.7"/>
          <circle cx="12" cy="12" r="2.6"/>
          <circle cx="12" cy="12" r="0.9" fill="currentColor" stroke="none"/>
        </g>
      </svg>
    </div>
    <div class="row">
      <span class="brand-demo">
        <svg viewBox="0 0 24 24" fill="none"><use href="#m3"/></svg>
        Traveritas
      </span>
      <span class="tab-demo">
        <svg viewBox="0 0 24 24" fill="none"><use href="#m3"/></svg>
        Traveritas
      </span>
    </div>
  </div>

  <!-- M4 花苞 -->
  <div class="cell">
    <h2>方案四 · 花苞</h2>
    <div class="big">
      <svg viewBox="0 0 24 24" fill="none">
        <g stroke="currentColor" stroke-width="0.9" stroke-linecap="round" fill="none">
          <path d="M12 21.5 C 12 17.5, 12 14.5, 12 11.5"/>
          <path d="M12 11.5 C 9.4 9.6, 8.6 6.4, 10.2 3.6 C 12.4 5.6, 13.2 8.6, 12 11.5 Z"/>
          <path d="M12 11.5 C 10.6 8.4, 11.6 5, 14.4 3 C 15.4 6.2, 14.4 9.4, 12 11.5 Z"/>
          <path d="M12 21.5 C 10.2 19.6, 9.4 17.4, 9.8 15"/>
          <path d="M12 21.5 C 13.9 19.7, 14.7 17.3, 14.2 14.8"/>
        </g>
      </svg>
    </div>
    <div class="row">
      <span class="brand-demo">
        <svg viewBox="0 0 24 24" fill="none"><use href="#m4"/></svg>
        Traveritas
      </span>
      <span class="tab-demo">
        <svg viewBox="0 0 24 24" fill="none"><use href="#m4"/></svg>
        Traveritas
      </span>
    </div>
  </div>

</div>

<!-- 图形符号定义（供上面小尺寸引用） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="m1">
      <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none">
        <path d="M12 12 C 8.8 9.4, 7.9 5.4, 12 2 C 16.1 5.4, 15.2 9.4, 12 12 Z"/>
        <path d="M12 12 C 8.2 11.2, 5.5 8.2, 6.5 4.2 C 10.4 5.3, 12 8.4, 12 12 Z"/>
        <path d="M12 12 C 15.8 11.2, 18.5 8.2, 17.5 4.2 C 13.6 5.3, 12 8.4, 12 12 Z"/>
        <path d="M12 12 C 8.8 14.6, 7.9 18.6, 12 22 C 16.1 18.6, 15.2 14.6, 12 12 Z"/>
        <path d="M12 12 C 8.2 12.8, 5.5 15.8, 6.5 19.8 C 10.4 18.7, 12 15.6, 12 12 Z"/>
        <path d="M12 12 C 15.8 12.8, 18.5 15.8, 17.5 19.8 C 13.6 18.7, 12 15.6, 12 12 Z"/>
        <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/>
      </g>
    </g>
    <!-- M1 实心变体（favicon 用，16px 下不发虚） -->
    <g id="m1solid">
      <g fill="currentColor">
        <path d="M12 13.6 C 8.6 10.9, 7.7 6.5, 12 2.8 C 16.3 6.5, 15.4 10.9, 12 13.6 Z"/>
        <path d="M12 13.6 C 8 12.8, 5 9.6, 6.1 5.3 C 10.2 6.5, 12 9.8, 12 13.6 Z"/>
        <path d="M12 13.6 C 16 12.8, 19 9.6, 17.9 5.3 C 13.8 6.5, 12 9.8, 12 13.6 Z"/>
        <path d="M12 13.6 C 8.6 16.3, 7.7 20.7, 12 24 C 16.3 20.7, 15.4 16.3, 12 13.6 Z" transform="translate(0 -1.6)"/>
        <path d="M12 13.6 C 8 14.4, 5 17.6, 6.1 21.9 C 10.2 20.7, 12 17.4, 12 13.6 Z"/>
        <path d="M12 13.6 C 16 14.4, 19 17.6, 17.9 21.9 C 13.8 20.7, 12 17.4, 12 13.6 Z"/>
      </g>
    </g>
    <g id="m2">
      <g stroke="currentColor" stroke-width="1.1" stroke-linecap="round" fill="none">
        <path d="M13 22 C 13.8 17.6, 12 13.4, 12.4 9.6"/>
        <path d="M12.4 9.6 C 9.6 8.9, 7.6 6.6, 7.8 3.8 C 10.5 5.2, 12 7.4, 12.4 9.6 Z"/>
        <path d="M12.4 9.3 C 12.1 6.9, 12.9 4.5, 14.4 2.6 C 15.2 5, 14.7 7.4, 13 9.5"/>
        <path d="M12.5 9.7 C 15.3 9.2, 17.8 7.4, 18.4 4.8 C 15.6 5.7, 13.6 7.5, 12.5 9.7 Z"/>
        <circle cx="15.2" cy="3.9" r="0.8" fill="currentColor" stroke="none"/>
      </g>
    </g>
    <g id="m3">
      <g stroke="currentColor" stroke-width="1.1" stroke-linecap="round" fill="none">
        <circle cx="12" cy="12" r="9.4"/>
        <path d="M12 2.6 V 8.6 M12 15.4 V 21.4 M2.6 12 H 8.6 M15.4 12 H 21.4"/>
        <circle cx="12" cy="12" r="2.6"/>
      </g>
    </g>
    <g id="m4">
      <g stroke="currentColor" stroke-width="1.1" stroke-linecap="round" fill="none">
        <path d="M12 21.5 C 12 17.5, 12 14.5, 12 11.5"/>
        <path d="M12 11.5 C 9.4 9.6, 8.6 6.4, 10.2 3.6 C 12.4 5.6, 13.2 8.6, 12 11.5 Z"/>
        <path d="M12 11.5 C 10.6 8.4, 11.6 5, 14.4 3 C 15.4 6.2, 14.4 9.4, 12 11.5 Z"/>
      </g>
    </g>
  </defs>
</svg>

</body>
</html>
