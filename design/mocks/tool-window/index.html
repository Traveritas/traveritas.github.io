<!doctype html>
<html lang="zh-CN" data-ctx="home" data-face="wake" data-glass="home" data-dock="1" data-view="explore" data-open="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>薄玻璃窗 · 工具层原型</title>
<link rel="stylesheet" href="/fonts/noto/font.css">
<link rel="stylesheet" href="window.css">
<link rel="icon" href="data:,">
<script>document.documentElement.classList.add('t-js');</script>
</head>
<body>

<!-- 底：四种语境的底子（夜色 / 天光 / 失线） -->
<div class="t-ground" id="t-ground" aria-hidden="true">
  <i class="t-seam" id="t-seam"></i>
  <i class="t-broken" id="t-broken"></i>
</div>

<!-- 空间：内容的窗（厚一档的玻璃） -->
<main class="t-space" id="t-space" aria-label="内容"></main>

<!-- 工具层：薄玻璃窗（比内容的窗薄一档） -->
<!-- 打开时从左边缘漫出来的一层薄雾：让工具层读成更前的一层，后面的内容退后 -->
<div class="t-scrim" id="t-scrim" aria-hidden="true"></div>
<nav class="t-shelf" id="t-shelf" aria-label="工具"></nav>
<!-- 拖出来的窗住在这里（不挂在被 transform 的那一摞下面，位置才对得上指针） -->
<div class="t-floats" id="t-floats"></div>

<p class="t-hint" id="t-hint" aria-hidden="true"></p>
<div class="t-vh" id="t-live" role="status" aria-live="polite"></div>

<!-- 无脚本兜底：这一轮工具层本就是增强层，正文与名录仍照旧读得到 -->
<noscript>
  <div class="t-noscript">
    <h1>Traveritas</h1>
    <p>在即将醒来的那一瞬，世界究竟是在成形，还是正在融化？</p>
    <ul>
      <li><a href="/">归处 · 回主页</a></li>
      <li><a href="/gate/">门 · NEXUS</a></li>
      <li><a href="https://github.com/Traveritas" rel="noreferrer">出口 · GitHub</a></li>
      <li><a href="/rss.xml">出口 · RSS</a></li>
    </ul>
  </div>
</noscript>

<script src="../layout-plane/data.js"></script>
<script src="window.js"></script>
</body>
</html>
