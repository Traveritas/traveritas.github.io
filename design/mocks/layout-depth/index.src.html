<!doctype html>
<html lang="zh-CN" class="nojs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>景深叠层 · 原型</title>
  <!-- 生成文件：改 index.src.html 后跑 node design/mocks/layout-depth/build.mjs -->
  <script>document.documentElement.classList.replace('nojs', 'js');</script>
  <link rel="stylesheet" href="/fonts/noto-serif-sc/font.css">
  <link rel="stylesheet" href="/node_modules/@fontsource/ibm-plex-mono/400.css">
  <link rel="stylesheet" href="depth.css">
</head>
<body>
  <div class="sky" aria-hidden="true"><div class="sky-side"></div><div class="mist m1"></div><div class="mist m2"></div></div>

  <div class="chrome">
    <a class="brand" href="#threshold">Traveritas</a>
    <p class="where" aria-live="polite"><span class="w-sec"></span><span class="w-n"></span></p>
    <button class="side-toggle" type="button" aria-pressed="false"><span class="st-a">侧看</span><span class="st-b">回到正面</span></button>
  </div>

  <nav class="rail" aria-label="页内位置"></nav>
  <p class="hint" aria-hidden="true">滚动，向前 <i>↓</i> · 回车展开</p>

  <main class="stage" id="stack">
<!--STACK-->
  </main>

  <div class="labels" aria-hidden="true"></div>
  <div class="scroller" aria-hidden="true"></div>

  <div class="reader" role="dialog" aria-modal="true" aria-label="阅读" hidden>
    <div class="r-glass"></div>
    <button class="r-close" type="button">收起 <i>Esc</i></button>
    <div class="r-scroll"><div class="r-col"></div></div>
  </div>

  <script src="depth.js"></script>
</body>
</html>
