<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 P5 · 过门（活体）</title>
<style>
  /* ═══ 概念 ═══
     入口=「门」字本身：站点的大门就是这个字。
     「门」字巨构立在雾中——左柱（丨）、横楣（⺆上横）、带下钩的右柱（㇆），
     以及悬在横楣左上、无处承重却从未坠落的那一点（丶）。
     滚动=走过这个字：镜头从门外推向门洞、穿越、进入门里的字段；
     穿越瞬间一次极轻的暖色翻闪（天色换了一层）。
     局部规则（一条）：门里比门外暖——门洞裁出的那片天是暖的
     （「别处的暖透过来的暖」，规则继承 Jc 冷晨）；丶在入梦时发亮：字的那一点是梦。
     与 p3-K 的差异：K 是「场景里摆放的一扇门」，这里是「字即门、入口即字」的进入机制。
     字平面被门柱真实遮挡（穿插）。性能纪律：DPR≤1.5、无后处理、~30fps、
     reduced-motion 静帧按需渲染。 */

  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-600-normal.woff2') format('woff2');
  }

  :root {
    --ink: #37363a;
    --ink-soft: #655f66;
    --ink-faint: #6f696f;
    --mist-ink: #5d6d80;
    --font-display: 'Noto Serif SC Web', 'Noto Serif SC', 'Palatino Linotype', Georgia, 'Songti SC', SimSun, serif;
    --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); color: var(--ink); background: #e2e1de; }

  .stage {
    position: fixed;
    inset: 0;
    overflow: clip;
    background: linear-gradient(to bottom, #e0e4e2 0%, #e9e4da 55%, #dbd5d0 100%);
  }
  .scroll-length { height: 300vh; }  /* 首屏之外 200vh 滚动余量 = 过门的行程 */
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .vignette {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(125% 92% at 50% 42%, transparent 60%, rgba(84, 72, 80, 0.12) 100%);
  }

  .rise { opacity: 0; transform: translateY(10px); animation: rise-in 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .rise.d1 { animation-delay: 0.15s; }
  .rise.d2 { animation-delay: 0.45s; }
  .rise.d3 { animation-delay: 0.7s; }
  @keyframes rise-in { to { opacity: 1; transform: translateY(0); } }

  .manifesto {
    position: absolute;
    left: 8vw;
    top: 9vh;
    z-index: 10;
    margin: 0;
    font-family: var(--font-display);
    line-height: 1.6;
    color: var(--ink);
    text-shadow: 0 2px 26px rgba(244, 240, 232, 0.9), 0 0 8px rgba(244, 240, 232, 0.7);
  }
  .manifesto .l1 { display: block; font-size: clamp(1.35rem, 2.8vw, 2.6rem); font-weight: 500; letter-spacing: 0.04em; }

  .brand {
    position: absolute; top: 4.5vh; left: 4vw; z-index: 10;
    display: inline-flex; align-items: center; gap: 0.6rem;
    font-family: var(--font-display); font-weight: 500; font-size: 1.02rem;
    letter-spacing: 0.06em; color: var(--ink); text-decoration: none;
    text-shadow: 0 1px 18px rgba(244, 240, 232, 0.9);
  }
  .brand .ring { width: 11px; height: 11px; border: 1.5px solid var(--mist-ink); border-radius: 50%; opacity: 0.85; }

  .nav {
    position: absolute; right: 3.4vw; top: 24vh; z-index: 10;
    display: flex; flex-direction: column; gap: 2.3rem;
  }
  .nav a {
    position: relative; writing-mode: vertical-rl; letter-spacing: 0.5em;
    padding: 0.4rem 0.7rem; color: var(--ink-soft); text-decoration: none;
    font-size: 0.95rem; transition: color 0.18s ease;
    text-shadow: 0 1px 16px rgba(244, 240, 232, 0.9);
  }
  .nav a::after {
    content: ''; position: absolute; top: 46%; right: calc(100% + 0.35rem);
    width: 1.3rem; height: 1px; background: rgba(93, 109, 128, 0.45);
    transition: width 0.18s ease, background 0.18s ease;
  }
  .nav a:hover { color: var(--ink); }
  .nav a:hover::after { width: 2rem; background: var(--mist-ink); }

  .side-note {
    position: absolute; left: 3.2vw; top: 13vh; z-index: 10;
    writing-mode: vertical-rl; font-size: 0.8rem; letter-spacing: 0.52em;
    color: var(--ink-faint);
    text-shadow: 0 0 10px rgba(244, 240, 232, 0.95), 0 0 4px rgba(244, 240, 232, 0.9);
  }

  .floating-ledger { position: absolute; left: 26vw; right: 16vw; bottom: 6vh; z-index: 10; }
  .floating-ledger h2 {
    margin: 0 0 1rem; font-weight: 500; font-size: 0.82rem;
    letter-spacing: 0.3em; color: var(--ink-faint);
    text-shadow: 0 1px 14px rgba(244, 240, 232, 0.9);
  }
  .slips { display: flex; gap: 1.2rem 1.8rem; align-items: flex-start; }
  .slip {
    position: relative; display: block; padding: 0.85rem 1rem 0.95rem;
    background: rgba(252, 250, 246, 0.9); border: 1px solid rgba(255, 255, 255, 0.62);
    box-shadow: 5px 4px 10px -6px rgba(84, 72, 80, 0.3);
    text-decoration: none; overflow: clip;
  }
  .slip::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
    background: linear-gradient(to bottom, transparent, rgba(200, 176, 160, 0.24));
  }
  .slip:nth-child(1) { width: 13rem; transform: rotate(-1.2deg); }
  .slip:nth-child(2) { width: 15.5rem; transform: rotate(0.7deg) translateY(10px); }
  .slip:nth-child(3) { width: 12.5rem; transform: rotate(-0.5deg) translateY(3px); }
  .slip .d { display: block; font-size: 0.72rem; letter-spacing: 0.12em; color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-bottom: 0.35rem; }
  .slip .t { display: block; font-family: var(--font-display); font-size: 0.98rem; color: var(--ink); line-height: 1.55; }
  .slip:hover .t { color: var(--mist-ink); }

  /* 穿越门洞一瞬的暖色翻闪 */
  .gate-flash {
    position: fixed; inset: 0; z-index: 40; pointer-events: none;
    background: radial-gradient(120% 100% at 50% 52%, rgba(250, 232, 205, 0.95) 0%, rgba(244, 220, 190, 0.85) 100%);
    opacity: 0;
  }

  .stage.no3d canvas#gl { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; opacity: 1; transform: none; }
  }
  @media (max-width: 760px) {
    .side-note { display: none; }
    .brand { position: static; margin: 4.5vh 9vw 0; }
    .nav { position: static; margin: 0.9rem 9vw 0; flex-direction: row; gap: 1.8rem; }
    .nav a { writing-mode: horizontal-tb; letter-spacing: 0.24em; font-size: 0.9rem; }
    .nav a::after { display: none; }
    .floating-ledger { position: static; margin: 2.8rem 9vw 8vh; }
    .slips { flex-direction: column; gap: 0.9rem; }
    .slip { width: 100%; transform: none; }
    .stage { position: relative; min-height: 100dvh; }
    .scroll-length { display: none; }
    .manifesto { position: relative; top: 0; left: 0; margin: 10vh 9vw 0; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <h1 class="manifesto rise" aria-label="这里不是梦，也不是现实。它是人在即将醒来时，看见的最后一层世界。">
    <span class="l1">这里不是梦，也不是现实。</span>
  </h1>

  <a class="brand rise d1" href="/"><span class="ring" aria-hidden="true"></span>Traveritas</a>
  <p class="side-note rise d2" aria-hidden="true">门里比门外暖</p>

  <nav class="nav rise d2" aria-label="站内入口">
    <a href="/articles/">随笔</a>
    <a href="/projects/">项目</a>
    <a href="/about/">关于</a>
  </nav>

  <section class="floating-ledger rise d3" aria-label="最近的随笔">
    <h2>最近的随笔</h2>
    <div class="slips">
      <a class="slip" href="#"><span class="d">2026.09.12</span><span class="t">母题探索记录</span></a>
      <a class="slip" href="#"><span class="d">2026.08.30</span><span class="t">关于“醒梦”的第一份笔记</span></a>
      <a class="slip" href="#"><span class="d">2026.08.11</span><span class="t">把网站做成一个房间</span></a>
    </div>
  </section>
</div>
<div class="scroll-length" aria-hidden="true"></div>
<div class="gate-flash" id="gateFlash" aria-hidden="true"></div>

<script src="vendor/three.min.js"></script>
<script>
/* ═══ 过门 ═══
   「门」字巨构 = 左柱 + 横楣 + 带下钩右柱 + 悬空的丶；
   滚动 = 镜头走过这个字（门外→门洞→门里），穿越瞬间暖色翻闪；
   门洞裁出更暖的别处天空；丶在入梦时发亮。 */
(function () {
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var qs = {};
  location.search.replace(/[?&]([^=&]+)(?:=([^&]*))?/g, function (_, k, v) { qs[k] = v === undefined ? '' : decodeURIComponent(v); });
  var fastMode = 'fast' in qs;
  var stillMode = 'still' in qs;
  if (stillMode) reduceMotion = true;
  var pinScroll = 'pin' in qs ? Math.max(0, Math.min(1, parseFloat(qs.pin) || 0)) : null;
  var speed = fastMode ? 6 : 1;

  if (!window.THREE) { document.getElementById('stage').classList.add('no3d'); return; }

  var seed = 11;
  function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  function range(a, b) { return a + rnd() * (b - a); }
  function clamp01(x) { return Math.min(1, Math.max(0, x)); }
  function ease(t) { t = clamp01(t); return t * t * (3 - 2 * t); }

  var canvas = document.getElementById('gl');
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false }); }
  catch (e) { document.getElementById('stage').classList.add('no3d'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

  var scene = new THREE.Scene();

  /* ── 色板：晨雾青（门外·醒）↔ 暮青紫（入梦）；门里的暖恒定 ── */
  var WAKE = {
    fog: 0xdfe3e0, skyTop: 0xc3ced2, skyHor: 0xefe9dd, sun: 0xfff0da,
    hemiSky: 0xf0efe6, hemiGnd: 0xafa595, fill: 0xe3ded4, sunI: 0.56,
    slab: 0xe0e4e0, glow: 0xf0c69c,
    mA: 0xece9de, mB: 0xdfd9cb, mC: 0xccc3b3, mD: 0xa29684
  };
  var DREAM = {
    fog: 0xd2cdd9, skyTop: 0xa9aec3, skyHor: 0xdcd3da, sun: 0xd6cbe2,
    hemiSky: 0xd8d3e0, hemiGnd: 0x8a8294, fill: 0xcfc8da, sunI: 0.34,
    slab: 0xd2cfda, glow: 0xf3bd92,
    mA: 0xdad5e0, mB: 0xccc5d2, mC: 0xb2a9ba, mD: 0x827a90
  };
  Object.keys(WAKE).forEach(function (k) {
    if (typeof WAKE[k] === 'number' && k !== 'sunI') { WAKE[k] = new THREE.Color(WAKE[k]); DREAM[k] = new THREE.Color(DREAM[k]); }
  });
  var fogCol = WAKE.fog.clone();
  scene.background = fogCol.clone();
  scene.fog = new THREE.Fog(fogCol.clone(), 14, 62);

  var camera = new THREE.PerspectiveCamera(44, 1, 0.1, 400);

  var hemi = new THREE.HemisphereLight(WAKE.hemiSky.clone(), WAKE.hemiGnd.clone(), 0.95);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(WAKE.sun.clone(), WAKE.sunI);
  sun.position.set(-4.5, 7.0, 6.5);   /* 光从身后偏左来：门外是晨 */
  scene.add(sun);
  var fill = new THREE.DirectionalLight(WAKE.fill.clone(), 0.24);
  fill.position.set(6.5, 4.5, 3.5);
  scene.add(fill);
  var SUN_DIR = new THREE.Vector3(-0.4, 0.55, 0.68).normalize();

  /* ── 程序纹理 ── */
  var surfTex = (function () {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var x = c.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, 128, 128);
    var im = x.getImageData(0, 0, 128, 128);
    for (var i = 0; i < im.data.length; i += 4) {
      var v = 234 + Math.floor(rnd() * 21);
      im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
    }
    x.putImageData(im, 0, 0);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(2, 2);
    return t;
  })();
  function makeGlowTex(inner, mid) {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var x = c.getContext('2d');
    var g = x.createRadialGradient(64, 64, 0, 64, 64, 62);
    g.addColorStop(0, inner);
    g.addColorStop(0.55, mid);
    g.addColorStop(1, 'rgba(255,220,178,0)');
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }

  /* ── 天空穹（门外之天） ── */
  var skyU = {
    uTop: { value: WAKE.skyTop.clone() },
    uHor: { value: WAKE.skyHor.clone() },
    uSunDir: { value: SUN_DIR },
    uSunCol: { value: WAKE.sun.clone() },
    uTime: { value: 0 }
  };
  var sky = new THREE.Mesh(
    new THREE.SphereGeometry(160, 32, 20),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, depthTest: false,
      uniforms: skyU,
      vertexShader: [
        'varying vec3 vDir;',
        'void main() {',
        '  vDir = normalize(position);',
        '  gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0);',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform vec3 uTop; uniform vec3 uHor; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform float uTime;',
        'varying vec3 vDir;',
        'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
        'float noise(vec2 p) {',
        '  vec2 i = floor(p), f = fract(p);',
        '  vec2 u = f * f * (3.0 - 2.0 * f);',
        '  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);',
        '}',
        'void main() {',
        '  float h = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0);',
        '  vec3 col = mix(uHor, uTop, smoothstep(0.5, 0.92, h));',
        '  col = mix(col, uHor * 0.985, smoothstep(0.5, 0.38, h));',
        '  float sd = max(dot(normalize(vDir), normalize(uSunDir)), 0.0);',
        '  col += uSunCol * (pow(sd, 20.0) * 0.26 + pow(sd, 4.0) * 0.09);',
        '  float haze = noise(vec2(atan(vDir.x, vDir.z) * 2.4, vDir.y * 5.0) + uTime * 0.006);',
        '  col += (haze - 0.5) * 0.02;',
        '  gl_FragColor = vec4(col, 1.0);',
        '}'
      ].join('\n')
    })
  );
  sky.renderOrder = -1;
  scene.add(sky);

  /* ── 地面：连续晕染雾原（继承底盘，无色带无点彩） ── */
  var mistU = {
    uTime: { value: 0 },
    uDream: { value: 0 },
    uFogColor: { value: fogCol.clone() },
    uFogNear: { value: 14.0 },
    uFogFar: { value: 62.0 },
    uA: { value: WAKE.mA.clone() }, uB: { value: WAKE.mB.clone() },
    uC: { value: WAKE.mC.clone() }, uD: { value: WAKE.mD.clone() }
  };
  var mist = new THREE.Mesh(
    new THREE.PlaneGeometry(400, 400, 72, 72),
    new THREE.ShaderMaterial({
      transparent: true,
      uniforms: mistU,
      vertexShader: [
        'uniform float uTime;',
        'varying vec3 vWorld;',
        'varying float vNdcY;',
        'void main() {',
        '  vec4 w = modelMatrix * vec4(position, 1.0);',
        '  w.y += 0.035 * sin(w.x * 0.5 + uTime * 0.5) + 0.022 * sin(w.z * 0.38 + uTime * 0.4 + w.x * 0.2);',
        '  vWorld = w.xyz;',
        '  vec4 pr = projectionMatrix * viewMatrix * w;',
        '  vNdcY = pr.y / pr.w;',
        '  gl_Position = pr;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform float uTime; uniform float uDream;',
        'uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar;',
        'uniform vec3 uA; uniform vec3 uB; uniform vec3 uC; uniform vec3 uD;',
        'varying vec3 vWorld; varying float vNdcY;',
        'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
        'float noise(vec2 p) {',
        '  vec2 i = floor(p), f = fract(p);',
        '  float a = hash(i), b = hash(i + vec2(1.0, 0.0)), c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));',
        '  vec2 u = f * f * (3.0 - 2.0 * f);',
        '  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);',
        '}',
        'float fbm(vec2 p) {',
        '  float v = 0.0, a = 0.5;',
        '  for (int i = 0; i < 3; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }',
        '  return v;',
        '}',
        'vec3 grad(float t) {',
        '  vec3 c = mix(uA, uB, smoothstep(0.0, 0.38, t));',
        '  c = mix(c, uC, smoothstep(0.38, 0.66, t));',
        '  c = mix(c, uD, smoothstep(0.66, 1.0, t));',
        '  return c;',
        '}',
        'void main() {',
        '  vec2 p = vWorld.xz * 0.048;',
        '  vec2 w1 = vec2(fbm(p + vec2(0.0, 3.7)), fbm(p + vec2(5.2, 0.0)));',
        '  float h = fbm(p * 2.1 + w1 * 1.2 + vec2(uTime * 0.008, -uTime * 0.006));',
        '  float dist = length(vWorld - cameraPosition);',
        '  float fogF = smoothstep(uFogNear, uFogFar, dist);',
        '  vec3 col = grad(h);',
        '  float streak = fbm(vec2(vWorld.x * 0.3, vWorld.z * 1.3) + w1 * 0.8);',
        '  col *= 0.975 + 0.05 * streak;',
        '  col = mix(col, uFogColor, fogF);',
        '  float deep = smoothstep(0.25, -0.85, vNdcY);',
        '  col *= 1.0 - 0.05 * deep;',
        '  float alpha = clamp(mix(0.76, 0.95, fogF) + deep * 0.26, 0.0, 1.0);',
        '  gl_FragColor = vec4(col, alpha);',
        '}'
      ].join('\n')
    })
  );
  mist.rotation.x = -Math.PI / 2;
  mist.renderOrder = 5;
  scene.add(mist);

  /* ── 门柱材质：磨砂受光壳（半兰伯特 + 逆光透光 + 菲涅尔边缘，继承底盘） ── */
  var SLAB_VERT = [
    'varying vec3 vN; varying vec3 vW; varying vec2 vUv; varying float vDist;',
    'void main() {',
    '  vec4 w = modelMatrix * vec4(position, 1.0);',
    '  vW = w.xyz;',
    '  vN = normalize(mat3(modelMatrix) * normal);',
    '  vUv = uv;',
    '  vec4 mv = viewMatrix * w;',
    '  vDist = length(mv.xyz);',
    '  gl_Position = projectionMatrix * mv;',
    '}'
  ].join('\n');
  var SLAB_FRAG = [
    'uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uSkyCol;',
    'uniform vec3 uBase; uniform vec3 uTransCol; uniform vec3 uRimCol; uniform vec3 uFogColor;',
    'uniform vec3 uWarmPos; uniform vec3 uWarmCol; uniform float uWarmI;',
    'uniform float uTrans; uniform float uRimPow; uniform float uFade;',
    'uniform float uFogNear; uniform float uFogFar;',
    'uniform sampler2D uMap;',
    'varying vec3 vN; varying vec3 vW; varying vec2 vUv; varying float vDist;',
    'void main() {',
    '  vec3 N = normalize(vN);',
    '  vec3 V = normalize(cameraPosition - vW);',
    '  vec3 L = normalize(uSunDir);',
    '  float ndl = dot(N, L);',
    '  float hl = clamp(0.5 + 0.5 * ndl, 0.0, 1.0); hl *= hl;',
    '  float back = pow(max(dot(V, -L), 0.0), 2.0);',
    '  float rim = pow(1.0 - abs(dot(N, V)), uRimPow);',
    '  vec3 col = uBase * (0.24 + 0.78 * hl) * mix(uSkyCol, uSunCol, 0.58);',
    /* 门里的暖：来自「别处」的一点暖光，只舔到朝向门洞的那些面 */
    '  vec3 Wd = uWarmPos - vW;',
    '  float Wdist2 = dot(Wd, Wd);',
    '  float wl = max(dot(N, Wd / sqrt(Wdist2)), 0.0);',
    '  col += uWarmCol * (wl * uWarmI / (1.0 + 0.0016 * Wdist2));',
    '  col += uTransCol * back * uTrans;',
    '  col += uRimCol * rim * 0.27;',
    '  float g = texture2D(uMap, vUv * vec2(3.0, 9.0)).r;',
    '  col *= 0.955 + 0.09 * g;',
    '  float fogF = smoothstep(uFogNear, uFogFar, vDist);',
    '  col = mix(col, uFogColor, clamp(fogF + uFade * 0.58, 0.0, 0.97));',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');
  var slabUniforms = [];
  function makeSlabMat() {
    var u = {
      uSunDir: { value: SUN_DIR }, uSunCol: { value: WAKE.sun.clone() },
      uSkyCol: { value: WAKE.hemiSky.clone() },
      uBase: { value: WAKE.slab.clone() },
      uTransCol: { value: WAKE.glow.clone() },
      uRimCol: { value: new THREE.Color(0xf2f4f2) },
      uFogColor: { value: fogCol.clone() },
      uFogNear: { value: 14.0 }, uFogFar: { value: 62.0 },
      uWarmPos: { value: new THREE.Vector3(0.5, 6.5, -30) },
      uWarmCol: { value: new THREE.Color(0xf2c092) },
      uWarmI: { value: 0.75 },
      uTrans: { value: 0.5 }, uRimPow: { value: 2.6 }, uFade: { value: 0 },
      uMap: { value: surfTex }
    };
    slabUniforms.push(u);
    return new THREE.ShaderMaterial({ vertexShader: SLAB_VERT, fragmentShader: SLAB_FRAG, uniforms: u });
  }

  /* ═══ 「门」字巨构 ═══
     左柱（丨）＋ 横楣（上横，右端略出挑）＋ 右柱（㇆竖，底端向内下钩）
     ＋ 悬空的丶（横楣左上，无处承重却从未坠落）。 */
  var gate = new THREE.Group();
  scene.add(gate);
  var gatePieces = [];
  function addStroke(size, pos, rot, opts) {
    opts = opts || {};
    var mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), makeSlabMat());
    mesh.position.set(pos[0], pos[1], pos[2]);
    mesh.rotation.set(rot[0], rot[1], rot[2]);
    mesh.renderOrder = 0;
    gate.add(mesh);
    gatePieces.push({
      mesh: mesh,
      baseY: pos[1], ph: rnd() * Math.PI * 2,
      amp: opts.amp !== undefined ? opts.amp : 0.02,
      dot: !!opts.dot
    });
    return mesh;
  }
  addStroke([2.4, 17.6, 2.4], [-5.7, 7.6, 0], [0, 0.02, 0.011]);           /* 丨 左柱 */
  addStroke([14.2, 2.5, 2.5], [0.7, 15.6, 0], [0, -0.014, -0.006]);        /* 上横（右端出挑） */
  addStroke([2.3, 13.2, 2.3], [6.4, 7.7, 0], [0, 0.03, -0.012]);           /* ㇆ 竖 */
  addStroke([1.9, 1.6, 2.3], [5.45, 0.55, 0], [0, 0.03, 0]);               /* 下钩（向内） */
  var dotMesh = (function () {                                              /* 丶 */
    var mesh = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1.5, 1.5),
      new THREE.MeshStandardMaterial({
        color: 0xe6ded2, emissive: 0xc9905a, emissiveIntensity: 0.12,
        roughness: 0.42, metalness: 0, map: surfTex
      })
    );
    mesh.rotation.z = Math.PI / 4;
    mesh.position.set(-7.9, 17.7, 1.1);   /* 悬在横楣左上：字的那一点，无处承重 */
    gate.add(mesh);
    gatePieces.push({ mesh: mesh, baseY: 17.7, ph: rnd() * Math.PI * 2, amp: 0.24, dot: true });
    var glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeGlowTex('rgba(255,226,186,0.95)', 'rgba(255,220,178,0.42)'),
      color: 0xf5d2a4, transparent: true, opacity: 0.14, depthWrite: false
    }));
    glow.scale.setScalar(6.0);
    glow.renderOrder = 7;
    scene.add(glow);
    return { mesh: mesh, glow: glow, glowMat: glow.material };
  })();

  /* ── 门洞里的「别处」：一块暖色的远处（被门柱自然裁出） ── */
  var warmU = {
    uCore: { value: new THREE.Color(0xf8d9ab) },
    uEdge: { value: new THREE.Color(0xe8cfae) },
    uWarm: { value: 1 },
    uTime: { value: 0 }
  };
  var warmElsewhere = new THREE.Mesh(
    new THREE.PlaneGeometry(70, 40),
    new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, fog: false,
      uniforms: warmU,
      vertexShader: [
        'varying vec2 vUv;',
        'void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }'
      ].join('\n'),
      fragmentShader: [
        'uniform vec3 uCore; uniform vec3 uEdge; uniform float uWarm; uniform float uTime;',
        'varying vec2 vUv;',
        'void main() {',
        '  vec2 p = vUv - vec2(0.5, 0.44);',
        '  p.x *= 1.55;',
        '  float d = length(p);',
        '  float core = smoothstep(0.52, 0.05, d);',
        '  float body = smoothstep(0.84, 0.2, d) * 0.55;',
        '  float breathe = 0.955 + 0.045 * sin(uTime * 0.21);',
        '  float a = (core * 0.94 + body) * uWarm * breathe;',
        '  gl_FragColor = vec4(mix(uEdge, uCore, core), a);',
        '}'
      ].join('\n')
    })
  );
  warmElsewhere.position.set(0.6, 8.6, -52);
  warmElsewhere.renderOrder = 1;
  scene.add(warmElsewhere);

  /* 门里的暖在雾原上淌出一片（光的积水） */
  var spill = new THREE.Mesh(
    new THREE.PlaneGeometry(26, 54),
    new THREE.MeshBasicMaterial({
      map: makeGlowTex('rgba(250,222,180,0.85)', 'rgba(246,212,168,0.34)'),
      transparent: true, opacity: 0.2, depthWrite: false
    })
  );
  spill.rotation.x = -Math.PI / 2;
  spill.rotation.z = 0.06;
  spill.position.set(0.5, 0.07, -27);
  spill.renderOrder = 6;
  scene.add(spill);

  /* ── 门里的字段：竖排宣言 ×2 + 三枚悬浮玻璃纸签 + 远处小碑 ── */
  function makeTextPlane(text, vertical, colorInk, worldW) {
    var cvs = document.createElement('canvas');
    var ctx = cvs.getContext('2d');
    var ratio = vertical ? [512, 2048] : [2048, 512];
    cvs.width = ratio[0]; cvs.height = ratio[1];
    var tex = new THREE.CanvasTexture(cvs);
    tex.anisotropy = 4;
    function draw() {
      var fontSize = vertical ? 168 : 148;
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      ctx.fillStyle = colorInk;
      ctx.font = '600 ' + fontSize + 'px "Noto Serif SC Web", "Songti SC", serif';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      if (vertical) {
        var x = cvs.width / 2;
        var step = fontSize * 1.12;
        var startY = cvs.height / 2 - (text.length - 1) * step / 2;
        for (var i = 0; i < text.length; i++) ctx.fillText(text[i], x, startY + i * step);
      } else {
        ctx.fillText(text, cvs.width / 2, cvs.height / 2);
      }
      tex.needsUpdate = true;
    }
    draw();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
    var mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: true, alphaTest: 0.12, side: THREE.DoubleSide });
    var h = worldW * (ratio[1] / ratio[0]);
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(worldW, h), mat);
    mesh.renderOrder = 6;
    scene.add(mesh);
    return mesh;
  }
  /* 门外时被门柱遮去一半、过门后完整显形 */
  var tp1 = makeTextPlane('它是人在即将醒来时', true, 'rgba(52,46,40,0.9)', 1.5);
  tp1.position.set(-4.2, 4.2, -38);
  tp1.rotation.y = 0.18;
  var tp2 = makeTextPlane('看见的最后一层世界', false, 'rgba(74,63,52,0.6)', 8.0);
  tp2.position.set(2.0, 8.0, -44);

  /* 纸签：门里悬浮的三片磨砂薄玻璃（梦时微微透暖） */
  var slipDefs = [
    { size: [1.8, 0.09, 1.2], pos: [-3.4, 3.2, -24], rot: [0.1, 0.5, -0.06] },
    { size: [2.1, 0.1, 1.4], pos: [3.1, 4.4, -30.5], rot: [-0.08, -0.4, 0.05] },
    { size: [1.6, 0.08, 1.05], pos: [0.4, 2.6, -36.5], rot: [0.06, 0.9, -0.03] }
  ];
  var sceneSlips = slipDefs.map(function (d, i) {
    var mesh = new THREE.Mesh(
      new THREE.BoxGeometry(d.size[0], d.size[1], d.size[2]),
      new THREE.MeshStandardMaterial({
        color: 0xe9e3d7, emissive: 0xcfa476, emissiveIntensity: 0.1,
        roughness: 0.5, metalness: 0, map: surfTex
      })
    );
    mesh.position.set(d.pos[0], d.pos[1], d.pos[2]);
    mesh.rotation.set(d.rot[0], d.rot[1], d.rot[2]);
    mesh.renderOrder = 0;
    scene.add(mesh);
    return { mesh: mesh, baseY: d.pos[1], ph: rnd() * Math.PI * 2, i: i };
  });

  /* 尺度锚点：门外路边小碑 ×2、门里远处小碑 ×2 */
  var steleTones = [0xe2dede, 0xd4d0d4, 0xc4c0c8];
  [[-9.6, -2.0, 0.22, 0.95], [9.9, -6.5, 0.15, 0.55], [-5.0, -34, 0.5, 2.1], [6.2, -44, 0.62, 2.6]]
  .forEach(function (st, i) {
    var stele = new THREE.Mesh(
      new THREE.BoxGeometry(st[2], st[3], st[2] * 0.6),
      new THREE.MeshStandardMaterial({ color: steleTones[i % 3], map: surfTex, roughness: 0.92, metalness: 0 })
    );
    stele.position.set(st[0], st[3] / 2 - 0.08, st[1]);
    stele.rotation.y = rnd() * Math.PI;
    scene.add(stele);
  });

  /* ── 尘光（门里比门外多一点） ── */
  var MOTES = 60;
  var moteGeo = new THREE.BufferGeometry();
  var motePos = new Float32Array(MOTES * 3);
  var moteBase = [];
  for (var m = 0; m < MOTES; m++) {
    moteBase.push({ x: range(-9, 10), y: range(0.3, 11), z: range(-44, 26), ph: rnd() * Math.PI * 2, v: range(0.05, 0.15) });
  }
  moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
  /* 初始位姿就地填好：静帧路径不跑动画循环，避免尘光聚在原点 */
  (function () {
    var mp0 = moteGeo.attributes.position;
    for (var m0 = 0; m0 < MOTES; m0++) mp0.setXYZ(m0, moteBase[m0].x, moteBase[m0].y, moteBase[m0].z);
    mp0.needsUpdate = true;
  })();
  var moteTex = makeGlowTex('rgba(255,244,226,1)', 'rgba(255,238,214,0.55)');
  var moteMat = new THREE.PointsMaterial({
    map: moteTex, color: 0xf2d8b8, size: 0.2, sizeAttenuation: true,
    transparent: true, opacity: 0.4, depthWrite: false
  });
  var motes = new THREE.Points(moteGeo, moteMat);
  motes.renderOrder = 7;
  scene.add(motes);

  /* ═══ 滚动=过门 ═══ */
  var scrollP = 0;
  var pointer = { x: 0, y: 0 };
  var gateFlash = document.getElementById('gateFlash');

  function readScroll() {
    if (pinScroll !== null) { scrollP = pinScroll; return; }
    var max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    scrollP = Math.min(1, Math.max(0, (window.scrollY || 0) / max));
  }

  var tmpA = new THREE.Color(), tmpFog = new THREE.Color();
  function applyPalette(dream) {
    function mix(k) { return tmpA.copy(WAKE[k]).lerp(DREAM[k], dream); }
    tmpFog.copy(WAKE.fog).lerp(DREAM.fog, dream);
    scene.fog.color.copy(tmpFog);
    scene.background.copy(tmpFog);
    var fogNear = 14 - 5 * dream, fogFar = 62 - 22 * dream;
    scene.fog.near = fogNear; scene.fog.far = fogFar;
    mistU.uFogColor.value.copy(tmpFog);
    mistU.uFogNear.value = fogNear; mistU.uFogFar.value = fogFar;
    mistU.uA.value.copy(mix('mA')); mistU.uB.value.copy(mix('mB'));
    mistU.uC.value.copy(mix('mC')); mistU.uD.value.copy(mix('mD'));
    skyU.uTop.value.copy(mix('skyTop'));
    skyU.uHor.value.copy(mix('skyHor'));
    skyU.uSunCol.value.copy(mix('sun'));
    hemi.color.copy(mix('hemiSky'));
    hemi.groundColor.copy(mix('hemiGnd'));
    fill.color.copy(mix('fill'));
    sun.color.copy(mix('sun'));
    sun.intensity = WAKE.sunI + (DREAM.sunI - WAKE.sunI) * dream;
    for (var i = 0; i < slabUniforms.length; i++) {
      var u = slabUniforms[i];
      u.uSunCol.value.copy(skyU.uSunCol.value);
      u.uSkyCol.value.copy(hemi.color);
      u.uTransCol.value.copy(mix('glow'));
      u.uFogColor.value.copy(tmpFog);
      u.uFogNear.value = fogNear; u.uFogFar.value = fogFar;
      u.uBase.value.copy(mix('slab'));
    }
  }

  var camX = 0.9, camY = 2.4, camZ = 26.0, lookY = 7.2, lookZ = 15.0;

  function renderOnce() {
    camera.position.set(camX + pointer.x * 0.3, camY + pointer.y * -0.1, camZ);
    camera.lookAt(0, lookY, lookZ);
    renderer.render(scene, camera);
  }
  function onResize() {
    var wv = window.innerWidth, hv = window.innerHeight;
    renderer.setSize(wv, hv, false);
    camera.aspect = wv / hv;
    camera.fov = (wv / hv < 0.75) ? 58 : 42;
    camera.updateProjectionMatrix();
    renderOnce();
  }

  var lastT = 0, running = false, rafId = null;
  function loop(now) {
    if (running) requestAnimationFrame(loop);
    if (now - lastT < 33) return;
    var t = now / 1000;
    lastT = now;

    readScroll();
    var pE = ease(scrollP);
    /* 梦：过门之后越深越梦 */
    var dream = clamp01(0.04 + 0.04 * Math.sin(t * 0.05 * speed) + smooth01((scrollP - 0.42) / 0.58) * 0.78);
    var dE = ease(dream);
    mistU.uDream.value = dream;
    mistU.uTime.value = t * speed;
    skyU.uTime.value = t * speed;
    warmU.uTime.value = t * speed;
    applyPalette(dream);

    /* 镜头路径：开场看见整个「门」字 → 走近时横楣出画 → 穿越（z=0）→ 门里字段 */
    camX = 0.9 - 0.9 * pE;
    camY = 2.4 + 0.7 * pE;
    camZ = 26.0 - 46.0 * pE;
    lookY = 6.7 + 0.3 * pE - 0.7 * dE;
    lookZ = camZ - 11.0;

    /* 穿越翻闪：镜头过 z=0 前后一小段 */
    var cross = Math.exp(-(camZ * camZ) / 3.4);
    gateFlash.style.opacity = (cross * 0.62).toFixed(3);

    /* 门字巨构：极缓呼吸；丶悬浮明灭，梦时发亮（字的那一点是梦） */
    for (var i = 0; i < gatePieces.length; i++) {
      var gp = gatePieces[i];
      gp.mesh.position.y = gp.baseY + Math.sin(t * speed * 0.16 + gp.ph) * gp.amp;
      if (!gp.dot) gp.mesh.rotation.z += Math.sin(t * speed * 0.11 + gp.ph) * 0.00012;
    }
    var dotPulse = 0.12 + 0.62 * dE + 0.05 * Math.sin(t * speed * 0.7 + 1.2);
    dotMesh.mesh.material.emissiveIntensity = dotPulse;
    dotMesh.glow.position.copy(dotMesh.mesh.position);
    dotMesh.glowMat.opacity = 0.1 + 0.34 * dE + 0.04 * Math.sin(t * speed * 0.7);

    /* 门里的暖随入梦略收（夜里的门内也倦了，但仍比门外暖） */
    warmU.uWarm.value = 1 - 0.22 * dE;
    spill.material.opacity = 0.18 + 0.05 * dE;

    /* 纸签：缓浮 + 梦时透暖 */
    for (var s2 = 0; s2 < sceneSlips.length; s2++) {
      var sl = sceneSlips[s2];
      sl.mesh.position.y = sl.baseY + Math.sin(t * speed * 0.22 + sl.ph) * 0.18;
      sl.mesh.rotation.z += Math.sin(t * speed * 0.13 + sl.ph) * 0.00012;
      sl.mesh.material.emissiveIntensity = 0.08 + 0.3 * dE;
    }

    /* 字平面：入梦微沉 */
    tp1.position.y = 4.2 - 0.7 * dE;
    tp2.position.y = 8.0 - 0.4 * dE;

    /* 尘光 */
    var mp = moteGeo.attributes.position;
    for (var q = 0; q < MOTES; q++) {
      var mb = moteBase[q];
      var yy = (mb.y + t * speed * mb.v) % 10.8;
      mp.setXYZ(q,
        mb.x + Math.sin(t * speed * 0.3 + mb.ph) * 0.5,
        0.3 + yy,
        mb.z + Math.cos(t * speed * 0.22 + mb.ph) * 0.4);
    }
    mp.needsUpdate = true;
    moteMat.opacity = 0.3 + 0.18 * dE;

    renderOnce();
  }
  function smooth01(x) { x = clamp01(x); return x * x * (3 - 2 * x); }

  function start() {
    if (running || reduceMotion) return;
    running = true; lastT = performance.now() - 40;
    rafId = requestAnimationFrame(loop);
    /* 测试辅助（?auto）：rAF 被节流的环境用定时器驱动 */
    if ('auto' in qs && !start.__auto) {
      start.__auto = true;
      setInterval(function () { if (!document.hidden) loop(performance.now()); }, 33);
    }
  }
  function stop() { running = false; if (rafId !== null) cancelAnimationFrame(rafId); rafId = null; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });

  window.addEventListener('pointermove', function (e) {
    pointer.x = (e.clientX / window.innerWidth - 0.5) * 2;
    pointer.y = (e.clientY / window.innerHeight - 0.5) * 2;
  }, { passive: true });
  window.addEventListener('scroll', function () {
    readScroll();
    if (reduceMotion) loopStatic();
  }, { passive: true });
  window.addEventListener('resize', onResize);

  /* reduced-motion：走一遍完整状态计算并渲染一帧（跟随滚动逐帧重算，无动画时钟） */
  function loopStatic() {
    var now = performance.now();
    var t = now / 1000;
    readScroll();
    var pE = ease(scrollP);
    var dream = clamp01(0.04 + smooth01((scrollP - 0.42) / 0.58) * 0.78);
    var dE = ease(dream);
    mistU.uDream.value = dream;
    applyPalette(dream);
    warmU.uWarm.value = 1 - 0.22 * dE;
    spill.material.opacity = 0.18 + 0.05 * dE;
    camX = 0.9 - 0.9 * pE; camY = 2.4 + 0.7 * pE; camZ = 26.0 - 46.0 * pE;
    lookY = 6.7 + 0.3 * pE - 0.7 * dE; lookZ = camZ - 11.0;
    dotMesh.mesh.material.emissiveIntensity = 0.12 + 0.62 * dE;
    dotMesh.glowMat.opacity = 0.1 + 0.34 * dE;
    gateFlash.style.opacity = (Math.exp(-(camZ * camZ) / 3.4) * 0.62).toFixed(3);
    renderOnce();
  }

  applyPalette(0.04);
  onResize();
  readScroll();
  renderOnce();
  if (reduceMotion) { loopStatic(); }
  else start();
})();
</script>
</body>
</html>
