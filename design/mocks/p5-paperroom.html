<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 · 纸间 Paperroom（活体）</title>
<style>
  /* ═══ 概念：纸间 Paperroom ═══
     主页是一张平放的「版台」：四张独立的印刷印张（宣言页 / 目录页 /
     照片页 / 版权页）悬浮叠放，裁切线、套准十字、页码、印刷色条全部
     预印在纸上——平面设计本身就是世界。真正的 3D 只有玻璃：
     · 玻璃纸鹤：全页唯一活物。折缝里藏光，入梦时它不飞走，只「折得更开」
       ——像下一秒就要起飞，但一直没有（「它可能马上消失」的倒置）。
     · 三枚丝印玻璃签，悬浮盖在三枚镂空圆窗上＝站点入口（非标签栏）。
     局部规则：纸下是暖的。暖光从版台穿过镂空窗向上渗——梦在纸下。
     滚动＝这叠纸为你展开：俯视 flat-lay → 镜头后仰 → 层间拉开、
     纸色转暮、墨色转淡、纸鹤张翅、暖光上渗。
     开场加载＝印制：半调网点印出「醒」→ 套准线对位 → 纸张落定 →
     玻璃纸鹤落台，阴影绽开。
     技术约束：无后处理、DPR≤1.5、reduced-motion 静帧、?auto 无头自检。
     测试参数：?auto（定时器活体）&fast（压缩周期）&pin=<0..1>（锁滚动）
     &still=1（单帧静帧，配 &pin）&rm（强制 reduced-motion）。 */

  @font-face {
    font-family: 'Noto Serif SC Web'; font-style: normal; font-weight: 500; font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Noto Serif SC Web'; font-style: normal; font-weight: 600; font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-600-normal.woff2') format('woff2');
  }

  :root {
    --paper: #f5f0e6;
    --ink: #47433c;
    --ink-soft: #6d675e;
    --ink-faint: #93897b;
    --gold: #b8863b;
    --font-display: 'Noto Serif SC Web', 'Noto Serif SC', 'Palatino Linotype', Georgia, 'Songti SC', SimSun, serif;
    --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0; font-family: var(--font-body); color: var(--ink);
    background: linear-gradient(to bottom, #eee9dd 0%, #f2ecdf 55%, #f0e2d8 100%);
  }
  html.no-webgl #gl, html.no-webgl .stage, html.no-webgl .preload { display: none; }

  .scroll-space { height: 430vh; }
  .stage { position: fixed; inset: 0; overflow: clip; z-index: 0; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ── UI 层 ── */
  .ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

  .mark { position: absolute; top: 34px; left: 42px; font-family: var(--font-display); }
  .mark b { display: block; font-weight: 600; font-size: 24px; letter-spacing: 0.4em; color: var(--ink); }
  .mark i {
    display: block; margin-top: 9px; font-style: normal;
    font-size: 10px; letter-spacing: 0.28em; color: var(--ink-faint);
  }
  .mark i::before {
    content: ''; display: block; width: 26px; height: 1px;
    background: currentColor; opacity: 0.6; margin-bottom: 8px;
  }

  /* 右上：竖排刊名注记 */
  .masthead {
    position: absolute; top: 36px; right: 42px;
    writing-mode: vertical-rl; font-family: var(--font-display);
    font-size: 11.5px; letter-spacing: 0.42em; color: var(--ink-faint);
  }

  /* 左下：印件单（入口目录 · 键盘可达） */
  .ticket {
    position: absolute; left: 42px; bottom: 38px;
    font-family: var(--font-display); pointer-events: auto;
  }
  .ticket h2 {
    margin: 0 0 10px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.34em; color: var(--ink-faint);
  }
  .ticket h2 span { font-weight: 500; opacity: 0.75; letter-spacing: 0.18em; }
  .ticket a {
    display: flex; align-items: baseline; gap: 10px; width: 208px;
    margin: 7px 0; padding: 0; color: var(--ink-soft); text-decoration: none;
    font-size: 14.5px; letter-spacing: 0.2em; transition: color 0.4s;
  }
  .ticket a em { font-style: normal; font-size: 10.5px; letter-spacing: 0.14em; color: var(--ink-faint); }
  .ticket a .lead { flex: 1; border-bottom: 1px dotted currentColor; opacity: 0.5; transform: translateY(-4px); }
  .ticket a .pg { font-size: 10.5px; letter-spacing: 0.12em; }
  .ticket a:hover, .ticket a:focus-visible { color: var(--ink); outline: none; }
  .ticket a.hot { color: var(--ink); }
  .ticket a.hot .pg { color: var(--gold); }

  /* 右下：页码 + 滚动提示 */
  .folio {
    position: absolute; right: 42px; bottom: 40px; text-align: right;
    font-family: var(--font-display); color: var(--ink-faint);
    font-size: 11px; letter-spacing: 0.3em; line-height: 2;
  }
  .folio b { font-weight: 600; font-size: 15px; color: var(--ink-soft); letter-spacing: 0.2em; }
  .hint {
    position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    font-family: var(--font-display); font-size: 11px; letter-spacing: 0.4em;
    color: var(--ink-faint); transition: opacity 0.8s;
  }
  .hint::after { content: ''; display: block; width: 1px; height: 26px; margin: 10px auto 0; background: currentColor; opacity: 0.55; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px;
    clip: rect(0 0 0 0); overflow: hidden; white-space: nowrap;
  }

  /* ── 进入动效：虹膜覆纸 ── */
  .iris {
    position: fixed; inset: 0; z-index: 30; pointer-events: none;
    background: #f6f1e7; opacity: 0;
    display: grid; place-items: center;
    font-family: var(--font-display); text-align: center;
  }
  .iris.on { opacity: 1; }
  .iris .big { font-size: clamp(34px, 5vw, 62px); font-weight: 600; letter-spacing: 0.3em; color: var(--ink); }
  .iris .sub { margin-top: 22px; font-size: 12.5px; letter-spacing: 0.26em; color: var(--ink-faint); line-height: 2.2; }
  .iris .sub b { color: var(--gold); font-weight: 500; }

  /* ── 加载页：半调印制 ── */
  .preload { position: fixed; inset: 0; z-index: 50; background: transparent; transition: opacity 0.65s ease; }
  .preload canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .preload.gone { opacity: 0; pointer-events: none; }
  .preload .pressing {
    position: absolute; left: 50%; bottom: 7vh; transform: translateX(-50%);
    font-family: var(--font-display); font-size: 11px; letter-spacing: 0.5em;
    color: #8d8271;
  }

  /* ── 无 WebGL 回退：一张静态印刷页 ── */
  .fallback { display: none; }
  html.no-webgl .fallback {
    display: block; position: relative; z-index: 1; min-height: 100vh;
    padding: 16vh 8vw; font-family: var(--font-display);
  }
  html.no-webgl .fallback h1 { font-size: clamp(30px, 5vw, 58px); font-weight: 600; letter-spacing: 0.06em; margin: 0 0 0.6em; }
  html.no-webgl .fallback p { font-size: clamp(15px, 1.8vw, 24px); letter-spacing: 0.14em; color: var(--ink-soft); margin: 0.5em 0; }
  html.no-webgl .fallback .fl-gold { color: var(--gold); }
  html.no-webgl .fallback nav { margin-top: 7vh; display: flex; gap: 4em; }
  html.no-webgl .fallback nav a { color: var(--ink-soft); text-decoration: none; font-size: 15px; letter-spacing: 0.3em; }

  @media (max-width: 720px) {
    .mark { top: 22px; left: 22px; }
    .mark b { font-size: 19px; }
    .masthead { display: none; }
    .ticket {
      left: 0; right: 0; bottom: 0; padding: 14px 22px 16px;
      background: linear-gradient(to top, rgba(245, 240, 230, 0.92), rgba(245, 240, 230, 0));
    }
    .ticket h2 { margin-bottom: 4px; }
    .ticket a { width: 150px; margin: 4px 0; font-size: 13px; }
    .folio { right: 22px; bottom: 20px; }
    .hint { bottom: 118px; }
  }
</style>
</head>
<body>
  <div class="scroll-space"></div>

  <div class="stage"><canvas id="gl"></canvas></div>

  <div class="ui">
    <div class="mark"><b>纸　间</b><i>PAPERROOM · ISSUE 001</i></div>
    <div class="masthead">最后一层世界 · 醒梦主页原稿</div>

    <nav class="ticket" aria-label="站点入口">
      <h2>印件单 <span>JOB No.001</span></h2>
      <a href="#essays" data-entry="0">随笔<span class="lead"></span><em>ESSAYS</em><span class="pg">001</span></a>
      <a href="#works" data-entry="1">项目<span class="lead"></span><em>WORKS</em><span class="pg">052</span></a>
      <a href="#about" data-entry="2">关于<span class="lead"></span><em>ABOUT</em><span class="pg">104</span></a>
    </nav>

    <div class="folio"><b>001</b><br />醒 · 梦之间</div>
    <div class="hint">滚动 · 展开这叠纸</div>

    <h1 class="sr-only">纸间——这里不是梦，也不是现实。它是人在即将醒来时，看见的最后一层世界。它可能马上消失。</h1>
  </div>

  <div class="iris" aria-hidden="true">
    <div><div class="big"></div><div class="sub"></div></div>
  </div>

  <div class="fallback">
    <h1>这里不是梦，也不是现实。</h1>
    <p>它是人在即将醒来时，看见的最后一层世界。</p>
    <p class="fl-gold">它可能马上消失。</p>
    <nav><a href="#">随笔</a><a href="#">项目</a><a href="#">关于</a></nav>
  </div>

  <div class="preload" id="preload">
    <canvas id="pcv"></canvas>
    <div class="pressing">正在印制 · 第 001 期</div>
  </div>

<script src="vendor/three.min.js"></script>
<script>
/* ═══════════════ 0 · 环境与工具 ═══════════════ */
window.__swarmErr = 'none';
window.onerror = function (m, s, l, c) { window.__swarmErr = String(m) + ' @' + l + ':' + c; };
(function () {
  var ce = console.error.bind(console);
  console.error = function () {
    try { window.__swarmErr = Array.prototype.map.call(arguments, String).join(' '); } catch (e) {}
    ce.apply(null, arguments);
  };
})();

var Q = {};
location.search.replace(/[?&]([^=&]+)(?:=([^&]*))?/g, function (_, k, v) { Q[k] = v === undefined ? '' : v; return ''; });
var IS_AUTO = Q.auto !== undefined;
var IS_FAST = Q.fast !== undefined || IS_AUTO; // auto 即快进加载页
var PIN = Q.pin !== undefined ? Math.min(1, Math.max(0, parseFloat(Q.pin) || 0)) : null;
var IS_STILL = Q.still === '1';
var FORCE_RM = Q.rm !== undefined;
var RM = FORCE_RM || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
var lerp = function (a, b, t) { return a + (b - a) * t; };
var sstep = function (a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
var easeIO = function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
var easeOutQ = function (t) { return 1 - Math.pow(1 - t, 4); };

/* ═══════════════ 1 · 调色（醒 → 梦） ═══════════════ */
function C(hex) { return new THREE.Color(hex); }
var PAL = {
  bg:      [C(0xece5d8), C(0xe6d5d5)],
  paper:   [C(0xf6f1e7), C(0xeddfdc)],
  table:   [C(0xe6ddcc), C(0xd8c6c4)],
  dirC:    [C(0xfff2de), C(0xffd7c2)],
  hemiS:   [C(0xf7f2e8), C(0xf2d8d0)],
  hemiG:   [C(0xcabdaa), C(0x97807f)],
  fillC:   [C(0xe2eaf1), C(0xe9ccd3)],
  glass:   [C(0xe9f0f3), C(0xf1e2ea)],
  iridA:   [C(0xf4dae2), C(0xf6d3da)],
  iridB:   [C(0xd2e4e6), C(0xd8e2e0)],
  glow:    [C(0xf3cf9c), C(0xffc794)],
  crease:  [C(0xc99a52), C(0xd9a95c)],
  caustic: [C(0xf7e3c2), C(0xffd9ae)],
  dust:    [C(0xbfb6a4), C(0xcdb4a8)]
};
var GOLD = C(0xb8863b);

/* ═══════════════ 2 · 渲染器 / 场景 / 灯光 ═══════════════ */
var canvas = document.getElementById('gl');
var renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
} catch (e) { renderer = null; }
if (!renderer || !renderer.getContext()) {
  document.documentElement.classList.add('no-webgl');
} else {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  scene.background = PAL.bg[0].clone();
  scene.fog = new THREE.Fog(PAL.bg[0].clone(), 17, 44);

  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 120);
  var camLook = new THREE.Vector3(0.4, 1.7, 0.05);

  var sun = new THREE.DirectionalLight(0xfff2de, 1.0);
  sun.position.set(-5.5, 13, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -8.5; sun.shadow.camera.right = 8.5;
  sun.shadow.camera.top = 8.5; sun.shadow.camera.bottom = -8.5;
  sun.shadow.camera.near = 3; sun.shadow.camera.far = 26;
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
  scene.add(sun); scene.add(sun.target);

  var hemi = new THREE.HemisphereLight(0xf7f2e8, 0xcabdaa, 0.55);
  scene.add(hemi);
  var fill = new THREE.DirectionalLight(0xe2eaf1, 0.22);
  fill.position.set(7, 6, -7);
  scene.add(fill);

  /* ═══════════════ 3 · 纹理工坊（全部程序绘制） ═══════════════ */
  var maxAniso = renderer.capabilities.getMaxAnisotropy();

  function cnv(w, h) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    return c;
  }
  function grain(ctx, w, h, n, a) {
    for (var i = 0; i < n; i++) {
      ctx.fillStyle = 'rgba(70,60,48,' + (Math.random() * a).toFixed(3) + ')';
      ctx.fillRect(Math.random() * w, Math.random() * h, 1.4, 1.4);
    }
  }
  function cropMarks(ctx, w, h, m, l, ink) {
    ctx.strokeStyle = ink; ctx.lineWidth = 2;
    var cs = [[m, m, 1, 1], [w - m, m, -1, 1], [m, h - m, 1, -1], [w - m, h - m, -1, -1]];
    cs.forEach(function (c) {
      ctx.beginPath();
      ctx.moveTo(c[0] + c[2] * 6, c[1]); ctx.lineTo(c[0] + c[2] * (6 + l), c[1]);
      ctx.moveTo(c[0], c[1] + c[3] * 6); ctx.lineTo(c[0], c[1] + c[3] * (6 + l));
      ctx.stroke();
    });
  }
  function regMark(ctx, x, y, r, ink, a) {
    ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - r * 1.7, y); ctx.lineTo(x + r * 1.7, y);
    ctx.moveTo(x, y - r * 1.7); ctx.lineTo(x, y + r * 1.7); ctx.stroke();
    ctx.restore();
  }
  function folioAt(ctx, x, y, num, label, ink, align) {
    ctx.fillStyle = ink; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = '600 34px "Noto Serif SC Web", serif';
    ctx.fillText(num, x, y);
    ctx.globalAlpha = 0.6;
    ctx.font = '500 21px "Noto Serif SC Web", serif';
    ctx.fillText(label, x + (align === 'right' ? 0 : 52), y - 1);
    ctx.globalAlpha = 1;
  }
  var serifW6 = '600 {S}px "Noto Serif SC Web", "Noto Serif SC", serif';
  var serifW5 = '500 {S}px "Noto Serif SC Web", "Noto Serif SC", serif';

  /* 世界 10.5 × 7.4；canvas 顶=远(-z)，左=西(-x) */
  var SW = 10.5, SH = 7.4;
  function w2px(x, z, W, H) { return [(x + SW / 2) / SW * W, (z + SH / 2) / SH * H]; }

  /* —— 镂空窗位（宣言页局部坐标） —— */
  var APE = [
    { x: 2.05, z: -1.35, name: '随笔', en: 'ESSAYS', no: '01' },
    { x: 3.10, z:  0.35, name: '项目', en: 'WORKS', no: '02' },
    { x: 2.00, z:  2.00, name: '关于', en: 'ABOUT', no: '03' }
  ];
  var APE_R = 0.62;

  /* —— 印张 1：宣言页（镂空 + 印刷家具） —— */
  var s1c = cnv(2048, 1444);
  (function () {
    var ctx = s1c.getContext('2d'), W = s1c.width, H = s1c.height;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    grain(ctx, W, H, 2600, 0.028);
    /* 边缘内影（纸的厚度感） */
    var eg = ctx.createLinearGradient(0, 0, 0, H);
    eg.addColorStop(0, 'rgba(120,105,85,0.10)'); eg.addColorStop(0.08, 'rgba(0,0,0,0)');
    eg.addColorStop(0.92, 'rgba(0,0,0,0)'); eg.addColorStop(1, 'rgba(120,105,85,0.12)');
    ctx.fillStyle = eg; ctx.fillRect(0, 0, W, H);
    var ink = 'rgba(72,66,56,0.9)';
    cropMarks(ctx, W, H, 46, 52, ink);
    regMark(ctx, W / 2, 74, 13, ink, 0.55);
    folioAt(ctx, 70, H - 64, '1', '醒梦 · 主页原稿', ink);
    /* 右缘竖排拉丁注记 */
    ctx.save(); ctx.translate(W - 44, 180); ctx.rotate(Math.PI / 2);
    ctx.font = serifW5.replace('{S}', 20); ctx.fillStyle = 'rgba(72,66,56,0.5)';
    try { ctx.letterSpacing = '7px'; } catch (e) {}
    ctx.fillText('THE LAST LAYER OF THE WORLD — WAKING ISSUE 001', 0, 0);
    try { ctx.letterSpacing = '0px'; } catch (e) {}
    ctx.restore();
    /* 三枚镂空窗：软边裁切 + 双环 + 引线 + 小注 */
    APE.forEach(function (a) {
      var p = w2px(a.x, a.z, W, H), px = p[0], py = p[1];
      var r = APE_R / SW * W, rIn = r * 0.9;
      var g = ctx.createRadialGradient(px, py, rIn * 0.7, px, py, r);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.72, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.save(); ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(72,66,56,0.85)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(px, py, r + 4, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(72,66,56,0.3)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(px, py, r + 14, 0, Math.PI * 2); ctx.stroke();
      /* 小注：窗的左下 */
      ctx.font = serifW5.replace('{S}', 22); ctx.fillStyle = 'rgba(72,66,56,0.62)';
      ctx.textAlign = 'right';
      ctx.fillText(a.name + ' · ' + a.no, px - r - 16, py + r + 6);
      ctx.globalAlpha = 0.4;
      ctx.setLineDash([2, 7]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(px - r * 0.8, py + r * 0.8); ctx.lineTo(px - r - 10, py + r + 2); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    });
  })();

  /* —— 宣言墨层（独立透明面片，随梦淡去） —— */
  var ink1c = cnv(2048, 1444);
  (function () {
    var ctx = ink1c.getContext('2d'), W = ink1c.width, H = ink1c.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#3f3a33'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 0.5;
    ctx.font = serifW5.replace('{S}', 38);
    ctx.fillText('醒梦 · 宣言 ——— 卷首', 172, 292);
    ctx.globalAlpha = 1;
    try { ctx.letterSpacing = '10px'; } catch (e) {}
    ctx.font = serifW6.replace('{S}', 152);

    if (running && performance.now() - lastFrameAt > 450) frame();
  }, 250);

  /* —— 字体就绪后重绘（宣言 / 鹤签 / 加载字） —— */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      [texS1, texInk1, texGold, texS2, texS3, texS4].forEach(function (t) { t.needsUpdate = true; });
      Object.keys(slipCanvasCache).forEach(function (k) { /* slips 材质引用同一 tex */ });
      slips.forEach(function (s) { if (s.uni.uMap.value) s.uni.uMap.value.needsUpdate = true; });
      if (IS_STILL && window.__renderOnce) window.__renderOnce(PIN !== null ? PIN : 0.34);
    });
  }

  /* —— resize（含 IAB 初始 0×0 自愈） —— */
  function onResize() {
    var w = window.innerWidth || 0, h = window.innerHeight || 0;
    if (!w || !h) return; /* IAB 视口未就绪：等真正的 resize 再初始化 */
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(w, h, false);
    if (!running && window.__renderOnce) window.__renderOnce(PIN !== null ? PIN : scrollP);
  }
  window.addEventListener('resize', onResize);
  onResize();

  /* —— 无头钩子 —— */
  window.__renderOnce = function (p) {
    if (typeof p === 'number') scrollP = clamp(p, 0, 1);
    INTRO.k = 1;
    update(typeof p === 'number' ? scrollP : scrollP, now());
    renderer.render(scene, camera);
  };
  window.__mockSnap = function () {
    if (!renderer.domElement.width) onResize();
    if (window.__swarmErr !== 'none') { /* 出错也照常出帧便于诊断 */ }
    window.__renderOnce(PIN !== null ? PIN : (IS_AUTO ? autoState.p : scrollP));
    return renderer.domElement.toDataURL('image/png');
  };
  window.__mockDbg = { scene: scene, camera: camera, crane: crane, sheets: sheets, slips: slips };

  /* —— 加载页：半调印「醒」 —— */
  var preloadEl = document.getElementById('preload');
  var preSkipped = false;
  function killPreload(instant) {
    if (preloadEl.classList.contains('gone')) return;
    preloadEl.classList.add('gone');
    startIntro(instant ? 0 : 350);
    window.setTimeout(function () { if (preloadEl.parentNode) preloadEl.parentNode.removeChild(preloadEl); }, 800);
  }
  if (RM || IS_STILL || document.documentElement.classList.contains('no-webgl')) {
    if (preloadEl.parentNode) preloadEl.parentNode.removeChild(preloadEl);
    INTRO.k = 1;
  } else {
    (function runPreload() {
      var pc = document.getElementById('pcv');
      var pctx = pc.getContext('2d');
      var DPR = Math.min(window.devicePixelRatio || 1, 1.5);
      var W = window.innerWidth, H = window.innerHeight;
      pc.width = W * DPR; pc.height = H * DPR; pctx.scale(DPR, DPR);
      var gd = null;
      var T_PRINT = IS_FAST ? 0.9 : 1.5, T_MARKS = 0.35, T_HOLD = 0.3, T_ALL = T_PRINT + T_MARKS + T_HOLD;
      var t0 = 0;
      function sampleGlyph() {
        var gc = cnv(240, 240), gx = gc.getContext('2d');
        gx.fillStyle = '#fff'; gx.fillRect(0, 0, 240, 240);
        gx.fillStyle = '#000'; gx.textAlign = 'center'; gx.textBaseline = 'middle';
        gx.font = serifW6.replace('{S}', 196);
        gx.fillText('醒', 120, 128);
        gd = gx.getImageData(0, 0, 240, 240).data;
      }
      function drawPre() {
        var el = (performance.now() - t0) / 1000;
        var k = clamp(el / T_PRINT, 0, 1);
        pctx.clearRect(0, 0, W, H);
        /* 半调网点 */
        var size = Math.min(W, H) * 0.62, ox = (W - size) / 2, oy = (H - size) / 2 - H * 0.02;
        var step = Math.max(9, size / 46);
        var sweep = -size * 0.25 + (size * 1.5) * k;
        pctx.fillStyle = '#2f2b26';
        for (var yy = 0; yy < size; yy += step) {
          for (var xx = 0; xx < size; xx += step) {
            var gxp = Math.floor(xx / size * 238), gyp = Math.floor(yy / size * 238);
            var lum = gd[(gyp * 240 + gxp) * 4] / 255;
            var dark = 1 - lum;
            if (dark < 0.12) continue;
            var dc = ox + xx + (Math.random() - 0.5) * 2, dy = oy + yy + (Math.random() - 0.5) * 2;
            var sw = (dc - ox + dy - oy) / 2 - sweep; // 对角扫描
            var env = clamp(1 - sw / (size * 0.16), 0, 1);
            env = env * env;
            if (env <= 0.02) continue;
            var r = dark * step * 0.42 * env;
            pctx.beginPath(); pctx.arc(dc, dy, r, 0, Math.PI * 2); pctx.fill();
          }
        }
        /* 套准线与角线 */
        var mk = clamp((el - T_PRINT) / T_MARKS, 0, 1);
        if (mk > 0) {
          pctx.globalAlpha = mk;
          pctx.strokeStyle = '#6b6355'; pctx.lineWidth = 1.2;
          var m = 34, l = 26;
          [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(function (c) {
            pctx.beginPath();
            pctx.moveTo(c[0] + c[2] * 5, c[1]); pctx.lineTo(c[0] + c[2] * (5 + l), c[1]);
            pctx.moveTo(c[0], c[1] + c[3] * 5); pctx.lineTo(c[0], c[1] + c[3] * (5 + l));
            pctx.stroke();
          });
          var rx = W / 2, ry = H * 0.085, rr2 = 9;
          pctx.beginPath(); pctx.arc(rx, ry, rr2, 0, Math.PI * 2); pctx.stroke();
          pctx.beginPath();
          pctx.moveTo(rx - rr2 * 1.8, ry); pctx.lineTo(rx + rr2 * 1.8, ry);
          pctx.moveTo(rx, ry - rr2 * 1.8); pctx.lineTo(rx, ry + rr2 * 1.8);
          pctx.stroke();
          pctx.globalAlpha = 1;
        }
        if (el < T_ALL && !preSkipped) requestAnimationFrame(drawPre);
        else killPreload(false);
      }
      var fontReady = (document.fonts && document.fonts.load)
        ? document.fonts.load('600 196px "Noto Serif SC Web"') : Promise.resolve();
      Promise.race([fontReady, new Promise(function (r) { setTimeout(r, 450); })]).then(function () {
        sampleGlyph();
        t0 = performance.now();
        requestAnimationFrame(drawPre);
      });
    })();
    ['pointerdown', 'wheel', 'keydown', 'touchstart'].forEach(function (ev) {
      window.addEventListener(ev, function () { preSkipped = true; killPreload(true); }, { once: false, passive: true });
    });
  }

  /* —— 启动 —— */
  readScroll();
  update(PIN !== null ? PIN : scrollP, 0);
  if (IS_STILL) { renderer.render(scene, camera); running = false; }
  else loop();
}
</script>
