<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 P5 · 阖眼（活体）</title>
<style>
  /* ═══ 概念 ═══
     入口即「醒来的动作」：页面以一只闭着的眼开场——暖黑暗场 + 缓慢漂移的磷光
     （闭眼时看见的光幻视），一条极淡的缝光（隔着眼皮的天光）。
     「按住，直到醒来」：按住任意处，眼睑缝隙渐张、过曝的暖白褪去，
     露出晨间的世界；中途松手，眼睑带着一点倦意落回。
     滚动 / 轻点也可以触发醒来（不留死路）。醒后进入常规主页语法：
     滚动=入梦。主体「凝形厅」：一座由九块磨砂巨板组成的半建巨构，
     醒来=世界获得形状（巨板就位、棱线清晰），入梦=世界散形（巨板漂离）；
     它永远在微调对齐、永远差一点完工——门楣下悬着唯一一块暖色「灯板」。
     入门机制参考（语法，非意象）：Midwam / The Underwatch Hotel 的
     press-and-hold 入场（awwwards hold interaction 语系）。
     性能纪律：DPR≤1.5、无后处理、~30fps、reduced-motion 直接醒着（静帧按需渲染）。 */

  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-600-normal.woff2') format('woff2');
  }

  :root {
    --ink: #37363a;
    --ink-soft: #655f66;
    --ink-faint: #6f696f;
    --mist-ink: #5d6d80;
    --night-ink: #d9c3aa;
    --night-faint: #9a8570;
    --font-display: 'Noto Serif SC Web', 'Noto Serif SC', 'Palatino Linotype', Georgia, 'Songti SC', SimSun, serif;
    --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); color: var(--ink); background: #211a15; overscroll-behavior-y: none; }
  body:not(.awake) { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body.awake { background: #e7e3db; }

  .stage {
    position: fixed;
    inset: 0;
    overflow: clip;
    background: linear-gradient(to bottom, #e3e7e2 0%, #eae6de 55%, #dcd6d0 100%);
  }
  .scroll-length { height: 260vh; }  /* 首屏之外留 160vh 滚动余量 = 入梦行程 */
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .vignette {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(125% 92% at 50% 42%, transparent 60%, rgba(84, 72, 80, 0.12) 100%);
  }

  /* ── 醒后浮现的内容（醒前全部蒙在 veil 之后） ── */
  .rise { opacity: 0; transform: translateY(10px); }
  .awake .rise { animation: rise-in 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .awake .rise.d1 { animation-delay: 0.15s; }
  .awake .rise.d2 { animation-delay: 0.45s; }
  .awake .rise.d3 { animation-delay: 0.7s; }
  @keyframes rise-in { to { opacity: 1; transform: translateY(0); } }

  .manifesto {
    position: absolute;
    left: 8vw;
    top: 9vh;
    z-index: 10;
    margin: 0;
    font-family: var(--font-display);
    line-height: 1.6;
    color: var(--ink);
    text-shadow: 0 2px 26px rgba(244, 240, 232, 0.9), 0 0 8px rgba(244, 240, 232, 0.7);
  }
  .manifesto .l1 { display: block; font-size: clamp(1.35rem, 2.8vw, 2.6rem); font-weight: 500; letter-spacing: 0.04em; }

  .brand {
    position: absolute; top: 4.5vh; left: 4vw; z-index: 10;
    display: inline-flex; align-items: center; gap: 0.6rem;
    font-family: var(--font-display); font-weight: 500; font-size: 1.02rem;
    letter-spacing: 0.06em; color: var(--ink); text-decoration: none;
    text-shadow: 0 1px 18px rgba(244, 240, 232, 0.9);
  }
  .brand .ring { width: 11px; height: 11px; border: 1.5px solid var(--mist-ink); border-radius: 50%; opacity: 0.85; }

  .nav {
    position: absolute; right: 3.4vw; top: 24vh; z-index: 10;
    display: flex; flex-direction: column; gap: 2.3rem;
  }
  .nav a {
    position: relative; writing-mode: vertical-rl; letter-spacing: 0.5em;
    padding: 0.4rem 0.7rem; color: var(--ink-soft); text-decoration: none;
    font-size: 0.95rem; transition: color 0.18s ease;
    text-shadow: 0 1px 16px rgba(244, 240, 232, 0.9);
  }
  .nav a::after {
    content: ''; position: absolute; top: 46%; right: calc(100% + 0.35rem);
    width: 1.3rem; height: 1px; background: rgba(93, 109, 128, 0.45);
    transition: width 0.18s ease, background 0.18s ease;
  }
  .nav a:hover { color: var(--ink); }
  .nav a:hover::after { width: 2rem; background: var(--mist-ink); }

  .side-note {
    position: absolute; left: 3.2vw; top: 13vh; z-index: 10;
    writing-mode: vertical-rl; font-size: 0.8rem; letter-spacing: 0.52em;
    color: var(--ink-faint);
    text-shadow: 0 0 10px rgba(244, 240, 232, 0.95), 0 0 4px rgba(244, 240, 232, 0.9);
  }

  .floating-ledger { position: absolute; left: 26vw; right: 16vw; bottom: 6vh; z-index: 10; }
  .floating-ledger h2 {
    margin: 0 0 1rem; font-weight: 500; font-size: 0.82rem;
    letter-spacing: 0.3em; color: var(--ink-faint);
    text-shadow: 0 1px 14px rgba(244, 240, 232, 0.9);
  }
  .slips { display: flex; gap: 1.2rem 1.8rem; align-items: flex-start; }
  .slip {
    position: relative; display: block; padding: 0.85rem 1rem 0.95rem;
    background: rgba(252, 250, 246, 0.9); border: 1px solid rgba(255, 255, 255, 0.62);
    box-shadow: 5px 4px 10px -6px rgba(84, 72, 80, 0.3);
    text-decoration: none; overflow: clip;
  }
  .slip::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
    background: linear-gradient(to bottom, transparent, rgba(200, 176, 160, 0.24));
  }
  .slip:nth-child(1) { width: 13rem; transform: rotate(-1.2deg); }
  .slip:nth-child(2) { width: 15.5rem; transform: rotate(0.7deg) translateY(10px); }
  .slip:nth-child(3) { width: 12.5rem; transform: rotate(-0.5deg) translateY(3px); }
  .slip .d { display: block; font-size: 0.72rem; letter-spacing: 0.12em; color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-bottom: 0.35rem; }
  .slip .t { display: block; font-family: var(--font-display); font-size: 0.98rem; color: var(--ink); line-height: 1.55; }
  .slip:hover .t { color: var(--mist-ink); }

  /* ── 眼睑（闭眼开场的主角） ──
     两片暖黑的「睑」，在画面 46% 高处相接；缝隙边缘各有一段柔化渐变，
     上睑边缘带一条会呼吸的「缝光」（隔着眼皮的天光）。
     张开：JS 每帧驱动 translateY（px，随视口高度计算），不用过渡以免和逐帧驱动打架。 */
  .lid {
    position: fixed; left: 0; right: 0; z-index: 60; pointer-events: none;
    will-change: transform;
  }
  .lid-top {
    top: 0;
    background: linear-gradient(to bottom, #191310 0%, #241c16 52%, #2b211a 100%);
  }
  .lid-top::before {  /* 缘外羽化：睑缘向亮处渐隐 */
    content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 15vh;
    background: linear-gradient(to bottom, rgba(44, 34, 26, 0.88) 0%, rgba(44, 34, 26, 0) 64%);
  }
  .lid-top::after {  /* 缝光：隔着眼皮的天光；强度由 JS 经 --sg 驱动 */
    content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 20vh;
    background: radial-gradient(52% 82% at 50% 0%, rgba(255, 228, 192, 0.85), rgba(255, 228, 192, 0) 66%);
    opacity: var(--sg, 0.3);
  }
  .lid-bot {
    bottom: 0;
    background: linear-gradient(to top, #150f0c 0%, #211913 46%, #291f18 100%);
  }
  .lid-bot::before {
    content: ''; position: absolute; left: 0; right: 0; bottom: 100%; height: 13vh;
    background: linear-gradient(to top, rgba(41, 31, 24, 0.86) 0%, rgba(41, 31, 24, 0) 66%);
  }

  /* ── 磷光（闭眼的光幻视）：大团暖光极慢漂移，仅存在于闭着的眼里 ── */
  .phosfield { position: fixed; inset: 0; z-index: 61; pointer-events: none; overflow: clip; }
  .phos { position: absolute; border-radius: 50%; filter: blur(46px); }
  .phos.p1 {
    width: 58vw; height: 44vh; left: -6vw; top: 8vh;
    background: radial-gradient(closest-side, rgba(198, 122, 74, 0.16), rgba(198, 122, 74, 0));
    animation: phos-drift-1 37s ease-in-out infinite alternate;
  }
  .phos.p2 {
    width: 46vw; height: 52vh; right: -8vw; top: 34vh;
    background: radial-gradient(closest-side, rgba(226, 168, 112, 0.13), rgba(226, 168, 112, 0));
    animation: phos-drift-2 47s ease-in-out infinite alternate;
  }
  .phos.p3 {
    width: 34vw; height: 26vh; left: 30vw; bottom: 4vh;
    background: radial-gradient(closest-side, rgba(232, 196, 148, 0.11), rgba(232, 196, 148, 0));
    animation: phos-drift-1 29s ease-in-out infinite alternate-reverse;
  }
  @keyframes phos-drift-1 {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(9vw, 5vh) scale(1.16); }
  }
  @keyframes phos-drift-2 {
    from { transform: translate(0, 0) scale(1.08); }
    to { transform: translate(-7vw, -6vh) scale(0.94); }
  }

  /* ── 按住提示（只在闭着眼时存在） ── */
  .wake-hint {
    position: fixed; left: 0; right: 0; bottom: 6.5vh; z-index: 62;
    text-align: center; pointer-events: none;
    color: var(--night-ink);
  }
  .wake-hint .zh {
    font-family: var(--font-display); font-weight: 500;
    font-size: clamp(1.02rem, 1.7vw, 1.3rem); letter-spacing: 0.42em; text-indent: 0.42em;
    animation: hint-breathe 4.6s ease-in-out infinite;
  }
  .wake-hint .holdline {
    display: block; width: 138px; height: 1px; margin: 1.1rem auto 0.8rem;
    background: rgba(217, 195, 170, 0.22); position: relative; overflow: hidden;
  }
  .wake-hint .holdline i {
    position: absolute; left: 0; top: 0; bottom: 0; width: 100%;
    background: linear-gradient(to right, rgba(240, 210, 172, 0.95), rgba(240, 214, 186, 0.55));
    transform: scaleX(0); transform-origin: left center;
  }
  .wake-hint .sub { font-size: 0.72rem; letter-spacing: 0.3em; color: var(--night-faint); }
  @keyframes hint-breathe { 0%, 100% { opacity: 0.62; } 50% { opacity: 1; } }

  /* ── 过曝暖白（醒来一瞬的光） ── */
  .day-veil {
    position: fixed; inset: 0; z-index: 63; pointer-events: none;
    background: radial-gradient(120% 100% at 50% 46%, #f8ecd9 0%, #f3e3cd 100%);
    opacity: 0;
  }

  .stage.no3d canvas#gl { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .awake .rise { animation: none; opacity: 1; transform: none; }
    .phos, .wake-hint .zh { animation: none; }
  }
  @media (max-width: 760px) {
    .side-note { display: none; }
    .brand { position: static; margin: 4.5vh 9vw 0; }
    .nav { position: static; margin: 0.9rem 9vw 0; flex-direction: row; gap: 1.8rem; }
    .nav a { writing-mode: horizontal-tb; letter-spacing: 0.24em; font-size: 0.9rem; }
    .nav a::after { display: none; }
    .floating-ledger { position: static; margin: 2.8rem 9vw 8vh; }
    .slips { flex-direction: column; gap: 0.9rem; }
    .slip { width: 100%; transform: none; }
    .stage { position: relative; min-height: 100dvh; }
    .scroll-length { display: none; }
    .manifesto { position: relative; top: 0; left: 0; margin: 10vh 9vw 0; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <h1 class="manifesto rise" aria-label="这里不是梦，也不是现实。它是人在即将醒来时，看见的最后一层世界。">
    <span class="l1">这里不是梦，也不是现实。</span>
  </h1>

  <a class="brand rise d1" href="/"><span class="ring" aria-hidden="true"></span>Traveritas</a>
  <p class="side-note rise d2" aria-hidden="true">醒时成形　入梦散形</p>

  <nav class="nav rise d2" aria-label="站内入口">
    <a href="/articles/">随笔</a>
    <a href="/projects/">项目</a>
    <a href="/about/">关于</a>
  </nav>

  <section class="floating-ledger rise d3" aria-label="最近的随笔">
    <h2>最近的随笔</h2>
    <div class="slips">
      <a class="slip" href="#"><span class="d">2026.09.12</span><span class="t">母题探索记录</span></a>
      <a class="slip" href="#"><span class="d">2026.08.30</span><span class="t">关于“醒梦”的第一份笔记</span></a>
      <a class="slip" href="#"><span class="d">2026.08.11</span><span class="t">把网站做成一个房间</span></a>
    </div>
  </section>
</div>
<div class="scroll-length" aria-hidden="true"></div>

<!-- 闭着的眼 -->
<div class="lid lid-top" id="lidTop" aria-hidden="true"></div>
<div class="lid lid-bot" id="lidBot" aria-hidden="true"></div>
<div class="phosfield" id="phos" aria-hidden="true">
  <div class="phos p1"></div>
  <div class="phos p2"></div>
  <div class="phos p3"></div>
</div>
<div class="wake-hint" id="wakeHint">
  <span class="zh">按住，直到醒来</span>
  <span class="holdline" aria-hidden="true"><i id="holdFill"></i></span>
  <span class="sub" aria-hidden="true">也可以直接滚动，或轻点一下</span>
</div>
<div class="day-veil" id="dayVeil" aria-hidden="true"></div>

<script src="vendor/three.min.js"></script>
<script>
/* ═══ 阖眼 ═══
   闭眼 → 按住 → 缝隙渐张 → 过曝褪去 → 醒后滚动=入梦。
   世界 = 凝形厅：九块磨砂巨板，醒=对齐成形，梦=漂离散形；
   唯一的暖是门楣下悬着的「灯板」。 */
(function () {
  function fallbackStatic() {
    /* 无 Three.js / 无 WebGL：跳过闭眼仪式，直接呈现可读的静态主页 */
    document.body.classList.add('awake');
    ['lidTop', 'lidBot', 'phos', 'wakeHint', 'dayVeil'].forEach(function (id) {
      var el = document.getElementById(id); if (el) el.style.display = 'none';
    });
  }
  if (!window.THREE) { document.getElementById('stage').classList.add('no3d'); fallbackStatic(); return; }
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var qs = {};
  location.search.replace(/[?&]([^=&]+)(?:=([^&]*))?/g, function (_, k, v) { qs[k] = v === undefined ? '' : decodeURIComponent(v); });
  var fastMode = 'fast' in qs;
  var stillMode = 'still' in qs;
  if (stillMode) reduceMotion = true;
  var pinScroll = 'pin' in qs ? Math.max(0, Math.min(1, parseFloat(qs.pin) || 0)) : null;
  /* ?open=1 直接醒着开场；?wake=0..1 锁定睁眼进度（供无头截取中间态） */
  var wakeLock = 'wake' in qs ? Math.max(0, Math.min(1, parseFloat(qs.wake) || 0)) : null;
  var openParam = 'open' in qs;
  var speed = fastMode ? 6 : 1;

  var seed = 7;
  function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  function range(a, b) { return a + rnd() * (b - a); }
  function clamp01(x) { return Math.min(1, Math.max(0, x)); }
  function ease(t) { t = clamp01(t); return t * t * (3 - 2 * t); }

  var canvas = document.getElementById('gl');
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false }); }
  catch (e) { document.getElementById('stage').classList.add('no3d'); fallbackStatic(); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

  var scene = new THREE.Scene();

  /* ── 色板：晨（醒）↔ 雾暮（梦），灯板永远暖 ── */
  var WAKE = {
    fog: 0xe9e5dc, skyTop: 0xccd8d3, skyHor: 0xf1ede3, sun: 0xfff0da,
    hemiSky: 0xf2efe6, hemiGnd: 0xb3a794, fill: 0xe6e0d6, sunI: 0.58,
    slab: 0xe2e6e1, glow: 0xf0c69c,
    mA: 0xece7db, mB: 0xe0d9ca, mC: 0xcfc4b2, mD: 0xa89a86
  };
  var DREAM = {
    fog: 0xd8d3dc, skyTop: 0xb6bac9, skyHor: 0xe4dde2, sun: 0xd8cede4,
    hemiSky: 0xdcd8e2, hemiGnd: 0x8f8898, fill: 0xd4cedb, sunI: 0.34,
    slab: 0xd4d2dc, glow: 0xf3bd92,
    mA: 0xdcd8e0, mB: 0xcdc6d2, mC: 0xb4abbc, mD: 0x847c92
  };
  Object.keys(WAKE).forEach(function (k) {
    if (typeof WAKE[k] === 'number' && k !== 'sunI') { WAKE[k] = new THREE.Color(WAKE[k]); DREAM[k] = new THREE.Color(DREAM[k]); }
  });
  var fogCol = WAKE.fog.clone();
  scene.background = fogCol.clone();
  scene.fog = new THREE.Fog(fogCol.clone(), 13, 70);

  var camera = new THREE.PerspectiveCamera(44, 1, 0.1, 400);

  var hemi = new THREE.HemisphereLight(WAKE.hemiSky.clone(), WAKE.hemiGnd.clone(), 0.95);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(WAKE.sun.clone(), WAKE.sunI);
  sun.position.set(-4.2, 6.5, -7.0);
  scene.add(sun);
  var fill = new THREE.DirectionalLight(WAKE.fill.clone(), 0.26);
  fill.position.set(6.5, 4.5, 3.5);
  scene.add(fill);
  var SUN_DIR = new THREE.Vector3(-0.4, 0.52, -0.74).normalize();

  /* ── 程序纹理：灰泥噪点（磨砂颗粒） ── */
  var surfTex = (function () {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var x = c.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, 128, 128);
    var im = x.getImageData(0, 0, 128, 128);
    for (var i = 0; i < im.data.length; i += 4) {
      var v = 234 + Math.floor(rnd() * 21);
      im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
    }
    x.putImageData(im, 0, 0);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(2, 2);
    return t;
  })();

  /* ── 天空穹 ── */
  var skyU = {
    uTop: { value: WAKE.skyTop.clone() },
    uHor: { value: WAKE.skyHor.clone() },
    uSunDir: { value: SUN_DIR },
    uSunCol: { value: WAKE.sun.clone() },
    uTime: { value: 0 }
  };
  var sky = new THREE.Mesh(
    new THREE.SphereGeometry(150, 32, 20),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, depthTest: false,
      uniforms: skyU,
      vertexShader: [
        'varying vec3 vDir;',
        'void main() {',
        '  vDir = normalize(position);',
        '  gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0);',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform vec3 uTop; uniform vec3 uHor; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform float uTime;',
        'varying vec3 vDir;',
        'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
        'float noise(vec2 p) {',
        '  vec2 i = floor(p), f = fract(p);',
        '  vec2 u = f * f * (3.0 - 2.0 * f);',
        '  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);',
        '}',
        'void main() {',
        '  float h = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0);',
        '  vec3 col = mix(uHor, uTop, smoothstep(0.5, 0.92, h));',

      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';

        var startY = cvs.height / 2 - (text.length - 1) * step / 2;
        for (var i = 0; i < text.length; i++) ctx.fillText(text[i], x, startY + i * step);

  /* ═══ 醒/梦状态机（眼睑在 3D 之外，由同一帧循环驱动） ═══ */

      s.mesh.position.set(
        s.home[0] + (s.loose[0] - s.home[0]) * (1 - align),
        s.home[1] + (s.loose[1] - s.home[1]) * (1 - align),
        s.home[2] + (s.loose[2] - s.home[2]) * (1 - align));
      s.mesh.rotation.set(
        s.homeRX * align + s.looseRX * (1 - align),
        s.homeRY * align + s.looseRY * (1 - align),
        s.homeRZ * align + s.looseRZ * (1 - align));
      s.mesh.material.uniforms.uFade.value = Math.min(1, dE * 0.85);
    }
    lantern.mesh.position.set(lantern.home[0], lantern.home[1], lantern.home[2]);
    lantern.mesh.rotation.set(0, 0.4, 0);
    lantern.mesh.material.emissiveIntensity = 0.5 + 0.35 * dE;
    lantern.glow.position.copy(lantern.mesh.position);
    lantern.glowMat.opacity = 0.3 + 0.2 * dE;
    tp1.position.y = 3.4 - 0.6 * dE;
    tp2.position.y = 9.6 - 0.4 * dE;
    camY = 2.1; camZ = 9.6; camLookY = 4.9; camLookZ = -9;
    renderOnce();
  }

  var camY = 2.1, camZ = 9.6, camLookY = 4.9, camLookZ = -9;

  var lastT = 0, running = false, rafId = null, lastFrame = 0;
  function loop(now) {
    if (running) requestAnimationFrame(loop);
    if (now - lastT < 33) return;
    var dt = Math.min(0.06, (now - lastFrame) / 1000) * speed;
    lastFrame = now;
    var t = now / 1000;
    lastT = now;

    /* 睁眼进度：按住推进，松手倦落 */
    if (!awake) {
      if (wakeLock !== null) w = wakeLock;
      else {
        if (holding || forcedHold) w += dt / 1.55;
        else w -= dt / 2.3;
        w = clamp01(w);
      }
      if (w >= 1) wakeNow(false);
      applyLids();
    }
    var wakeE = ease(w);

    readScroll();
    var dream = clamp01(0.05 + 0.05 * Math.sin(t * 0.05 * speed) + 0.62 * scrollP);
    var dE = ease(dream);
    mistU.uDream.value = dream;
    mistU.uTime.value = t * speed;
    skyU.uTime.value = t * speed;
    applyPalette(dream, wakeE);

    /* 成形度 a：醒=1（闭眼时世界也散着）；梦=散形 */
    var align = wakeE * (1 - 0.92 * dE);

    /* 凝形厅：home↔loose 插值 + 永不停止的微调 */
    for (var i = 0; i < slabs.length; i++) {
      var s = slabs[i];
      var jig = Math.sin(t * speed * 0.09 + s.ph) * (s.amp * (0.5 + 1.6 * (1 - align)));
      var jig2 = Math.sin(t * speed * 0.07 + s.ph2) * (s.amp * (0.5 + 1.6 * (1 - align)));
      var m = s.mesh;
      m.position.set(
        s.home[0] + (s.loose[0] - s.home[0]) * (1 - align) + jig,
        s.home[1] + (s.loose[1] - s.home[1]) * (1 - align) + jig2,
        s.home[2] + (s.loose[2] - s.home[2]) * (1 - align) + jig * 0.6
      );
      m.rotation.set(
        s.homeRX * align + s.looseRX * (1 - align),
        s.homeRY * align + (s.looseRY * (1 - align)) + Math.sin(t * speed * 0.06 + s.ph) * s.rotAmp,
        s.homeRZ * align + s.looseRZ * (1 - align)
      );
      m.material.uniforms.uFade.value = Math.min(1, dE * 0.85);
    }
    /* 灯板：悬浮呼吸，梦时更亮更暖 */
    var lg = 1 - align;
    lantern.mesh.position.set(
      lantern.home[0] + (lantern.loose[0] - lantern.home[0]) * lg,
      lantern.home[1] + (lantern.loose[1] - lantern.home[1]) * lg + Math.sin(t * speed * 0.5 + lantern.ph) * 0.16,
      lantern.home[2] + (lantern.loose[2] - lantern.home[2]) * lg
    );
    lantern.mesh.rotation.y = t * speed * 0.12;
    lantern.mesh.rotation.z = Math.sin(t * speed * 0.3 + lantern.ph) * 0.05;
    var pulse = 0.5 + 0.14 * Math.sin(t * speed * 0.8 + lantern.ph) + 0.35 * dE;
    lantern.mesh.material.emissiveIntensity = pulse;
    lantern.glow.position.copy(lantern.mesh.position);
    lantern.glowMat.opacity = 0.22 + 0.2 * pulse;

    /* 字平面：入梦微微下沉 */
    tp1.position.y = 3.4 - 0.9 * dE;
    tp2.position.y = 9.6 - 0.6 * dE;

    /* 尘光 */
    var mp = moteGeo.attributes.position;
    for (var q = 0; q < MOTES; q++) {
      var mb = moteBase[q];
      var yy = (mb.y + t * speed * mb.v) % 11;
      mp.setXYZ(q,
        mb.x + Math.sin(t * speed * 0.3 + mb.ph) * 0.5,
        0.3 + yy,
        mb.z + Math.cos(t * speed * 0.22 + mb.ph) * 0.4);
    }
    mp.needsUpdate = true;
    moteMat.opacity = 0.26 + 0.22 * wakeE + 0.1 * dE;

    /* 镜头：醒来=从低位推起坐定；入梦=微微下沉抬头 */
    camY = 1.72 + 0.38 * wakeE - 0.5 * dE;
    camZ = 10.6 - 1.0 * wakeE - 1.0 * dE;
    camLookY = 4.4 + 0.5 * wakeE + 0.8 * dE;
    camLookZ = -9 + 1.2 * dE;

    renderOnce();
  }

  function start() {
    if (running || reduceMotion) return;
    running = true; lastT = performance.now() - 40; lastFrame = performance.now();
    rafId = requestAnimationFrame(loop);
    /* 测试辅助（?auto）：rAF 被节流的环境用定时器驱动，并在 0.9s 后自动醒来 */
    if ('auto' in qs && !start.__auto) {
      start.__auto = true;
      setInterval(function () { if (!document.hidden) loop(performance.now()); }, 33);
      setTimeout(function () { if (!awake) autoWake(); }, fastMode ? 300 : 900);
    }
  }
  function stop() { running = false; if (rafId !== null) cancelAnimationFrame(rafId); rafId = null; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });

  /* ── 输入：按住醒来；滚动/轻点也能触发（不留死路） ── */
  function autoWake() { if (!awake) forcedHold = true; }
  window.addEventListener('pointerdown', function (e) {
    if (awake) return;
    holding = true; downT = performance.now();
  }, { passive: true });
  window.addEventListener('pointerup', function () {
    if (awake) return;
    holding = false;
    if (performance.now() - downT < 260) autoWake();  /* 轻点=直接醒来 */
  }, { passive: true });
  window.addEventListener('pointercancel', function () { holding = false; }, { passive: true });
  window.addEventListener('keydown', function (e) {
    if (awake) return;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); holding = true; }
  });
  window.addEventListener('keyup', function (e) {
    if (awake) return;
    if (e.code === 'Space' || e.code === 'Enter') holding = false;
  });
  window.addEventListener('wheel', function () { autoWake(); }, { passive: true });
  window.addEventListener('touchmove', function () { autoWake(); }, { passive: true });
  window.addEventListener('pointermove', function (e) {
    pointer.x = (e.clientX / window.innerWidth - 0.5) * 2;
    pointer.y = (e.clientY / window.innerHeight - 0.5) * 2;
  }, { passive: true });
  window.addEventListener('scroll', function () {
    readScroll();
    if (reduceMotion) composeStatic();
  }, { passive: true });
  window.addEventListener('resize', onResize);

  /* ── 初始化 ── */
  applyPalette(0.05, 0);
  sizeLids();
  onResize();
  readScroll();

  if (reduceMotion) {
    /* reduced-motion：直接醒着（不给用户增加「按住」负担），世界成形，静帧按需渲染 */
    wakeNow(true);
    composeStatic();
  } else if (openParam || (wakeLock !== null && wakeLock >= 1)) {
    wakeNow(true);
    start();
    if (wakeLock !== null) { w = wakeLock; applyLids(); }
  } else {
    start();
    applyLids();
  }
})();
</script>
</body>
</html>
