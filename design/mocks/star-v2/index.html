<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>star-v2 · 三轴正交六芒星 · 三维水晶原语</title>
<link rel="stylesheet" href="/fonts/noto/font.css" />
<style>
  /* 底是站点昼面的同一支色（tokens.css 的 --bg / --dream / --fg-faint），
     让这颗晶体与 NEXUS 那颗落在同一张纸上。 */
  :root {
    --bg: #f0f3f6;
    --dream: #9389ae;
    --umber: #4f4a66;
    --fg-faint: #858f9d;
    --fg-soft: #56606d;
    --amber: #9a86c4;
    --stage: min(72vmin, 400px);
    --rule: rgba(35,40,48,0.10);
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg-soft); }
  body {
    font-family: 'Noto Serif SC', 'Palatino Linotype', Georgia, 'Songti SC', serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: grid;
    align-content: start;
    justify-items: center;
    padding: 5vh 0 0;
    gap: 3.2vh;
    overflow-x: hidden;
  }

  /* ── 星 ── 只有这一块是画布；它左右上下都留着空白，字与线在画布里面（星体后方） */
  #stage {
    position: relative;
    width: var(--stage);
    height: var(--stage);
    cursor: default;
    background: var(--bg);
    transition: opacity 0.5s;
  }
  #stage canvas {
    display: block;
    width: 100%;
    height: 100%;
    /* 画布本身是整幅底（含星后面的线与字），底色由着色器写满 */
  }

  /* ── 页面读数（验收用，不是文案） ── */
  .meta {
    width: var(--stage);
    display: grid;
    gap: 0.5rem;
    font: 11px/1.7 ui-monospace, 'Cascadia Mono', Consolas, monospace;
    color: var(--fg-faint);
    letter-spacing: 0.02em;
  }
  .meta b { color: var(--fg-soft); font-weight: 500; }
  .meta .hint { color: var(--fg-faint); opacity: 0.85; }
  .meta code { font: inherit; color: var(--fg-soft); }
  .sep { height: 1px; background: var(--rule); }
</style>
</head>
<body>
  <div id="stage" role="img" aria-label="三轴正交六芒星的三维水晶原语；点击星体或按空格，转一圈">
    <canvas id="c"></canvas>
  </div>

  <div class="meta">
    <span id="stat">…</span>
    <div class="sep"></div>
    <span class="hint">点击星体或按空格 —— 走十六格，最后一格落回同一个落定姿态，然后完全静止。</span>
    <span class="hint">
      <code>__star.setTime(0.2 / 0.5 / 0.8)</code> 摆姿态 ｜
      <code>__star.rest()</code> 回落定 ｜
      <code>__star.state().timers</code> 查计时器（静止与播完都是 0）
    </span>
    <span class="hint">静止的证据是像素逐字节相同；<code>state().raf</code> 是全局计数，页面之外的东西也会推它，不能当证据。</span>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./src.js"></script>
</body>
</html>
