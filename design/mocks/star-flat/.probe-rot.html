<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>旋转核对</title>
<style>body{margin:0;background:#f0f3f6;display:flex;gap:40px;padding:40px;font:12px monospace}</style>
</head>
<body>
<div><svg viewBox="-16 -16 32 32" width="240" height="240"><path id="a" fill="#232830"></path></svg><div>rotate 0（路径已转）</div></div>
<div><svg viewBox="-16 -16 32 32" width="240" height="240"><path id="b" fill="#232830"></path></svg><div>transform rotate(45)</div></div>
<div><svg viewBox="-16 -16 32 32" width="240" height="240"><rect x="-8" y="-8" width="16" height="16" fill="#9a86c4" transform="rotate(45)"></rect></svg><div>对照组：正方形 rotate(45)</div></div>
<script type="module">
import { starPath, PRESETS } from './star.js';
document.getElementById('a').setAttribute('d', starPath({...PRESETS.spire, rotate: 45}));
document.getElementById('b').setAttribute('d', starPath(PRESETS.spire));
document.getElementById('b').setAttribute('transform', 'rotate(45)');
</script>
</body>
</html>
