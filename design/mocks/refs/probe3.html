<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>edge probe 3 · star + plate mark</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;}
  .plate{position:absolute;inset:0;background:url(../cards-r5/shared/plate-1440.png) center/1440px 900px no-repeat #111;}
  .card{position:absolute;width:270px;height:118px;border-radius:3px;box-sizing:border-box;padding:14px 16px 34px;
        font-family:"Songti SC","Source Han Serif SC",Georgia,serif;}
  .t{font-size:16px;letter-spacing:.02em;margin:0 0 6px;}
  .b{font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;font-size:10px;line-height:1.5;opacity:.62;margin:0;}
  .star{position:absolute;left:15px;bottom:13px;width:13px;height:13px;overflow:visible;}
  .star path{fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .ghost{stroke-width:1.25px;transform:translate(.6px,.6px);}
  .real{stroke-width:1.25px;}
  .on-d{background:rgba(255,255,255,.045);color:#e8effa;
        box-shadow:0 0 0 .5px rgba(190,212,255,.15),0 0 2px rgba(0,0,0,.35),
                   inset 0 -.6px 0 rgba(0,0,0,.60),inset 0 0 1.8px rgba(0,0,0,.30);}
  .on-m{background:rgba(255,255,255,.055);color:#f2ebf4;
        box-shadow:0 0 0 .5px rgba(255,255,255,.13),0 0 2px rgba(8,5,12,.30),
                   inset 0 -.6px 0 rgba(8,5,12,.55),inset 0 0 1.6px rgba(8,5,12,.22);}
  .on-l{background:rgba(255,255,255,.26);color:#141b28;
        box-shadow:inset 0 -.6px 0 rgba(26,20,30,.30),inset 0 0 1.6px rgba(26,20,30,.10),
                   0 0 1.5px rgba(26,20,30,.10),0 0 4px rgba(26,20,30,.05);}
  .mark::after{content:"";position:absolute;inset:-7px;border-radius:10px;border:.5px solid rgba(255,255,255,.07);pointer-events:none;}
  .mark.on-l::after{border-color:rgba(26,20,30,.08);}
  .cap{position:absolute;font:10px/1 -apple-system,"Segoe UI",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#fff;opacity:.45;}
</style>
</head>
<body>
<div class="plate"></div>
<div class="cap" style="left:120px;top:120px">C 星·套印 + 版口</div>

<div class="card on-d mark" style="left:1050px;top:150px">
  <p class="t">夜航的稿</p><p class="b">纸上留下的是被压下去的那层。</p>
  <svg class="star" viewBox="0 0 24 24">
    <g>
      <path class="ghost" d="M12 2 L13.2 10.8 L22 12 L13.2 13.2 L12 22 L10.8 13.2 L2 12 L10.8 10.8 Z" stroke="rgba(236,158,120,.42)"/>
      <path class="real"  d="M12 2 L13.2 10.8 L22 12 L13.2 13.2 L12 22 L10.8 13.2 L2 12 L10.8 10.8 Z" stroke="#d3e0f2"/>
    </g>
  </svg>
</div>

<div class="card on-m" style="left:585px;top:150px">
  <p class="t">夜航的稿</p><p class="b">纸上留下的是被压下去的那层。</p>
  <svg class="star" viewBox="0 0 24 24">
    <g>
      <path class="ghost" d="M12 2 L13.2 10.8 L22 12 L13.2 13.2 L12 22 L10.8 13.2 L2 12 L10.8 10.8 Z" stroke="rgba(236,158,120,.34)"/>
      <path class="real"  d="M12 2 L13.2 10.8 L22 12 L13.2 13.2 L12 22 L10.8 13.2 L2 12 L10.8 10.8 Z" stroke="#e2d7ea"/>
    </g>
  </svg>
</div>

<div class="card on-d" style="left:1050px;top:400px">
  <p class="t">夜航的稿</p><p class="b">不带错位，只有一根线。</p>
  <svg class="star" viewBox="0 0 24 24">
    <path class="real" d="M12 2 L13.2 10.8 L22 12 L13.2 13.2 L12 22 L10.8 13.2 L2 12 L10.8 10.8 Z" stroke="#d3e0f2"/>
  </svg>
</div>
</body>
</html>
