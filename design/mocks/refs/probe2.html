<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>edge probe 2</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;}
  .plate{position:absolute;inset:0;background:url(../cards-r5/shared/plate-1440.png) center/1440px 900px no-repeat #111;}
  .card{position:absolute;width:270px;height:118px;border-radius:3px;box-sizing:border-box;padding:14px 16px;
        font-family:"Songti SC","Source Han Serif SC",Georgia,serif;}
  .t{font-size:16px;letter-spacing:.02em;margin:0 0 6px;}
  .b{font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;font-size:10px;line-height:1.5;opacity:.62;margin:0;}
  .on-l{--ink:26,20,30;--lit:255,255,255;background:rgba(255,255,255,.26);color:#141b28;}
  .on-m{--ink:8,5,12;--lit:255,255,255;background:rgba(255,255,255,.055);color:#f2ebf4;}
  .on-d{--ink:0,0,0;--lit:190,212,255;background:rgba(255,255,255,.045);color:#e8effa;}

  /* V1' 压痕·按极性分叉 */
  /* 浅底：墨往外渗 —— 外侧 1.5px 极淡暗晕 + 内侧一根 0.6px 墨线 */
  .vA.on-l{box-shadow:0 0 1.5px rgba(var(--ink),.10),0 0 3px rgba(var(--ink),.05),
                      inset 0 -.6px 0 rgba(var(--ink),.30),inset 0 0 1.6px rgba(var(--ink),.10);}
  /* 深底：墨压不出更暗，边只能是「纸芯露出来」——外侧 0.5px 亮 + 内侧 0.6px 沉 */
  .vA.on-m{box-shadow:0 0 0 .5px rgba(var(--lit),.13),0 0 2px rgba(var(--ink),.30),
                      inset 0 -.6px 0 rgba(var(--ink),.55),inset 0 0 1.6px rgba(var(--ink),.22);}
  .vA.on-d{box-shadow:0 0 0 .5px rgba(var(--lit),.15),0 0 2px rgba(var(--ink),.35),
                      inset 0 -.6px 0 rgba(var(--ink),.62),inset 0 0 1.8px rgba(var(--ink),.30);}

  /* V5 = V1' + 版口：外面 6px 处一条 0.5px 的压痕线 */
  .vB.on-l{box-shadow:0 0 1.5px rgba(var(--ink),.10),
                      inset 0 -.6px 0 rgba(var(--ink),.30),inset 0 0 1.6px rgba(var(--ink),.10);}
  .vB.on-m{box-shadow:0 0 0 .5px rgba(var(--lit),.13),0 0 2px rgba(var(--ink),.30),
                      inset 0 -.6px 0 rgba(var(--ink),.55),inset 0 0 1.6px rgba(var(--ink),.22);}
  .vB.on-d{box-shadow:0 0 0 .5px rgba(var(--lit),.15),0 0 2px rgba(var(--ink),.35),
                      inset 0 -.6px 0 rgba(var(--ink),.62),inset 0 0 1.8px rgba(var(--ink),.30);}
  .vB::after{content:"";position:absolute;inset:-7px;border-radius:10px;border:.5px solid rgba(var(--lit),.07);pointer-events:none;}
  .vB.on-l::after{border-color:rgba(var(--ink),.08);}

  .cap{position:absolute;font:10px/1 -apple-system,"Segoe UI",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#fff;opacity:.45;}
</style>
</head>
<body>
<div class="plate"></div>
<div class="cap" style="left:120px;top:120px">A 压痕</div>
<div class="cap" style="left:120px;top:370px">B 压痕+版口</div>

<div class="card vA on-l" style="left:120px;top:150px"><p class="t">夜航的稿</p><p class="b">纸上留下的是被压下去的那层，不是画上去的那层。</p></div>
<div class="card vA on-m" style="left:585px;top:150px"><p class="t">夜航的稿</p><p class="b">纸上留下的是被压下去的那层，不是画上去的那层。</p></div>
<div class="card vA on-d" style="left:1050px;top:150px"><p class="t">夜航的稿</p><p class="b">纸上留下的是被压下去的那层，不是画上去的那层。</p></div>

<div class="card vB on-l" style="left:120px;top:400px"><p class="t">夜航的稿</p><p class="b">纸上留下的是被压下去的那层，不是画上去的那层。</p></div>
<div class="card vB on-m" style="left:585px;top:400px"><p class="t">夜航的稿</p><p class="b">纸上留下的是被压下去的那层，不是画上去的那层。</p></div>
<div class="card vB on-d" style="left:1050px;top:400px"><p class="t">夜航的稿</p><p class="b">纸上留下的是被压下去的那层，不是画上去的那层。</p></div>
</body>
</html>
