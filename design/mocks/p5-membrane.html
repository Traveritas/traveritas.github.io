<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 · 天膜 Membrane（活体）</title>
<style>
  /* ═══ 概念：天膜 Membrane ═══
     整页隔在一层绷紧的磨砂天膜之后。膜后是暖暗的内室：地面有一道
     发光的地缝，远处两扇磨砂巨门虚掩——门缝里透进外面的白昼。
     膜上有一道发丝细纹。
     入口机制 = 加压：滚动不是「向下看内容」，是对着裂纹压。
     · 压力渐深：裂纹变宽发亮 → 分出枝纹 → 裂纹周围洇出应力白斑
     · 门同时被从外面缓缓推开（膜上的裂纹与门缝是同一道裂的两尺度）
     · 过临界：一声白闪，膜破了——你走进白昼，句子以墨色跟着出来
     · 破后膜不消失：只剩极淡的一层，贴在你眼前（最后一层世界）
     技术约束：无后处理、DPR≤1.5、reduced-motion 静帧、?auto 无头自检、
     &pin=<0..1> 锁相位、&still=1 单帧、window.__mockSnap() 强制出帧。 */

  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Noto Serif SC Web';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('https://fastly.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/files/noto-serif-sc-chinese-simplified-600-normal.woff2') format('woff2');
  }

  :root {
    --parchment: #f3e9d8;
    --parchment-dim: rgba(243, 233, 216, 0.55);
    --ink: #3a4046;
    --font-display: 'Noto Serif SC Web', 'Noto Serif SC', 'Palatino Linotype', Georgia, 'Songti SC', SimSun, serif;
    --font-body: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--parchment);
    background: linear-gradient(to bottom, #2b2521 0%, #35291f 55%, #8a715a 100%);
  }
  html.no-webgl #gl { display: none; }
  html.no-webgl .fallback { display: flex; }

  #gl { position: fixed; inset: 0; }
  #gl canvas { display: block; width: 100%; height: 100%; }

  /* 滚动高度：500vh */
  #track { height: 500vh; }

  .fallback {
    display: none; position: fixed; inset: 0; z-index: 5;
    align-items: center; justify-content: center; text-align: center; color: var(--parchment);
  }
  .fallback div { font-family: var(--font-display); font-size: 22px; line-height: 2.2; letter-spacing: .12em; }

  /* 宣言：暖侧（膜内） */
  .manifesto {
    position: fixed; left: 50%; top: 44%; z-index: 6;
    transform: translate(-50%, -50%);
    text-align: center;
    font-family: var(--font-display); font-weight: 500;
    font-size: clamp(20px, 3.4vw, 34px);
    line-height: 2.3; letter-spacing: .3em; text-indent: .3em;
    color: var(--parchment);
    text-shadow: 0 0 26px rgba(243, 210, 160, 0.28);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }
  .manifesto.small { display: block; font-size: .52em; letter-spacing: .42em; color: var(--parchment-dim); margin-top: 1.1em; }
  /* 宣言：墨侧（破膜后） */
  .manifesto.ink { color: var(--ink); text-shadow: none; top: 30%; opacity: 0; }
  .manifesto.ink .small { color: rgba(58, 64, 70, 0.6); }

  .brand {
    position: fixed; left: 26px; top: 24px; z-index: 10;
    font-family: var(--font-display); font-size: 15px; letter-spacing: .5em;
    color: var(--parchment-dim);
  }
  .brand em { font-style: normal; color: var(--parchment); }

  /* 账目卡 */
  .card {
    position: fixed; left: 22px; bottom: 20px; z-index: 10;
    max-width: 300px; padding: 14px 18px 13px;
    background: rgba(20, 17, 14, 0.45);
    border: 1px solid rgba(243, 233, 216, 0.16);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font-size: 12px; line-height: 1.75; color: rgba(243, 233, 216, 0.66);
  }
  .card b {
    display: block; margin-bottom: 4px;
    font-family: var(--font-display); font-weight: 600;
    font-size: 15px; letter-spacing: .2em; color: var(--parchment);
  }
  .card i { font-style: normal; color: rgba(243, 233, 216, 0.38); }

  /* 右下：压力计 + 提示 */
  .hint {
    position: fixed; right: 24px; bottom: 22px; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    color: rgba(243, 233, 216, 0.6); font-size: 12px; letter-spacing: .32em;
  }
  .hint svg { display: block; }
  .hint .bar-bg { stroke: rgba(243,233,216,.18); }
  .hint .bar-fg { stroke: #f3e9d8; }
  .hint .crack-mark { stroke: #ffd9a8; }

  @media (max-width: 640px) {
    .card { left: 14px; right: 14px; bottom: 14px; max-width: none; padding: 11px 14px 10px; font-size: 11px; }
    .card i { display: none; }
    .brand { left: 16px; top: 16px; }
    .hint { right: 16px; bottom: 15px; }
    .hint span { display: none; }
    .manifesto { white-space: normal; width: 86vw; line-height: 2.1; }
  }
</style>
</head>
<body>
<div id="gl"></div>
<div id="track"></div>

<div class="fallback"><div>这里不是梦，也不是现实。<br/>它是人在即将醒来时，看见的最后一层世界。</div></div>

<div class="brand">记<em> · </em>醒梦</div>

<div class="manifesto" id="mWarm">
  这里不是梦，也不是现实。
  <span class="small">滚动，对着裂纹压</span>
</div>
<div class="manifesto ink" id="mInk">
  它是人在即将醒来时，<br/>看见的最后一层世界。
  <span class="small">随笔 · 关于 · 项目</span>
</div>

<div class="card">
  <b>天膜 <i>Membrane</i></b>
  整页隔在一层绷紧的天膜之后：滚动是加压——<br/>
  裂纹变宽、分叉、洇出白斑，门被从外面推开；<br/>
  过临界，膜破，你走进门后的白昼。<br/>
  <i>破后仍剩极淡的一层，贴在眼前。</i>
</div>

<div class="hint">
  <span>滚动 · 加压</span>
  <svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true">
    <path d="M8 2 L11 10 L6 17 L13 24 L9 32" fill="none" class="crack-mark" stroke-width="1.6" opacity="0.85"/>
    <line class="bar-bg" x1="19" y1="4" x2="19" y2="30" stroke-width="2"/>
    <line class="bar-fg" id="barFg" x1="19" y1="30" x2="19" y2="30" stroke-width="2"/>
  </svg>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function () {
'use strict';

window.addEventListener('error', function (e) {
  window.__swarmErr = (e.message || 'error') + ' @' + (e.lineno || '?');
});
window.addEventListener('unhandledrejection', function (e) {
  window.__swarmErr = 'rejection: ' + (e.reason && e.reason.message || e.reason);
});
(function () {
  var ce = console.error;
  console.error = function () {
    try { window.__swarmErr = 'console: ' + Array.prototype.join.call(arguments, ' ').slice(0, 400); } catch (e2) {}
    ce.apply(console, arguments);
  };
})();

/* ───────── URL 参数（裸旗标兼容） ───────── */
var qs = location.search;
function q(name) {
  var m = qs.match(new RegExp('[?&]' + name + '(?:=([^&]*))=?'));
  return m ? (m[1] !== undefined ? decodeURIComponent(m[1]) : '') : null;
}
var IS_AUTO  = qs.indexOf('auto')  >= 0;
var IS_FAST  = qs.indexOf('fast')  >= 0;
var IS_STILL = qs.indexOf('still') >= 0;
var PIN      = q('pin');
var RM = false;
try { RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

/* ───────── 渲染器 ───────── */
var container = document.getElementById('gl');
var renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
} catch (e) {
  document.documentElement.classList.add('no-webgl');
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(Math.max(1, window.innerWidth), Math.max(1, window.innerHeight));
container.appendChild(renderer.domElement);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x241f1c);
scene.fog = new THREE.Fog(0x2b2521, 9, 52);

var camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 160);
camera.position.set(0, 1.7, 10);
camera.lookAt(0, 3.4, -26);
scene.add(camera);   // 相机有子物体（膜），必须入场景

/* 光：暖暗内室，光源来自门缝方向 */
var hemi = new THREE.HemisphereLight(0x6b5f55, 0x2e2a26, 0.8);
scene.add(hemi);
var seamLight = new THREE.DirectionalLight(0xffd9a8, 0.85);
seamLight.position.set(0, 5, -18);
scene.add(seamLight);
var fill = new THREE.DirectionalLight(0x8fa3b5, 0.12);
fill.position.set(-14, 9, 6);
scene.add(fill);

/* ───────── 材质工具 ───────── */
var noiseTex = (function () {
  var c = document.createElement('canvas'); c.width = c.height = 128;
  var g = c.getContext('2d'), img = g.createImageData(128, 128);
  for (var i = 0; i < img.data.length; i += 4) {
    var v = 196 + (Math.random() - 0.5) * 60;
    img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255;
  }
  g.putImageData(img, 0, 0);
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3);
  return t;
})();

/* ───────── 内室：地面 + 地缝光 ───────── */
var ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({ color: 0x6e6258, roughness: 1.0, map: noiseTex })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

var spillTex = (function () {
  var c = document.createElement('canvas'); c.width = 128; c.height = 512;
  var g = c.getContext('2d');
  var lg = g.createLinearGradient(0, 0, 0, 512);
  lg.addColorStop(0, 'rgba(255,217,168,0)');
  lg.addColorStop(0.45, 'rgba(255,217,168,0.30)');
  lg.addColorStop(1, 'rgba(255,217,168,0.95)');
  g.fillStyle = lg; g.fillRect(0, 0, 128, 512);
  /* 横向柔边 */
  var hg = g.createLinearGradient(0, 0, 128, 0);
  hg.addColorStop(0, 'rgba(0,0,0,1)'); hg.addColorStop(0.25, 'rgba(0,0,0,0)');
  hg.addColorStop(0.75, 'rgba(0,0,0,0)'); hg.addColorStop(1, 'rgba(0,0,0,1)');
  g.globalCompositeOperation = 'destination-out';
  g.fillStyle = hg; g.fillRect(0, 0, 128, 512);
  return new THREE.CanvasTexture(c);
})();
var spill = new THREE.Mesh(
  new THREE.PlaneGeometry(6.5, 9),
  new THREE.MeshBasicMaterial({ map: spillTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, opacity: 0.55 })
);
spill.rotation.x = -Math.PI / 2;
spill.position.set(0, 0.03, -21);
spill.renderOrder = 2;
scene.add(spill);
/* 门脚光池 */
var poolTex = (function () {
  var c = document.createElement('canvas'); c.width = 128; c.height = 128;
  var g = c.getContext('2d');
  var rg = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  rg.addColorStop(0, 'rgba(255,217,168,0.9)');
  rg.addColorStop(0.5, 'rgba(255,217,168,0.32)');
  rg.addColorStop(1, 'rgba(255,217,168,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
var pool = new THREE.Mesh(
  new THREE.PlaneGeometry(11, 11),
  new THREE.MeshBasicMaterial({ map: poolTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false })
);
pool.rotation.x = -Math.PI / 2;
pool.position.set(0, 0.04, -24);
pool.renderOrder = 2;
scene.add(pool);
/* 地缝本体（发光细线） */
var seamLine = new THREE.Mesh(
  new THREE.PlaneGeometry(0.34, 34),
  new THREE.MeshBasicMaterial({ color: 0xffe6bd, transparent: true, opacity: 0.95, depthWrite: false, blending: THREE.AdditiveBlending, fog: false })
);
seamLine.rotation.x = -Math.PI / 2;
seamLine.position.set(0, 0.05, -13);
seamLine.renderOrder = 3;
scene.add(seamLine);

/* ───────── 巨门两扇（磨砂，带暖窗）+ 门墙（左右两片，留出门洞） ───────── */
var backdropMat = new THREE.MeshStandardMaterial({ color: 0x1d1815, roughness: 1.0 });
var backdropL = new THREE.Mesh(new THREE.PlaneGeometry(68, 50), backdropMat);
backdropL.position.set(-46.2, 17, -27.6);
scene.add(backdropL);
var backdropR = new THREE.Mesh(new THREE.PlaneGeometry(68, 50), backdropMat);
backdropR.position.set(46.2, 17, -27.6);
scene.add(backdropR);

var slabMatL = new THREE.MeshStandardMaterial({
  color: 0xcabfb2, roughness: 0.96, map: noiseTex,
  emissive: 0x16110d, emissiveIntensity: 1
});
var slabMatR = slabMatL.clone();
var slabGeo = new THREE.BoxGeometry(11.5, 26, 2.4);
var slabL = new THREE.Mesh(slabGeo, slabMatL);
slabL.position.set(-6.6, 13, -26);
scene.add(slabL);
var slabR = new THREE.Mesh(slabGeo, slabMatR);
slabR.position.set(6.6, 13, -26);
scene.add(slabR);

var winTex = (function () {
  var c = document.createElement('canvas'); c.width = 64; c.height = 64;
  var g = c.getContext('2d');
  var rg = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  rg.addColorStop(0, 'rgba(255,214,150,1)');
  rg.addColorStop(0.55, 'rgba(255,205,135,0.85)');
  rg.addColorStop(1, 'rgba(255,205,135,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
var winGeo = new THREE.PlaneGeometry(1.15, 2.0);
var winMat = new THREE.MeshBasicMaterial({ map: winTex, transparent: true, depthWrite: false });
var winRnd = (function () { var s = 7; return function () { s = (s * 16807) % 2147483647; return (s & 0xffff) / 0xffff; }; })();
[-1, 1].forEach(function (side) {
  for (var i = 0; i < 5; i++) {
    var w = new THREE.Mesh(winGeo, winMat);
    var lx = (winRnd() - 0.5) * 8.2;
    var ly = 3.2 + winRnd() * 14;
    w.position.set(side < 0 ? -6.6 + lx : 6.6 + lx, ly, -26 + 1.24);
    if (side > 0) w.rotation.y = Math.PI;
    w.renderOrder = 4;
    scene.add(w);
  }
});

/* ───────── 门外：白昼（基本面 + 远影 + 日盘） ───────── */
var dayTex = (function () {
  var c = document.createElement('canvas'); c.width = 4; c.height = 256;
  var g = c.getContext('2d');
  var lg = g.createLinearGradient(0, 0, 0, 256);
  lg.addColorStop(0, '#f7f5ef');
  lg.addColorStop(0.62, '#eef0ea');
  lg.addColorStop(1, '#e7e3d6');
  g.fillStyle = lg; g.fillRect(0, 0, 4, 256);
  return new THREE.CanvasTexture(c);
})();
var dayWall = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 40),
  new THREE.MeshBasicMaterial({ map: dayTex, fog: false })
);
dayWall.position.set(0, 12, -58);
scene.add(dayWall);

var silMat = new THREE.MeshBasicMaterial({ color: 0xb6bfc6, fog: false });
var sils = new THREE.Group();
function sil(geo, x, y, z, ry) {
  var m = new THREE.Mesh(geo, silMat);
  m.position.set(x, y, z); m.rotation.y = ry || 0;
  sils.add(m); return m;
}
sil(new THREE.BoxGeometry(2.6, 15, 1.2), -7, 7.5, -52, 0.2);
sil(new THREE.CylinderGeometry(0.7, 1.1, 19, 6), 4, 9.5, -52, 0);
(function () { var r = new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.4, 8, 40), silMat); r.position.set(-1, 11, -54); r.rotation.x = 0.12; sils.add(r); })();
sils.visible = false;   // 只在门缝里可见（由膜外显隐控制不必要——门板会遮挡，直接常显）
sils.visible = true;
scene.add(sils);
var sunDisc = new THREE.Mesh(
  new THREE.CircleGeometry(2.6, 40),
  new THREE.MeshBasicMaterial({ color: 0xfff3da, fog: false, transparent: true, opacity: 0.95 })
);
sunDisc.position.set(9, 13, -57);
scene.add(sunDisc);
/* 门外的地 */
var outGround = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 36),
  new THREE.MeshBasicMaterial({ color: 0xdcd8cb, fog: false })
);
outGround.rotation.x = -Math.PI / 2;
outGround.position.set(0, 0.01, -44);
scene.add(outGround);

/* ───────── 尘埃 ───────── */
var DUST_N = 110;
var dustGeo = new THREE.BufferGeometry();
var dustPos = new Float32Array(DUST_N * 3);
var dustSeed = new Float32Array(DUST_N);
for (var d = 0; d < DUST_N; d++) {
  dustPos[d*3] = (Math.random() - 0.5) * 26;
  dustPos[d*3+1] = 0.2 + Math.random() * 7;
  dustPos[d*3+2] = -Math.random() * 30;
  dustSeed[d] = Math.random() * Math.PI * 2;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
var dustTex = (function () {
  var c = document.createElement('canvas'); c.width = c.height = 32;
  var g = c.getContext('2d');
  var rg = g.createRadialGradient(16, 16, 0, 16, 16, 15);
  rg.addColorStop(0, 'rgba(255,236,200,0.95)'); rg.addColorStop(0.5, 'rgba(255,236,200,0.30)'); rg.addColorStop(1, 'rgba(255,236,200,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(c);
})();
var dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  size: 0.085, map: dustTex, transparent: true, opacity: 0.55, depthWrite: false, sizeAttenuation: true
}));
dust.renderOrder = 7;
scene.add(dust);

/* ───────── 天膜（挂在相机上的全屏幕 quad） ───────── */
/* 裂纹画在 canvas 上：R 通道 = 裂纹强度（核心亮、外围柔），G 通道 = 应力白斑 */
var crackTex = (function () {
  var c = document.createElement('canvas'); c.width = 1024; c.height = 576;
  var g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 1024, 576);
  function strokePath(pts, width, blur, alpha, color) {
    g.save();
    g.strokeStyle = color || 'rgba(255,255,255,' + alpha + ')';
    g.lineWidth = width;
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.shadowColor = 'rgba(255,255,255,' + Math.min(1, alpha + 0.25) + ')';
    g.shadowBlur = blur;
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.stroke();
    g.restore();
  }
  /* 主裂纹：从上缘下行到底部（屏幕坐标 1024×576） */
  var main = [[470, -10], [492, 92], [452, 170], [488, 262], [470, 330], [500, 420], [482, 500], [496, 590]];
  strokePath(main, 13, 46, 0.16);           /* 宽柔晕（磨砂里的透光） */
  strokePath(main, 3.2, 26, 0.45);
  strokePath(main, 1.9, 12, 0.8);
  strokePath(main, 0.9, 4, 1.0);            /* 白芯 */
  /* 枝纹 A：自 (488,262) 向右下 */
  var brA = [[488, 262], [560, 300], [612, 296], [700, 342], [748, 402]];
  strokePath(brA, 7, 30, 0.14);
  strokePath(brA, 2.2, 18, 0.38);
  strokePath(brA, 1.2, 8, 0.68);
  strokePath(brA, 0.6, 3, 0.9);
  /* 枝纹 B：自 (470,330) 向左上 */
  var brB = [[470, 330], [402, 300], [352, 306], [286, 262], [236, 200]];
  strokePath(brB, 6, 28, 0.13);
  strokePath(brB, 2.0, 16, 0.34);
  strokePath(brB, 1.0, 7, 0.62);
  strokePath(brB, 0.5, 3, 0.85);
  /* 枝纹 C：自 (500,420) 向右 */
  var brC = [[500, 420], [574, 440], [648, 430], [736, 458]];
  strokePath(brC, 5, 24, 0.12);
  strokePath(brC, 1.8, 14, 0.3);
  strokePath(brC, 0.9, 6, 0.55);
  /* 应力白斑（G 通道）：裂纹附近的浅色晕斑 */
  function blob(x, y, r, a) {
    var rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, 'rgba(0,255,0,' + a + ')');
    rg.addColorStop(1, 'rgba(0,255,0,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  var pts = [main[1], main[3], main[4], main[5], brA[2], brA[4], brB[3], brC[2]];
  for (var i = 0; i < pts.length; i++) {
    blob(pts[i][0] + (i % 2 ? 26 : -30), pts[i][1] + (i % 3 ? -18 : 14), 60 + (i % 4) * 26, 0.32 + (i % 3) * 0.1);
  }
  var t = new THREE.CanvasTexture(c);
  return t;
})();

var memUniforms = {
  uTime:    { value: 0 },
  uPress:   { value: 0 },
  uCleared: { value: 0 },
  uFlash:   { value: 0 },
  uTex:     { value: crackTex },
  uDay:     { value: new THREE.Color(0xf6f3ec) },
  uWarm:    { value: new THREE.Color(0x4a4038) },
  uAspect:  { value: 1.6 }
};
var memMat = new THREE.ShaderMaterial({
  uniforms: memUniforms,
  transparent: true,
  depthWrite: false,
  depthTest: false,
  vertexShader: [
    'varying vec2 vUv;',
    'void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }'
  ].join('\n'),
  fragmentShader: [
    'precision mediump float;',
    'varying vec2 vUv;',
    'uniform sampler2D uTex;',
    'uniform float uTime, uPress, uCleared, uFlash, uAspect;',
    'uniform vec3 uDay, uWarm;',
    'float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
    'float vnoise(vec2 p){',
    '  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);',
    '  return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y);',
    '}',
    'float fbm(vec2 p){ float v=0.0, a=0.55; for(int i=0;i<3;i++){ v+=a*vnoise(p); p=p*2.13+7.7; a*=0.5; } return v; }',
    'void main(){',
    '  vec2 uv = vUv;',
    '  /* 磨砂雾：呼吸的云，奶白而非深色（逆光磨砂） */',
    '  float mott = fbm(uv * vec2(2.6, 2.0) + vec2(uTime * 0.006, -uTime * 0.004));',
    '  float hazeA = (0.52 + (mott - 0.5) * 0.30) * (1.0 - uPress * 0.26);',
    '  vec3 milky = mix(uWarm, uDay, 0.30 + mott * 0.22);',
    '  vec3 col = milky * (0.80 + mott * 0.30);',
    '  /* 膜上白昼的渗光：越靠近门缝方向越亮 */',
    '  float daySeep = smoothstep(0.78, 0.24, uv.y) * (0.12 + uPress * 0.20);',
    '  col += uDay * daySeep;',
    '  /* 裂纹 */',
    '  vec4 tx = texture2D(uTex, uv);',
    '  float reveal = smoothstep(0.045, 0.10, uPress);',
    '  float grow  = 1.0 + uPress * 1.5;',
    '  float core  = smoothstep(0.5 / grow, 0.94 / grow, tx.r) * reveal;',
    '  float glow  = tx.r * reveal;',
    '  float blotch = tx.g * smoothstep(0.30, 0.58, uPress) * (0.55 + 0.45 * mott);',
    '  float flick = 0.94 + 0.06 * sin(uTime * 0.031);',
    '  col += vec3(1.0, 0.98, 0.94) * core * 0.9 * flick;',
    '  col += uDay * glow * 0.5 * (0.4 + uPress);',
    '  col += vec3(0.96, 0.97, 0.99) * blotch * 0.34;',
    '  float alpha = clamp(hazeA + core * 0.9 + glow * 0.42 + blotch * 0.32, 0.0, 1.0);',
    '  /* 破膜：雾散剩极淡一层 */',
    '  alpha *= mix(1.0, 0.085, uCleared);',
    '  col = mix(col, uDay * 1.06, uCleared * 0.6);',
    '  /* 白闪 */',
    '  float fl = clamp(uFlash, 0.0, 1.0);',
    '  col = mix(col, vec3(1.0), fl);',
    '  alpha = max(alpha, fl * 0.96);',
    '  gl_FragColor = vec4(col, clamp(alpha, 0.0, 1.0));',
    '}'
  ].join('\n')
});
var memGeo = new THREE.PlaneGeometry(1, 1);
var membrane = new THREE.Mesh(memGeo, memMat);
membrane.renderOrder = 20;
membrane.frustumCulled = false;
camera.add(membrane);
function fitMembrane() {
  var h = 2 * Math.tan(camera.fov * Math.PI / 360);
  var w = h * camera.aspect;
  membrane.scale.set(w * 1.06, h * 1.06, 1);
  membrane.position.set(0, 0, -1);
  memUniforms.uAspect.value = camera.aspect;
}

/* ───────── 滚动 → 相位 ───────── */
var scrollP = 0;
var PIN_P = PIN !== null && PIN !== '' ? Math.min(1, Math.max(0, parseFloat(PIN))) : null;
function readScroll() {
  if (PIN_P !== null) { scrollP = PIN_P; return; }
  var max = document.documentElement.scrollHeight - window.innerHeight;
  var y = window.scrollY || window.pageYOffset || 0;
  if (max > 0) scrollP = Math.min(1, Math.max(0, y / max));
}
window.addEventListener('scroll', readScroll, { passive: true });

function sstep(a, b, x) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

var mWarm = document.getElementById('mWarm');
var mInk = document.getElementById('mInk');
var barFg = document.getElementById('barFg');

/* ───────── 主更新 ───────── */
function update(dt, t) {
  readScroll();
  var p = scrollP;
  var press = sstep(0.05, 0.74, p);
  var cleared = sstep(0.775, 0.835, p);
  var flash = Math.exp(-Math.pow((p - 0.80) / 0.02, 2));

  memUniforms.uTime.value = t;
  memUniforms.uPress.value = press;
  memUniforms.uCleared.value = cleared;
  memUniforms.uFlash.value = flash;

  /* 门被推开 */
  var open = sstep(0.40, 0.76, p) * 3.4;
  slabL.position.x = -6.6 - open;
  slabR.position.x = 6.6 + open;

  /* 破膜后：走入白昼（穿过门洞，门在 z=-26） */
  var walk = sstep(0.80, 0.97, p);
  camera.position.z = 10 - 44 * walk;
  camera.position.y = 1.7 + 0.3 * walk;
  camera.lookAt(0, 3.4 + 1.6 * walk, camera.position.z - 26);  // 注视点随相机前移（会话 I 坑④）
  var dayI = sstep(0.5, 0.8, p);
  seamLight.intensity = 0.85 + dayI * 1.1;
  hemi.intensity = 0.55 + dayI * 0.5;
  scene.fog.far = 52 + dayI * 30;
  spill.material.opacity = 0.75 + dayI * 0.25;

  /* 地缝呼吸（未破时） */
  var breathe = 0.9 + 0.1 * Math.sin(t * 0.0011);
  seamLine.material.opacity = (0.55 + press * 0.4) * breathe;

  /* 尘埃缓浮 */
  if (!RM && !IS_STILL) {
    for (var i = 0; i < DUST_N; i++) {
      dustPos[i*3+1] += dt * 0.045;
      dustPos[i*3] += Math.sin(t * 0.00018 + dustSeed[i]) * dt * 0.02;
      if (dustPos[i*3+1] > 7.4) dustPos[i*3+1] = 0.2;
    }
    dustGeo.attributes.position.needsUpdate = true;
  }

  /* DOM 宣言两态 */
  if (mWarm) {
    var oWarm = sstep(0.06, 0.2, p) * (1 - sstep(0.76, 0.82, p));
    mWarm.style.opacity = oWarm.toFixed(3);
  }
  if (mInk) {
    var oInk = sstep(0.875, 0.95, p);
    mInk.style.opacity = oInk.toFixed(3);
  }
  if (barFg) {
    var h2 = 26 * press;
    barFg.setAttribute('y1', (30 - h2).toFixed(1));
  }
}

/* ───────── 帧循环 / 静帧 / auto ───────── */
var lastT = 0;
function loop(t) {
  requestAnimationFrame(loop);
  var dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;
  update(dt, t);
  renderer.render(scene, camera);
}
function renderOnce() {
  update(0.016, performance.now());
  renderer.render(scene, camera);
}

var autoStep = function () {
  var T = IS_FAST ? 7000 : 16000;
  var now = performance.now();
  var ph = (now % (T * 2)) / T;
  var tri = ph < 1 ? ph : 2 - ph;
  /* 在关键相位驻留：压 / 枝 / 开门 / 破 / 白昼 */
  var stops = [0, 0.45, 0.72, 0.80, 0.95];
  var u = tri * (stops.length - 1);
  var k = Math.min(stops.length - 2, Math.floor(u));
  var f = u - k;
  var s = f * f * (3 - 2 * f);
  var val = stops[k] + (stops[k + 1] - stops[k]) * s;
  window.scrollTo(0, val * (document.documentElement.scrollHeight - window.innerHeight));
};
autoStep = autoStep;  // 占位避免压缩器混淆

if (IS_AUTO) {
  setInterval(autoStep, 33);
  requestAnimationFrame(function t0() { loop(performance.now()); });
} else if (RM || IS_STILL) {
  renderOnce();
  window.addEventListener('scroll', function () { requestAnimationFrame(renderOnce); }, { passive: true });
} else {
  requestAnimationFrame(loop);
}

window.__mockSnap = function () {
  /* 隐藏面板中定时器会停摆：出帧前先自愈画布尺寸 */
  var w = window.innerWidth, h = window.innerHeight, c = renderer.domElement;
  if (w > 0 && h > 0 && (c.width === 0 || c.height === 0 ||
      Math.abs(c.width - Math.floor(w * renderer.getPixelRatio())) > 2 ||
      Math.abs(c.height - Math.floor(h * renderer.getPixelRatio())) > 2)) {
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.fov = h > w * 1.15 ? 38 : 46;
    camera.updateProjectionMatrix();
    fitMembrane();
  }
  update(0.016, performance.now());
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.__mockDbg = { scene: scene, camera: camera, membrane: membrane };

/* ───────── resize ───────── */
function onResize() {
  var w = window.innerWidth, h = window.innerHeight;
  if (w <= 0 || h <= 0) return;
  var portrait = h > w * 1.15;
  camera.aspect = w / h;
  camera.fov = portrait ? 40 : 46;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  fitMembrane();
  if (RM || IS_STILL) requestAnimationFrame(renderOnce);
}
window.addEventListener('resize', onResize);
onResize();
readScroll();
/* 尺寸看门狗：无头/标签页恢复时 innerWidth 可能晚至数百毫秒才就绪 */
(function () {
  var n = 0;
  var timer = setInterval(function () {
    n++;
    var w = window.innerWidth, h = window.innerHeight;
    var c = renderer.domElement;
    if (w > 0 && h > 0 && (c.width === 0 || c.height === 0 ||
        Math.abs(c.width - Math.floor(w * renderer.getPixelRatio())) > 2 ||
        Math.abs(c.height - Math.floor(h * renderer.getPixelRatio())) > 2)) {
      onResize();
    }
    if (n > 24) clearInterval(timer);
  }, 125);
})();

})();
</script>
</body>
</html>
