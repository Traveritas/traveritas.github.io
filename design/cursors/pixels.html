<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:#dfe3e9;font:11px Consolas,monospace;color:#333;padding:30px}
  .row{display:flex;gap:30px;margin-bottom:26px}
  .box{padding:18px;display:flex}
  .light{background:#f0f3f6}.dark{background:#16181e}
  .px{width:224px;height:224px;image-rendering:pixelated}
  .cap{font-size:10px;letter-spacing:.12em;color:#777;margin-bottom:8px}
</style></head><body>
<div class="row">
  <div><div class="cap">A 32 → 7×</div><div class="box light"><img class="px" src="png/arrow-a-32.png"></div></div>
  <div><div class="cap">B 32 → 7×</div><div class="box light"><img class="px" src="png/arrow-b-32.png"></div></div>
  <div><div class="cap">C 32 → 7×</div><div class="box light"><img class="px" src="png/arrow-c-32.png"></div></div>
  <div><div class="cap">A 32 on deep</div><div class="box dark"><img class="px" src="png/arrow-a-32.png"></div></div>
</div>
</body></html>
